<meta charset="utf-8" />
<!-- Without this a phone lays the page out at 980px and scales it to fit: measured
     0.383x at 375px wide, which renders 14px body text at 5.4 device pixels and makes
     the max-width:900px rules unreachable on any actual phone. -->
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
<title>Enqueue</title>
<link
  rel="preload"
  href="fonts/IBM-Plex-Sans-400.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link
  rel="preload"
  href="fonts/IBM-Plex-Sans-500.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link
  rel="preload"
  href="fonts/IBM-Plex-Sans-600.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<!-- M.8: the single monolithic <style>/<script> blocks were split into the files
     below, each moved verbatim from the one-block era (a script asserted the tiles
     reassemble byte-identically). The order of the stylesheets and scripts below is
     load order and must not be reordered casually: tokens first (every other rule
     reads var()s from it), and the script list keeps the same declaration order the
     one block had, with the boot call last in settings.js. -->
<link rel="stylesheet" href="/static/css/tokens.css" />
<link rel="stylesheet" href="/static/css/base.css" />
<link rel="stylesheet" href="/static/css/home.css" />
<link rel="stylesheet" href="/static/css/artifact.css" />
<link rel="stylesheet" href="/static/css/reader.css" />
<link rel="stylesheet" href="/static/css/chat.css" />
<link rel="stylesheet" href="/static/css/settings.css" />
<link rel="stylesheet" href="/static/css/pill.css" />
</head>
<body>
<!-- The window drag handle and the search bar live here; the pill (capture) is
     its own door at the foot, and the dropover is the one piece of chrome that
     exists before any view does. -->
<div class="topbar" id="topbar"></div>
<main id="view"><div class="state">opening...</div></main>
<div class="pill" id="pill"></div>

<div class="dropover" id="dropover" hidden>
  <div class="dropcard">
    <div class="drop-ic">
      <svg id="dropIn" viewBox="0 0 24 24">
        <path d="M12 4v11" />
        <path d="M7.5 10.5L12 15l4.5-4.5" />
        <path d="M5 19h14" />
      </svg>
      <svg id="dropOk" viewBox="0 0 24 24">
        <path d="M4.5 12.5l5 5 10-11" />
      </svg>
    </div>
    <div class="title">Drop anything to keep it</div>
    <div class="sub">
      Files, images, and text. Everything stays on this machine.
    </div>
    <div class="hint">Release to keep</div>
  </div>
</div>

<script src="/static/js/util.js"></script>
<script src="/static/js/icons.js"></script>
<script src="/static/js/md.js"></script>
<script src="/static/js/dialogs.js"></script>
<script src="/static/js/pill.js"></script>
<script src="/static/js/morph.js"></script>
<script src="/static/js/home.js"></script>
<script src="/static/js/artifact.js"></script>
<script src="/static/js/search.js"></script>
<script src="/static/js/pivot.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/trash.js"></script>
<script src="/static/js/settings.js"></script>
</body>
</html>
