  // Switching backend moves the endpoint with it, because leaving the old URL behind

  // ---- AI sub-page ---------------------------------------------------------
  async function showSettingsAI() {
    teardown();
    restorePill("inside");
    view.innerHTML = '<div class="state">...</div>';
    const d = await api("/settings");
    let html =
      '<button class="settings-back" onclick="showSettings()">' +
      '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8L10 13"/></svg> Settings</button>' +
      '<div class="h2">AI</div>';

    html += '<div class="shelf">The model</div><div class="group">';
    const chosen = d.settings.llm_backend;
    html +=
      '<div class="field"><label for="s_backend">Answers come from</label>' +
      '<select id="s_backend"' +
      (chosen.locked ? " disabled" : "") +
      ' onchange="chooseBackend(this.value)">' +
      d.backends
        .map(
          (b) =>
            '<option value="' +
            esc(b.name) +
            '"' +
            (b.name === chosen.value ? " selected" : "") +
            ">" +
            esc(b.label) +
            "</option>",
        )
        .join("") +
      "</select>";
    const picked = d.backends.find((b) => b.name === chosen.value);
    if (picked && !picked.local)
      html +=
        '<div class="aside caution">The text of whatever is retrieved gets sent to ' +
        esc(picked.label) +
        ". Artifacts marked local only never take this path." +
        (picked.needs_key && !picked.key_present
          ? " <b>No API key is set</b>, so calls will fail until ENQ_LLM_API_KEY is exported."
          : "") +
        "</div>";
    else if (picked)
      html += '<div class="aside">Nothing leaves this machine.</div>';
    html += "</div>";
    for (const name of ["llm_model", "llm_url", "model_retries"]) {
      const f = d.settings[name];
      html +=
        '<div class="field"><label for="s_' +
        name +
        '">' +
        esc(SETTING_LABELS[name]) +
        "</label>" +
        '<input id="s_' +
        name +
        '" value="' +
        esc(String(f.value ?? "")) +
        '"' +
        (f.locked ? " disabled" : "") +
        " onchange=\"saveSetting('" +
        name +
        "', this.value)\">" +
        (f.locked
          ? '<div class="pinned">pinned by ' +
            esc(f.env_var) +
            " in the environment</div>"
          : "") +
        "</div>";
    }
    const keyed = d.storage.api_key_present;
    html +=
      '<div class="field"><label for="s_key">API key</label>' +
      (d.storage.api_key_editable
        ? '<div class="keyrow">' +
          '<input id="s_key" type="password" autocomplete="off" spellcheck="false" ' +
          'placeholder="' +
          (keyed
            ? "stored " + esc(d.storage.api_key_hint || "")
            : "paste a key") +
          '">' +
          '<button class="btn tertiary sm" onclick="saveKey()">Save</button>' +
          (keyed
            ? '<button class="btn ghost harm sm" onclick="forgetKey()">Forget</button>'
            : "") +
          "</div>" +
          '<div class="aside">saved in the macOS Keychain, not in any file here.</div>'
        : '<div class="aside caution">' +
          (d.storage.api_key_where === "environment"
            ? "Pinned by <b>ENQ_LLM_API_KEY</b> in the environment" +
              (d.storage.api_key_hint
                ? " (" + esc(d.storage.api_key_hint) + ")"
                : "") +
              ". Unset it to store one here instead."
            : "No keychain on this system.") +
          "</div>") +
      '<div id="keyState" class="aside caution"></div></div>';

    html +=
      '<div class="field"><label for="s_headers">' +
      esc(SETTING_LABELS.llm_headers) +
      "</label>" +
      '<textarea id="s_headers" rows="3" spellcheck="false" placeholder="' +
      "HTTP-Referer: https://your-app&#10;X-Title: Enqueue" +
      '" onchange="saveSetting(\'llm_headers\', this.value)">' +
      esc(String(d.settings.llm_headers.value || "")) +
      "</textarea>" +
      '<div class="aside">One <b>Name: value</b> per line.</div></div>';

    html += '<div id="settingState" class="aside"></div>';
    view.innerHTML = html;
    window.scrollTo(0, 0);
  }

  // ---- Features sub-page ---------------------------------------------------
  async function showSettingsFeatures() {
    teardown();
    restorePill("inside");
    view.innerHTML = '<div class="state">...</div>';
    const d = await api("/settings");
    let html =
      '<button class="settings-back" onclick="showSettings()">' +
      '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8L10 13"/></svg> Settings</button>' +
      '<div class="h2">Features</div>';

    html += '<div class="shelf">Capture</div><div class="group">';
    const hk = d.settings.hotkey;
    html +=
      '<div class="field"><label for="s_hotkey">' +
      esc(SETTING_LABELS.hotkey) +
      "</label>" +
      '<button class="recorder" id="s_hotkey"' +
      (hk.locked ? " disabled" : "") +
      ' onclick="recordHotkey(this)"><span id="hotkeyLabel">' +
      esc(keyLabel(hk.value)) +
      "</span></button>" +
      (hk.locked
        ? '<div class="pinned">pinned by ' + esc(hk.env_var) + "</div>"
        : '<div class="aside">Click, then press the combination you want.</div>') +
      "</div>";
    const ua = d.settings.user_agent;
    html +=
      '<div class="field"><label for="s_ua">' +
      esc(SETTING_LABELS.user_agent) +
      "</label>" +
      '<input id="s_ua" placeholder="Enqueue/0.2 (+https://...)" value="' +
      esc(String(ua.value ?? "")) +
      '"' +
      (ua.locked ? " disabled" : "") +

    html +=
      '</div><div class="shelf">Links</div><div class="group">' +
      '<div class="field"><div class="togglerow"><div>' +
      '<span class="rowlabel">' +
      esc(SETTING_LABELS.auto_preview) +
      "</span>" +
      (ap.locked
        ? '<div class="pinned">pinned by ' + esc(ap.env_var) + "</div>"
        : '<div class="aside">' +
          (apOn
            ? "One request per link, as you save it."
            : "A link stays a bare address until you open it.") +
          "</div>") +
      "</div>" +
      '<button class="toggle" role="switch" aria-checked="' +
      String(apOn) +
      '" aria-label="' +
      esc(SETTING_LABELS.auto_preview) +
      '"' +
      (ap.locked ? ' disabled aria-disabled="true"' : "") +
      " onclick=\"saveSetting('auto_preview', '" +
      (apOn ? "off" : "on") +
      '\').then(showSettingsFeatures)"><span class="knob"></span></button>' +
      "</div></div></div>";

    html += '<div id="settingState" class="aside"></div>';
    view.innerHTML = html;
    window.scrollTo(0, 0);
  }

  // ---- Storage sub-page ----------------------------------------------------
  async function showSettingsStorage() {
    teardown();
    restorePill("inside");

    const d = await api("/settings");
    let html =
      '<button class="settings-back" onclick="showSettings()">' +
      '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8L10 13"/></svg> Settings</button>' +
      '<div class="h2">Storage</div>';

    const s0 = d.storage;
    html +=
      '<div class="callout note"><p>Nothing you keep here leaves this machine.</p></div>' +
      '<div class="group"><div class="field">' +
      '<span class="rowlabel">Everything lives at</span>' +
      '<div class="mono chip">' +
      esc(s0.data_dir) +
      "</div></div></div>";
    html +=
      '<div class="shelf">Usage</div><div class="group">' +
      '<div class="field"><div class="facts">' +
      '<b>database</b> <span class="mono">' +

      "</span><br>" +
      '<b>files</b> <span class="mono">' +

      "</span><br>" +
      '<b>index</b> <span class="mono">' +

          ([k, v]) =>

      "</div></div>" +
      '<div class="field"><span class="rowlabel">Rebuild the index</span>' +
      '<div class="aside">Everything derived is thrown away and rebuilt.</div>' +

  // ---- Trash sub-page ------------------------------------------------------
  async function showSettingsTrash() {
    teardown();
    restorePill("inside");
    view.innerHTML = '<div class="state">...</div>';
    const [d, trash] = await Promise.all([
      api("/settings"),
      api("/trash").catch(() => ({ items: [], retention_days: 30 })),
    ]);
    let html =
      '<button class="settings-back" onclick="showSettings()">' +
      '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8L10 13"/></svg> Settings</button>' +
      '<div class="h2">Trash</div>';

    const td = d.settings.trash_days;
    html +=
      '<div class="shelf">Retention</div><div class="group">' +
      '<div class="field"><label for="s_trash">' +
      esc(SETTING_LABELS.trash_days) +
      "</label>" +
      '<input id="s_trash" type="number" min="1" max="3650" value="' +
      esc(String(td.value)) +
      '"' +
      (td.locked ? " disabled" : "") +
      " onchange=\"saveSetting('trash_days', this.value)\">" +
      (td.locked
        ? '<div class="pinned">pinned by ' + esc(td.env_var) + "</div>"
        : '<div class="aside">Only things you delete are ever removed.</div>') +
      "</div></div>";
    html +=
      '<div class="shelf">Trash</div><div class="group">' +
      '<div class="aside">Deleted things wait ' +
      trash.retention_days +
      " day" +
      (trash.retention_days === 1 ? "" : "s") +
      ", then go for good.</div>";
    if (!trash.items.length) {
      html += '<div class="aside">Nothing in the trash.</div>';
    } else {
      html +=
        '<div class="callout warn">Emptying the trash deletes files permanently.</div>' +
        '<div class="actions"><button class="btn danger terminal" onclick="emptyTrash(' +
        trash.items.length +
        ')">Empty trash (' +
        trash.items.length +
        ")</button></div>" +
        trash.items
          .map(
            (a) =>
              '<div class="item" data-kind="' +
              esc(a.kind) +
              '"><div class="item-body"><span class="kindrow">' +
              '<span class="kindmark"></span>' +
              '<span class="kindword">' +
              esc(a.kind) +
              "</span></span>" +
              '<div class="title">' +
              esc(a.title || "Untitled") +
              "</div></div>" +
              '<span class="meta">' +
              (a.days_left > 0
                ? a.days_left +
                  " day" +
                  (a.days_left === 1 ? "" : "s") +
                  " left"
                : "goes at the next launch") +
              "</span>" +
              '<div class="rowacts">' +
              '<button class="btn ghost" onclick="restoreArtifact(&#39;' +
              a.id +
              '&#39;)">Restore</button>' +
              '<button class="btn ghost harm" onclick="purgeArtifact(&#39;' +
              a.id +
              '&#39;)">Delete now</button></div></div>',
          )
          .join("") +
        "</div>";
    }

    html += '<div id="settingState" class="aside"></div>';
    view.innerHTML = html;
    window.scrollTo(0, 0);
  }
  // would point a hosted model at localhost and fail in a way nobody could read.
  const BACKEND_MODELS = {
    ollama: "llama3.1:8b",
    openrouter: "google/gemini-3-flash",
    opencode: "opencode-model",
  };

  async function chooseBackend(name) {
    const list = (await api("/settings")).backends;
    const spec = list.find((b) => b.name === name);
    const changes = { llm_backend: name };
    if (spec && spec.url) changes.llm_url = spec.url;
    if (BACKEND_MODELS[name]) changes.llm_model = BACKEND_MODELS[name];

    try {
      await api("/settings", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ changes }),
      });
    } catch (err) {
      const state = document.getElementById("settingState");
      if (state) state.textContent = String(err);
      return;
    }
    showSettings();
  }

  // The value is sent once and never read back. What returns is whether a key now
  // exists and its last four characters, so the field can be cleared immediately.
  async function saveKey() {
    const field = document.getElementById("s_key");
    const state = document.getElementById("keyState");
    const key = field.value.trim();
    if (!key) return;

    try {
      await api("/settings/api-key", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key }),
      });
    } catch (err) {
      state.textContent = String(err.message || err);
      return;
    }
    field.value = "";
    showSettings();
    toast("Key stored in the Keychain.");
  }

  async function forgetKey() {
    const yes = await ask(
      "Forget the stored API key?",
      "It is removed from the Keychain. Anything that needs it stops working until you enter it again.",
      "Forget",
    );
    if (!yes) return;
    try {
      await api("/settings/api-key", { method: "DELETE" });
    } catch (err) {
      return toast(String(err.message || err), true);
    }
    showSettings();
    toast("Key forgotten.");
  }

  async function saveSetting(name, value) {
    const state = document.getElementById("settingState");
    try {
      await api("/settings", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ changes: { [name]: value } }),
      });
      if (state) {
        state.textContent = "saved";
        setTimeout(() => {
          state.textContent = "";
        }, 2000);
      }
    } catch (err) {
      if (state) state.textContent = String(err);
    }
  }

  async function rebuildIndex(button) {
    button.disabled = true;
    button.textContent = "rebuilding...";
    try {
      const r = await api("/index", { method: "POST" });
      button.textContent = "Rebuilt " + r.chunks.indexed + " passages";
    } catch (err) {
      button.disabled = false;
      button.textContent = "Could not rebuild: " + String(err);
    }
  }

  // A topic drawn out of a conversation is the same kind of thing a lens is, so it
  // hangs a room. The chat it came from stays in the rail, because the room is a move
  // inside the conversation rather than a departure from it.
  let room = null;

  async function doCurate(lens) {
    const backTo = chat ? chat.chat.id : null;
    const stages = [
      "expanding the lens into the way documents actually talk",
      "searching the literal and conceptual layers",
      "reading each candidate and deciding whether it belongs",
      "looking for what they share, and where they disagree",
    ];
    let i = 0;
    view.innerHTML =
      '<div class="state thinking" id="stage">' + stages[0] + "</div>";
    const tick = setInterval(() => {
      i = Math.min(i + 1, stages.length - 1);
      const el = document.getElementById("stage");
      if (el) el.textContent = stages[i];
    }, 9000);

    let r;
    try {
      r = await api("/curate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lens, keep: 8, pool: 10 }),
      });
    } catch (err) {
      clearInterval(tick);
      view.innerHTML =
        back(backTo) +
        '<div class="state">The curator could not finish.<br><br><span class="strongtext">' +
        esc(String(err)) +
        "</span><br><br>Nothing was lost. The artifacts are untouched; only the " +
        "room failed to hang.</div>";
      return;
    }
    clearInterval(tick);

    const ex = r.exhibit || {};
    room = { lens, exhibit: ex, kept: r.kept };

    let html =
      back(backTo) +
      '<div class="h1">' +
      esc(ex.suggested_name || lens) +
      "</div>" +
      '<div class="meta">' +
      r.kept.length +
      " kept &middot; " +
      r.rejected +
      " rejected &middot; " +
      r.considered +
      " considered</div>";
    if (ex.through_line)
      html +=
        '<div class="md" style="margin:var(--sp-4) 0">' +
        esc(ex.through_line) +
        "</div>";
    if (ex.thin)
      html +=
        '<div class="callout warn">thin &middot; ' +
        esc(ex.thin_reason) +
        "</div>";

    // A room can come back short for two very different reasons: the collection did not
    // hold it, or the model could not do the job. Saying which is the difference between
    // a useful answer and a mystery.
    if (r.failed)
      html +=
        '<div class="aside caution">' +
        r.failed +
        " of " +
        r.considered +
        " judgments failed their checks; those artifacts were dropped without being judged.</div>";
    if (r.synthesis_error)
      html +=
        '<div class="aside caution">no through line: ' +
        esc(r.synthesis_error) +
        "</div>";

    r.kept.forEach((k, j) => {
      html +=
        '<div class="item hang" style="animation-delay:' +
        j * 70 +
        'ms" ' +
        'tabindex="0" role="button" onclick="showArtifact(\'' +
        k.artifact_id +
        "')\" " +
        "onkeydown=\"rowKey(event, () => showArtifact('" +
        k.artifact_id +
        "'))\">" +
        '<div class="item-body">' +
        '<div class="title">' +
        esc(k.title) +
        "</div>" +
        '<div class="md" style="font-size:14px">' +
        esc(k.placard) +
        "</div>" +
        '<div class="meta">match ' +
        k.strength +
        "</div></div></div>";
    });

    // A room costs three model passes to build. Keeping one is a decision, not a
    // default, but re-deriving it later would cost the same again, so the offer is here.
    if (r.kept.length)
      html +=
        '<button class="btn tertiary" id="btnKeep" onclick="keepRoom()">Keep this room</button>';

    view.innerHTML = html;
    window.scrollTo(0, 0);
  }

  function back(chatId) {
    return chatId
      ? '<div class="back" onclick="showChat(\'' +
          chatId +
          "')\">&larr; the conversation</div>"
      : '<div class="back" onclick="home()">&larr; everything</div>';
  }

  async function keepRoom() {
    const button = document.getElementById("btnKeep");
    if (!room || !button) return;
    button.disabled = true;
    try {
      await api("/exhibits", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(room),
      });
      button.textContent = "saved";
    } catch (err) {
      button.disabled = false;
      button.textContent = "Could not save it: " + String(err);
    }
  }

  home();
</script>
