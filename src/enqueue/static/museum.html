<meta charset="utf-8" />
<!-- Without this a phone lays the page out at 980px and scales it to fit: measured
     0.383x at 375px wide, which renders 14px body text at 5.4 device pixels and makes
     the max-width:900px rules unreachable on any actual phone. -->
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
<title>Enqueue</title>
<link
  rel="preload"
  href="fonts/IBM-Plex-Sans-400.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link
  rel="preload"
  href="fonts/IBM-Plex-Sans-500.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link
  rel="preload"
  href="fonts/IBM-Plex-Sans-600.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<style>
  /* IBM Plex Sans, vendored as static cuts. The type scale (DESIGN.md section 3)
     uses 400 for body, 500 for titles and buttons, 600 for display and eyebrows;
     every one of those weights has a bundled face below, so nothing falls back to
     a system font. The 700 face stays declared but unused, kept because the file
     is vendored and the scale may grow into it. Nothing is fetched: these are
     files on disk beside this page. */
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src:
      url("fonts/IBM-Plex-Sans-400.woff2") format("woff2"),
      url("fonts/IBMPlexSans-Regular.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 500;
    font-style: normal;
    font-display: swap;
    src:
      url("fonts/IBM-Plex-Sans-500.woff2") format("woff2"),
      url("fonts/IBMPlexSans-Medium.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 600;
    font-style: normal;
    font-display: swap;
    src:
      url("fonts/IBM-Plex-Sans-600.woff2") format("woff2"),
      url("fonts/IBMPlexSans-SemiBold.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src:
      url("fonts/IBM-Plex-Sans-700.woff2") format("woff2"),
      url("fonts/IBMPlexSans-Bold.ttf") format("truetype");
  }
  :root {
    /* The app is light only. Without this the browser assumes it may be either, and
       on a machine set to dark mode it paints native scrollbars, the caret and select
       menus dark against the canvas. */
    color-scheme: light;

    /* The light surface ladder, per DESIGN.md section 2. --bg is the canvas;
       --surface is one step up (cards, panels, inputs); --surface-2 two steps
       (hovered cards, selected chips); --surface-3 three (pressed fills, recessed
       wells). --surface-doc is the reading pane's faint-cool-tint canvas, the tint
       DESIGN.md allows on the page background. */
    --bg: #ffffff;
    --surface: #f6f7f9;
    --surface-doc: #fbfbfd;
    --surface-2: #eef0f3;
    --surface-3: #e4e6eb;

    /* Ink. --surface-3 is the darkest ground anything sits on, so it is the binding
       case: --text-mute (ink-subtle) measures 4.19 there, --text-dim 6.38. */
    --text: #101114;
    --text-dim: #4d5061;
    --text-mute: #686b82;
    /* The faintest ink that can carry text. DESIGN.md's #9497a9 measures 2.89:1 on
       the canvas and fails 4.5, so the token is pulled up to #6c6f84: 4.62:1 on
       surface-1 (the darkest ground a placeholder renders on - inputs sit on
       surface-1), 4.95:1 on the canvas. It is not permitted on surface-2 (4.33). */
    --ink-faint: #6c6f84;

    /* The one chromatic accent, bold Kraken purple (#7132f5) replacing the muted
       lavender. It is a fill, a focus ring, a link - never a section
       background and never a card wash. 6.04:1 on the canvas means it can stand
       alone as a filled control and as text on the canvas, so the old 1.5px --text
       edge every amber fill carried is gone. */
    --accent: #7132f5;
    /* Hover and pressed steps for filled lavender controls. DESIGN-kraken.md names
       #8b5cf6 as the hover, but white text on #8b5cf6 measures 4.23:1 and fails
       4.5, so the hover step uses --lavender-focus (#7132f5, 6.04:1 with white)
       and the pressed step --lavender-deep (#5b1ecf, 8.30:1 with white). */
    --accent-strong: #7132f5;
    /* The ink motif on the lavender disc (the greeting eye and the drop icon):
       #101114 on #7132f5 is 3.13:1, which clears the 3:1 graphic rule. The disc
       never fills --lavender-deep while the ink motif is on it - ink on deep is
       2.28:1 and fails - so its pressed state is a scale squash, not a fill
       change. */
    --accent-ink: #101114;
    /* Lavender as text. #7132f5 clears 4.5 even on surface-3 (4.84:1), and the
       places lavender text carries weight (aside.dirty, .title-action.lit) use
       --accent-text #5741d8, which clears 4.5:1 on every surface (6.66 canvas,
       6.21 surface-1, 5.83 surface-2, 5.33 surface-3). */
    --accent-text: #5741d8;

    /* The lavender family, named per DESIGN-kraken.md section 2. */
    --lavender: #7132f5;
    --lavender-focus: #7132f5;
    --lavender-deep: #5b1ecf;
    --lavender-subtle: rgba(113, 50, 245, 0.16);
    --on-lavender: #ffffff;

    --line: #dedee5;
    --line-soft: #eceef2;
    /* The only line token allowed to be a sole boundary. DESIGN.md's #c4c6d0
       measures 1.70:1 on the canvas and fails the 3:1 boundary rule, so the token
       is pulled up to #7f8296: 3.32:1 on surface-2 (the darkest ground a control
       border sits on), 3.79:1 on the canvas. */
    --line-strong: #7f8296;

    /* Link emphasis is lavender. Links render on the canvas and on raised grounds
       (bubbles, cards), so they use --accent-text #5741d8, which clears 4.5:1 on
       every surface (6.66 canvas, 6.21 surface-1, 5.83 surface-2, 5.33 surface-3). */
    --link: #5741d8;
    /* Code ink: a cool machine-blue for code text. 7.50:1 on the code block's
       --surface-2 ground, 8.56:1 on white for inline code. */
    --code-ink: #0a5270;

    /* Semantic colours. --danger carries white text on its fill (6.09:1) and is
       safe as text on the canvas. --success is 3.45:1 on white: a fill and a
       graphic only, never text - success text steps to the badge ink (#026b3f). */
    --danger: #b4332b;
    --success: #149e61;
    --warning: #c47d1f;
    --info: #3b6bb5;

    /* Callout washes carry --text or --text-dim only. --text-mute measures 4.33-4.50
       on these and fails 4.5, which is why it is not permitted on any of them. */
    --tint-info: rgba(59, 107, 181, 0.14);
    --tint-ok: rgba(20, 158, 97, 0.16);
    --tint-warn: rgba(196, 125, 31, 0.16);
    --tint-note: rgba(113, 50, 245, 0.14);

    /* Badge fills and inks (DESIGN.md section 7). Each ink clears 4.5:1 on its own
       fill: success #026b3f on the ok wash 5.49:1, neutral #4d5061 on the neutral
       wash 6.82:1, lavender #5741d8 on the lavender-subtle wash 5.17:1, danger
       #7a241c on the danger wash 8.02:1. */
    --badge-success-fill: rgba(20, 158, 97, 0.16);
    --badge-success-ink: #026b3f;
    --badge-neutral-fill: rgba(104, 107, 130, 0.12);
    --badge-danger-fill: rgba(180, 51, 43, 0.14);
    --badge-danger-ink: #7a241c;

    /* Kind colours live on an 8px dot, which is a graphic, so they answer to 3:1
       rather than the 4.5:1 text needs. Re-measured on the new white canvas: every
       hue clears 3:1 (green 4.87, blue 5.83, peach 4.90, pink 6.57, teal 6.37,
       chat 4.27), and under colour-vision deficiency the closest pair sits 8.5
       apart under deuteranopia and 5.2 under protanopia (both the peach-teal pair,
       clearly distinct - the just-noticeable difference is 2.3). The blue-violet
       pair that used to collapse now sits 12.1 deutan / 10.4 protan apart.

       --teal holds an olive-gold and --peach a burnt terracotta. The names are wrong
       and the values are right: an actual teal collapses into --green under
       deuteranopia. Do not "fix" a value to match its name. */
    --green: #30804b;
    --blue: #376899;
    --peach: #ad5a31;
    --pink: #8f4273;
    --teal: #755c12;

    /* Kind is a fact about a thing, never an action, so none of these is the accent. */
    --kind-note: var(--green);
    --kind-link: var(--blue);
    --kind-pdf: var(--peach);
    --kind-image: var(--pink);
    --kind-file: var(--teal);
    /* A conversation is its own kind of kept thing, so it earns its own hue: a
       desaturated violet, the one patch of the band the five kinds do not occupy.
       The original deep plum collapsed into --blue under deuteranopia (2.7 apart),
       so the violet is lifted until it reads as violet in every vision - 12.1
       deutan / 10.4 protan away from blue - which still leaves it 4.27:1 on white. */
    --kind-chat: #7f6ad4;

    /* The near-black focus ring this replaced is gone: :focus-visible now draws a
       2px --lavender-focus outline at 50% opacity (AU.1). */
    /* Tinted with the ink rather than black, so it stays cool on the canvas. */
    --scrim: rgba(16, 17, 20, 0.32);

    /* Spacing, per DESIGN.md section 4 (4, 8, 12, 16, 24, 32, 48, 96). The old 20px
       --sp-4 is gone; the numeric names keep the binding points the component CSS
       already references, and --sp-md/--sp-lg are the DESIGN.md names for 16 and 24. */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --sp-6: 32px;
    --sp-7: 48px;
    --sp-md: 16px;
    --sp-lg: 24px;
    --sp-section: 96px;

    /* Radius, per DESIGN.md section 5: buttons and inputs 8px (--r-md), cards and
       panels 12px (--r-lg), status pills pill. */
    --r-sm: 6px;
    --r-md: 8px;
    --r: 8px;
    --r-lg: 12px;
    --r-full: 9999px;
    --r-pill: 9999px;

    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    /* System-only on purpose. Monospace here is information - hashes, paths, byte
       sizes - never decoration, and it is not worth a second font file. Nothing is
       named here that is not already on the machine. */
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --z-base: 1;
    --z-raised: 2;
    /* S.5: the frozen home header sits above the wall cards but below the
       drawer, pill, and drag strip. */
    --z-sticky: 5;
    --z-pill: 40;
    --z-menu: 50;
    /* The tags-and-summary drawer sits above the artifact content but below the
       drag strip and the pill, so the window still drags and the pill still wins. */
    --z-drawer: 30;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-fast: 140ms;
    --dur: 160ms;
    --dur-slow: 200ms;

    /* The cool whisper shadow scale, per DESIGN.md section 6. Shadows are cool and
       low-opacity; the surface ladder and hairlines carry most of the hierarchy.
       The old warm 24/48/96px halos are gone. */
    --shadow-micro: 0 1px 3px rgba(16, 17, 20, 0.04);
    --shadow-card: 0 4px 16px rgba(16, 17, 20, 0.06);
    --shadow-lifted: 0 8px 28px rgba(16, 17, 20, 0.08);
  }

  /* Structural whitespace is the first thing to give when the window is narrow: the
     content still needs its gutters, but 96px of air above a title does not. Mobile
     LG per DESIGN.md section 9. */
  @media (max-width: 768px) {
    :root {
      --sp-section: 24px;
    }
  }

  * {
    box-sizing: border-box;
  }
  /* The sticky period heading would otherwise cover the focus ring of anything reached
     by keyboard from below. */
  html {
    /* 32px drag strip plus a hair of air for focus rings. */
    scroll-padding-top: calc(32px + var(--sp-1));
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-dim);
    font-family: var(--sans);
    /* Body SM is the app's default body: this is a reference wall of kept things,
       not a page of prose, so the reading size is one step down from Body. Weight
       holds at 400 and tracking at zero (DESIGN.md section 3). */
    font-size: 14px;
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
  }

  /* Every icon in the app is a stroke-drawn line glyph: the svg() helper emits
     bare paths with no inline styling, so the stroke contract lives here once
     and the per-context rules below only size and weight. The star flag and the
     lit title action override fill/stroke where they need to. */
  svg {
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* The top strip: a persistent search bar and the window's drag handle.
     `-webkit-app-region` is a Chromium feature and is inert in this WKWebView, which is
     why the old CSS drag region never moved the window. Dragging is done by invoking
     the Rust `window_drag` on mousedown instead (see the script), the same mechanism
     the capture overlay uses. Everything at this height and above is draggable except
     the search field itself. */
  .topbar {
    /* A slim drag strip now that the search lives in the home header below. */
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 32px;
    background: var(--bg);
    z-index: calc(var(--z-pill) - 1);
  }
  .searchbar {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    height: 40px;
    /* Inputs answer to the 8px rung, not the pill. */
    padding: 0 var(--sp-3);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    transition:
      border-color var(--dur-fast) var(--ease),
      box-shadow var(--dur-fast) var(--ease);
  }
  .searchbar:focus-within {
    /* DL.4: the focus signal is the mandated 2px lavender-focus ring at 50%
       opacity, not a drop shadow - a ring says "focus", a shadow says "depth". */
    box-shadow: 0 0 0 2px
      color-mix(in oklab, var(--lavender-focus) 50%, transparent);
  }
  /* P.7: on hover the searchbar's border warms to lavender - a hint that the
     most-used input belongs to the brand. The 2px focus ring is untouched, so
     hover and focus read as distinct states. */
  .searchbar:hover {
    border-color: var(--lavender-focus);
  }
  .searchbar svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    stroke: var(--text-mute);
    stroke-width: 2;
  }
  .searchbar input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: none;
    outline: none;
    font: inherit;
    font-size: 14px;
    color: var(--text);
  }
  .searchbar input::placeholder {
    /* The faintest ink that still clears 4.5:1 on the input's surface-1 ground. */
    color: var(--ink-faint);
  }

  /* The home header: a time-of-day greeting with the search bar tucked under it,
     one tight group, then a generous step down to the first shelf. LY.10: the
     hero-to-content transition is the largest gap on the page (48px below the
     header + the shelf's own 24px top), and every later shelf tightens to 24. */
  .homehead {
    position: sticky;
    /* Sticky right below the 32px drag strip: the header freezes in its
       natural position (the greeting never tucks under the traffic lights)
       and the wall cards scroll up beneath it. */
    top: 32px;
    z-index: var(--z-sticky);
    margin-bottom: var(--sp-7);
    /* S.5: the frozen header. Two layers: the lavender wash on top, and an
       opaque white ground beneath. The ground is opaque from the top through
       85%, then fades to transparent at the bottom edge, so cards scrolling
       under dissolve there and nowhere else - they never show through the
       translucent wash at the top (the reappearing-artifacts bug). */
    background:
      linear-gradient(180deg, var(--lavender-subtle) 0%, transparent 40%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg) 92%, transparent 100%);
    padding-top: var(--sp-3);
    padding-bottom: var(--sp-6);
  }
  .homehead .display {
    margin: 0;
    color: var(--text);
    /* LY.7: the greeting is the hero - Display LG (40/600/-1.4) rather than the
       Display MD the generic .display carries. The phrase is the first thing the
       eye lands on, so it earns the largest rung the canvas fits. */
    font-size: 40px;
    line-height: 45px;
    letter-spacing: -1.4px;
  }
  .homehead .searchbar {
    margin-top: var(--sp-4);
  }
  /* The wall's composition is centered: the greeting above the search, and the
     section labels beneath. The cards keep their full-width grid - a card has no
     center, and the grid already spans the centered column. Detail views stay
     left-aligned because they are reading surfaces. */
  .homehead {
    text-align: center;
  }
  .homehead .searchbar {
    margin-inline: auto;
  }
  .shelf.center {
    justify-content: center;
  }
  /* The keycap hint is the discoverability for Cmd+K: it disappears the moment the
     field is focused or holds text, because that is the moment it is no longer
     needed. */
  .searchbar kbd.hint {
    flex-shrink: 0;
    font-family: var(--mono);
    /* Mono: the scale's 13px code step. A keycap keeps its own tight line-height
       as a badge, not a paragraph. DL.5: it fades out over 140ms when the field
       engages, instead of vanishing. */
    font-size: 13px;
    line-height: 1;
    padding: 3px 6px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    color: var(--text-mute);
    background: var(--surface-doc);
    opacity: 1;
    transform: scale(1);
    transition:
      opacity var(--dur-fast) var(--ease),
      transform var(--dur-fast) var(--ease);
  }
  .searchbar:focus-within kbd.hint,
  .searchbar:has(input:not(:placeholder-shown)) kbd.hint {
    /* display:none would skip the transition; the keycap fades and shrinks away,
       and comes back the same way when the field empties again. */
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
  }
  /* The greeting settles in each time the home renders - a 200ms rise, nothing
     more. The reduced-motion block above crushes its duration to 1ms. */
  @keyframes greet {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  .homehead {
    animation: greet var(--dur-slow) var(--ease) backwards;
  }
  /* The model's phrase replaces the fallback with the same settle the header used
     on render - a pop, not a reflow. */
  .greeting.swap {
    animation: greet var(--dur-slow) var(--ease) backwards;
  }
  /* P.7: the greeting's trailing period is the one lavender character in the
     hero text - a single pixel of brand ink that ties the phrase to the eye
     without recoloring the whole line (the eye owns the saturation). */
  .greet-mark {
    color: var(--accent);
  }

  /* The greeting eye: the eye alone is the brand mark now - the lavender disc is
     gone. Ink on the canvas is ~19:1, which clears the 3:1 graphic rule by a wide
     margin, so the eye needs no lavender fill to read: it is the single boldest
     mark on the home view. N.14: the mark is now the supplied eyeball.png - a
     flat image whose white ground was canvas-blended in prep, so it reads as ink
     on the page exactly like the stroke-only SVG did before it. O.3 split the
     image into a frame and a pupil again, restoring the cursor-follow. */
  /* Emblem and greeting side by side as one centered group: the bold eye to
     the left of the phrase, its vertical centre on the text's. The eye is the
     brand mark at the row's left edge instead of a hero stack above the
     phrase, which saves a full emblem-height of vertical space in the home
     header. */
  .greetline {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
  }
  .greet-emblem {
    position: relative;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    animation: emblem-in var(--dur-slow) var(--ease) backwards;
  }
  .greet-emblem .eye-blinkwrap {
    position: relative;
  }
  /* The socket is a circular clip box positioned exactly over the eye
     opening, so the sliding pupil can never paint past the lid. Its
     size and centre are set in source-image px as a fraction of the
     frame's display width, so they scale with the emblem. The frame's
     own art draws over the socket's edge, so the clip seam is hidden. */
  .greet-emblem .eye-socket {
    position: absolute;
    /* Centre the socket on the iris centre (~546, 402 of a 1024 image). */
    left: 53.3%;
    top: 39.3%;
    /* The lid opening: the white sclera run bounded by the lash line,
       ~184 px wide x ~140 px tall in source px (184/1024 = 18.0%,
       140/1024 = 13.7%). A clip this size - not the iris size - is what
       lets the pupil lean within the lid without ever clearing it. */
    width: 18%;
    height: 13.7%;
    transform: translate(-50%, -50%);
    overflow: hidden;
    border-radius: 50%;
    /* The socket sits behind the frame (DOM order), no z-index needed. */
  }
  .greet-emblem .eye-pupil {
    position: absolute;
    /* Rest: centred on the socket. The pupil PNG is 134x133 source px
       (2x SLIDE larger than the 70x69 iris crop), so it must render at
       source scale for the iris to sit exactly where the frame's hole
       is: 134/1024 = 13.09% of the frame. As percentages of the socket
       (18.0% x 13.7% of the frame) that is 13.09/18.0 = 72.7% wide and
       12.99/13.7 = 94.8% tall - the transparent PNG margin provides the
       travel headroom in every direction. */
    left: 50%;
    top: 50%;
    width: 72.7%;
    height: 94.8%;
    transform: translate(-50%, -50%);
    will-change: transform;
  }
  .greet-emblem .eye-frame {
    /* ~104px: the mascot beside the phrase rather than above it - it no longer
       anchors the hero stack, so it steps down from the 112-140px band. The
       image carries a small crop margin around the art, so the clamp sizes the
       whole image and the eye itself lands near 90px, still the boldest mark
       on the row but a companion to the greeting, not a second hero. A vw-aware
       clamp keeps it proportionate on smaller windows. */
    width: clamp(84px, 11vw, 104px);
    height: auto;
    display: block;
  }
  @keyframes emblem-in {
    from {
      opacity: 0;
      transform: translateY(6px) scale(0.86);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  /* No chrome beyond the search strip. Content clears the fixed top bar. */
  main {
    max-width: 1200px;
    margin: 0 auto;
    /* 32px drag strip only - the gradient starts right below the traffic
       lights, no extra breathing step between them. */
    padding: 32px var(--sp-5) 160px;
  }

  /* ---- type roles --------------------------------------------------------
     One geometric sans, no second family. Headlines lock together at -2% tracking;
     line-height ratio drops as size rises. Uppercase appears in exactly one role. */
  .h1,
  .display,
  .h2,
  .h3 {
    color: var(--text);
    /* Display holds at 600, never 700; the ladder below steps down through 500 and
       400. The heading steps override this weight where their rung is lighter. */
    font-weight: 600;
    margin: 0;
  }
  .display {
    /* Display MD, the largest rung that fits a 1200px work surface: the marketing
       page's XL and LG are heroes the app does not have. The -1.0px tracking is the
       display signature - aggressive, scaling down with size, never zero. */
    font-size: 30px;
    line-height: 35px;
    letter-spacing: -1px;
  }
  .h1 {
    /* Headline: panel titles and section openers. */
    font-size: 24px;
    line-height: 29px;
    letter-spacing: -0.5px;
  }
  .h2 {
    /* Title: the scale's 20px step, at its own 500 weight rather than the shared 600. */
    font-size: 20px;
    font-weight: 500;
    line-height: 25px;
    letter-spacing: -0.3px;
  }
  .h3 {
    /* Subhead: lead paragraphs, back at body weight. */
    font-size: 18px;
    font-weight: 400;
    line-height: 25px;
    letter-spacing: -0.2px;
  }

  /* The section-category signal. The leading accent dot is the identity of the label,
     not a flourish, so it is drawn here rather than left to each caller to remember. */
  .shelf {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    /* LY.8/DI.2: a quiet section label, not an eyebrow. Sentence case at 12/500
       with zero tracking, in the faintest ink that still clears 4.5:1 on the
       canvas (--ink-faint, 4.62:1 on surface-1). The accent dot and the uppercase
       tracked eyebrow are gone - DESIGN.md section 8 keeps the accent for brand,
       CTA, focus and links, and the impeccable eyebrow ban applies here. */
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink-faint);
    margin: var(--sp-5) 0 var(--sp-2);
  }
  /* LY.8/DI.2: the decorative accent dot before every section label is gone. */
  .shelf:first-child {
    margin-top: 0;
  }

  .title {
    /* Title: the 20px / 500 card-title step. */
    font-size: 20px;
    font-weight: 500;
    line-height: 25px;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .excerpt {
    /* Body SM: card body and secondary text. */
    font-size: 14px;
    line-height: 21px;
    color: var(--text-dim);
    margin-top: var(--sp-2);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* Metadata only: timestamps, kinds, counts, byte sizes. */
  .meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--sp-1);
    /* Caption: timestamps, kinds, counts and byte sizes are the scale's meta. */
    font-size: 12px;
    font-weight: 400;
    line-height: 17px;
    letter-spacing: 0;
    color: var(--text-mute);
    margin-top: var(--sp-2);
  }
  /* The separator is a graphic between labels, so it answers to 3:1 rather than 4.5. */
  .meta .sep {
    color: var(--line-strong);
  }
  /* Pivot groups: the same title-and-count rhythm as every other view, one step
     apart so a long grouping reads as shelves rather than one wall. */
  .pivotgroup {
    /* Flex row so the toggle and the group delete button share the header
       line; wrap keeps the meta count and the wall on their own rows below. */
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    margin-top: var(--sp-6);
  }
  /* The group header is a button (K.10): the whole row toggles the section, and
     the chevron reads the state - up when expanded, down when collapsed. The
     header reads at the Title rung (N.2a): 20/500, -0.3px, ink - a heading, not
     a caption. The hover lifts the whole row one surface so it reads clickable. */
  .pivotgroup .grouptoggle {
    flex: 1;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    width: 100%;
    padding: 12px 0;
    border: 0;
    background: none;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.26;
    letter-spacing: -0.3px;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    border-radius: var(--r-md);
    transition: background var(--dur-fast) var(--ease);
  }
  .pivotgroup .grouptoggle:hover {
    background: var(--surface);
  }
  .pivotgroup .gchev {
    display: inline-flex;
    flex-shrink: 0;
    color: var(--text-mute);
  }
  .pivotgroup .gchev svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
    transition: transform var(--dur-fast) var(--ease);
  }
  .pivotgroup:not(.collapsed) .gchev svg {
    transform: rotate(180deg);
  }
  .pivotgroup.collapsed .wall,
  .pivotgroup.collapsed .meta {
    display: none;
  }
  /* The count and the wall keep their own rows under the flex header line. */
  .pivotgroup .meta,
  .pivotgroup .wall {
    flex-basis: 100%;
  }
  /* The group delete control (R.3): a small round ghost beside the header
     label, revealed only on saved views. At rest it is quiet; hovering tints
     it danger red to signal the destructive intent. */
  .pivotgroup .groupdel {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: var(--r-full);
    background: none;
    color: var(--text-mute);
    display: grid;
    place-items: center;
    cursor: pointer;
    margin-left: var(--sp-2);
    transition:
      background var(--dur-fast) var(--ease),
      color var(--dur-fast) var(--ease);
  }
  .pivotgroup .groupdel svg {
    width: 15px;
    height: 15px;
    stroke-width: 1.8;
  }
  .pivotgroup .groupdel:hover {
    background: var(--surface);
    color: var(--danger);
  }
  /* Wall sections in the Type and Tags modes get the same collapsible header as
     pivot groups (L.4): the shelf label becomes a button that folds its cards
     away. The shelf look is kept - same 12/500 faint label, now clickable, with
     the item count and a chevron that reads the state. */
  .wallgroup {
    margin-top: var(--sp-5);
  }
  .wallgroup:first-child {
    margin-top: 0;
  }
  .wallgroup .grouptoggle {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    width: 100%;
    /* Same Title-rung uplevel as the pivot groups (N.2a). */
    padding: 12px 0;
    border: 0;
    background: none;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.26;
    letter-spacing: -0.3px;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    border-radius: var(--r-md);
    transition: background var(--dur-fast) var(--ease);
  }
  .wallgroup .grouptoggle:hover {
    background: var(--surface);
  }
  .wallgroup .grouptoggle .shelf {
    flex: 1;
    margin: 0;
    /* The shelf span inherits the toggle's Title sizing (N.2a); its own 12/500
       faint caption treatment applies only to bare shelves, not group headers. */
    font-size: inherit;
    font-weight: inherit;
    line-height: inherit;
    letter-spacing: inherit;
    color: inherit;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .wallgroup .gmeta {
    /* Caption: the item count rides with the label, same faint ink. */
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    letter-spacing: 0;
    color: var(--ink-faint);
  }
  .wallgroup .gchev {
    display: inline-flex;
    flex-shrink: 0;
    color: var(--text-mute);
  }
  .wallgroup .gchev svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
    transition: transform var(--dur-fast) var(--ease);
  }
  .wallgroup:not(.collapsed) .gchev svg {
    transform: rotate(180deg);
  }
  .wallgroup.collapsed .wall {
    display: none;
  }
  /* A typed organize turn: the actions sit at the top (K.8) with the groups
     beneath, inside the turn, using the same pivot group markup. Tighter than
     the standalone view so a grouped turn reads as one turn, not a pasted
     screen. */
  .turn .org {
    margin-top: var(--sp-2);
    min-width: 0;
  }
  .turn .org .pivotgroup {
    margin-top: var(--sp-3);
  }
  .org-actions {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-2);
    margin-top: var(--sp-3);
  }
  /* A misfiled card is invisible unless it can be moved, so every pivot card carries
     the move control. It stays hidden until the card is hovered or the control itself
     takes keyboard focus, so it never competes with the card face it sits on. */
  .pivotcard {
    position: relative;
  }
  .movebtn {
    position: absolute;
    top: var(--sp-2);
    right: var(--sp-2);
    /* AU.9: over the card face it sits on, so the raised rung. */
    z-index: var(--z-raised);
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: var(--r-full);
    background: var(--surface);
    color: var(--text-mute);
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0;
    transition:
      opacity var(--dur-fast) var(--ease),
      background var(--dur-fast) var(--ease),
      color var(--dur-fast) var(--ease);
  }
  .movebtn svg {
    width: 16px;
    height: 16px;
    stroke-width: 1.8;
  }
  .movebtn:hover {
    background: var(--surface-2);
    color: var(--text);
  }
  .pivotcard:hover .movebtn,
  .movebtn:focus {
    opacity: 1;
  }
  /* Removing a card from a saved grouping (L.6b) sits beside the move control;
     both are hidden until the card is hovered or focused, so the pair never
     competes with the card face. The remove one is ghosted - it is reversible. */
  .removebtn {
    position: absolute;
    top: var(--sp-2);
    right: 44px;
    z-index: var(--z-raised);
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: var(--r-full);
    background: var(--surface);
    color: var(--text-mute);
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 0;
    transition:
      opacity var(--dur-fast) var(--ease),
      background var(--dur-fast) var(--ease),
      color var(--dur-fast) var(--ease);
  }
  .removebtn svg {
    width: 16px;
    height: 16px;
    stroke-width: 1.8;
  }
  .removebtn:hover {
    background: var(--surface-2);
    color: var(--danger);
  }
  .pivotcard:hover .removebtn,
  .removebtn:focus {
    opacity: 1;
  }
  /* The restore control on a Removed shelf card (L.6b) mirrors move/remove: a
     small pill over the card face, revealed on hover or focus. */
  .restorebtn {
    position: absolute;
    top: var(--sp-2);
    right: var(--sp-2);
    z-index: var(--z-raised);
    min-height: 0;
    padding: 4px 12px;
    border-radius: var(--r-full);
    border: 1.5px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 17px;
    font-weight: 500;
    letter-spacing: 0;
    cursor: pointer;
    opacity: 0;
    transition:
      opacity var(--dur-fast) var(--ease),
      background var(--dur-fast) var(--ease);
  }
  .restorebtn:hover {
    background: var(--surface-2);
  }
  .pivotcard:hover .restorebtn,
  .restorebtn:focus {
    opacity: 1;
  }
  /* The Removed shelf reads as a quieter group, so its key label is not a
     false group the eye could mistake for a real one. */
  .removedgroup .grouptoggle span {
    color: var(--text-mute);
  }
  .removedgroup .meta {
    color: var(--text-mute);
  }
  /* The move picker's group choices stack full-width so a long key is never clipped. */
  .pickgroups {
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    margin: var(--sp-3) 0;
    max-height: 50vh;
    overflow-y: auto;
  }
  .pickgroups .btn {
    justify-content: flex-start;
    text-align: left;
  }
  /* The add-artifact picker (L.6c) filters the library with a search box above
     the same full-width row list the move picker uses. */
  .picksearch {
    width: 100%;
    margin-top: var(--sp-3);
    padding: 8px 12px;
    /* N.11b: an input, not a pill - 8px corners per DESIGN.md section 7. */
    border-radius: var(--r-md);
    border: 1.5px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    transition:
      border-color var(--dur-fast) var(--ease),
      box-shadow var(--dur-fast) var(--ease);
  }
  .picksearch:focus {
    outline: none;
    border-color: var(--accent);
    /* N.9c: the same 2px lavender-focus ring as the home searchbar - one focus
       signal for every input in the app. */
    box-shadow: 0 0 0 2px
      color-mix(in oklab, var(--lavender-focus) 50%, transparent);
  }
  /* The saved-groupings picker row (L.5): the name runs the grouping, with the
     rename pencil and the forget control beside it, one row per grouping. The
     name grows to fill the row so the controls sit at the right edge. */
  .pickgroups .customrow {
    display: flex;
    align-items: center;
    gap: var(--sp-1);
  }
  .pickgroups .customrow .rowname {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pickgroups .customrow .title-action {
    width: 32px;
    height: 32px;
    border-radius: var(--r-full);
    color: var(--text-mute);
  }
  .pickgroups .customrow .title-action svg {
    width: 15px;
    height: 15px;
  }
  /* The rename pencil and the forget X on a saved-view row (P.6): the row-level
     add plus is gone - adding to a view happens from the artifact's own drawer
     now, or from inside a saved view run. */
  .pickgroups .customrow .forgetbtn {
    /* Icon button (N.1a): 32px round, matching the rename pencil beside it. The
       X is the destructive disclosure on this row, so its hover is the danger
       ink, not the neutral text. */
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: var(--r-full);
    background: none;
    color: var(--text-mute);
    overflow: hidden;
    font-family: var(--sans);
    cursor: pointer;
    transition:
      background var(--dur-fast) var(--ease),
      color var(--dur-fast) var(--ease);
  }
  .pickgroups .customrow .forgetbtn svg {
    width: 15px;
    height: 15px;
    /* Same stroke contract as the plus and the pencil (N.1a). */
    stroke-width: 1.8;
  }
  .pickgroups .customrow .forgetbtn:hover {
    color: var(--danger);
    background: var(--surface-2);
  }
  .aside {
    /* Body: helper and supporting text. */
    font-size: 16px;
    line-height: 24px;
    color: var(--text-dim);
    margin-top: var(--sp-2);
    max-width: 64ch;
  }
  .aside.dirty {
    color: var(--accent-text);
    font-weight: 500;
  }
  /* Why something failed carries more than what it will cost, so it is not the same
     grey. It is still ink, never the accent: the accent is an instruction. */
  .aside.caution,
  .strongtext {
    color: var(--text);
    font-weight: 600;
  }
  .state {
    /* Body LG: the empty state is a lead paragraph. */
    font-size: 18px;
    line-height: 27px;
    letter-spacing: -0.1px;
    color: var(--text-dim);
    padding: var(--sp-5) 0;
    max-width: 62ch;
  }
  /* At most one display line per view: the empty state's, or the home greeting's. */
  .empty {
    text-align: center;
    padding-top: var(--sp-section);
  }
  .empty .state {
    margin: 0 auto;
    text-align: left;
  }

  /* Every focusable element, one ring, no exceptions. A translucent browser default
     would be the only thing in the app that is not verified against its ground. */
  :focus-visible {
    /* One ring, no exceptions: 2px lavender-focus at 50% opacity, per DESIGN.md
       section 7. Soft enough to sit under the lavender fills it rings, distinct
       enough against the canvas. */
    outline: 2px solid
      color-mix(in oklab, var(--lavender-focus) 50%, transparent);
    outline-offset: 2px;
  }
  :focus:not(:focus-visible) {
    outline: none;
  }

  /* ---- buttons ------------------------------------------------------------
     One geometry for all of them: 8px radius, 14/500 label with zero tracking,
     8px 14px padding, 40px minimum height. What changes between variants is
     fill and edge. */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    min-height: 40px;
    /* 8px 14px, per DESIGN.md section 7. */
    padding: 8px 14px;
    border-radius: var(--r-md);
    border: 1px solid transparent;
    background: transparent;
    font-family: var(--sans);
    /* Button: 14px / 500 / 1.20 with zero tracking - the scale's button step. */
    font-size: 14px;
    font-weight: 500;
    line-height: 17px;
    letter-spacing: 0;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition:
      background var(--dur-fast) var(--ease),
      border-color var(--dur-fast) var(--ease),
      color var(--dur-fast) var(--ease);
  }
  .btn.sm {
    font-size: 12px;
    line-height: 15px;
    letter-spacing: 0;
  }
  /* Primary: the one instruction per surface. The old 1.5px --text edge is gone -
     lavender clears the 3:1 sole-boundary rule on the canvas (6.04:1), so the fill
     bounds the control on its own, and the label is white on the fill (6.04:1). */
  .btn.primary {
    background: var(--accent);
    color: var(--on-lavender);
  }
  .btn.primary:hover {
    /* DESIGN-kraken.md names #8b5cf6 as the hover, but white on that is 4.23:1 and
       fails 4.5; the hover step is the lavender-focus that clears 4.5 (6.04:1 with
       white). */
    background: var(--lavender-focus);
  }
  .btn.primary:active {
    background: var(--lavender-deep);
  }
  .btn.secondary {
    background: var(--surface);
    border-color: var(--line-strong);
    color: var(--text);
  }
  .btn.secondary:hover {
    background: var(--surface-2);
  }
  .btn.secondary:active {
    background: var(--surface-3);
  }
  .btn.tertiary {
    color: var(--text);
  }
  .btn.tertiary:hover {
    background: var(--surface);
  }
  .btn.tertiary:active {
    background: var(--surface-2);
  }
  /* The compact text button: same ghost treatment as tertiary, tighter padding. */
  .btn.ghost {
    padding: 6px 12px;
    color: var(--text);
  }
  .btn.ghost:hover {
    background: var(--surface);
  }
  .btn.ghost:active {
    background: var(--surface-2);
  }
  /* Subtle: a lavender wash for a secondary brand action. The wash carries the
     lavender idea without shouting. Its text is the deep lavender that clears 4.5:1
     on the wash (5.17:1): the primary #7132f5 measures 4.69 there and only just
     clears, so the wash uses --accent-text, the same ink the badges use. */
  .btn.subtle {
    background: var(--lavender-subtle);
    color: var(--accent-text);
  }
  .btn.subtle:hover {
    background: color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .btn.subtle:active {
    background: color-mix(in srgb, var(--accent) 24%, transparent);
  }
  /* Inverse: white on a lavender or surface-2 banner. On lavender the white fill
     bounds the control itself (6.04:1 against the banner); on surface-2 the
     line-strong border carries the 3:1 boundary (3.32:1). */
  .btn.inverse {
    background: #ffffff;
    border-color: var(--line-strong);
    color: var(--text);
  }
  .btn.inverse:hover {
    background: var(--surface-doc);
  }
  .btn.danger {
    background: var(--danger);
    color: #ffffff;
  }
  .btn.danger:hover {
    background: color-mix(in oklab, var(--danger) 82%, var(--text));
    border-color: color-mix(in oklab, var(--danger) 82%, var(--text));
  }
  .btn.danger:active {
    background: color-mix(in oklab, var(--danger) 70%, var(--text));
    border-color: color-mix(in oklab, var(--danger) 70%, var(--text));
  }
  /* Icon-only. The fill change is the boundary, so no line is required around it. */
  .btn.icon {
    width: 40px;
    height: 40px;
    min-height: 40px;
    padding: 0;
    border-radius: var(--r-md);
    background: var(--surface-2);
    color: var(--text);
  }
  .btn.icon:hover {
    background: var(--surface-3);
  }
  /* Disabled is never colour alone: fill, opacity, cursor and aria-disabled together. */
  .btn[disabled],
  .btn[aria-disabled="true"] {
    background: var(--surface-2);
    border-color: transparent;
    color: var(--text-mute);
    opacity: 0.55;
    cursor: not-allowed;
  }
  .btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    stroke-width: 1.8;
  }
  .btn.icon svg {
    width: 19px;
    height: 19px;
  }

  /* ---- callouts -----------------------------------------------------------
     Inline notices only. No border, no shadow, --text or --text-dim on the tint. */
  .callout {
    border-radius: var(--r);
    padding: var(--sp-4);
    margin-top: var(--sp-4);
    color: var(--text);
    font-size: 16px;
    line-height: 22.4px;
    max-width: 68ch;
  }
  .callout.info {
    background: var(--tint-info);
  }
  .callout.ok {
    background: var(--tint-ok);
  }
  .callout.warn {
    background: var(--tint-warn);
  }
  .callout.note {
    background: var(--tint-note);
  }
  /* --text-mute measures 4.36 on --tint-note and fails 4.5, so an eyebrow on a tint
     steps up to --text-dim (6.13) rather than keeping its usual grey. */
  .callout .shelf {
    color: var(--text-dim);
    margin: 0 0 var(--sp-3);
  }
  .callout p {
    margin: 0;
  }
  .callout p + p {
    margin-top: var(--sp-3);
  }

  /* ---- rows ---------------------------------------------------------------
     Collections on the wall, trash entries, anything that is a line rather than an
     object. Lifted onto --surface with a hairline, never a recessed fill inside a card. */
  .item {
    display: flex;
    gap: var(--sp-4);
    align-items: center;
    padding: var(--sp-3) var(--sp-4);
    margin-bottom: var(--sp-2);
    background: var(--surface);
    border: 1px solid var(--line);
    /* Cards answer to the 12px rung, even the compact list rows. */
    border-radius: var(--r-lg);
    transition:
      background var(--dur-fast) var(--ease),
      border-color var(--dur-fast) var(--ease);
    cursor: pointer;
  }
  .item:hover {
    /* Level 2 lift, same as the wall cards. */
    background: var(--surface-2);
    border-color: var(--line-strong);
  }
  .item-body {
    flex: 1;
    min-width: 0;
  }
  .item-body .kindrow {
    margin-bottom: var(--sp-1);
  }
  .item .meta {
    margin-top: 0;
    flex-shrink: 0;
  }

  /* ---- the wall ----------------------------------------------------------
     Square cards on cream. Roughly 4-up at 1200px and 1-up at 480px, which falls out
     of auto-fill rather than out of a breakpoint list. */
  .wall {
    display: grid;
    /* LY.3: 5-up at desktop (N.6a), dropping a column per the ladder below
       (4-up at 1440, 3-up at 1280, 2-up at 1024, 1-up at 768). Minh's call:
       5 is the densest mode, and the card chrome tightens to 16px so the
       narrower column still reads. */
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: var(--sp-4);
    margin-top: var(--sp-4);
  }
  /* LY.9: the saved wall keeps its breathing room before the next shelf, moved
     from an inline style on the element to a class. */
  .wall--saved {
    margin-bottom: var(--sp-5);
  }
  /* S.5: the wall body sits below the sticky header. The top 8px of the slot
     is a margin gap (the grid's own margin-top), and the mask softens it so
     the leading edge of the first cards dissolves as they scroll up under the
     header rather than clipping at a hard line. */
  /* S.7b: an 8px horizontal inset pulls the card grid inside the gradient's
     visual bounds, so no card or tag reads as sticking out past the wash. */
  .wallbody {
    padding-inline: var(--sp-2);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 8px);
    mask-image: linear-gradient(180deg, transparent 0%, black 8px);
  }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    /* CR.5: the wall is a grid of tiles, not a checkerboard. A text card takes
       its natural height - title plus clamped preview - so a long note visibly
       differs from a bare link; the min-height keeps a one-line note from
       collapsing to a sliver. Pictorial cards keep the square lock below,
       because there the picture is the shape. */
    min-height: 140px;
    min-width: 0;
    overflow: hidden;
    cursor: pointer;
    /* Level 1: surface on canvas with a hairline. The wall cards follow the
       card recipe - surface 1, 1px line border, 12px radius - with 12px
       padding at the 5-up default (O.2b), back to 16px below 1280px. */
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: var(--sp-3);
    /* The wall never sheds a card: scrolling appends, and a collection meant to grow
       forever means the grid keeps everything ever scrolled past. Measured at 2,000
       cards, one style change cost 152 ms of forced layout - nine dropped frames for a
       hover. Skipping the rendering work for off-screen cards brings that to 48 ms
       while leaving them in the DOM, so scroll position, anchoring and find-in-page
       all keep working. Virtual scrolling would be faster and would break all three. */
    content-visibility: auto;
    /* N.10a: the intrinsic-size hint tracks the slightly shorter 5-up cards. */
    contain-intrinsic-size: auto 150px;
    /* Elevation only. Scaling a card on hover moves everything the eye was using to
       compare one object with another. */
    transition:
      background var(--dur) ease,
      border-color var(--dur) ease,
      box-shadow var(--dur) ease;
  }
  .card:hover {
    /* Level 2 lift: the hovered card steps up a surface and its hairline tightens
       to line-strong. The whisper card shadow helps it separate from the wall. */
    background: var(--surface-2);
    border-color: var(--line-strong);
    box-shadow: var(--shadow-card);
  }

  /* One hue per kind, resolved wherever the kind is declared and inherited by the dot
     inside it. The dot is the only thing that ever reads it: a kind may not become a
     background, a border, a title colour or a badge, because kind is a fact about a
     thing and every one of those would make it look like an instruction. */
  [data-kind="note"] {
    --kind: var(--kind-note);
  }
  [data-kind="link"] {
    --kind: var(--kind-link);
  }
  [data-kind="pdf"] {
    --kind: var(--kind-pdf);
  }
  [data-kind="image"] {
    --kind: var(--kind-image);
  }
  [data-kind="file"] {
    --kind: var(--kind-file);
  }
  [data-kind="chat"] {
    --kind: var(--kind-chat);
  }

  /* The dot carries the hue, the word beside it carries the meaning, and they always
     travel together. Colour is never the only thing saying what a thing is, which
     satisfies 1.4.1 structurally rather than by a note in a document. */
  .kindrow {
    display: flex;
    align-items: center;
    gap: var(--sp-1);
    flex-shrink: 0;
  }
  .kindmark {
    display: inline-block;
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    border-radius: var(--r-full);
    background: var(--kind, var(--line-strong));
    /* Q.2: the dot is 8px - below touch-target size. The transparent ::after
       extends the hit area to 44px without changing the visible dot, so a
       future tap target (eg filter-by-kind) works with no CSS change. */
    position: relative;
  }
  .kindmark::after {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
  }
  .kindword {
    /* Caption: the kind label travels with its dot and stays smaller than the title. */
    font-size: 12px;
    font-weight: 400;
    line-height: 17px;
    color: var(--text-dim);
  }

  .card .title {
    margin-top: var(--sp-3);
    /* Title: the scale's 20px / 500 card-title step, at the base class's values. */
    font-size: 20px;
    font-weight: 500;
    line-height: 25px;
    letter-spacing: -0.3px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* The saved-grouping card pencil (L.3b): the same rename act as the saved-
     grouping pencil, at card scale. It stays visible - the forget control only wakes on
     hover, and a rename affordance that hides would defeat having one at all. */
  .card .title-action {
    width: 26px;
    height: 26px;
    border-radius: var(--r-full);
  }
  .card .title-action svg {
    width: 15px;
    height: 15px;
  }
  .card .preview {
    flex: 1;
    min-height: 0;
    margin-top: var(--sp-2);
    /* Body SM: the card preview is secondary text. */
    font-size: 14px;
    line-height: 21px;
    color: var(--text-dim);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    /* N.5: the note preview keeps its newlines (list items, paragraph breaks)
       so a bulleted note reads as bullets instead of a run-on phrase. */
    white-space: pre-wrap;
  }
  /* A note's preview is a plain-text snippet (markdown stripped before it
     reaches the card), so the clamped box holds a single text run: the browser
     paints the ellipsis itself and no block child can overlap another line. */
  .cardfoot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-2);
    margin-top: var(--sp-3);
  }
  .cardfoot .meta {
    margin-top: 0;
  }
  /* The only accent on the wall, and it means one thing: nothing has read this yet. */
  .unread {
    width: 6px;
    height: 6px;
    flex-shrink: 0;
    border-radius: var(--r-full);
    background: var(--accent);
    /* P.7: a soft lavender halo around the unread dot - the pending state reads
       as a small purple "ping". Decorative, so no contrast requirement. */
    box-shadow: 0 0 0 4px var(--lavender-subtle);
  }
  /* A card that is being kept says so, but quietly: keeping is a state, not an
     instruction, so it does not get the accent. */
  .card .flag {
    color: var(--text-mute);
  }
  .card .flag svg {
    width: 14px;
    height: 14px;
    display: block;
    fill: currentColor;
    stroke-width: 1.4;
  }

  /* A picture is the truest face a thing has, so it fills the card and the title rides
     a band over the foot of it. A band, not a gradient: a gradient has no edge and the
     text ends up sitting on whatever the photograph happens to be doing there. The
     square lock stays here (CR.5): the image is the card's shape, so pictorial cards
     hold the 1:1 the grid was built on. */
  .card.pictorial {
    aspect-ratio: 1 / 1;
    padding: 0;
  }
  .card.pictorial img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .cardband {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: var(--sp-3) 24px 24px;
    background: rgb(255 255 255 / 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .cardband .title {
    margin-top: 0;
    -webkit-line-clamp: 2;
  }
  .cardband .kindrow {
    margin-bottom: var(--sp-1);
  }
  .card.pictorial .flag {
    position: absolute;
    top: var(--sp-3);
    right: var(--sp-3);
  }

  #wallEnd {
    min-height: 24px;
    padding: var(--sp-4) 0 var(--sp-6);
    text-align: center;
  }

  @media (max-width: 1280px) {
    .wall {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    /* The 4-up and below ladder restores the roomier 16px card padding -
       only the densest 5-up mode tightens (O.2b). */
    .card {
      padding: var(--sp-md);
    }
  }
  @media (max-width: 1024px) {
    .wall {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }
  @media (max-width: 768px) {
    .wall {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--sp-3);
    }
    /* Display scales toward Display MD on mobile, per DESIGN.md section 9. */
    .homehead .display {
      font-size: 30px;
      line-height: 35px;
      letter-spacing: -1px;
    }
  }
  @media (max-width: 480px) {
    .wall {
      grid-template-columns: minmax(0, 1fr);
      gap: var(--sp-3);
    }
  }

  /* settings tab bar -------------------------------------------------------
     DI.1: one tabbed surface instead of four stacked full pages, so the tab
     bar is the whole navigation. Underline tabs: the active one takes the
     lavender accent, and the bar itself is the divider. */
  .settings-tabs {
    display: flex;
    gap: var(--sp-1);
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    /* Q.6: a little air above the bar so it reads as its own row below the
       "Settings" heading, not a line under it. */
    margin-top: var(--sp-3);
    margin-bottom: var(--sp-5);
    scrollbar-width: none;
  }
  .settings-tabs::-webkit-scrollbar {
    display: none;
  }
  .settings-tabs button {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-mute);
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: var(--sp-2) var(--sp-3) calc(var(--sp-2) - 2px);
    cursor: pointer;
    white-space: nowrap;
    transition:
      color var(--dur-fast) var(--ease),
      border-color var(--dur-fast) var(--ease);
  }
  .settings-tabs button:hover {
    color: var(--text);
  }
  .settings-tabs button.active {
    color: var(--accent-text);
    border-bottom-color: var(--accent);
    /* Q.6: a faint lavender wash behind the active tab's label so it reads as
       a place, not just a line. The top corners round so the wash reads as a
       tab; the underline stays. */
    background: var(--lavender-subtle);
    border-radius: var(--r-md) var(--r-md) 0 0;
  }
  /* The disclosure that holds the trash item list behind a summary, DI.6. */
  .disclosure {
    margin-top: var(--sp-2);
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface-2);
    overflow: hidden;
  }
  .disclosure summary {
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--sp-2);
    cursor: pointer;
    user-select: none;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    padding: var(--sp-2) var(--sp-3);
  }
  .disclosure summary::-webkit-details-marker {
    display: none;
  }
  .disclosure summary::after {
    content: "";
    width: 8px;
    height: 8px;
    border-right: 1.5px solid var(--text-mute);
    border-bottom: 1.5px solid var(--text-mute);
    transform: rotate(45deg) translate(-1px, -1px);
    transition: transform var(--dur-fast) var(--ease);
  }
  .disclosure[open] summary::after {
    transform: rotate(-135deg) translate(-1px, -1px);
  }
  .disclosure .disclosure-body {
    padding: 0 var(--sp-3) var(--sp-3);
  }
  /* ---- the capture pill ---------------------------------------------------
     The app's signature object, present on every page. It floats, so it is one of the
     four things in the whole system allowed a shadow. */
  .pill {
    position: fixed;
    left: 50%;
    bottom: var(--sp-5);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    height: 56px;
    padding: 0 var(--sp-4);
    z-index: var(--z-pill);
    /* S.6: a tinted surface, not the same white as the cards behind it, so
       the pill reads as a distinct object floating above the artifacts.
       --surface-2 is two rungs off the canvas - cool, not grey, clearly
       darker than the wall cards' --surface. */
    background: var(--surface-2);
    /* S.6: a hairline edge so the pill reads as a defined object against the
       artifacts, not just a shadow blur. */
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    /* S.6: a bolder shadow than the default --shadow-lifted so the pill pops
       above the card grid - a tight contact shadow plus a wide elevation one
       at 50% stronger opacity than the old lifted shadow. */
    box-shadow:
      0 4px 12px rgba(16, 17, 20, 0.06),
      0 12px 36px rgba(16, 17, 20, 0.12);
    transition:
      width var(--dur-slow) ease,
      box-shadow var(--dur-slow) ease,
      transform var(--dur-fast) var(--ease);
  }
  /* DL.2: hovering the pill lifts it 2px - a physical object answering a cursor,
     with the same cool shadow it already carries. The centering translateX is
     preserved. Placed before the focus rule so the focus ring wins when both
     apply (hovering a focused pill keeps the ring visible). */
  .pill:hover {
    transform: translateX(-50%) translateY(-2px);
  }
  /* AU.2: the pill field's own outline is off, so the container carries the focus
     ring - the same 2px lavender-focus at 50% as every other control, one size up
     for the 56px pill. Ring first, then the lift, so focus reads as focus. */
  .pill:focus-within {
    box-shadow:
      0 0 0 2px color-mix(in oklab, var(--lavender-focus) 50%, transparent),
      var(--shadow-lifted);
  }
  /* The capture control is the one thing on the pill that is an instruction, so it is
     the one thing wearing the accent: a filled circle, with the label in plain ink
     beside it rather than in the yellow, which could not be read. */
  .pill .keep {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    height: 44px;
    padding: 0 var(--sp-2) 0 0;
    border: 0;
    background: transparent;
    border-radius: var(--r-full);
    font-family: var(--sans);
    /* Button: 14px / 500 / 1.20, zero tracking. */
    font-size: 14px;
    font-weight: 500;
    line-height: 17px;
    letter-spacing: 0;
    color: var(--text);
    cursor: pointer;
  }
  .pill .keep .disc {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: var(--r-full);
    background: var(--accent);
    /* The edge is gone: the disc's lavender fill bounds it against the pill surface
       at 6.04:1, so no --text edge is needed (the old edge was for amber, which
       could not bound a control on its own). DL.1: the disc squashes on press -
       scale, never a fill change, because the disc never fills --lavender-deep
       while the ink motif is on it (ink on deep is 2.28:1 and fails). */
    color: var(--accent-ink);
    /* Q.5: the transform transition gets an ease-out-back so the press
       releases with a ~3% overshoot pop instead of a linear settle; the
       background stays on the plain ease. */
    transition:
      background var(--dur-fast) var(--ease),
      transform var(--dur-fast) cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .pill .keep:hover .disc {
    background: var(--lavender-focus);
    /* Q.5: a 6px 16%-opacity halo so the disc "warms up" when the cursor
       approaches - it reads as a glow, not a border (decorative, no contrast
       requirement). */
    box-shadow: 0 0 0 6px var(--lavender-subtle);
  }
  .pill .keep:active .disc {
    transform: scale(0.92);
  }
  .pill .keep .chev {
    color: var(--text-mute);
  }
  /* Icon-only companions. Their fill is their boundary, so they need no line.
     AU.10: 44px is the touch floor, so a finger gets the same target a cursor
     does. DL.3: the same press squash vocabulary as the disc. */
  .pill button.round {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border: 0;
    border-radius: var(--r-full);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition:
      background var(--dur-fast) var(--ease),
      color var(--dur-fast) var(--ease),
      transform var(--dur-fast) var(--ease);
  }
  /* Q.5: on hover the round buttons take the pill's colour language - a faint
     lavender wash behind a lavender icon, the same accent the keep disc wears. */
  .pill button.round:hover {
    background: var(--lavender-subtle);
    color: var(--accent);
  }
  .pill button.round:active {
    transform: scale(0.94);
  }
  /* Q.3: at <380px the pill's 56px height + 44px round buttons risk spilling
     the viewport. Tighten the padding/gap and hide the keep label if one is
     present (the disc alone still reads as add via its plus icon). */
  @media (max-width: 380px) {
    .pill {
      padding: 0 var(--sp-2);
      gap: var(--sp-1);
    }
    .pill .keep {
      padding: 0 var(--sp-1) 0 0;
    }
    .pill .keep .label {
      display: none;
    }
  }
  .pill svg {
    width: 19px;
    height: 19px;
    stroke-width: 1.8;
  }
  .pill .keep .disc svg {
    width: 18px;
    height: 18px;
    stroke-width: 2.2;
  }
  .pill .keep .chev svg {
    width: 15px;
    height: 15px;
  }

  /* Typing turns the pill into a field. It keeps the stadium, because it is still the
     same object doing a second thing rather than a different control appearing. */
  .pill.wide {
    width: min(560px, calc(100vw - 40px));
    padding-left: var(--sp-4);
  }
  .pill input {
    flex: 1;
    min-width: 0;
    font-family: var(--sans);
    /* Body: entry text at 16 / 400, zero tracking. */
    font-size: 16px;
    font-weight: 400;
    line-height: 24px;
    letter-spacing: 0;
    background: transparent;
    border: 0;
    color: var(--text);
    padding: var(--sp-2) 0;
  }
  .pill input:focus {
    outline: none;
  }
  .pill input::placeholder {
    color: var(--ink-faint);
  }
  .scope {
    /* Caption: the scope prefix in the capture pill. */
    font-size: 12px;
    font-weight: 400;
    color: var(--text-mute);
    white-space: nowrap;
    padding-right: var(--sp-2);
  }

  /* Four equal choices, so none of them is the primary and none of them is yellow. */
  .menu {
    position: fixed;
    left: 50%;
    bottom: 96px;
    z-index: var(--z-menu);
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
    width: 280px;
    background: var(--surface);
    /* AU.3: shadow, no border - a floating surface. */
    border: 0;
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lifted);
    padding: var(--sp-2);
  }
  .menu button {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    width: 100%;
    background: transparent;
    border: 0;
    border-radius: var(--r);
    cursor: pointer;
    padding: var(--sp-3);
    font-family: var(--sans);
    /* Body: menu items are list text, not buttons. */
    font-size: 16px;
    font-weight: 400;
    line-height: 24px;
    letter-spacing: 0;
    color: var(--text);
    text-align: left;
    transition:
      background var(--dur-fast) var(--ease),
      color var(--dur-fast) var(--ease);
  }
  /* Q.5: the capture menu shares the pill's colour language - lavender wash +
     lavender ink/icon on hover, matching the round buttons. Keyboard focus
     keeps its own surface-2 signal so the two states stay distinct. */
  .menu button:hover {
    background: var(--lavender-subtle);
    color: var(--accent);
  }
  .menu button:focus-visible {
    background: var(--surface-2);
  }
  .menu button:hover .ic {
    color: var(--accent);
  }
  .menu .ic {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--text-mute);
    display: grid;
    place-items: center;
  }
  .menu svg {
    width: 20px;
    height: 20px;
    stroke-width: 1.8;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translate(-50%, 4px);
    }
    to {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }
  .menu {
    transform: translateX(-50%);
    animation: rise var(--dur-fast) ease both;
  }
  @keyframes hang {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  /* `backwards`, not `both`: the end frame is the element's own resting state anyway,
     and a retained end frame keeps `transform: none` winning over every later rule. */
  .hang {
    animation: hang var(--dur-slow) var(--ease) backwards;
  }

  /* `animation-iteration-count` has to be reset too, and leaving it out is worse than
     doing nothing at all. Measured: `breathe` kept `infinite` while its duration was
     crushed to 1ms, turning a slow pulse into roughly sixty opacity flashes a second
     for exactly the people who asked for less motion. */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
    .thinking,
    .recorder.listening span {
      animation: none !important;
      opacity: 1 !important;
    }
  }

  /* ---- the artifact ------------------------------------------------------- */
  .back {
    margin-bottom: var(--sp-4);
  }
  .h1 {
    margin-top: var(--sp-4);
  }
  .h1:first-child {
    margin-top: 0;
  }
  /* ---- opening a thing --------------------------------------------------
     The card and the artifact are one object seen twice, so the browser tweens between
     them rather than replacing a page. The default crossfade is switched off for the
     named parts: a face that dissolves into a different face looks like two things,
     and the whole point is that it is one. */
  ::view-transition-old(artifact-face),
  ::view-transition-new(artifact-face) {
    /* Height, not both: a square card becoming a tall page must not squash on the
       way. Letting height animate alone keeps the width honest at every frame. */
    height: 100%;
    animation: none;
    mix-blend-mode: normal;
    object-fit: cover;
  }
  ::view-transition-old(artifact-title),
  ::view-transition-new(artifact-title) {
    height: 100%;
    animation: none;
    mix-blend-mode: normal;
  }
  ::view-transition-group(artifact-face),
  ::view-transition-group(artifact-title) {
    animation-duration: 340ms;
    animation-timing-function: cubic-bezier(0.2, 0.9, 0.24, 1);
  }

  ::view-transition-old(root) {
    animation: 120ms cubic-bezier(0.4, 0, 1, 1) both fadeOut;
  }
  ::view-transition-new(root) {
    animation: 220ms cubic-bezier(0, 0, 0.2, 1) 60ms both fadeIn;
  }
  @keyframes fadeOut {
    to {
      opacity: 0;
    }
  }
  @keyframes fadeIn {
    from {
      opacity: 0;
    }
  }

  .titlerow {
    display: flex;
    align-items: flex-start;
    gap: var(--sp-3);
    margin-top: var(--sp-2);
  }
  .titlerow .h1,
  .titlerow .h2 {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 0;
  }
  .title-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-dim);
    border-radius: var(--r-sm);
    flex-shrink: 0;
    margin-top: 0;
    transition:
      color 0.15s,
      background 0.15s;
  }
  /* CR.3: pin and the drawer ride together as one unit, tighter than the
     titlerow's 12px gap, so the header reads as grouped affordances rather than
     four identical icons in a row. */
  .title-group {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    margin: 0 var(--sp-1);
  }
  .title-action svg {
    width: 22px;
    height: 22px;
    stroke-width: 1.8;
  }
  .title-action:active {
    transform: scale(0.92);
  }
  .title-action.lit svg {
    fill: currentColor;
    stroke: var(--text-dim);
  }
  .title-action:hover {
    color: var(--text);
    background: color-mix(in srgb, var(--line) 20%, transparent);
  }
  .title-action.lit {
    color: var(--accent-text);
  }
  .title-action.lit:hover {
    color: var(--accent-text);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .title-action.danger:hover {
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 10%, transparent);
  }
  /* Nothing you can do to an artifact is urgent, so this row has no primary in it. */
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--sp-3);
    margin-top: var(--sp-4);
  }
  /* The author flex rule above would beat the UA's [hidden] rule, so the dirty
     bar needs its own explicit hidden state to collapse to nothing. */
  .actions[hidden] {
    display: none;
  }

  /* Tags: optional labels on an artifact, added after it exists. The row hugs
     the header; the reading pane's own top margin gives the generous gap below. */
  /* The artifact page: one centered reading stack. Everything in flow - the back
     button, kind row, title row, meta, actions, url, callouts and the body -
     lives in .pagecol, a 720px long-form measure centered the way the wall is.
     The pin / drawer / trash icons therefore land just to the right of the title
     text, not at the far edge of the app window. The drawer is position:fixed
     and stays anchored to the viewport edge, covering the column only when open. */
  main[data-kind] .pagecol,
  #view > .pagecol {
    max-width: 720px;
    margin: 0 auto;
  }
  .bodygrid {
    margin: var(--sp-6) 0 0;
  }
  .bodycol {
    min-width: 0;
  }
  .bodycol > :first-child {
    margin-top: 0;
  }
  /* The tags-and-summary drawer. Fixed to the right edge, over the content, never
     beside it: it cannot push or reflow the reading column, only cover it. Hidden
     off-screen when closed, so it is out of the tab order and the a11y tree until
     the toggle brings it in. */
  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(320px, 88vw);
    z-index: var(--z-drawer);
    background: var(--surface);
    border-left: 1px solid var(--line);
    box-shadow: var(--shadow-lifted);
    overflow-y: auto;
    /* The same breathing room as main: clears the 32px drag strip above and the
       pill below, so nothing scrolls under the chrome. */
    padding: calc(32px + var(--sp-5)) var(--sp-5) 132px;
    visibility: hidden;
    transform: translateX(100%);
    transition:
      transform var(--dur-slow) var(--ease),
      visibility 0s linear var(--dur-slow);
  }
  .drawer.open {
    visibility: visible;
    transform: translateX(0);
    transition: transform var(--dur-slow) var(--ease);
  }
  .drawer .shelf {
    margin-top: 0;
  }
  /* The drawer's own dismiss control. The header toggle is the primary affordance,
     but at narrow widths the open drawer covers the header, so the drawer carries a
     `>>` of its own in its top corner - Escape and this both close it. */
  .drawer-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-2);
  }
  .drawer-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-mute);
    border-radius: var(--r-sm);
    flex-shrink: 0;
  }
  .drawer-close:hover {
    color: var(--text);
    background: color-mix(in srgb, var(--line) 20%, transparent);
  }
  .drawer-close svg {
    width: 18px;
    height: 18px;
    stroke-width: 1.8;
  }
  .tagrow {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--sp-1);
  }
  .tagrow .tagchip {
    max-width: 100%;
  }
  .tagrow .taglabel {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tagrow .tagadd {
    width: 100%;
    min-width: 0;
  }
  @media (max-width: 768px) {
    .drawer {
      width: 88vw;
    }
  }
  .tagchip {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    padding: var(--sp-1) var(--sp-2);
    background: var(--surface-2);
    border-radius: var(--r-full);
    border: 0;
    font: inherit;
    /* Caption: tags are meta labels. */
    font-size: 12px;
    font-weight: 400;
    line-height: 17px;
    color: var(--text);
  }
  .tagx {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    border-radius: var(--r-full);
    background: none;
    color: var(--text-mute);
    cursor: pointer;
  }
  .tagx:hover {
    color: var(--text);
    background: var(--line-soft);
  }
  .tagx svg {
    width: 12px;
    height: 12px;
    stroke-width: 2;
  }
  .tagadd {
    min-width: 90px;
    padding: var(--sp-1) 0;
    border: 0;
    border-bottom: 1.5px solid var(--line-strong);
    border-radius: 0;
    background: none;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }
  .tagadd::placeholder {
    color: var(--ink-faint);
  }
  .tagadd:focus {
    border-color: var(--accent);
  }

  .viewsrow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--sp-2);
    margin-top: var(--sp-2);
  }
  .viewchip {
    /* Same shape as a tag chip: pill, surface-1 fill, faint border, the
       view name and an X. Inherits .tagx for the close button. */
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    padding: 4px 4px 4px 10px;
    border-radius: var(--r-full);
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: 13px;
    color: var(--text);
  }
  .viewchip:hover {
    border-color: var(--line-strong);
  }
  .viewadd {
    /* A quiet ghost chip - same height as a view chip, no fill, lavender
       ink on hover. The + signals "add" without competing with the
       view-name chips. */
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border: 0;
    background: none;
    border-radius: var(--r-full);
    font-size: 13px;
    color: var(--text-mute);
    cursor: pointer;
    transition:
      color var(--dur-fast) var(--ease),
      background var(--dur-fast) var(--ease);
  }
  .viewadd:hover {
    color: var(--accent);
    background: var(--lavender-subtle);
  }

  /* Badges: a fact about a thing, on a tint (DESIGN.md section 7). Four flavours,
     each text clearing 4.5:1 on its own fill (5.49 success, 6.82 neutral, 5.95
     lavender, 8.02 danger). Neutral is the only one with squared corners; the other
     three are pills. */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    padding: 2px 8px;
    border-radius: var(--r-pill);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    line-height: 17px;
    letter-spacing: 0;
    white-space: nowrap;
  }
  .badge.success {
    background: var(--badge-success-fill);
    color: var(--badge-success-ink);
  }
  .badge.neutral {
    background: var(--badge-neutral-fill);
    color: var(--text-dim);
    border-radius: var(--r-md);
  }
  .badge.lavender {
    background: var(--lavender-subtle);
    color: var(--accent-text);
  }
  .badge.danger {
    background: var(--badge-danger-fill);
    color: var(--badge-danger-ink);
  }

  /* The home tag bar: the same chips, secondary and smaller than the searchbar.
     The searchbar stays visually primary; these answer to the wall, not to it. */
  .tagbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--sp-1);
    margin-top: var(--sp-3);
  }
  /* The tag bar belongs to the Tags wall mode (L.1): in every other mode it is
     rendered into the header hidden and toggled by setWallGroup, so the chips
     and the all-tags expander survive mode switches without a refetch. */
  .tagbar[hidden] {
    display: none;
  }
  .tagbar .tagchip {
    cursor: pointer;
    color: var(--text-mute);
  }
  .tagbar .tagchip:hover {
    color: var(--text);
    background: var(--line-soft);
  }

  /* The wall's grouping selector, under the search and above the tag filters:
     a recessed segmented control with the chosen mode raised on a surface pill.
     The mode is a one-of-N contract, so the segments always keep one pressed. */
  .groupbar {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-top: var(--sp-4);
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    background: var(--line-soft);
  }
  .groupbar button {
    border: 0;
    background: none;
    padding: 4px 13px;
    border-radius: var(--r-full);
    font: inherit;
    font-size: 13px;
    line-height: 1.3;
    color: var(--text-mute);
    cursor: pointer;
    transition:
      color var(--dur-fast) var(--ease),
      background var(--dur-fast) var(--ease),
      box-shadow var(--dur-fast) var(--ease);
  }
  .groupbar button:hover:not([aria-pressed="true"]) {
    color: var(--text);
    /* Q.2: a quiet hover on inactive tabs so the cursor gets a clickable
       signal. surface-2 (the app's hovered step, not lavender) keeps it
       secondary to the active tab's accent; border-radius matches the pill
       shape. */
    background: var(--surface-2);
    border-radius: var(--r-md);
  }
  .groupbar button[aria-pressed="true"] {
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow-micro);
  }
  /* P.7: the active tab gets a small lavender disc ahead of its label - the
     brand colour reads in the tab bar without replacing the underline. A 6px
     graphic: --accent on the canvas at 6.04:1 clears the 3:1 rule. */
  .groupbar button[aria-pressed="true"]::before {
    content: "";
    display: inline-block;
