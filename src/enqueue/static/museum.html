<style>
  /* IBM Plex Sans, vendored as static cuts. The variable "Var" roman the type system
     wants is not in fonts/, so weight 450 resolves down to 400 here and body copy
     carries the -0.08px tracking compensation instead. Nothing is fetched: these are
     files on disk beside this page. */
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src: url("fonts/IBMPlexSans-Regular.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 500;
    font-style: normal;
    font-display: swap;
    src: url("fonts/IBMPlexSans-Medium.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 600;
    font-style: normal;
    font-display: swap;
    src: url("fonts/IBMPlexSans-SemiBold.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url("fonts/IBMPlexSans-Bold.ttf") format("truetype");
  }
  :root {
    /* The app is light only. Without this the browser assumes it may be either, and
       on a machine set to dark mode it paints native scrollbars, the caret and select
       menus dark against the cream. */
    color-scheme: light;

    /* Surfaces: canvas -> raised -> reading, with --surface-2 sideways off the canvas
       as a recession rather than an elevation. */
    --bg: #eeefe9;
    --surface: #ffffff;
    --surface-doc: #fcfcfa;
    --surface-2: #e5e7e0;

    /* Ink. --surface-2 is the darkest ground anything sits on, so it is the binding
       case: --text-mute measures 4.75 there and has no headroom left. */
    --text: #23251d;
    --text-dim: #4d4f46;
    --text-mute: #63655b;

    /* The one loud colour. It is a fill and only ever a fill: 1.76:1 on the canvas
       means it can be neither text nor a lone border, which is why every filled accent
       control below carries a 1.5px --text edge to satisfy the 3:1 boundary rule. */
    --accent: #f7a501;
    --accent-quiet: #dd9001;
    --accent-ink: #23251d;

    --line: #bfc1b7;
    --line-soft: #dcdfd2;
    /* The only line token clearing 3:1 (3.40 at worst), so it is the only one allowed
       to be the sole boundary of a control. */
    --line-strong: #7d7b73;

    --link: #0c6083;
    --danger: #9e2a20;

    /* Pastel callouts carry --text or --text-dim only. --text-mute measures 4.36 on
       --tint-note and fails, which is why it is not permitted on any of them. */
    --tint-info: #dceaf6;
    --tint-ok: #d9eddf;
    --tint-warn: #f7d6d3;
    --tint-note: #e7d8ee;

    /* Kind colours live on an 8px dot, which is a graphic, so they answer to 3:1
       rather than the 4.5:1 text needs. That matters: on a light canvas every colour
       passing 4.5 has to sit under 0.132 luminance, and five hues crammed into that
       band came out 2.5% apart - green and teal were already indistinguishable with
       normal vision. Freeing them from carrying text widens the band to 0.223 and lets
       them separate by hue instead. Worst pair: 29.2 normal, 10.9 deuteranopia, 8.3
       protanopia.

       --teal holds an olive-gold and --peach a burnt terracotta. The names are wrong
       and the values are right: an actual teal collapses into --green under
       deuteranopia. Do not "fix" a value to match its name. */
    --green: #30804b;
    --blue: #376899;
    --peach: #ad5a31;
    --pink: #8f4273;
    --teal: #755c12;

    /* Kind is a fact about a thing, never an action, so none of these is the accent. */
    --kind-note: var(--green);
    --kind-link: var(--blue);
    --kind-pdf: var(--peach);
    --kind-image: var(--pink);
    --kind-file: var(--teal);

    --focus: #23251d;
    /* Tinted with --text rather than black so it warms the cream rather than greying it. */
    --scrim: rgba(35, 37, 29, 0.32);

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 20px;
    --sp-5: 32px;
    --sp-6: 48px;
    --sp-section: 48px;

    /* The scale skips the 8px to 16px band on purpose: that middle ground is what
       makes an interface read as generic. Controls are 20px, containers 40px. */
    --r-sm: 6px;
    --r: 20px;
    --r-lg: 40px;
    --r-full: 999px;

    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    /* System-only on purpose. Monospace here is information - hashes, paths, byte
       sizes - never decoration, and it is not worth a second font file. Nothing is
       named here that is not already on the machine. */
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --z-pill: 40;
    --z-menu: 50;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-fast: 140ms;
    --dur: 160ms;
    --dur-slow: 200ms;

    /* Atmospheric cushioning, not drop shadows: 24px blur minimum, 10% opacity
       maximum, tinted with --text so the halo stays warm on cream. About 95% of
       surfaces use none of these and sit flat on the canvas with a hairline. */
    --shadow-1: 0 4px 24px rgba(35, 37, 29, 0.05);
    --shadow-2: 0 24px 48px rgba(35, 37, 29, 0.08);
    --shadow-3: 0 40px 96px rgba(35, 37, 29, 0.1);
  }

  /* Structural whitespace is the first thing to give when the window is narrow: the
     content still needs its gutters, but 96px of air above a title does not. */
  @media (max-width: 900px) {
    :root {
      --sp-section: 24px;
    }
  }

  * {
    box-sizing: border-box;
  }
  /* The sticky period heading would otherwise cover the focus ring of anything reached
     by keyboard from below. */
  html {
    scroll-padding-top: 72px;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 450;
    line-height: 1.4;
    /* The variable cut that reaches 450 is not vendored, so this rounds to 400 and
       reads a shade looser than the type system intends. The tracking pays it back. */
    letter-spacing: -0.08px;
    -webkit-font-smoothing: antialiased;
    /* Make the top of the window draggable for native window move.
       Interactive elements opt out via -webkit-app-region: no-drag below. */
    -webkit-app-region: drag;
  }

  /* Everything interactive opts out of window dragging so clicks register. */
  button,
  a,
  input,
  textarea,
  select,
  [role="button"],
  [tabindex]:not([tabindex="-1"]),
  label,
  iframe,
  .pill,
  .card,
  .item {
    -webkit-app-region: no-drag;
  }

  /* No chrome. A persistent bar is a wall, and the walls are supposed to recede. */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--sp-section) var(--sp-5) 160px;
  }

  /* ---- type roles --------------------------------------------------------
     One geometric sans, no second family. Headlines lock together at -2% tracking;
     line-height ratio drops as size rises. Uppercase appears in exactly one role. */
  .h1,
  .display,
  .h2,
  .h3 {
    color: var(--text);
    font-weight: 500;
    margin: 0;
  }
  .display {
    font-size: 32px;
    line-height: 36px;
    letter-spacing: -0.64px;
  }
  .h1 {
    font-size: 26px;
    line-height: 31px;
    letter-spacing: -0.52px;
  }
  .h2 {
    font-size: 20px;
    line-height: 25px;
    letter-spacing: -0.4px;
  }
  .h3 {
    font-size: 17px;
    line-height: 22px;
    letter-spacing: -0.34px;
  }

  /* The section-category signal. The leading accent dot is the identity of the label,
     not a flourish, so it is drawn here rather than left to each caller to remember. */
  .shelf {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.56px;
    text-transform: uppercase;
    color: var(--text-mute);
    margin: var(--sp-5) 0 var(--sp-2);
  }
  .shelf::before {
    content: "";
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    border-radius: var(--r-full);
    background: var(--accent);
  }
  .shelf:first-child {
    margin-top: 0;
  }

  .title {
    font-size: 16px;
    font-weight: 600;
    line-height: 22.4px;
    letter-spacing: 0;
    color: var(--text);
  }
  .excerpt {
    font-size: 15px;
    line-height: 22px;
    color: var(--text-dim);
    margin-top: var(--sp-2);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* Metadata only: timestamps, kinds, counts, byte sizes. */
  .meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--sp-1);
    font-size: 13px;
    font-weight: 500;
    line-height: 18px;
    letter-spacing: 0;
    color: var(--text-mute);
    margin-top: var(--sp-2);
  }
  /* The separator is a graphic between labels, so it answers to 3:1 rather than 4.5. */
  .meta .sep {
    color: var(--line-strong);
  }
  .aside {
    font-size: 15px;
    line-height: 22px;
    color: var(--text-dim);
    margin-top: var(--sp-2);
    max-width: 64ch;
  }
  /* Why something failed carries more than what it will cost, so it is not the same
     grey. It is still ink, never the accent: the accent is an instruction. */
  .aside.caution,
  .strongtext {
    color: var(--text);
    font-weight: 600;
  }
  .state {
    font-size: 16px;
    line-height: 22.4px;
    color: var(--text-dim);
    padding: var(--sp-5) 0;
    max-width: 62ch;
  }
  /* At most one display line per view, and this is the only place it appears. */
  .empty {
    text-align: center;
    padding-top: var(--sp-section);
  }
  .empty .state {
    margin: 0 auto;
    text-align: left;
  }

  /* Every focusable element, one ring, no exceptions. A translucent browser default
     would be the only thing in the app that is not verified against its ground. */
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  :focus:not(:focus-visible) {
    outline: none;
  }

  /* ---- buttons ------------------------------------------------------------
     One geometry for all of them: 20px radius, 16/500 label at -3% tracking, 6px 24px
     padding, 40px minimum height. What changes between variants is fill and edge. */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    min-height: 40px;
    padding: 6px 24px;
    border-radius: var(--r);
    border: 1.5px solid transparent;
    background: transparent;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    line-height: 16px;
    letter-spacing: -0.48px;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition:
      background var(--dur-fast) var(--ease),
      border-color var(--dur-fast) var(--ease),
      color var(--dur-fast) var(--ease);
  }
  .btn.sm {
    font-size: 14px;
    line-height: 14px;
    letter-spacing: -0.42px;
  }
  /* The border, not the fill, is what clears 3:1 here: the yellow measures 1.76 on
     cream and could never bound a control on its own. */
  .btn.primary {
    background: var(--accent);
    border-color: var(--text);
    color: var(--accent-ink);
  }
  .btn.primary:hover {
    background: var(--accent-quiet);
  }
  .btn.primary:active {
    background: var(--accent-quiet);
  }
  .btn.secondary {
    background: var(--text);
    border-color: var(--text);
    color: var(--bg);
  }
  .btn.secondary:hover {
    background: #14150f;
  }
  .btn.tertiary {
    background: var(--surface);
    border-color: var(--line-strong);
    color: var(--text);
  }
  .btn.tertiary:hover {
    background: var(--surface-2);
  }
  .btn.ghost {
    padding: 6px 12px;
    color: var(--text);
  }
  .btn.ghost:hover {
    background: var(--surface-2);
  }
  .btn.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
  }
  .btn.danger:hover {
    background: #82221a;
    border-color: #82221a;
  }
  /* The fill change is the boundary, so --line-strong is not required around it. */
  .btn.icon {
    width: 40px;
    height: 40px;
    min-height: 40px;
    padding: 0;
    border-radius: var(--r-full);
    background: var(--surface-2);
    color: var(--text);
  }
  .btn.icon:hover {
    background: var(--line-soft);
  }
  /* Disabled is never colour alone: fill, opacity, cursor and aria-disabled together. */
  .btn[disabled],
  .btn[aria-disabled="true"] {
    background: var(--surface-2);
    border-color: transparent;
    color: var(--text-mute);
    opacity: 0.55;
    cursor: not-allowed;
  }
  .btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .btn.icon svg {
    width: 19px;
    height: 19px;
  }

  /* ---- callouts -----------------------------------------------------------
     Inline notices only. No border, no shadow, --text or --text-dim on the tint. */
  .callout {
    border-radius: var(--r);
    padding: var(--sp-4);
    margin-top: var(--sp-4);
    color: var(--text);
    font-size: 16px;
    line-height: 22.4px;
    max-width: 68ch;
  }
  .callout.info {
    background: var(--tint-info);
  }
  .callout.ok {
    background: var(--tint-ok);
  }
  .callout.warn {
    background: var(--tint-warn);
  }
  .callout.note {
    background: var(--tint-note);
  }
  /* --text-mute measures 4.36 on --tint-note and fails 4.5, so an eyebrow on a tint
     steps up to --text-dim (6.13) rather than keeping its usual grey. */
  .callout .shelf {
    color: var(--text-dim);
    margin: 0 0 var(--sp-3);
  }
  .callout p {
    margin: 0;
  }
  .callout p + p {
    margin-top: var(--sp-3);
  }

  /* ---- rows ---------------------------------------------------------------
     Collections on the wall, trash entries, anything that is a line rather than an
     object. Lifted onto --surface with a hairline, never a recessed fill inside a card. */
  .item {
    display: flex;
    gap: var(--sp-4);
    align-items: center;
    padding: var(--sp-3) var(--sp-4);
    margin-bottom: var(--sp-2);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    transition: border-color var(--dur-fast) var(--ease);
    cursor: pointer;
  }
  .item:hover {
    border-color: var(--line-strong);
  }
  .item-body {
    flex: 1;
    min-width: 0;
  }
  .item-body .kindrow {
    margin-bottom: var(--sp-1);
  }
  .item .meta {
    margin-top: 0;
    flex-shrink: 0;
  }

  /* ---- the wall ----------------------------------------------------------
     Square cards on cream. Roughly 4-up at 1200px and 1-up at 480px, which falls out
     of auto-fill rather than out of a breakpoint list. */
  .wall {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: var(--sp-4);
    margin-top: var(--sp-4);
  }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    aspect-ratio: 1 / 1;
    min-width: 0;
    overflow: hidden;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    /* 40px of corner on a 240px square eats the corners, so nothing sits closer than
       24px to the edge or it collides with the curve. */
    padding: 24px;
    /* The wall never sheds a card: scrolling appends, and a collection meant to grow
       forever means the grid keeps everything ever scrolled past. Measured at 2,000
       cards, one style change cost 152 ms of forced layout - nine dropped frames for a
       hover. Skipping the rendering work for off-screen cards brings that to 48 ms
       while leaving them in the DOM, so scroll position, anchoring and find-in-page
       all keep working. Virtual scrolling would be faster and would break all three. */
    content-visibility: auto;
    contain-intrinsic-size: auto 280px;
    /* Elevation only. Scaling a card on hover moves everything the eye was using to
       compare one object with another. */
    transition: box-shadow var(--dur) ease;
  }
  .card:hover {
    box-shadow: var(--shadow-2);
  }

  /* One hue per kind, resolved wherever the kind is declared and inherited by the dot
     inside it. The dot is the only thing that ever reads it: a kind may not become a
     background, a border, a title colour or a badge, because kind is a fact about a
     thing and every one of those would make it look like an instruction. */
  [data-kind="note"] {
    --kind: var(--kind-note);
  }
  [data-kind="link"] {
    --kind: var(--kind-link);
  }
  [data-kind="pdf"] {
    --kind: var(--kind-pdf);
  }
  [data-kind="image"] {
    --kind: var(--kind-image);
  }
  [data-kind="file"] {
    --kind: var(--kind-file);
  }

  /* The dot carries the hue, the word beside it carries the meaning, and they always
     travel together. Colour is never the only thing saying what a thing is, which
     satisfies 1.4.1 structurally rather than by a note in a document. */
  .kindrow {
    display: flex;
    align-items: center;
    gap: var(--sp-1);
    flex-shrink: 0;
  }
  .kindmark {
    display: inline-block;
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    border-radius: var(--r-full);
    background: var(--kind, var(--line-strong));
  }
  .kindword {
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    color: var(--text-dim);
  }

  .card .title {
    margin-top: var(--sp-3);
    font-size: 20px;
    font-weight: 500;
    line-height: 26px;
    letter-spacing: -0.4px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .preview {
    flex: 1;
    min-height: 0;
    margin-top: var(--sp-2);
    font-size: 15px;
    line-height: 22px;
    color: var(--text-dim);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cardfoot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-2);
    margin-top: var(--sp-3);
  }
  .cardfoot .meta {
    margin-top: 0;
  }
  /* The only accent on the wall, and it means one thing: nothing has read this yet. */
  .unread {
    width: 6px;
    height: 6px;
    flex-shrink: 0;
    border-radius: var(--r-full);
    background: var(--accent);
  }
  /* A card that is being kept says so, but quietly: keeping is a state, not an
     instruction, so it does not get the accent. */
  .card .flag {
    color: var(--text-mute);
  }
  .card .flag svg {
    width: 14px;
    height: 14px;
    display: block;
    fill: currentColor;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linejoin: round;
  }

  /* A picture is the truest face a thing has, so it fills the card and the title rides
     a band over the foot of it. A band, not a gradient: a gradient has no edge and the
     text ends up sitting on whatever the photograph happens to be doing there. */
  .card.pictorial {
    padding: 0;
  }
  .card.pictorial img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .cardband {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: var(--sp-3) 24px 24px;
    background: rgb(255 255 255 / 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .cardband .title {
    margin-top: 0;
    -webkit-line-clamp: 2;
  }
  .cardband .kindrow {
    margin-bottom: var(--sp-1);
  }
  .card.pictorial .flag {
    position: absolute;
    top: var(--sp-3);
    right: var(--sp-3);
  }

  /* Sticky, so you always know which stretch of time you are looking at once the wall
     is long enough to lose your place in. */
  .when {
    position: sticky;
    top: 0;
    z-index: 1;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mute);
    padding: var(--sp-4) 0 var(--sp-2);
    background: linear-gradient(var(--bg) 68%, transparent);
  }

  /* Kept things run sideways: a shelf you scan, not a list you read down. Snap so a
     flick lands on a card rather than between two. */
  .rail-h {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 200px;
    gap: var(--sp-5);
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
    padding-bottom: var(--sp-3);
    margin-top: var(--sp-4);
  }
  .rail-h > .card {
    scroll-snap-align: start;
    content-visibility: visible;
  }
  /* A visible track, because a scroller with no scrollbar is a scroller nobody finds. */
  .rail-h::-webkit-scrollbar {
    height: 8px;
  }
  .rail-h::-webkit-scrollbar-track {
    background: transparent;
  }
  .rail-h::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: var(--r-full);
  }
  .rail-h::-webkit-scrollbar-thumb:hover {
    background: var(--line-strong);
  }

  #wallEnd {
    min-height: 24px;
    padding: var(--sp-4) 0 var(--sp-6);
    text-align: center;
  }

  @media (max-width: 1080px) {
    .wall {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
  }
  @media (max-width: 760px) {
    .wall {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--sp-3);
    }
    .rail-h {
      gap: var(--sp-3);
    }
  }
  @media (max-width: 460px) {
    .wall {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  /* settings hub nav rows -------------------------------------------------- */
  .settings-nav-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 16px;
    background: var(--surface);
    border: none;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    text-align: left;
    transition: background 0.2s;
  }
  .settings-nav-row:first-of-type {
    border-top: 1px solid var(--line);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
  }
  .settings-nav-row:last-of-type {
    border-radius: 0 0 var(--r-lg) var(--r-lg);
    border-bottom: none;
  }
  .settings-nav-row:hover {
    background: color-mix(in srgb, var(--line) 20%, var(--surface));
  }
  .settings-nav-row .row-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--text-dim);
  }
  .settings-nav-row .row-body {
    flex: 1;
    min-width: 0;
  }
  .settings-nav-row .row-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .settings-nav-row .row-desc {
    font-size: 12px;
    color: var(--text-mute);
    margin-top: 1px;
  }
  .settings-nav-row .chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    opacity: 0.5;
  }
  .settings-nav-wrap {
    display: flex;
    flex-direction: column;
    margin-top: var(--sp-5);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
  }
  .settings-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    margin-bottom: var(--sp-4);
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 13px;
    transition: color 0.2s;
  }
  .settings-back:hover {
    color: var(--text);
  }
  .settings-back svg {
    width: 16px;
    height: 16px;
  }

  /* ---- the capture pill ---------------------------------------------------
     The app's signature object, present on every page. It floats, so it is one of the
     four things in the whole system allowed a shadow. */
  .pill {
    position: fixed;
    left: 50%;
    bottom: var(--sp-5);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    height: 56px;
    padding: 0 var(--sp-4);
    z-index: var(--z-pill);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    box-shadow: var(--shadow-2);
    transition:
      width var(--dur-slow) ease,
      border-color var(--dur-slow) ease;
  }
  /* The capture control is the one thing on the pill that is an instruction, so it is
     the one thing wearing the accent: a filled circle, with the label in plain ink
     beside it rather than in the yellow, which could not be read. */
  .pill .keep {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    height: 44px;
    padding: 0 var(--sp-2) 0 0;
    border: 0;
    background: transparent;
    border-radius: var(--r-full);
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    line-height: 16px;
    letter-spacing: -0.48px;
    color: var(--text);
    cursor: pointer;
  }
  .pill .keep .disc {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: var(--r-full);
    background: var(--accent);
    border: 1.5px solid var(--text);
    color: var(--accent-ink);
  }
  .pill .keep:hover .disc {
    background: var(--accent-quiet);
  }
  .pill .keep .chev {
    color: var(--text-mute);
  }
  /* Icon-only companions. Their fill is their boundary, so they need no line. */
  .pill button.round {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: 0;
    border-radius: var(--r-full);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background var(--dur-fast) var(--ease);
  }
  .pill button.round:hover {
    background: var(--line-soft);
  }
  .pill svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .pill .keep .disc svg {
    width: 18px;
    height: 18px;
    stroke-width: 2.2;
  }
  .pill .keep .chev svg {
    width: 15px;
    height: 15px;
  }

  /* Typing turns the pill into a field. It keeps the stadium, because it is still the
     same object doing a second thing rather than a different control appearing. */
  .pill.wide {
    width: min(560px, calc(100vw - 40px));
    padding-left: var(--sp-4);
  }
  .pill input {
    flex: 1;
    min-width: 0;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 450;
    letter-spacing: -0.08px;
    background: transparent;
    border: 0;
    color: var(--text);
    padding: var(--sp-2) 0;
  }
  .pill input:focus {
    outline: none;
  }
  .pill input::placeholder {
    color: var(--text-mute);
  }
  .scope {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mute);
    white-space: nowrap;
    padding-right: var(--sp-2);
  }

  /* Four equal choices, so none of them is the primary and none of them is yellow. */
  .menu {
    position: fixed;
    left: 50%;
    bottom: 96px;
    z-index: var(--z-menu);
    display: flex;
    flex-direction: column;
    gap: var(--sp-1);
    width: 280px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-2);
    padding: var(--sp-2);
  }
  .menu button {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    width: 100%;
    background: transparent;
    border: 0;
    border-radius: var(--r);
    cursor: pointer;
    padding: var(--sp-3);
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 450;
    letter-spacing: -0.08px;
    color: var(--text);
    text-align: left;
    transition: background var(--dur-fast) var(--ease);
  }
  .menu button:hover,
  .menu button:focus-visible {
    background: var(--surface-2);
  }
  .menu .ic {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--text-mute);
    display: grid;
    place-items: center;
  }
  .menu svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translate(-50%, 4px);
    }
    to {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }
  .menu {
    transform: translateX(-50%);
    animation: rise var(--dur-fast) ease both;
  }
  @keyframes hang {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
  /* `backwards`, not `both`: the end frame is the element's own resting state anyway,
     and a retained end frame keeps `transform: none` winning over every later rule. */
  .hang {
    animation: hang var(--dur-slow) var(--ease) backwards;
  }

  /* `animation-iteration-count` has to be reset too, and leaving it out is worse than
     doing nothing at all. Measured: `breathe` kept `infinite` while its duration was
     crushed to 1ms, turning a slow pulse into roughly sixty opacity flashes a second
     for exactly the people who asked for less motion. */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
    .thinking,
    .recorder.listening span {
      animation: none !important;
      opacity: 1 !important;
    }
  }

  /* ---- the artifact ------------------------------------------------------- */
  .back {
    margin-bottom: var(--sp-4);
  }
  .h1 {
    margin-top: var(--sp-4);
  }
  .h1:first-child {
    margin-top: 0;
  }
  /* ---- opening a thing --------------------------------------------------
     The card and the artifact are one object seen twice, so the browser tweens between
     them rather than replacing a page. The default crossfade is switched off for the
     named parts: a face that dissolves into a different face looks like two things,
     and the whole point is that it is one. */
  ::view-transition-old(artifact-face),
  ::view-transition-new(artifact-face) {
    /* Height, not both: a square card becoming a tall page must not squash on the
       way. Letting height animate alone keeps the width honest at every frame. */
    height: 100%;
    animation: none;
    mix-blend-mode: normal;
    object-fit: cover;
  }
  ::view-transition-old(artifact-title),
  ::view-transition-new(artifact-title) {
    height: 100%;
    animation: none;
    mix-blend-mode: normal;
  }
  ::view-transition-group(artifact-face),
  ::view-transition-group(artifact-title) {
    animation-duration: 340ms;
    animation-timing-function: cubic-bezier(0.2, 0.9, 0.24, 1);
  }

  ::view-transition-old(root) {
    animation: 120ms cubic-bezier(0.4, 0, 1, 1) both fadeOut;
  }
  ::view-transition-new(root) {
    animation: 220ms cubic-bezier(0, 0, 0.2, 1) 60ms both fadeIn;
  }
  @keyframes fadeOut {
    to {
      opacity: 0;
    }
  }
  @keyframes fadeIn {
    from {
      opacity: 0;
    }
  }

  .titlerow {
    display: flex;
    align-items: flex-start;
    gap: var(--sp-3);
    margin-top: var(--sp-2);
  }
  .titlerow .h1,
  .titlerow .h2 {
    flex: 1;
    min-width: 0;
    margin-top: 0;
  }
  /* Nothing you can do to an artifact is urgent, so this row has no primary in it. */
  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--sp-3);
    margin-top: var(--sp-4);
  }

  /* Keeping something is a small decision, so the control behaves like one: it settles
     rather than springs. Ease-out only, no bounce. */
  .pin {
    transition:
      background var(--dur-fast) var(--ease),
      color var(--dur) var(--ease),
      transform var(--dur) cubic-bezier(0.22, 1, 0.36, 1);
  }
  .pin:active {
    transform: scale(0.92);
  }
  .pin.lit svg {
    fill: currentColor;
    animation: kept 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes kept {
    from {
      transform: scale(0.7);
      opacity: 0.4;
    }
    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  /* The reading pane. Long-form sits on the warm white rather than the raised white,
     so a full page of it does not glare against the cream. */
  .docpane {
    background: var(--surface-doc);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: var(--sp-6);
    margin-top: var(--sp-6);
    max-width: 720px;
  }
  .docpane > *:first-child {
    margin-top: 0;
  }

  /* One pane. You type into the document itself, not into a source view beside it.
     Markdown remains the storage format; it is parsed on load and serialised on save. */
  .editor {
    min-height: 320px;
    outline: none;
    caret-color: var(--text);
  }
  .editor:empty::before {
    content: attr(data-placeholder);
    color: var(--text-mute);
  }
  .editor > *:first-child {
    margin-top: 0;
  }
  .editor.titled > h1:first-child {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .bar {
    display: flex;
    gap: var(--sp-3);
    align-items: center;
    margin-top: var(--sp-4);
    padding-top: var(--sp-3);
    border-top: 1px solid var(--line-soft);
    position: relative;
  }
  /* The rule under the editor fills once, left to right. The page acknowledging the
     words, rather than a notification about them. */
  .bar.landed::after {
    content: "";
    position: absolute;
    left: 0;
    top: -1px;
    height: 1px;
    width: 100%;
    background: var(--line-strong);
    transform-origin: left center;
    animation: fill 620ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fill {
    from {
      transform: scaleX(0);
      opacity: 1;
    }
    60% {
      transform: scaleX(1);
      opacity: 1;
    }
    to {
      transform: scaleX(1);
      opacity: 0;
    }
  }

  .md,
  .editor {
    font-size: 16px;
    line-height: 22.4px;
    color: var(--text-dim);
  }
  .md h1,
  .md h2,
  .md h3,
  .editor h1,
  .editor h2,
  .editor h3 {
    font-weight: 500;
    color: var(--text);
    margin: var(--sp-4) 0 var(--sp-2);
  }
  .md h1,
  .editor h1 {
    font-size: 32px;
    line-height: 38px;
    letter-spacing: -0.64px;
  }
  .md h2,
  .editor h2 {
    font-size: 24px;
    line-height: 29px;
    letter-spacing: -0.48px;
  }
  .md h3,
  .editor h3 {
    font-size: 20px;
    line-height: 26px;
    letter-spacing: -0.4px;
  }
  .md p,
  .editor p {
    margin: var(--sp-4) 0 0;
  }
  .md ul,
  .md ol,
  .editor ul,
  .editor ol {
    margin: var(--sp-4) 0 0;
    padding-left: var(--sp-4);
  }
  .md li,
  .editor li {
    margin: var(--sp-1) 0;
  }
  .md code,
  .editor code {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 20px;
    font-weight: 400;
    letter-spacing: 0;
    background: var(--surface-2);
    border-radius: var(--r-sm);
    padding: 1px 6px;
  }
  .md pre,
  .editor pre {
    background: var(--surface-2);
    border-radius: var(--r);
    padding: var(--sp-4);
    margin: var(--sp-4) 0 0;
    overflow-x: auto;
  }
  .md pre code {
    background: none;
    padding: 0;
  }
  .md blockquote,
  .editor blockquote {
    margin: var(--sp-4) 0 0;
    padding-left: var(--sp-4);
    border-left: 2px solid var(--line-strong);
    color: var(--text-dim);
  }
  .md a,
  .editor a {
    color: var(--link);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .md strong,
  .editor strong {
    font-weight: 600;
    color: var(--text);
  }
  .md em,
  .editor em {
    font-style: italic;
  }

  /* An image is its own proportion, so it is not cropped to a shape of ours. */
  .page,
  .shot {
    display: block;
    max-width: 100%;
    height: auto;
    margin: var(--sp-4) auto 0;
    border-radius: var(--r);
  }
  a {
    color: inherit;
    text-decoration: none;
  }

  .url {
    font-size: 15px;
    line-height: 22px;
    color: var(--link);
    word-break: break-all;
    display: block;
    width: fit-content;
    max-width: 100%;
    margin-top: var(--sp-2);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .lede {
    font-size: 16px;
    line-height: 22.4px;
    color: var(--text-dim);
    max-width: 64ch;
    margin-top: var(--sp-4);
    text-wrap: pretty;
  }

  /* Paths, hashes and byte sizes are information, so they are set in the one place
     monospace is allowed and chipped onto the recessed fill. */
  .mono {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 20px;
    font-weight: 400;
    letter-spacing: 0;
  }
  .chip {
    background: var(--surface-2);
    border-radius: var(--r-sm);
    padding: 1px 6px;
  }

  /* ---- the trash ---------------------------------------------------------- */
  .trashbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--sp-3);
    margin: var(--sp-6) 0 var(--sp-4);
  }
  /* Full-pill radius is the only place this app departs from the 20px control radius,
     and it is deliberate: the shape itself flags the action as terminal. */
  .btn.terminal {
    border-radius: var(--r-full);
  }
  /* A list, not the wall grid. A wall implies keeping, and this page is about not
     keeping. */
  .trash .item {
    cursor: default;
  }
  .trash .item:hover {
    border-color: var(--line);
  }
  .trash .rowacts {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex-shrink: 0;
  }
  .btn.ghost.harm {
    color: var(--danger);
  }
  .btn.ghost.harm:hover {
    background: var(--tint-warn);
  }

  /* ---- the reader --------------------------------------------------------- */
  .leaf {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1.414;
    background: var(--surface-doc);
    border: 1px solid var(--line);
    border-radius: var(--r);
    margin-top: var(--sp-3);
    overflow: hidden;
    /* Pages load as they are reached and are then held forever. Each is rasterised at
       the pane's width times the device pixel ratio, so on a Retina screen a page is
       roughly 1800 x 2545, which is about 18 MB once decoded regardless of how small
       the PNG was on the wire. Skipping the rendering work off-screen lets the decoded
       data go with it, and the element stays in the DOM so page numbering, the folio
       counter and the find highlights all keep their positions. */
    content-visibility: auto;
    contain-intrinsic-size: auto 1000px;
  }
  .leaf.loaded {
    aspect-ratio: auto;
    background: #fff;
  }
  .leaf img {
    width: 100%;
    height: auto;
    display: block;
  }
  .leaf.blank {
    aspect-ratio: auto;
    min-height: 120px;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: var(--text-mute);
  }
  /* The word cannot be highlighted, because the page is a picture of itself, so the
     box is drawn over it in percentages that hold at any width and any pixel density.
     Multiply keeps the words underneath readable through them.

     The tint family is where this colour comes from. A find highlight is a notice, not
     a kind and not an action, so it may be neither a kind hue nor the accent. */
  .findbox {
    position: absolute;
    background: var(--tint-info);
    mix-blend-mode: multiply;
    pointer-events: none;
    border-radius: var(--r-sm);
  }
  .findbox.on {
    background: var(--tint-warn);
    outline: 1.5px solid var(--line-strong);
  }

  /* The CSS Custom Highlight API paints over live text without touching the DOM, so
     the editor's markdown is not rewritten by having searched it. */
  ::highlight(enqueue-find) {
    background: var(--tint-info);
    color: var(--text);
  }
  ::highlight(enqueue-find-current) {
    background: var(--tint-warn);
    color: var(--text);
  }

  .leaf.hit {
    border-color: var(--line-strong);
  }
  .folio {
    position: fixed;
    right: var(--sp-5);
    bottom: var(--sp-5);
    z-index: var(--z-pill);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mute);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    padding: var(--sp-2) var(--sp-3);
    box-shadow: var(--shadow-2);
    pointer-events: none;
  }

  /* ---- the left rail ------------------------------------------------------
     Its own scroll region on the canvas, divided from the content by a hairline. */
  .rail {
    display: none;
    top: 0;
    bottom: 0;
    width: 280px;
    z-index: var(--z-pill);
    background: var(--bg);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: var(--sp-5) var(--sp-4) 132px;
    transition: transform var(--dur) var(--ease);
  }
  .rail .wordmark {
    margin-bottom: var(--sp-4);
  }
  .rail .shelf {
    margin: var(--sp-5) 0 var(--sp-2);
  }
  /* The rail's only accent, because it is the rail's only instruction. */
  .rail .newchat {
    width: 100%;
    margin-bottom: var(--sp-2);
  }
  .rail .gohome {
    width: 100%;
    justify-content: flex-start;
    color: var(--text-dim);
  }

  /* Rows lift onto the raised white when selected and take a hairline with them, which
     is the whole gesture: selection is a state, so it does not shout in yellow. */
  .threadrow {
    display: flex;
    align-items: center;
    gap: var(--sp-1);
    margin-bottom: 2px;
    padding-right: var(--sp-2);
    border: 1px solid transparent;
    border-radius: var(--r);
    transition:
      background var(--dur-fast) var(--ease),
      border-color var(--dur-fast) var(--ease);
  }
  .threadrow:hover {
    background: var(--surface-2);
  }
  .threadrow.on {
    background: var(--surface);
    border-color: var(--line);
  }
  .thread {
    flex: 1;
    min-width: 0;
    text-align: left;
    background: transparent;
    border: 0;
    padding: var(--sp-3) 16px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 450;
    letter-spacing: -0.08px;
    line-height: 22px;
    color: var(--text-dim);
    cursor: pointer;
    overflow: hidden;

  .threadrow.on .thread {
    font-weight: 600;
    font-size: 16px;

  /* Visible only on hover or when already doing something, so the rail stays a list of
     names rather than a list of controls. */
  .rowbtn {

    border: 0;

  .rowbtn:focus-visible {
    opacity: 1;

  .rowbtn:hover {

  /* Kept threads sit above the rest with a rule under them, so the break reads as an
     ordering and not as two unrelated lists. */
  .kept {

  .railfoot {

  .transcript {

  .said.streaming {

  .from {

  .group {

  .field label,
  .field .rowlabel {

  .toggle {
    display: inline-flex;

  .pinned {
