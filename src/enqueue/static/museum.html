    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: var(--sp-1);
    vertical-align: middle;
  }

  /* The clear control on a Tagged header: a quiet text button, not an action. */
  .tagclear {
    border: 0;
    background: none;
    padding: var(--sp-1) var(--sp-2);
    border-radius: var(--r-full);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mute);
    cursor: pointer;
  }
  .tagclear:hover {
    background: var(--surface-2);
    color: var(--text);
  }

  /* The reading pane. Long-form sits on the faint-cool canvas rather than the
     raised surface, so a full page of it does not glare against the white. */
  .docpane {
    background: var(--surface-doc);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: var(--sp-6);
    margin-top: var(--sp-6);
    max-width: 720px;
  }
  .docpane > *:first-child {
    margin-top: 0;
  }

  /* One pane. You type into the document itself, not into a source view beside it.
     Markdown remains the storage format; it is parsed on load and serialised on save. */
  .editor {
    min-height: 320px;
    outline: none;
    caret-color: var(--text);
  }
  .editor:empty::before {
    content: attr(data-placeholder);
    color: var(--text-mute);
  }
  .editor > *:first-child {
    margin-top: 0;
  }
  .editor.titled > h1:first-child {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .bar {
    display: flex;
    gap: var(--sp-3);
    align-items: center;
    margin-top: var(--sp-4);
    padding-top: var(--sp-3);
    border-top: 1px solid var(--line-soft);
    position: relative;
  }
  /* The rule under the editor fills once, left to right. The page acknowledging the
     words, rather than a notification about them. */
  .bar.landed::after {
    content: "";
    position: absolute;
    left: 0;
    top: -1px;
    height: 1px;
    width: 100%;
    background: var(--line-strong);
    transform-origin: left center;
    animation: fill 620ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fill {
    from {
      transform: scaleX(0);
      opacity: 1;
    }
    60% {
      transform: scaleX(1);
      opacity: 1;
    }
    to {
      transform: scaleX(1);
      opacity: 0;
    }
  }

  .md,
  .editor {
    font-size: 16px;
    line-height: 22.4px;
    color: var(--text-dim);
  }
  .md h1,
  .md h2,
  .md h3,
  .editor h1,
  .editor h2,
  .editor h3 {
    font-weight: 500;
    color: var(--text);
    margin: var(--sp-4) 0 var(--sp-2);
  }
  .md h1,
  .editor h1 {
    font-size: 32px;
    line-height: 38px;
    letter-spacing: -0.64px;
  }
  .md h2,
  .editor h2 {
    font-size: 24px;
    line-height: 29px;
    letter-spacing: -0.48px;
  }
  .md h3,
  .editor h3 {
    font-size: 20px;
    line-height: 26px;
    letter-spacing: -0.4px;
  }
  .md p,
  .editor p {
    margin: var(--sp-4) 0 0;
  }
  .md ul,
  .md ol,
  .editor ul,
  .editor ol {
    margin: var(--sp-4) 0 0;
    padding-left: var(--sp-4);
  }
  /* A list nested inside an item is a continuation of the line above it, not a new
     block: the 20px list gap would otherwise appear between a parent item and its
     Tab-indented child, twice the spacing of every other line. */
  .md li ul,
  .md li ol,
  .editor li ul,
  .editor li ol {
    margin-top: 0;
  }
  .md li,
  .editor li {
    margin: var(--sp-1) 0;
  }
  .md code,
  .editor code {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 20px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--code-ink);
    background: var(--surface-2);
    border-radius: var(--r-sm);
    padding: 1px 6px;
  }
  .md pre,
  .editor pre {
    background: var(--surface-2);
    border-radius: var(--r);
    padding: var(--sp-4);
    margin: var(--sp-4) 0 0;
    overflow-x: auto;
  }
  .md pre code {
    background: none;
    padding: 0;
  }
  /* A pre the editor builds for a typed fence is bare, while md() wraps its text
     in <code>. Either shape must read as code: mono, code-ink, tight leading. */
  .editor pre code,
  .editor pre {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 20px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--code-ink);
  }
  .md blockquote,
  .editor blockquote {
    margin: var(--sp-4) 0 0;
    padding-left: var(--sp-4);
    border-left: 2px solid var(--line-strong);
    color: var(--text-dim);
  }
  .md a,
  .editor a {
    color: var(--link);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .md strong,
  .editor strong {
    font-weight: 600;
    color: var(--text);
  }
  .md em,
  .editor em {
    font-style: italic;
  }

  /* An image is its own proportion, so it is not cropped to a shape of ours. */
  .page,
  .shot {
    display: block;
    max-width: 100%;
    height: auto;
    margin: var(--sp-4) auto 0;
    border-radius: var(--r);
  }
  a {
    color: inherit;
    text-decoration: none;
  }

  .url {
    font-size: 15px;
    line-height: 22px;
    color: var(--link);
    word-break: break-all;
    display: block;
    width: fit-content;
    max-width: 100%;
    margin-top: var(--sp-2);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .lede {
    font-size: 16px;
    line-height: 22.4px;
    color: var(--text-dim);
    max-width: 64ch;
    margin-top: var(--sp-4);
    text-wrap: pretty;
  }

  /* Paths, hashes and byte sizes are information, so they are set in the one place
     monospace is allowed and chipped onto the recessed fill. */
  .mono {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 20px;
    font-weight: 400;
    letter-spacing: 0;
  }
  .chip {
    background: var(--surface-2);
    border-radius: var(--r-sm);
    padding: 1px 6px;
  }

  /* ---- the trash ---------------------------------------------------------- */
  .trashbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--sp-3);
    margin: var(--sp-6) 0 var(--sp-4);
  }
  /* Full-pill radius is the only place this app departs from the 20px control radius,
     and it is deliberate: the shape itself flags the action as terminal. */
  .btn.terminal {
    border-radius: var(--r-full);
  }
  /* A list, not the wall grid. A wall implies keeping, and this page is about not
     keeping. */
  .trash .item {
    cursor: default;
  }
  .trash .item:hover {
    border-color: var(--line);
  }
  .trash .rowacts {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex-shrink: 0;
  }
  .btn.ghost.harm {
    color: var(--danger);
  }
  .btn.ghost.harm:hover {
    background: var(--tint-warn);
  }

  /* ---- the reader --------------------------------------------------------- */
  .leaf {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1.414;
    background: var(--surface-doc);
    border: 1px solid var(--line);
    border-radius: var(--r);
    margin-top: var(--sp-3);
    overflow: hidden;
    /* Pages load as they are reached and are then held forever. Each is rasterised at
       the pane's width times the device pixel ratio, so on a Retina screen a page is
       roughly 1800 x 2545, which is about 18 MB once decoded regardless of how small
       the PNG was on the wire. Skipping the rendering work off-screen lets the decoded
       data go with it, and the element stays in the DOM so page numbering, the folio
       counter and the find highlights all keep their positions. */
    content-visibility: auto;
    contain-intrinsic-size: auto 1000px;
  }
  .leaf.loaded {
    aspect-ratio: auto;
    background: #fff;
  }
  .leaf img {
    width: 100%;
    height: auto;
    display: block;
  }
  .leaf.blank {
    aspect-ratio: auto;
    min-height: 120px;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: var(--text-mute);
  }
  /* The word cannot be highlighted, because the page is a picture of itself, so the
     box is drawn over it in percentages that hold at any width and any pixel density.
     Multiply keeps the words underneath readable through them.

     The tint family is where this colour comes from. A find highlight is a notice, not
     a kind and not an action, so it may be neither a kind hue nor the accent. */
  .findbox {
    position: absolute;
    background: var(--tint-info);
    mix-blend-mode: multiply;
    pointer-events: none;
    border-radius: var(--r-sm);
  }
  .findbox.on {
    background: var(--tint-warn);
    outline: 1.5px solid var(--line-strong);
  }

  /* The CSS Custom Highlight API paints over live text without touching the DOM, so
     the editor's markdown is not rewritten by having searched it. */
  ::highlight(enqueue-find) {
    background: var(--tint-info);
    color: var(--text);
  }
  ::highlight(enqueue-find-current) {
    background: var(--tint-warn);
    color: var(--text);
  }

  .folio {
    position: fixed;
    right: var(--sp-5);
    bottom: var(--sp-5);
    z-index: var(--z-pill);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mute);
    background: var(--surface);
    /* AU.3: the folio is a contained badge, not a floating surface - it keeps the
       border and drops the shadow, the other side of the ghost-card rule. */
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    padding: var(--sp-2) var(--sp-3);
    pointer-events: none;
  }

  /* ---- the conversation ---------------------------------------------------
     Side and corner shape carry the speaker. No avatars, no name labels, no in-flow
     timestamps: a label under every bubble is a thing to read that says nothing. */
  .transcript {
    max-width: 760px;
    margin: 0 auto;
  }
  .turn {
    display: flex;
    flex-direction: column;
    margin-top: var(--sp-5);
  }
  .turn + .turn.you + .turn.you,
  .turn + .turn.curator + .turn.curator {

  }
  .said {
    max-width: 88%;

    border: 1px solid var(--line);

    color: var(--text);

  .said.streaming {
    position: relative;
    overflow: hidden;
  }
  .said.streaming::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;

    to {

  /* Where the answer came from. This is what separates an answer from an assertion, so

  .from {

  .unsourced {

  .recorder {

  dialog.ask {

  dialog.ask.name p {

  dialog.ask.name .namefield {
    width: 100%;
    margin-top: var(--sp-4);

    font-weight: 400;
    line-height: 24px;
    letter-spacing: 0;

    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--r-md);

    border: 1px solid var(--line-strong);

    box-shadow: 0 0 0 2px

  .toast {

<div class="topbar" id="topbar"></div>
<main id="view"><div class="state">opening...</div></main>
<div class="pill" id="pill"></div>

<div class="dropover" id="dropover" hidden>

<script>
  // Focus is drawn by `:focus-visible` in one rule for the whole app. The engine
  // already knows the difference between a Tab and a click, and the hand-rolled
  // keyboard-nav class this replaces had drifted into four different ring colours.

  const view = document.getElementById("view");
  const pill = document.getElementById("pill");
  const esc = (s) =>
    (s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );

  // One-entry cache for the artifact about to be opened. The morph needs the detail
  // payload in hand before the transition begins; without it the callback awaits the
  // network mid-transition and the browser tweens between two unfinished frames.
  let warmed = null;

  const api = async (p, o) => {
    if (!o && warmed && warmed.path === p) {
      const hit = warmed.body;
      warmed = null;
      return hit;
    }
    const r = await fetch(p, o);
    if (!r.ok)
      throw new Error(
        (await r.json().catch(() => ({}))).detail || r.statusText,
      );
    return r.json();
  };

  // Self-contained markdown. A CDN would make the museum reach the network to render
  // something you wrote, which is the opposite of the promise. Escapes before parsing,
  // so no input path can render raw HTML.
  function md(src) {
    let t = esc(src);
    const held = [];
    t = t.replace(
      /```([\s\S]*?)```/g,
      (m, code) =>
        "\x00" +
        (held.push(
          // Only the newline right after the opening fence is decorative and is
          // dropped; the first real line is kept as typed. The serializer writes
          // bare fences, so a lang tag the editor typed (or one in hand-written
          // markdown) is content, not metadata - stripping it would destroy text
          // on the save/reopen round trip.
          "<pre><code>" + code.replace(/^\n/, "") + "</code></pre>",
        ) -
          1) +
        "\x00",
    );
    t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    t = t.replace(
      /\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>',
    );
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");

    const out = [];
    const items = [];
    const flushList = () => {
      if (!items.length) return;
      // Build the list tree from indented items, then render it. Two spaces of
      // indentation is one level, matching what the editor's indent command and the
      // markdown serializer produce, so a nested list round-trips unchanged.
      const root = { lists: [] };
      const stack = [];
      for (const it of items) {
        while (stack.length && stack[stack.length - 1].depth > it.depth)
          stack.pop();
        let top = stack[stack.length - 1];
        if (top && top.depth === it.depth && top.tag !== it.tag) {
          stack.pop();
          top = stack[stack.length - 1];
        }
        let list =
          top && top.depth === it.depth && top.tag === it.tag ? top : null;
        if (!list) {
          list = { tag: it.tag, depth: it.depth, items: [] };
          // A jumped indentation (more than one level at once) has no item to hang
          // the new list under, so it degrades to nesting under the nearest shallower
          // item rather than dropping content or crashing.
          const parent =
            top && top.depth < it.depth
              ? top.items[top.items.length - 1]
              : null;
          const owner = parent ? (parent.lists ||= []) : root.lists;
          owner.push(list);
          stack.push(list);
        }
        const item = { content: it.content };
        list.items.push(item);
      }
      const renderList = (list) => {
        let h = "<" + list.tag + ">";
        for (const it of list.items) {
          h += "<li>" + it.content;
          if (it.lists) for (const sub of it.lists) h += renderList(sub);
          h += "</li>";
        }
        return h + "</" + list.tag + ">";
      };
      for (const list of root.lists) out.push(renderList(list));
      items.length = 0;
    };
    for (const raw of t.split("\n")) {
      const line = raw.trimEnd();
      const h = line.match(/^(#{1,3})\s+(.*)$/);
      const li = line.match(/^(\s*)([-*+])\s+(.*)$/);
      const ol = line.match(/^(\s*)(\d+)\.\s+(.*)$/);
      const bq = line.match(/^(?:&gt;|>)\s?(.*)$/);
      if (h) {
        flushList();
        out.push("<h" + h[1].length + ">" + h[2] + "</h" + h[1].length + ">");
      } else if (li || ol) {
        items.push({
          depth: Math.min(Math.floor((li || ol)[1].length / 2), 8),
          tag: li ? "ul" : "ol",
          content: (li || ol)[3],
        });
      } else if (bq) {
        flushList();
        out.push("<blockquote>" + bq[1] + "</blockquote>");
      } else if (/^\ufffd\d+\ufffd$/.test(line)) {
        // A code-fence placeholder is the block itself, not prose: wrapping it in a
        // <p> would make the browser split the paragraph around the <pre>, leaving
        // stray empty paragraphs above and below the block. The placeholder bytes
        // reach the browser as U+FFFD: the raw NULs in this file are not valid
        // UTF-8, and both sides of the round trip are corrupted identically.
        flushList();
        out.push(held[+line.slice(1, -1)]);
      } else if (!line.trim()) flushList();
      else {
        flushList();
        out.push("<p>" + line + "</p>");
      }
    }
    flushList();
    return out.join("").replace(/\x00(\d+)\x00/g, (m, i) => held[+i]);
  }

  // The wall preview must be a plain, clamped snippet. Rendered markdown brings
  // block children - headings, nested lists - into a line-clamped box, where they
  // paint over each other instead of clamping with an ellipsis. Strip the syntax
  // first so the box only ever holds a text run, which clamps cleanly.
  function mdText(src) {
    let t = src;
    t = t.replace(/```[\s\S]*?```/g, " ");
    t = t.replace(/`([^`\n]+)`/g, "$1");
    t = t.replace(/\[([^\]]+)\]\((?:https?:[^)\s]+|[^)]*)\)/g, "$1");
    t = t.replace(/\*\*([^*]+)\*\*/g, "$1");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1$2");
    t = t.replace(/^\s{0,3}#{1,6}\s+/gm, "");
    // List markers become a leading interpunct (N.5): the item stays a bullet,
    // just without the markdown syntax, and the newline survives so a bulleted
    // note reads as bullets, not a run-on phrase.
    t = t.replace(/^\s{0,3}(?:[-*+]|\d+[.)])\s+/gm, "• ");
    t = t.replace(/^\s{0,3}>\s?/gm, "");
    // Collapse runs of spaces and tabs inside a line, but keep newlines - they
    // carry the list and paragraph structure the preview needs.
    t = t.replace(/[^\S\n]+/g, " ");
    // A paragraph break is at most one blank line.
    t = t.replace(/\n{3,}/g, "\n\n");
    return t.trim();
  }

  // Turn the edited document back into markdown. Only the tags md() can produce need
  // handling, which is what keeps this tractable: the editor and the parser are two
  // halves of one contract rather than a general HTML converter.
  function htmlToMd(root) {
    const inline = (node) => {
      if (node.nodeType === 3) return node.nodeValue;
      if (node.nodeType !== 1) return "";
      const kids = [...node.childNodes].map(inline).join("");
      switch (node.tagName) {
        case "BR":
          return "\n";
        case "STRONG":
        case "B":
          return kids.trim() ? "**" + kids + "**" : "";
        case "EM":
        case "I":
          return kids.trim() ? "*" + kids + "*" : "";
        case "CODE":
          return "`" + kids + "`";
        case "A":
          return "[" + kids + "](" + (node.getAttribute("href") || "") + ")";
        default:
          return kids;
      }
    };

    // Lists are written indented, two spaces per level, so a nested list survives
    // the round trip. An item's sub-lists sit inside its <li> (or directly under the
    // list, which some engines produce) and are serialised one level deeper.
    const listToMd = (node, depth) => {
      const pad = "  ".repeat(depth);
      const ordered = node.tagName === "OL";
      let n = 1;
      const out = [];
      for (const child of node.childNodes) {
        if (child.nodeType !== 1) continue;
        if (child.tagName === "UL" || child.tagName === "OL") {
          out.push(...listToMd(child, depth + 1));
          continue;
        }
        if (child.tagName !== "LI") continue;
        const parts = [];
        const nested = [];
        for (const cc of child.childNodes) {
          if (cc.nodeType === 1 && (cc.tagName === "UL" || cc.tagName === "OL"))
            nested.push(cc);
          else parts.push(cc);
        }
        const text = parts
          .map(inline)
          .join("")
          .replace(/\u00a0/g, " ")
          .trim();
        out.push(pad + (ordered ? n++ + ". " : "- ") + text);
        for (const sub of nested) out.push(...listToMd(sub, depth + 1));
      }
      return out;
    };

    const lines = [];
    for (const node of root.childNodes) {
      if (node.nodeType === 3) {
        const t = node.nodeValue.trim();
        if (t) lines.push(t, "");
        continue;
      }
      if (node.nodeType !== 1) continue;

      switch (node.tagName) {
        case "H1":
          lines.push("# " + inline(node).trim(), "");
          break;
        case "H2":
          lines.push("## " + inline(node).trim(), "");
          break;
        case "H3":
          lines.push("### " + inline(node).trim(), "");
          break;
        case "UL":
        case "OL": {
          lines.push(...listToMd(node, 0));
          lines.push("");
          break;
        }
        case "BLOCKQUOTE":
          lines.push("> " + inline(node).trim(), "");
          break;
        case "PRE": {
          // The <pre> may wrap its text in the <code> md() produces, and a line
          // break may be a literal newline or a <br> from editing. Walk the raw
          // text so both come out as real newlines; textContent would drop <br>s.
          // The zero-width marker after an Enter-made newline is dropped too.
          let code = "";
          const walk = (n) => {
            if (n.nodeType === 3) code += n.nodeValue.replace(/\u200b/g, "");
            else if (n.nodeType === 1) {
              if (n.tagName === "BR") code += "\n";
              else for (const c of n.childNodes) walk(c);
            }
          };
          walk(node);
          lines.push("```", code.replace(/\n$/, ""), "```", "");
          break;
        }
        case "DIV":
        case "P": {
          const t = inline(node)
            .replace(/\u200b/g, "")
            .replace(/\u00a0/g, " ")
            .trimEnd();
          lines.push(t.trim() ? t : "", t.trim() ? "" : null);
          break;
        }
        default: {
          const t = inline(node).trim();
          if (t) lines.push(t, "");
        }
      }
    }
    return lines
      .filter((l) => l !== null)
      .join("\n")
      .replace(/\n{3,}/g, "\n\n")
      .replace(/^\n+|\n+$/g, "");
  }

  // Structural markdown typed at the start of a line becomes the real thing, the way
  // it does in any editor that renders as you write.
  const RULES = [
    [/^(#{1,3})\s$/, (m) => "h" + m[1].length],
    [/^```\s?$/, () => "pre"],
    [/^[-*+]\s$/, () => "ul"],
    [/^1\.\s$/, () => "ol"],
    [/^>\s$/, () => "blockquote"],
  ];

  // Tab indents/un-indents a list item. These are DOM moves rather than
  // execCommand("indent"), because the exec command swaps out the text node under
  // the caret (the old one comes back detached and empty), so the caret can't be
  // restored and lands on the line above. Moving the <li> wholesale keeps the text
  // node alive, and produces the canonical nested shape the serializer expects.
  function indentItem(li) {
    const list = li.parentElement;
    const prev = li.previousElementSibling;
    if (!prev) return false; // first item: nothing to nest under
    const nested = document.createElement(list.tagName);
    list.removeChild(li);
    nested.appendChild(li);
    prev.appendChild(nested);
    return true;
  }

  function outdentItem(li) {
    const list = li.parentElement;
    if (!list) return false;
    const grand = list.parentElement;
    if (!grand || grand.tagName !== "LI") return false; // top level: no-op
    grand.parentElement.insertBefore(li, grand.nextSibling);
    if (!list.children.length) list.remove();
    return true;
  }

  function applyInputRules(ed) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    let block = sel.anchorNode;
    while (block && block.parentNode !== ed) block = block.parentNode;
    if (!block) return;
    // The first keystroke of an empty note lands in a bare text node with no block
    // for the structural rules to convert. Give it a paragraph so "- ", "# ", "1. "
    // and "> " work on the very first line too.
    if (block.nodeType !== 1) {
      if (block.nodeType !== 3) return;
      const p = document.createElement("p");
      block.parentNode.insertBefore(p, block);
      p.appendChild(block);
      block = p;
    }
    if (["UL", "OL", "PRE", "BLOCKQUOTE"].includes(block.tagName)) return;

    const text = block.textContent;
    for (const [re, kind] of RULES) {
      const m = text.match(re);
      if (!m) continue;
      const tag = kind(m);
      // A code block is built directly rather than through formatBlock: the fence
      // markers are the whole line and nothing in them is kept, so the empty <pre>
      // simply takes the block's place with the caret already inside it. It is a
      // bare <pre>, not md()'s <pre><code>: Chrome drops an empty <code>'s text
      // node on the first keystroke and inserts outside the wrapper, while a bare
      // pre takes the text the way the caret suggests.
      if (tag === "pre") {
        const pre = document.createElement("pre");
        block.replaceWith(pre);
        const r = document.createRange();
        r.selectNodeContents(pre);
        r.collapse(true);
        const s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
        return;
      }
      document.execCommand(
        tag === "ul"
          ? "insertUnorderedList"
          : tag === "ol"
            ? "insertOrderedList"
            : "formatBlock",
        false,
        tag === "ul" || tag === "ol" ? null : tag,
      );
      // Find the element this rule produced. A list command nests the new list
      // inside the paragraph it converted (`<p><ul><li>...`), which is invalid
      // nesting: htmlToMd reads that wrapper as a paragraph and flattens the items
      // to plain text, silently deleting the bullet on save. Unwrap until the list
      // is a direct child of the editor, the shape the serializer expects.
      const isList = tag === "ul" || tag === "ol";
      let made = isList ? block.querySelector("ul, ol") : null;
      if (isList && !made) {
        // Some engines replace the paragraph with the list instead of nesting it,
        // detaching block; fall back to the list under the caret.
        const caret = window.getSelection().anchorNode;
        const el =
          caret && caret.nodeType === 1 ? caret : caret && caret.parentElement;
        made = el && el.closest ? el.closest("ul, ol") : null;
      }
      if (isList) {
        while (made && made.parentNode && made.parentNode !== ed) {
          const wrap = made.parentNode;
          wrap.parentNode.insertBefore(made, wrap);
          wrap.remove();
        }
      } else {
        // formatBlock replaces the block in place; find it from the caret.
        const caret = window.getSelection().anchorNode;
        const el =
          caret && caret.nodeType === 1 ? caret : caret && caret.parentElement;
        made = el && el.closest ? el.closest("h1, h2, h3, blockquote") : null;
      }
      // The marker characters were the instruction, not the content. The caret does
      // not reliably land inside the converted block's text (Chrome collapses it
      // onto the list container), so strip from the block's own first text node.
      const first =
        made && made.firstElementChild
          ? made.firstElementChild.firstChild
          : made
            ? made.firstChild
            : null;
      const host = first && first.nodeType === 3 ? first : null;
      if (host)
        host.nodeValue = host.nodeValue.replace(/^(#{1,3}|[-*+]|1\.|>)\s/, "");
      return;
    }
  }

  // ---- the pill ------------------------------------------------------------
  const ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    find: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    // The eye, not a question mark. Asking here is not a support request; it is looking
    // at what you already own and seeing what is in it.
    ask: '<path d="M2.2 12S5.8 5.6 12 5.6 21.8 12 21.8 12 18.2 18.4 12 18.4 2.2 12 2.2 12z"/><circle cx="12" cy="12" r="2.8"/>',
    // Organize: four panes over the whole library, answering like search and ask do.
    // Search narrows, ask converses, organize rearranges.
    grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    back: '<path d="M14.5 6.5L9 12l5.5 5.5"/>',
    chev: '<path d="M6.5 14.5L12 9l5.5 5.5"/>',
    down: '<path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/>',
    home: '<path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.6V20h12V9.6"/>',
    star: '<path d="M12 4.2l2.3 4.9 5.2.7-3.8 3.7 1 5.3-4.7-2.6-4.7 2.6 1-5.3-3.8-3.7 5.2-.7z"/>',
    trash:
      '<path d="M4 7h16"/><path d="M9.5 7V5h5v2"/><path d="M6.5 7l1 13h9l1-13"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    // Move/redistribute: two horizontal arrows pointing outward - one left, one
    // right. Reads as "move this artifact to another place".
    move: '<path d="M3 8h13"/><path d="M12 4l4 4-4 4"/><path d="M21 16H8"/><path d="M12 12l-4 4 4 4"/>',
    note: '<path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/>',
    upload:
      '<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v3h16v-3"/>',
    link: '<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
    image:
      '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-7 7"/>',
    gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7L5.6 5.6"/>',
    // The rename pencil (K.7/L.3b): a quiet ghost beside a saved-grouping title, not a
    // gear or a menu - renaming is an act on one grouping while you look at it.
    pencil:
      '<path d="M4 20l4.5-1 10-10-3.5-3.5-10 10z"/><path d="M14 6.5l3.5 3.5"/>',
    // The drawer toggle: a double chevron pointing at the drawer. Closed, it points
    // into the content (the drawer lives off the right edge, so it invites you to
    // pull it in); open, it points back out, inviting you to push it away. One
    // button, two directions, read at a glance.
    panelin:
      '<path d="M13.5 6.5L8 12l5.5 5.5"/><path d="M19 6.5L13.5 12l5.5 5.5"/>',
    panelout:
      '<path d="M5.5 6.5L11 12l-5.5 5.5"/><path d="M11 6.5L16.5 12 11 17.5"/>',
  };
  const svg = (k) => '<svg viewBox="0 0 24 24">' + ICONS[k] + "</svg>";

  let menu = null;
  let scope = { kind: "everything", label: "everything" };

  function closeMenu(restoreFocus) {
    if (menu) {
      menu.remove();
      menu = null;
    }
    const b = document.getElementById("btnAdd");
    if (b) {
      b.setAttribute("aria-expanded", "false");
      // Focus goes back where it came from. Dropping it on BODY leaves a keyboard user
      // at the top of the document with no idea the menu ever opened.
      if (restoreFocus) b.focus();
    }
  }

  // The first slot changes with where you are. On the wall it captures, because that is
  // the only thing you can do to a wall. Inside an object there is nowhere to put a new
  // capture yet and the thing you actually want is out, so it becomes the way out.
  // Search and ask never move: they mean the same thing on every surface.
  let place = "wall";

  function restorePill(where) {
    if (where) place = where;
    closeMenu();
    pill.classList.remove("wide");
    const inside = place === "inside";

    // Wall: Plus + Search + Eye (chat) + Settings. Saved groupings moved into
    // the wall's grouping selector (K.6), so the pill no longer carries a grid
    // button.
    // Inside: Back + Eye (context-aware).
    let html = "";
    if (inside) {
      // Home, not a back arrow: there is no history stack - "out" is always the
      // wall - so the way out wears the same yellow disc as the plus, and only
      // the icon changes. One button that always means the same place.
      html =
        '<button class="keep" aria-label="Home" onclick="home()">' +
        '<span class="disc">' +
        svg("home") +
        "</span></button>" +
        '<button class="round" aria-label="' +
        (scope.kind === "chat" ? "Continue chat" : "Ask about this") +
        '" onclick="chatOrAsk()">' +
        svg("ask") +
        "</button>";
    } else {
      html =
        '<button class="keep" id="btnAdd" aria-expanded="false" ' +
        'onclick="toggleMenu(event)">' +
        '<span class="disc">' +
        svg("plus") +
        "</span></button>" +
        '<button class="round" aria-label="Search" onclick="openField(\'search\')">' +
        svg("find") +
        "</button>" +
        '<button class="round" aria-label="Chat with AI" onclick="openField(\'ask\')">' +
        svg("ask") +
        "</button>" +
        '<button class="round" aria-label="Settings" onclick="showSettings()">' +
        svg("gear") +
        "</button>";
    }
    pill.innerHTML = html;
  }

  // Context-aware eye action inside a chat or the ask field.
  function chatOrAsk() {
    if (scope.kind === "chat" && scope.id) {
      showChat(scope.id);
    } else {
      openField("ask");
    }
  }

  const MENU = [
    ["note", "Note", () => newNote()],
    ["upload", "Upload", () => pickFile("*/*")],
    ["link", "Link", () => openField("link")],
    ["image", "Image", () => pickFile("image/*")],
  ];

  function toggleMenu(e) {
    if (e) e.stopPropagation();
    if (menu) return closeMenu();
    menu = document.createElement("div");
    menu.className = "menu";
    menu.setAttribute("role", "menu");
    // Four equal-weight choices. None of them is the primary, so none of them is
    // yellow, and hover is the recessed fill rather than a colour that would read as
    // "this is the one you want".
    menu.innerHTML = MENU.map(
      ([k, label]) =>
        '<button role="menuitem"><span class="ic">' +
        svg(k) +
        "</span>" +
        label +
        "</button>",
    ).join("");
    document.body.appendChild(menu);
    menu.querySelectorAll("button").forEach((b, i) => {
      b.onclick = (ev) => {
        ev.stopPropagation();
        closeMenu();
        MENU[i][2]();
      };
    });
    document.getElementById("btnAdd").setAttribute("aria-expanded", "true");
    menu.querySelector("button").focus();

    // role="menu" promises arrow navigation. Without it the role is a lie to a screen
    // reader that has already announced a menu.
    menu.addEventListener("keydown", (ev) => {
      const items = [...menu.querySelectorAll("button")];
      const at = items.indexOf(document.activeElement);
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        const next =
          (at + (ev.key === "ArrowDown" ? 1 : -1) + items.length) %
          items.length;
        items[next].focus();
      }
      if (ev.key === "Home") {
        ev.preventDefault();
        items[0].focus();
      }
      if (ev.key === "End") {
        ev.preventDefault();
        items[items.length - 1].focus();
      }
    });
  }

  function openField(mode) {
    closeMenu();
    // The wall's home search is the one search surface it shows, so the pill's
    // magnifier and Cmd+K both route here instead of popping a second field.
    if (mode === "search") {
      const hs = document.getElementById("homesearch");
      if (hs) {
        hs.focus();
        hs.select();
        return;
      }
    }
    const hint = {
      search: "find something",
      ask: "ask about " + scope.label,
      link: "paste a url",
    }[mode];
    // CR.6: the pill field's name is the mode, not the placeholder - a placeholder
    // disappears on focus, so the accessible name has to survive it.
    const label = {
      search: "Search your artifacts",
      ask: "Ask about " + scope.label,
      link: "Paste a URL",
    }[mode];
    pill.classList.add("wide");
    pill.innerHTML =
      (mode === "ask"
        ? '<span class="scope">' + esc(scope.label) + "</span>"
        : "") +
      '<input id="field" placeholder="' +
      esc(hint) +
      '" aria-label="' +
      esc(label) +
      '" autocomplete="off">' +
      '<button class="round" aria-label="Close" onclick="restorePill()">' +
      svg("close") +
      "</button>";

    const field = document.getElementById("field");
    field.focus();
    field.onkeydown = (e) => {
      if (e.key === "Escape") return restorePill();
      if (e.key !== "Enter") return;
      const v = field.value.trim();
      if (!v) return;
      restorePill();
      if (mode === "search") doSearch(v);
      else if (mode === "ask") startChat(v);
      else saveLink(v);
    };
  }

  // Cmd+K (or Ctrl+K) jumps to search from anywhere: the home search on the wall,
  // the pill's inline field on any other view. A search never costs a person their
  // place.
  document.addEventListener("keydown", (e) => {
    if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== "k") return;
    e.preventDefault();
    openField("search");
  });

  // Capture is the one act the whole product rests on, and it used to fail in silence:
  // a link that errored and an upload that 500ed both re-rendered the wall exactly like
  // success. "Nothing is ever lost" cannot be true of a thing that can drop your capture
  // without saying so, so both paths now report, and a failure keeps what you typed.
  function toast(message, bad) {
    const old = document.getElementById("toast");
    if (old) old.remove();
    const node = document.createElement("div");
    node.id = "toast";
    node.className = "toast" + (bad ? " bad" : "");
    node.setAttribute("role", "status");
    node.textContent = message;
    document.body.appendChild(node);
    setTimeout(() => node.remove(), bad ? 8000 : 2600);
  }

  /// One modal shell for every dialog in the app (M.6a). Owns dialog creation,
  /// the done guard, finish(), the close-in-try/catch + remove, the Cancel
  /// button, the cancel event and the Escape keydown, so none of the dialogs
  /// can drift from one another.
  ///
  /// The box comes back synchronously with `finish` and `promise` on it: a
  /// dialog wires its own rows or confirm button to `box.finish(value)`, and
  /// callers await `box.promise`. Cancel, Escape and (when `backdrop` is set) a
  /// click on the frame itself resolve `cancelValue` (null unless the dialog
  /// overrides it, as ask does with false). Focus lands on the Cancel button by
  /// default, so a stray Return can never trigger a confirm; `focusSel` moves
  /// it to a field.
  ///
  /// The promise is settled inside each handler rather than on the dialog's
  /// `close` event. Measured here, `close()` does not fire `close` in this
  /// engine, so a version that resolved there never resolved at all: `await
  /// ask(...)` hung and the delete still did not happen. Settling at the source
  /// removes the dependency entirely, and `done` keeps the double path from
  /// resolving twice.
  function modalShell(markup, opts) {
    const o = opts || {};
    const box = document.createElement("dialog");
    box.className = "ask";
    box.innerHTML = markup;
    if (o.labelledBy) box.setAttribute("aria-labelledby", o.labelledBy);

    box.promise = new Promise((resolve) => {
      let done = false;
      const finish = (answer) => {
        if (done) return;
        done = true;
        try {
          box.close();
        } catch (_) {
          // Already closed by the platform; the node still has to go.
        }
        box.remove();
        resolve(answer);
      };
      box.finish = finish;

      const cancel = () =>
        finish(o.cancelValue === undefined ? null : o.cancelValue);
      box.querySelector('[value="no"]').onclick = cancel;
      // Esc means no. `cancel` is the specified path; the keydown is the
      // fallback for engines that skip it, and finish() makes the overlap
      // harmless.
      box.addEventListener("cancel", (e) => {
        e.preventDefault();
        cancel();
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          cancel();
        }
      });
      if (o.backdrop) {
        // A click that lands on the dialog frame itself (the backdrop, or the
        // padding ring around the content) dismisses without picking.
        box.addEventListener("click", (e) => {
          if (e.target === box) cancel();
        });
      }

      document.body.appendChild(box);
      box.showModal();
      const focus = o.focusSel
        ? box.querySelector(o.focusSel)
        : box.querySelector('[value="no"]');
      focus.focus();
    });
    return box;
  }

  /// Ask before doing something irreversible. Resolves true only on the confirm
  /// button.
  ///
  /// Replaces `window.confirm`, which the WKWebView this ships inside does not
  /// implement: it returned false without ever drawing a panel, so every guard
  /// read as "the person said no" and the action was skipped in silence.
  function ask(title, detail, confirmLabel) {
    const box = modalShell(
      '<h2 id="askTitle"></h2><p></p>' +
        '<div class="asked">' +
        '<button class="btn secondary" value="no">Cancel</button>' +
        '<button class="btn danger" value="yes"></button>' +
        "</div>",
      { labelledBy: "askTitle", cancelValue: false },
    );
    box.querySelector("h2").textContent = title;
    box.querySelector("p").textContent = detail;
    const yes = box.querySelector('[value="yes"]');
    yes.textContent = confirmLabel;
    yes.onclick = () => box.finish(true);
    return box.promise;
  }

  // A one-line text prompt, same modal shell as ask() but with a field. Resolves
  // to the trimmed value, or null on cancel/empty. Used to name a saved grouping -
  // naming is the one place a person types a name, and it is never a browser
  // prompt(), which the macOS WKWebView renders inconsistently.
  function askText(title, placeholder, confirmLabel, initial) {
    const box = modalShell(
      '<h2 id="askTitle"></h2>' +
        '<input class="field" id="askField" autocomplete="off">' +
        '<div class="asked">' +
        '<button class="btn secondary" value="no">Cancel</button>' +
        '<button class="btn primary" value="yes"></button>' +
        "</div>",
      { labelledBy: "askTitle", focusSel: "#askField" },
    );
    box.querySelector("h2").textContent = title;
    const field = box.querySelector("#askField");
    field.placeholder = placeholder || "";
    field.value = initial || "";
    box.querySelector('[value="yes"]').textContent = confirmLabel;
    const submit = () => {
      const v = field.value.trim();
      box.finish(v || null);
    };
    box.querySelector('[value="yes"]').onclick = submit;
    // Enter submits from the field; Escape is the shell's job.
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submit();
      }
    });
    return box.promise;
  }

  // The grouping-name modal gets the rich treatment askText does not: an
  // explanatory line under the title, a properly styled field, and a Save that
  // only wakes once there is something to save. askText stays the plain prompt
  // for any other caller; naming a saved grouping goes through here.
  function askGroupName(title, placeholder, confirmLabel, initial, explainer) {
    const box = modalShell(
      '<h2 id="askTitle"></h2>' +
        "<p></p>" +
        '<input class="namefield" id="askField" autocomplete="off">' +
        '<div class="asked">' +
        '<button class="btn ghost" value="no">Cancel</button>' +
        '<button class="btn primary" value="yes" disabled></button>' +
        "</div>",
      { labelledBy: "askTitle", focusSel: "#askField" },
    );
    box.classList.add("name");
    box.querySelector("h2").textContent = title;
    box.querySelector("p").textContent =
      explainer === undefined
        ? "Saved views re-run live as your library grows."
        : explainer;
    const field = box.querySelector("#askField");
    field.placeholder = placeholder || "";
    field.value = initial || "";
    const save = box.querySelector('[value="yes"]');
    save.textContent = confirmLabel;
    // Save wakes only once there is text to save: a disabled button cannot take
    // focus, so a stray Return before typing can never submit. The field's own
    // Enter handler keeps the trim/empty guard for the typed path.
    const arm = () => {
      save.disabled = field.value.trim().length === 0;
    };
    field.addEventListener("input", arm);
    arm();
    const submit = () => {
      const v = field.value.trim();
      if (!v) return; // an empty Enter does not submit
      box.finish(v);
    };
    save.onclick = submit;
    // Enter submits from the field (an empty Return is a no-op); Escape is the
    // shell's job. The field starts with focus, not the Save button, so
    // nothing is saved by accident.
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submit();
      }
    });
    return box.promise;
  }

  function pickFile(accept) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = accept;
    input.multiple = true;

    // The input has to be in the document before it is clicked. Chrome opens the
    // panel for a detached input; WKWebView, which is what the macOS window is,
    // silently does nothing, so Upload appeared to do nothing at all in the app while
    // working in a browser. Kept off-screen rather than display:none, because a
    // hidden input is not clickable either.
    input.style.cssText =
      "position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(input);
    const done = () => input.remove();

    input.onchange = async () => {
      const failed = [];
      let saved = 0;
      for (const file of input.files) {
        const fd = new FormData();
        fd.append("file", file);
        try {
          const r = await fetch("/capture/upload", {
            method: "POST",
            body: fd,
          });
          if (!r.ok)
            throw new Error(
              (await r.json().catch(() => ({}))).detail || r.statusText,
            );
          saved++;
        } catch (err) {
          failed.push(file.name + ": " + String(err.message || err));
        }
      }
      done();
      home();
      if (failed.length) toast("Not saved. " + failed.join("; "), true);
      else if (saved) toast(saved === 1 ? "Saved." : saved + " saved.");
    };

    // Cancelling the panel fires `cancel` in modern engines and nothing at all in
    // older ones, so the node is also swept on the next focus back to the window.
    input.oncancel = done;
    window.addEventListener(
      "focus",
      () =>
        setTimeout(() => {
          if (!input.files || !input.files.length) done();
        }, 500),
      { once: true },
    );

    input.click();
  }

  async function saveLink(url) {
    try {
      await api("/capture/link", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
    } catch (err) {
      // The pill stays open with the address still in it: a failed capture must not
      // also cost you the thing you were capturing.
      openField("link");
      const field = document.getElementById("field");
      if (field) field.value = url;
      toast("Not saved. " + String(err.message || err), true);
      return;
    }
    home();
    toast("Saved.");
  }

  async function newNote() {
    const d = await api("/notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ body: "" }),
    });
    showArtifact(d.artifact.id, true);
  }

  document.addEventListener("keydown", (e) => {
    // CR.4: Cmd/Ctrl+. is the keyboard twin of the panel button - it opens (and
    // closes) the tags-and-summary drawer from anywhere on an artifact view.
    // The drawer only exists there, so its presence is the guard.
    if ((e.metaKey || e.ctrlKey) && e.key === ".") {
      if (document.getElementById("drawer")) {
        e.preventDefault();
        toggleDrawer();
      }
      return;
    }
    if (e.key === "Escape") {
      // The drawer is an overlay; Escape dismisses it before falling through to the
      // pill handling. A tag edit in progress owns its own Escape (blur the input),
      // so this defers while the tag field is focused.
      const inTagInput =
        e.target && e.target.classList && e.target.classList.contains("tagadd");
      if (!inTagInput && drawerOpen()) {
        toggleDrawer(false);
        return;
      }
      const wasOpen = !!menu;
      closeMenu(true);
      if (!wasOpen && pill.classList.contains("wide")) restorePill();
    }
  });
  document.addEventListener("click", (e) => {
    if (menu && !menu.contains(e.target) && !pill.contains(e.target))
      closeMenu();
  });

  // A WKWebView has no tabs, so `target="_blank"` opens nothing: clicking the address
  // on a saved link did precisely nothing, with no error anywhere to say why. The page
  // has to hand the address to the OS instead.
  //
  // Delegated rather than wired per link, because addresses also come out of rendered
  // markdown, and a rule that only covers the ones this file writes by hand is a rule
  // that breaks the next time something else renders a link.
  const bridge = window.__TAURI__ ? window.__TAURI__.core.invoke : null;

  document.addEventListener("click", (e) => {
    if (!bridge) return; // an ordinary browser can open its own tabs
    const link = e.target.closest && e.target.closest("a[href]");
    if (!link) return;

    const href = link.getAttribute("href") || "";
    if (!/^https?:/i.test(href)) return; // in-page and engine-relative links stay here

    e.preventDefault();
    bridge("open_external", { url: link.href }).catch((err) =>
      toast(String(err && err.message ? err.message : err), true),
    );
  });

  // Drag the window by the top strip. `-webkit-app-region` is inert in this WKWebView,
  // so the move is done by invoking the Rust `window_drag` on mousedown, the same path
  // the capture overlay uses. The search field opts out so a click there types rather
  // than dragging; a plain browser (no bridge) just does nothing, which is correct.
  const topbar = document.getElementById("topbar");
  if (topbar && bridge) {
    topbar.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      if (e.target.closest("input, button, a, [role='button']")) return;
      e.preventDefault();
      // Surface a rejection rather than swallowing it. A silent catch here is exactly
      // what hid the missing ACL grant last time: the invoke failed and the window
      // simply did not move, with nothing to say why.
      bridge("window_drag").catch((err) =>
        toast(
          "Could not drag the window: " +
            String(err && err.message ? err.message : err),
          true,
        ),
      );
    });
  }

  // ---- surfaces ------------------------------------------------------------
  // Enter and Space activate a row, the way they would if it were a real button.
  // Only one card can claim the shared names at a time: `view-transition-name` must be
  // unique in the document or the browser refuses the whole transition. So the names
  // are applied to the card being opened, held across the swap, and released after.
  let morphing = null;

  function claimMorph(id) {
    releaseMorph();
    const card = document.querySelector('.card[data-id="' + id + '"]');
    if (!card) return;

    const frame = card.querySelector("img");
    const title = card.querySelector(".title");
    if (frame) frame.style.viewTransitionName = "artifact-face";
    if (title) title.style.viewTransitionName = "artifact-title";
    morphing = card;
  }

  function releaseMorph() {
    if (!morphing) return;
    morphing.querySelectorAll("img, .title").forEach((el) => {
      el.style.viewTransitionName = "";
    });
    morphing = null;
  }

  // Wraps a navigation so the browser can tween between the two states. Falls straight
  // through where the API is missing, or where the person asked for less motion: a
  // morph is motion, and "reduced" has to mean reduced here too.
  function withMorph(run) {
    const wants = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (wants || !document.startViewTransition) return run();
    return document.startViewTransition(run).finished.finally(releaseMorph);
  }

  // The fetch happens BEFORE the transition starts, not inside it.
  //
  // startViewTransition snapshots the page, runs the callback, then snapshots again.
  // An awaited fetch inside that callback means the browser holds a frozen frame of
  // the old page while the network happens, then swaps to a half-built new one: the
  // jumble. Warming the cache first makes the callback a synchronous DOM write, which
  // is the only thing the API can actually tween.
  async function openArtifact(id) {
    claimMorph(id);
    const path = "/artifacts/" + id;
    try {
      warmed = { path, body: await api(path) };
    } catch (err) {
      releaseMorph();
      return toast(String(err.message || err), true);
    }
    withMorph(() => showArtifact(id));
  }

  function rowKey(event, run) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      run();
    }
  }

  function host(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, "");
    } catch (e) {
      return url || "";
    }
  }

  // "Three weeks ago" is a thing people remember. A date is not, which is why the
  // wall counts backwards from now rather than printing an ISO string nobody reads.
  function since(iso) {
    const then = new Date(iso);
    if (isNaN(then)) return "undated";
    const mins = Math.round((Date.now() - then.getTime()) / 60000);
    if (mins < 2) return "just now";
    if (mins < 60) return mins + " minutes ago";
    const hours = Math.round(mins / 60);
    if (hours < 24) return hours === 1 ? "an hour ago" : hours + " hours ago";
    const days = Math.round(hours / 24);
    if (days < 7) return days === 1 ? "yesterday" : days + " days ago";
    const weeks = Math.round(days / 7);
    if (days < 60) return weeks === 1 ? "last week" : weeks + " weeks ago";
    const months = Math.round(days / 30);
    if (days < 365) return months === 1 ? "last month" : months + " months ago";
    const years = Math.round(days / 365);
    return years === 1 ? "last year" : years + " years ago";
  }

  // Which artifacts have a picture of their own. Those fill the card and take a band
  // across the foot for the title; everything else is set as type inside the square.
  function facePicture(a) {
    const drop = ' onerror="this.remove()"';
    if (a.kind === "image")
      return (
        '<img src="/artifacts/' +
        a.id +
        '/blob" alt="" loading="lazy"' +
        drop +
        ">"
      );
    if (a.kind === "pdf")
      return (
        '<img src="/artifacts/' +
        a.id +
        '/page/0?width=520" alt="" loading="lazy"' +
        drop +
        ">"
      );
    if (a.kind === "link" && a.has_preview_image)
      return (
        '<img src="/artifacts/' +
        a.id +
        '/preview-image" alt="" loading="lazy"' +
        drop +
        ">"
      );
    return null;
  }

  // The dot is a graphic and answers to 3:1; the word beside it carries the meaning and
  // answers to 4.5:1 in ink. Neither travels without the other, so no piece of
  // information on the wall is carried by colour alone.
  const kindRow =
    '<span class="kindrow"><span class="kindmark"></span>' +
    '<span class="kindword">';

  // ---- wall grouping (K.6) ------------------------------------------------
  // The mode decides how the fetched cards are arranged under the home header.
  // Type and Tags regroup the same rows client-side (no refetch, no model
  // calls); Custom swaps the body for the saved-groupings list, which lives on
  // the server, so that one mode fetches /pivots.

  function groupBarHtml() {
    const labels = [
      ["touched", "Last touch"],
      ["type", "Type"],
      ["tags", "Tags"],
      ["custom", "Custom"],
    ];
    return (
      '<div class="groupbar" role="group" aria-label="Group the wall by">' +
      labels
        .map(
          ([mode, label]) =>
            '<button type="button" aria-pressed="' +
            (wallGroup === mode ? "true" : "false") +
            '" data-mode="' +
            mode +
            '">' +
            label +
            "</button>",
        )
        .join("") +
      "</div>"
    );
  }

  // The wall body for the client-side modes: one arrangement over the same
  // fetched cards. Last touch keeps the flat wall - the saved shelf, then
  // everything else with the pager foot. Type and Tags group every card into
  // sections, kept and fresh together; the pin flag still marks the kept ones.
  function wallBodyHtml() {
    const cards = wallKept.concat(wallFirst);
    // Q.2: a fresh library has no guidance - show an empty state in every
    // wall mode instead of empty SAVED / EVERYTHING ELSE sections.
    if (!wallKept.length && !wallFirst.length) {
      return (
        '<div class="state" style="padding: var(--sp-7) var(--sp-4); text-align: center;">' +
        '<div class="shelf" style="margin-bottom: var(--sp-3)">Nothing kept yet</div>' +
        '<div class="aside">Press the + below to capture a note, a link, or a file.</div>' +
        "</div>"
      );
    }
    if (wallGroup === "type") return wallSectionsHtml(kindSections(cards));
    if (wallGroup === "tags") return wallSectionsHtml(tagSections(cards));
    // Last touch: the saved shelf and the pager wall render as the same
    // collapsible .wallgroup sections the Type/Tags modes use, so the header
    // control (toggle + count + chevron) reads identically across modes.
    const sections = [];
    if (wallKept.length) sections.push(["SAVED", wallKept, true]);
    sections.push(["EVERYTHING ELSE", wallFirst, false]);
    return wallSectionsHtml(sections);
  }

  // The kind order the wall itself uses: notes first, then the rest of the
  // type filter, conversations last. Unknown kinds (none today) append at the
  // end under their own name rather than disappearing.
  const KIND_SHELVES = [
    ["note", "Notes"],
    ["link", "Links"],
    ["pdf", "PDFs"],
    ["image", "Images"],
    ["file", "Files"],
    ["chat", "Conversations"],
  ];

  function kindSections(items) {
    const byKind = {};
    for (const a of items) {
      (byKind[a.kind] ||= []).push(a);
    }
    const sections = KIND_SHELVES.filter(([k]) => byKind[k]).map(
      ([k, label]) => [label, byKind[k]],
    );
    for (const k of Object.keys(byKind)) {
      if (!KIND_SHELVES.some(([kk]) => kk === k)) sections.push([k, byKind[k]]);
    }
    return sections;
  }

  // Tags are multi-valued, so one artifact can sit under several shelves. The
  // shelves run in tag-count order (most-tagged first, names tie-broken), and
  // whatever carries no tag lands in an Untagged shelf at the end.
  function tagSections(items) {
    const byTag = new Map();
    const untagged = [];
    for (const a of items) {
      if (!a.tags || !a.tags.length) {
        untagged.push(a);
        continue;
      }
      for (const t of a.tags) {
        if (!byTag.has(t)) byTag.set(t, []);
        byTag.get(t).push(a);
      }
    }
    const shelves = [...byTag.entries()].sort(
      (a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]),
    );
    const sections = shelves.map(([t, list]) => ["#" + t, list]);
    if (untagged.length) sections.push(["Untagged", untagged]);
    return sections;
  }

  // Wall sections in every mode (L.4): each shelf is a collapsible section, the
  // same shape as a pivot group - a toggle header (label + count + chevron)
  // folding its cards away. Collapsed choices persist per mode in
  // sessionStorage, so a mode switch and switch back keeps the folds. A section
  // entry may carry a third flag for the last-touch SAVED shelf, which gets the
  // saved styling and no pager end-marker; the pager shelf carries the wall
  // id/end-marker instead.
  function wallSectionsHtml(sections) {
    const collapsed = wallCollapsedSet(wallGroup);
    return sections
      .map(([label, list, isSaved]) => {
        const key = label;
        const isCollapsed = collapsed.has(key);
        return (
          '<section class="wallgroup' +
          (isCollapsed ? " collapsed" : "") +
          '" data-key="' +
          esc(key) +
          '">' +
          '<button class="grouptoggle" type="button" aria-expanded="' +
          String(!isCollapsed) +
          '" title="' +
          esc(isCollapsed ? groupPreview(list) : "") +
          '"><span class="shelf center">' +
          esc(label) +
          '</span><span class="gmeta">' +
          list.length +
          '</span><span class="gchev" aria-hidden="true">' +
          svg("chev") +
          "</span></button>" +
          '<div class="wall' +
          (isSaved ? " wall--saved" : "") +
          (isSaved ? "" : '" id="wall') +
          '">' +
          list.map((a, i) => card(a, i)).join("") +
          "</div>" +
          (isSaved ? "" : '<div id="wallEnd" class="aside"></div>') +
          "</section>"
        );
      })
      .join("");
  }

  // ---- collapsible wall sections (L.4) --------------------------------
  // A sibling of the pivot-group collapse plumbing, keyed on the wall mode
  // instead of a spec hash: Type and Tags each keep their own folds.
  function wallCollapsedSet(mode) {
    try {
      return new Set(
        JSON.parse(
          sessionStorage.getItem("enqueue.collapsedWall." + mode) || "[]",
        ),
      );
    } catch (_) {
      return new Set();
    }
  }

  function wallSaveCollapsed(mode, set) {
    try {
      sessionStorage.setItem(
        "enqueue.collapsedWall." + mode,
        JSON.stringify([...set]),
      );
    } catch (_) {
      // Storage unavailable: collapsing still works for this render, it just
      // does not survive a mode switch.
    }
  }

  // Bind the collapsible section headers after a Type/Tags wall renders. The
  // sections live under `view`, parallel to mountPivotGroups.
  function mountWallGroups(mode) {
    // N.10b: one listener per toggle, not delegation - a wall run yields at
    // most ~10 sections, so the listener count is trivially small, and `view`
    // is a reused container where a persistent delegation listener would need
    // its own teardown lifecycle.
    const collapsed = wallCollapsedSet(mode);
    view.querySelectorAll(".wallgroup .grouptoggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const section = btn.closest(".wallgroup");
        const key = section.dataset.key;
        section.classList.toggle("collapsed");
        const nowCollapsed = section.classList.contains("collapsed");
        btn.setAttribute("aria-expanded", String(!nowCollapsed));
        if (nowCollapsed) collapsed.add(key);
        else collapsed.delete(key);
        wallSaveCollapsed(mode, collapsed);
      });
    });
  }

  // Switch the wall's grouping mode in place: the header stays, the body
  // re-renders from the cards already in hand. Only Custom fetches - the saved
  // groupings rows live on the server.
  async function setWallGroup(mode) {
    if (!WALL_GROUPS.includes(mode)) return;
    // Custom is not a mode (L.5): it opens the saved-groupings modal over the
    // current wall and returns to the mode that was showing. Only a grouping
    // actually opened takes over the view (runSavedGrouping, route g/<id>); a
    // cancel or backdrop click leaves the wall untouched.
    if (mode === "custom") {
      const pick = await openCustomPicker();
      if (pick) runSavedGrouping(pick.id, pick.name);
      return;
    }
    wallGroup = mode;
    localStorage.setItem("enqueue.wallGroup", mode);
    const bar = view.querySelector(".groupbar");
    if (bar) {
      bar.querySelectorAll("button").forEach((b) => {
        b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
      });
    }
    // The tag bar is the Tags mode's filter row (L.1): show it only when the
    // mode asks for it. It stays in the DOM either way, so its chips and the
    // all-tags expander keep their state across mode switches.
    const tagbar = view.querySelector(".tagbar");
    if (tagbar) tagbar.hidden = mode !== "tags";
    const slot = document.getElementById("wallbody");
    if (!slot) return;
    slot.innerHTML = wallBodyHtml();
    // The Type and Tags modes fold their shelves (L.4); the toggle headers are
    // re-bound on every body render.
    if (mode === "type" || mode === "tags") mountWallGroups(mode);
    if (mode === "touched") watchWallEnd();
  }

  // The saved-groupings modal (L.5): selecting "Custom" on the wall opens this
  // instead of swapping the wall body, so the wall stays useful behind the dim.
  // Each row runs its grouping, renames it (L.3b pencil), or forgets it. Cancel,
  // Escape, and a backdrop click all close without touching the wall. Resolves
  // to the picked grouping ({ id, name }) or null.
  function openCustomPicker() {
    const box = modalShell(
      '<h2 id="pickTitle">Saved views</h2>' +
        '<p class="aside">Re-runs live as your library grows. Ask the eye to organize, then keep any arrangement here.</p>' +
        '<div class="pickgroups" id="customPickerList"></div>' +
        '<div class="asked"><button class="btn secondary" value="no">Cancel</button></div>',
      { labelledBy: "pickTitle", backdrop: true },
    );

    // Render (or re-render) the row list. Called on open, and again by
    // renameSavedGrouping / forgetSavedGrouping after they change a row.
    const refresh = () => {
      const list = box.querySelector("#customPickerList");
      list.innerHTML = '<div class="state">opening...</div>';
      api("/pivots")
        .then((d) => {
          if (!box.isConnected) return; // the modal closed while fetching
          list.innerHTML = "";
          const pivots = d.items || [];
          if (!pivots.length) {
            const none = document.createElement("div");
            none.className = "state";
            none.textContent = "Nothing saved yet.";
            list.appendChild(none);
            return;
          }
          for (const p of pivots) {
            const row = document.createElement("div");
            row.className = "customrow";
            row.dataset.pivot = p.id;

            const run = document.createElement("button");
            run.className = "btn tertiary rowname";
            run.textContent = p.name;
            run.onclick = () => box.finish({ id: p.id, name: p.name });
            row.appendChild(run);

            const rename = document.createElement("button");
            rename.className = "title-action";
            rename.setAttribute("aria-label", "Rename " + p.name);
            rename.title = "Rename this view";
            rename.innerHTML = svg("pencil");
            rename.onclick = (ev) => {
              ev.stopPropagation();
              renameSavedGrouping(ev, p.id);
            };
            row.appendChild(rename);

            const forget = document.createElement("button");
            forget.className = "forgetbtn";
            forget.innerHTML = svg("close");
            forget.setAttribute("aria-label", "Forget " + p.name);
            forget.onclick = (ev) => {
              ev.stopPropagation();
              forgetSavedGrouping(ev, p.id);
            };
            row.appendChild(forget);

            list.appendChild(row);
          }
        })
        .catch(() => {
          if (!box.isConnected) return;
          const list = box.querySelector("#customPickerList");
          list.innerHTML = "";
          const none = document.createElement("div");
          none.className = "aside";
          none.textContent = "Could not load saved views.";
          list.appendChild(none);
        });
    };
    refresh();
    return box.promise;
  }

  // Refresh the saved-groupings modal's row list after a rename or forget from
  // inside it. A no-op when no picker is open, so the shared row actions also
  // work from the saved-groupings sub-view.
  async function refreshCustomPicker() {
    const dialog = document.querySelector("dialog.ask #customPickerList");
    if (!dialog) return;
    const box = dialog.closest("dialog");
    if (!box || !box.open) return;
    const list = box.querySelector("#customPickerList");
    const d = await api("/pivots").catch(() => ({ items: [] }));
    if (!box.isConnected) return; // the modal closed while fetching
    list.innerHTML = "";
    const pivots = d.items || [];
    if (!pivots.length) {
      const none = document.createElement("div");
      none.className = "state";
      none.textContent = "Nothing saved yet.";
      list.appendChild(none);
      return;
    }
    for (const p of pivots) {
      const row = document.createElement("div");
      row.className = "customrow";
      row.dataset.pivot = p.id;

      const run = document.createElement("button");
      run.className = "btn tertiary rowname";
      run.textContent = p.name;
      run.onclick = () => {
        try {
          box.close();
        } catch (_) {
          // Already closed by the platform; the node still has to go.
        }
        box.remove();
        runSavedGrouping(p.id, p.name);
      };
      row.appendChild(run);

      const rename = document.createElement("button");
      rename.className = "title-action";
      rename.setAttribute("aria-label", "Rename " + p.name);
      rename.title = "Rename this view";
      rename.innerHTML = svg("pencil");
      rename.onclick = (ev) => {
        ev.stopPropagation();
        renameSavedGrouping(ev, p.id);
      };
      row.appendChild(rename);

      const forget = document.createElement("button");
      forget.className = "forgetbtn";
      forget.innerHTML = svg("close");
      forget.setAttribute("aria-label", "Forget " + p.name);
      forget.onclick = (ev) => {
        ev.stopPropagation();
        forgetSavedGrouping(ev, p.id);
      };
      row.appendChild(forget);

      list.appendChild(row);
    }
  }

  function card(a, i) {
    const bits = [since(a.created_at)];
    if (a.local_only) bits.push("local only");
    if (a.status === "text_only" && a.kind === "note")
      bits.push("holds a credential");

    // A conversation is a sixth kind on the wall: same card, same dot, same clock,
    // but it opens the thread instead of the artifact. The word is the app's own
    // name for the kind, not the storage table's.
    const word = a.kind === "chat" ? "conversation" : a.kind;
    const open = a.kind === "chat" ? "showChat" : "openArtifact";

    // "pending" is the engine's word for an artifact nothing has read yet, which is
    // the one thing the wall marks in the accent.
    const unread = a.status === "pending";
    const picture = facePicture(a);
    const flag = a.pinned
      ? '<span class="flag" aria-hidden="true">' + svg("star") + "</span>"
      : "";

    const inside = picture
      ? picture +
        flag +
        '<div class="cardband">' +
        kindRow +
        esc(word) +
        "</span></span>" +
        '<div class="title">' +
        esc(a.title || "Untitled") +
        "</div></div>"
      : '<div class="cardfoot" style="margin-top:0">' +
        kindRow +
        esc(word) +
        "</span></span>" +
        flag +
        "</div>" +
        '<div class="title">' +
        esc(a.title || "Untitled") +
        "</div>" +
        '<div class="preview">' +
        (a.kind === "note"
          ? esc(mdText(a.excerpt || ""))
          : esc(a.excerpt || (a.kind === "link" ? host(a.source_url) : ""))) +
        "</div>" +
        '<div class="cardfoot"><span class="meta">' +
        bits.map(esc).join(" ") +
        "</span>" +
        (unread ? '<span class="unread"></span>' : "") +
        "</div>";

    return (
      '<div class="card' +
      (picture ? " pictorial" : "") +
      (i < 18 ? " hang" : "") +
      '" data-kind="' +
      esc(a.kind) +
      '" data-id="' +
      esc(a.id) +
      '" ' +
      'tabindex="0" role="button"' +
      ' aria-label="' +
      esc(
        (a.title || "Untitled") +
          ", " +
          word +
          ", " +
          bits.join(", ") +
          (unread ? ", not read yet" : "") +
          (a.pinned ? ", kept" : ""),
      ) +
      '"' +
      (i < 18 ? ' style="animation-delay:' + i * 22 + 'ms"' : "") +
      ' onclick="' +
      open +
      "('" +
      a.id +
      "')\"" +
      " onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();" +
      open +
      "('" +
      a.id +
      "')}\">" +
      inside +
      "</div>"
    );
  }

  // Ingestion time by default. The promise is that things sit in the order you found
  // them, and sorting by last touched means fixing a typo silently moves a note to the
  // front of your own museum.

  // What the wall was showing last time it drew. Compared on focus so a refresh only
  // happens when something actually changed, rather than reflowing the grid and
  // throwing away your scroll position every time you tab back.
  let wallStamp = null;

  // A capture made in the overlay lands in a different window, and this one has no
  // way to hear about it. Without this the museum sits stale until you navigate, so
  // saving something correctly looked like saving nothing. The wall refreshes only
  // when something actually changed; an open artifact or chat re-fetches
  // its own rows on focus (K.9) so a capture elsewhere never leaves the open page
  // stale - scroll is kept, nothing blinks.
  async function refreshIfStale() {
    if (document.hidden || !view) return;
    if (place === "wall") {
      const peek = await api("/artifacts?limit=1&order=ingested").catch(
        () => null,
      );
      if (!peek) return;
      const stamp = peek.total + ":" + ((peek.items[0] || {}).id || "");
      if (stamp !== wallStamp) home({ keepScroll: true });
      return;
    }
    if (pivotState && pivotState.pivot_id) {
      // A saved view is open: re-run it with the current spec so a
      // capture elsewhere is reflected, keeping scroll position.
      const scrollY = window.scrollY;
      let next;
      try {
        next = await api("/pivot/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ spec: pivotState.spec }),
        });
      } catch (err) {
        return;
      }
      if (pivotState && pivotState.pivot_id) {
        renderPivot(
          next,
          pivotState.request,
          pivotState.spec,
          pivotState.pivot_id,
        );
        window.scrollTo(0, scrollY);
      }
      return;
    }
    if (scope.kind === "artifact" && scope.id) {
      showArtifact(scope.id, false, window.scrollY);
    } else if (scope.kind === "chat" && scope.id) {
      showChat(scope.id);
    }
  }

  window.addEventListener("focus", refreshIfStale);
  document.addEventListener("visibilitychange", refreshIfStale);

  // ---- hash router (K.9) --------------------------------------------------
  // The museum is a single-page app with all view state in memory and no URL.
  // macOS can reclaim a hidden webview, and the capture flow hides the museum,
  // so a reload re-inits the page and used to land on the wall no matter what
  // was open. Every navigation now writes a route token to the hash and boot
  // restores the same view. Tokens: empty = wall, #a/<id> = artifact,
  // #c/<id> = chat, #g = saved-groupings list,
  // #g/<id> = a saved grouping run, #s/<query> = search results.
  function setRoute(token) {
    const want = token ? "#" + token : "";
    if (location.hash === want) return;
    // replaceState, not location.hash: the app's own pill is the back button,
    // and browser-history entries for every artifact would make Back a broken
    // walk through views that never re-render. There is no hashchange listener
    // - a second window driving the same museum is not a scenario today.
    history.replaceState(null, "", want || location.pathname + location.search);
  }

  // Boot reads the hash and restores the view that was open when the page was
  // reclaimed, so a hidden-and-restored museum never lands on the wall while an
  // artifact was open. Anything unrecognized falls back to the wall.
  function restoreRoute() {
    const raw = location.hash.replace(/^#/, "");
    if (!raw) return home();
    const [kind, ...rest] = raw.split("/");
    const id = rest.join("/");
    if (kind === "a" && id) return showArtifact(id);
    if (kind === "c" && id) return showChat(id);
    if (kind === "g" && !id) return showSavedGroupings();
    if (kind === "g" && id) return runSavedGrouping(id);
    if (kind === "s" && id) {
      try {
        return doSearch(decodeURIComponent(id));
      } catch (_) {
        return home();
      }
    }
    return home();
  }

  // One order, always: what you touched last. The bar of alternatives was three
  // controls for a decision nobody makes twice, sitting above the thing they were
  // meant to help you read.
  const PAGE = 48;
  let wall = null;

  // The wall's grouping mode (K.6): how the fetched cards are arranged under the
  // home header. Last touch is the flat list the wall has always been; Type and
  // Tags regroup the same rows client-side. Custom is not a mode - it opens the
  // saved-groupings modal (L.5) and returns to the mode that was showing, so it
  // is never persisted and never the boot state.
  const WALL_GROUPS = ["type", "touched", "tags", "custom"];
  let wallGroup = localStorage.getItem("enqueue.wallGroup");
  if (!WALL_GROUPS.includes(wallGroup) || wallGroup === "custom")
    wallGroup = "touched";

  // The cards home() fetched last time, kept for the client-side regroups.
  let wallKept = [];
  let wallFirst = [];

  async function home(opts) {
    const wasReading = chat;
    const keepAt = opts && opts.keepScroll ? window.scrollY : null;
    teardown();
    scope = { kind: "everything", label: "everything" };
    view.removeAttribute("data-kind");
    restorePill("wall");
    setRoute("");
    view.innerHTML = '<div class="state">opening...</div>';

    const [kept, first, tagcloud] = await Promise.all([
      api("/artifacts?pinned=true&order=touched&limit=200"),
      api("/artifacts?pinned=false&order=touched&limit=" + PAGE),
      api("/tags"),
    ]);

    if (!kept.total && !first.total) {
      // No illustration and no button. The capture pill is already on screen and it
      // is the call to action; a second one here would be the same instruction twice.
      view.innerHTML =
        '<div class="empty"><div class="display">Nothing here yet</div>' +
        '<div class="state">Anything you drop on the pill below is kept exactly as it ' +
        "arrived and read on this machine, in the order you found it. No folder, no tag, " +
        "no reason required. Nothing here expires.</div></div>";
      return;
    }

    // The emblem is the same eye at every hour; the greeting phrase below it
    // carries the time of day. The eye is decorative, so it is hidden from the
    // accessibility tree; the phrase says everything.
    const hour = new Date().getHours();
    const fallback =
      hour < 12
        ? "Good morning"
        : hour < 17
          ? "Good afternoon"
          : "Good evening";
    let html =
      '<div class="homehead">' +
      '<div class="greetline">' +
      // O.3: the eyeball PNG is split into a frame (the socket: outline, lashes,
