<script>
  // Focus is drawn by `:focus-visible` in one rule for the whole app. The engine
  // already knows the difference between a Tab and a click, and the hand-rolled
  // keyboard-nav class this replaces had drifted into four different ring colours.

  const view = document.getElementById("view");
  const pill = document.getElementById("pill");
  const esc = (s) =>
    (s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );

  // One-entry cache for the artifact about to be opened. The morph needs the detail
  // payload in hand before the transition begins; without it the callback awaits the
  // network mid-transition and the browser tweens between two unfinished frames.
  let warmed = null;

  const api = async (p, o) => {
    if (!o && warmed && warmed.path === p) {
      const hit = warmed.body;
      warmed = null;
      return hit;
    }
    const r = await fetch(p, o);
    if (!r.ok)
      throw new Error(
        (await r.json().catch(() => ({}))).detail || r.statusText,
      );
    return r.json();
  };

  // Self-contained markdown. A CDN would make the museum reach the network to render
  // something you wrote, which is the opposite of the promise. Escapes before parsing,
  // so no input path can render raw HTML.
  function md(src) {
    let t = esc(src);
    const held = [];
    t = t.replace(
      /```([\s\S]*?)```/g,
      (m, code) =>
        "␀" +
        (held.push(
          "<pre><code>" + code.replace(/^\w*\n/, "") + "</code></pre>",
        ) -
          1) +
        "␀",
    );
    t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    t = t.replace(
      /\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>',
    );
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");

    const out = [];
    let list = null;
    const close = () => {
      if (list) {
        out.push("</" + list + ">");
        list = null;
      }
    };
    for (const raw of t.split("\n")) {
      const line = raw.trimEnd();
      const h = line.match(/^(#{1,3})\s+(.*)$/);
      const li = line.match(/^\s*[-*+]\s+(.*)$/);
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);
      const bq = line.match(/^(?:&gt;|>)\s?(.*)$/);
      if (h) {
        close();
        out.push("<h" + h[1].length + ">" + h[2] + "</h" + h[1].length + ">");
      } else if (li) {
        if (list !== "ul") {
          close();
          out.push("<ul>");
          list = "ul";
        }
        out.push("<li>" + li[1] + "</li>");
      } else if (ol) {
        if (list !== "ol") {
          close();
          out.push("<ol>");
          list = "ol";
        }
        out.push("<li>" + ol[1] + "</li>");
      } else if (bq) {
        close();
        out.push("<blockquote>" + bq[1] + "</blockquote>");
      } else if (!line.trim()) close();
      else {
        close();
        out.push("<p>" + line + "</p>");
      }
    }
    close();
    return out.join("").replace(/␀(\d+)␀/g, (m, i) => held[+i]);
  }

  // Turn the edited document back into markdown. Only the tags md() can produce need
  // handling, which is what keeps this tractable: the editor and the parser are two
  // halves of one contract rather than a general HTML converter.
  function htmlToMd(root) {
    const inline = (node) => {
      if (node.nodeType === 3) return node.nodeValue;
      if (node.nodeType !== 1) return "";
      const kids = [...node.childNodes].map(inline).join("");
      switch (node.tagName) {
        case "BR":
          return "\n";
        case "STRONG":
        case "B":
          return kids.trim() ? "**" + kids + "**" : "";
        case "EM":
        case "I":
          return kids.trim() ? "*" + kids + "*" : "";
        case "CODE":
          return "`" + kids + "`";
        case "A":
          return "[" + kids + "](" + (node.getAttribute("href") || "") + ")";
        default:
          return kids;
      }
    };

    const lines = [];
    for (const node of root.childNodes) {
      if (node.nodeType === 3) {
        const t = node.nodeValue.trim();
        if (t) lines.push(t, "");
        continue;
      }
      if (node.nodeType !== 1) continue;

      switch (node.tagName) {
        case "H1":
          lines.push("# " + inline(node).trim(), "");
          break;
        case "H2":
          lines.push("## " + inline(node).trim(), "");
          break;
        case "H3":
          lines.push("### " + inline(node).trim(), "");
          break;
        case "UL":
          for (const li of node.children) lines.push("- " + inline(li).trim());
          lines.push("");
          break;
        case "OL": {
          let i = 1;
          for (const li of node.children)
            lines.push(i++ + ". " + inline(li).trim());
          lines.push("");
          break;
        }
        case "BLOCKQUOTE":
          lines.push("> " + inline(node).trim(), "");
          break;
        case "PRE":
          lines.push("```", node.textContent.replace(/\n$/, ""), "```", "");
          break;
        case "DIV":
        case "P": {
          const t = inline(node)
            .replace(/\u00a0/g, " ")
            .trimEnd();
          lines.push(t.trim() ? t : "", t.trim() ? "" : null);
          break;
        }
        default: {
          const t = inline(node).trim();
          if (t) lines.push(t, "");
        }
      }
    }
    return lines
      .filter((l) => l !== null)
      .join("\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  // Structural markdown typed at the start of a line becomes the real thing, the way
  // it does in any editor that renders as you write.
  const RULES = [
    [/^(#{1,3})\s$/, (m) => "h" + m[1].length],
    [/^[-*+]\s$/, () => "ul"],
    [/^1\.\s$/, () => "ol"],
    [/^>\s$/, () => "blockquote"],
  ];

  function applyInputRules(ed) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    let block = sel.anchorNode;
    while (block && block.parentNode !== ed) block = block.parentNode;
    if (!block || block.nodeType !== 1) return;
    if (["UL", "OL", "PRE", "BLOCKQUOTE"].includes(block.tagName)) return;

    const text = block.textContent;
    for (const [re, kind] of RULES) {
      const m = text.match(re);
      if (!m) continue;
      const tag = kind(m);
      document.execCommand(
        tag === "ul"
          ? "insertUnorderedList"
          : tag === "ol"
            ? "insertOrderedList"
            : "formatBlock",
        false,
        tag === "ul" || tag === "ol" ? null : tag,
      );
      // The marker characters were the instruction, not the content.
      const target = window.getSelection().anchorNode;
      const host = target && target.nodeType === 3 ? target : null;
      if (host)
        host.nodeValue = host.nodeValue.replace(
          re.source.replace(/[\^$]/g, "") === ""
            ? ""
            : /^(#{1,3}|[-*+]|1\.|>)\s/,
          "",
        );
      return;
    }
  }

  // ---- the pill ------------------------------------------------------------
  const ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    find: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    // The eye, not a question mark. Asking here is not a support request; it is looking
    // at what you already own and seeing what is in it.
    ask: '<path d="M2.2 12S5.8 5.6 12 5.6 21.8 12 21.8 12 18.2 18.4 12 18.4 2.2 12 2.2 12z"/><circle cx="12" cy="12" r="2.8"/>',
    back: '<path d="M14.5 6.5L9 12l5.5 5.5"/>',
    chev: '<path d="M6.5 14.5L12 9l5.5 5.5"/>',
    down: '<path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/>',
    home: '<path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.6V20h12V9.6"/>',
    star: '<path d="M12 4.2l2.3 4.9 5.2.7-3.8 3.7 1 5.3-4.7-2.6-4.7 2.6 1-5.3-3.8-3.7 5.2-.7z"/>',
    trash:
      '<path d="M4 7h16"/><path d="M9.5 7V5h5v2"/><path d="M6.5 7l1 13h9l1-13"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    note: '<path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/>',
    upload:
      '<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v3h16v-3"/>',
    link: '<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
    image:
      '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-7 7"/>',
    rail: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16"/>',
    gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7L5.6 5.6"/>',
  };
  const svg = (k) => '<svg viewBox="0 0 24 24">' + ICONS[k] + "</svg>";

  let menu = null;
  let scope = { kind: "everything", label: "everything" };

  function closeMenu(restoreFocus) {
    if (menu) {
      menu.remove();
      menu = null;
    }
    const b = document.getElementById("btnAdd");
    if (b) {
      b.setAttribute("aria-expanded", "false");
      // Focus goes back where it came from. Dropping it on BODY leaves a keyboard user
      // at the top of the document with no idea the menu ever opened.
      if (restoreFocus) b.focus();
    }
  }

  // The first slot changes with where you are. On the wall it captures, because that is
  // the only thing you can do to a wall. Inside an object there is nowhere to put a new
  // capture yet and the thing you actually want is out, so it becomes the way out.
  // Search and ask never move: they mean the same thing on every surface.
  let place = "wall";

  function restorePill(where) {
    if (where) place = where;
    closeMenu();
    pill.classList.remove("wide");
    const inside = place === "inside";

    // Wall: Plus + Search + Eye (chat) + Settings.
    // Inside: Back + Eye (context-aware).
    let html = "";
    if (inside) {
      html =
        '<button class="round" aria-label="Back to everything" onclick="home()">' +
        svg("back") +
        "</button>" +
        '<button class="round" aria-label="' +
        (scope.kind === "chat" ? "Continue chat" : "Ask about this") +
        '" onclick="chatOrAsk()">' +
        svg("ask") +
        "</button>";
    } else {
      html =
        '<button class="keep" id="btnAdd" aria-expanded="false" ' +
        'onclick="toggleMenu(event)">' +
        '<span class="disc">' +
        svg("plus") +
        "</span></button>" +
        '<button class="round" aria-label="Search" onclick="openField(\'search\')">' +
        svg("find") +
        "</button>" +
        '<button class="round" aria-label="Chat with AI" onclick="openField(\'ask\')">' +
        svg("ask") +
        "</button>" +
        '<button class="round" aria-label="Settings" onclick="showSettings()">' +
        svg("gear") +
        "</button>";
    }
    pill.innerHTML = html;
  }

  // Context-aware eye action inside an exhibit/chat.
  function chatOrAsk() {
    if (scope.kind === "chat" && scope.id) {
      showChat(scope.id);
    } else {
      openField("ask");
    }
  }

  const MENU = [
    ["note", "Note", () => newNote()],
    ["upload", "Upload", () => pickFile("*/*")],
    ["link", "Link", () => openField("link")],
    ["image", "Image", () => pickFile("image/*")],
  ];

  function toggleMenu(e) {
    if (e) e.stopPropagation();
    if (menu) return closeMenu();
    menu = document.createElement("div");
    menu.className = "menu";
    menu.setAttribute("role", "menu");
    // Four equal-weight choices. None of them is the primary, so none of them is
    // yellow, and hover is the recessed fill rather than a colour that would read as
    // "this is the one you want".
    menu.innerHTML = MENU.map(
      ([k, label]) =>
        '<button role="menuitem"><span class="ic">' +
        svg(k) +
        "</span>" +
        label +
        "</button>",
    ).join("");
    document.body.appendChild(menu);
    menu.querySelectorAll("button").forEach((b, i) => {
      b.onclick = (ev) => {
        ev.stopPropagation();
        closeMenu();
        MENU[i][2]();
      };
    });
    document.getElementById("btnAdd").setAttribute("aria-expanded", "true");
    menu.querySelector("button").focus();

    // role="menu" promises arrow navigation. Without it the role is a lie to a screen
    // reader that has already announced a menu.
    menu.addEventListener("keydown", (ev) => {
      const items = [...menu.querySelectorAll("button")];
      const at = items.indexOf(document.activeElement);
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        const next =
          (at + (ev.key === "ArrowDown" ? 1 : -1) + items.length) %
          items.length;
        items[next].focus();
      }
      if (ev.key === "Home") {
        ev.preventDefault();
        items[0].focus();
      }
      if (ev.key === "End") {
        ev.preventDefault();
        items[items.length - 1].focus();
      }
    });
  }

  function openField(mode) {
    closeMenu();
    const hint = {
      search: "find something",
      ask: "ask about " + scope.label,
      link: "paste a url",
    }[mode];
    pill.classList.add("wide");
    pill.innerHTML =
      (mode === "ask"
        ? '<span class="scope">' + esc(scope.label) + "</span>"
        : "") +
      '<input id="field" placeholder="' +
      esc(hint) +
      '" autocomplete="off">' +
      '<button class="round" aria-label="Close" onclick="restorePill()">' +
      svg("close") +
      "</button>";

    const field = document.getElementById("field");
    field.focus();
    field.onkeydown = (e) => {
      if (e.key === "Escape") return restorePill();
      if (e.key !== "Enter") return;
      const v = field.value.trim();
      if (!v) return;
      restorePill();
      if (mode === "search") doSearch(v);
      else if (mode === "ask") startChat(v);
      else saveLink(v);
    };
  }

  // Capture is the one act the whole product rests on, and it used to fail in silence:
  // a link that errored and an upload that 500ed both re-rendered the wall exactly like
  // success. "Nothing is ever lost" cannot be true of a thing that can drop your capture
  // without saying so, so both paths now report, and a failure keeps what you typed.
  function toast(message, bad) {
    const old = document.getElementById("toast");
    if (old) old.remove();
    const node = document.createElement("div");
    node.id = "toast";
    node.className = "toast" + (bad ? " bad" : "");
    node.setAttribute("role", "status");
    node.textContent = message;
    document.body.appendChild(node);
    setTimeout(() => node.remove(), bad ? 8000 : 2600);
  }

  /// Ask before doing something irreversible. Resolves true only on the confirm button.
  ///
  /// Replaces `window.confirm`, which the WKWebView this ships inside does not
  /// implement: it returned false without ever drawing a panel, so every guard read as
  /// "the person said no" and the action was skipped in silence.
  ///
  /// The promise is settled inside each handler rather than on the dialog's `close`
  /// event. Measured here, `close()` does not fire `close` in this engine, so a version
  /// that resolved there never resolved at all: `await ask(...)` hung and the delete
  /// still did not happen. Settling at the source removes the dependency entirely, and
  /// `done` keeps the double path from resolving twice.
  function ask(title, detail, confirmLabel) {
    return new Promise((resolve) => {
      const box = document.createElement("dialog");
      box.className = "ask";
      box.innerHTML =
        '<h2 id="askTitle"></h2><p></p>' +
        '<div class="asked">' +
        '<button class="btn secondary" value="no">Cancel</button>' +
        '<button class="btn danger" value="yes"></button>' +
        "</div>";
      box.setAttribute("aria-labelledby", "askTitle");
      box.querySelector("h2").textContent = title;
      box.querySelector("p").textContent = detail;
      box.querySelector('[value="yes"]').textContent = confirmLabel;

      let done = false;
      const finish = (answer) => {
        if (done) return;
        done = true;
        try {
          box.close();
        } catch (_) {
          // Already closed by the platform; the node still has to go.
        }
        box.remove();
        resolve(answer);
      };

      box.querySelector('[value="no"]').onclick = () => finish(false);
      box.querySelector('[value="yes"]').onclick = () => finish(true);
      // Esc means no. `cancel` is the specified path; the keydown is the fallback for
      // engines that skip it, and finish() makes the overlap harmless.
      box.addEventListener("cancel", (e) => {
        e.preventDefault();
        finish(false);
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          finish(false);
        }
      });

      document.body.appendChild(box);
      box.showModal();
      // Cancel takes focus, so a stray Return cannot destroy anything.
      box.querySelector('[value="no"]').focus();
    });
  }

  function pickFile(accept) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = accept;
    input.multiple = true;

    // The input has to be in the document before it is clicked. Chrome opens the
    // panel for a detached input; WKWebView, which is what the macOS window is,
    // silently does nothing, so Upload appeared to do nothing at all in the app while
    // working in a browser. Kept off-screen rather than display:none, because a
    // hidden input is not clickable either.
    input.style.cssText =
      "position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(input);
    const done = () => input.remove();

    input.onchange = async () => {
      const failed = [];
      let saved = 0;
      for (const file of input.files) {
        const fd = new FormData();
        fd.append("file", file);
        try {
          const r = await fetch("/capture/upload", {
            method: "POST",
            body: fd,
          });
          if (!r.ok)
            throw new Error(
              (await r.json().catch(() => ({}))).detail || r.statusText,
            );
          saved++;
        } catch (err) {
          failed.push(file.name + ": " + String(err.message || err));
        }
      }
      done();
      home();
      if (failed.length) toast("Not saved. " + failed.join("; "), true);
      else if (saved) toast(saved === 1 ? "Saved." : saved + " saved.");
    };

    // Cancelling the panel fires `cancel` in modern engines and nothing at all in
    // older ones, so the node is also swept on the next focus back to the window.
    input.oncancel = done;
    window.addEventListener(
      "focus",
      () =>
        setTimeout(() => {
          if (!input.files || !input.files.length) done();
        }, 500),
      { once: true },
    );

    input.click();
  }

  async function saveLink(url) {
    try {
      await api("/capture/link", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
    } catch (err) {
      // The pill stays open with the address still in it: a failed capture must not
      // also cost you the thing you were capturing.
      openField("link");
      const field = document.getElementById("field");
      if (field) field.value = url;
      toast("Not saved. " + String(err.message || err), true);
      return;
    }
    home();
    toast("Saved.");
  }

  async function newNote() {
    const d = await api("/notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ body: "" }),
    });
    showArtifact(d.artifact.id, true);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      const wasOpen = !!menu;
      closeMenu(true);
      if (!wasOpen && pill.classList.contains("wide")) restorePill();
    }
  });
  document.addEventListener("click", (e) => {
    if (menu && !menu.contains(e.target) && !pill.contains(e.target))
      closeMenu();
  });

  // A WKWebView has no tabs, so `target="_blank"` opens nothing: clicking the address
  // on a saved link did precisely nothing, with no error anywhere to say why. The page
  // has to hand the address to the OS instead.
  //
  // Delegated rather than wired per link, because addresses also come out of rendered
  // markdown, and a rule that only covers the ones this file writes by hand is a rule
  // that breaks the next time something else renders a link.
  const bridge = window.__TAURI__ ? window.__TAURI__.core.invoke : null;

  document.addEventListener("click", (e) => {
    if (!bridge) return; // an ordinary browser can open its own tabs
    const link = e.target.closest && e.target.closest("a[href]");
    if (!link) return;

    const href = link.getAttribute("href") || "";
    if (!/^https?:/i.test(href)) return; // in-page and engine-relative links stay here

    e.preventDefault();
    bridge("open_external", { url: link.href }).catch((err) =>
      toast(String(err && err.message ? err.message : err), true),
    );
  });

  // ---- surfaces ------------------------------------------------------------
  // Enter and Space activate a row, the way they would if it were a real button.
  // Only one card can claim the shared names at a time: `view-transition-name` must be
  // unique in the document or the browser refuses the whole transition. So the names
  // are applied to the card being opened, held across the swap, and released after.
  let morphing = null;

  function claimMorph(id) {
    releaseMorph();
    const card = document.querySelector('.card[data-id="' + id + '"]');
    if (!card) return;

    const frame = card.querySelector("img");
    const title = card.querySelector(".title");
    if (frame) frame.style.viewTransitionName = "artifact-face";
    if (title) title.style.viewTransitionName = "artifact-title";
    morphing = card;
  }

  function releaseMorph() {
    if (!morphing) return;
    morphing.querySelectorAll("img, .title").forEach((el) => {
      el.style.viewTransitionName = "";
    });
    morphing = null;
  }

  // Wraps a navigation so the browser can tween between the two states. Falls straight
  // through where the API is missing, or where the person asked for less motion: a
  // morph is motion, and "reduced" has to mean reduced here too.
  function withMorph(run) {
    const wants = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (wants || !document.startViewTransition) return run();
    return document.startViewTransition(run).finished.finally(releaseMorph);
  }

  // The fetch happens BEFORE the transition starts, not inside it.
  //
  // startViewTransition snapshots the page, runs the callback, then snapshots again.
  // An awaited fetch inside that callback means the browser holds a frozen frame of
  // the old page while the network happens, then swaps to a half-built new one: the
  // jumble. Warming the cache first makes the callback a synchronous DOM write, which
  // is the only thing the API can actually tween.
  async function openArtifact(id) {
    claimMorph(id);
    const path = "/artifacts/" + id;
    try {
      warmed = { path, body: await api(path) };
    } catch (err) {
      releaseMorph();
      return toast(String(err.message || err), true);
    }
    withMorph(() => showArtifact(id));
  }

  function rowKey(event, run) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      run();
    }
  }

  function host(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, "");
    } catch (e) {
      return url || "";
    }
  }

  // "Three weeks ago" is a thing people remember. A date is not, which is why the
  // wall counts backwards from now rather than printing an ISO string nobody reads.
  function since(iso) {
    const then = new Date(iso);
    if (isNaN(then)) return "undated";
    const mins = Math.round((Date.now() - then.getTime()) / 60000);
    if (mins < 2) return "just now";
    if (mins < 60) return mins + " minutes ago";
    const hours = Math.round(mins / 60);
    if (hours < 24) return hours === 1 ? "an hour ago" : hours + " hours ago";
    const days = Math.round(hours / 24);
    if (days < 7) return days === 1 ? "yesterday" : days + " days ago";
    const weeks = Math.round(days / 7);
    if (days < 60) return weeks === 1 ? "last week" : weeks + " weeks ago";
    const months = Math.round(days / 30);
    if (days < 365) return months === 1 ? "last month" : months + " months ago";
    const years = Math.round(days / 365);
    return years === 1 ? "last year" : years + " years ago";
  }

  // Which artifacts have a picture of their own. Those fill the card and take a band
  // across the foot for the title; everything else is set as type inside the square.
  function facePicture(a) {
    const drop = ' onerror="this.remove()"';
    if (a.kind === "image")
      return (
        '<img src="/artifacts/' +
        a.id +
        '/blob" alt="" loading="lazy"' +
        drop +
        ">"
      );
    if (a.kind === "pdf")
      return (
        '<img src="/artifacts/' +
        a.id +
        '/page/0?width=520" alt="" loading="lazy"' +
        drop +
        ">"
      );
    if (a.kind === "link" && a.has_preview_image)
      return (
        '<img src="/artifacts/' +
        a.id +
        '/preview-image" alt="" loading="lazy"' +
        drop +
        ">"
      );
    return null;
  }

  // The dot is a graphic and answers to 3:1; the word beside it carries the meaning and
  // answers to 4.5:1 in ink. Neither travels without the other, so no piece of
  // information on the wall is carried by colour alone.
  const kindRow =
    '<span class="kindrow"><span class="kindmark"></span>' +
    '<span class="kindword">';

  function card(a, i) {
    const bits = [since(a.created_at)];
    if (a.local_only) bits.push("local only");
    if (a.status === "text_only" && a.kind === "note")
      bits.push("holds a credential");

    // "pending" is the engine's word for an artifact nothing has read yet, which is
    // the one thing the wall marks in the accent.
    const unread = a.status === "pending";
    const picture = facePicture(a);
    const flag = a.pinned
      ? '<span class="flag" aria-hidden="true">' + svg("star") + "</span>"
      : "";

    const inside = picture
      ? picture +
        flag +
        '<div class="cardband">' +
        kindRow +
        esc(a.kind) +
        "</span></span>" +
        '<div class="title">' +
        esc(a.title || "Untitled") +
        "</div></div>"
      : '<div class="cardfoot" style="margin-top:0">' +
        kindRow +
        esc(a.kind) +
        "</span></span>" +
        flag +
        "</div>" +
        '<div class="title">' +
        esc(a.title || "Untitled") +
        "</div>" +
        '<div class="preview">' +
        esc(a.excerpt || (a.kind === "link" ? host(a.source_url) : "")) +
        "</div>" +
        '<div class="cardfoot"><span class="meta">' +
        bits.map(esc).join(" ") +
        "</span>" +
        (unread ? '<span class="unread"></span>' : "") +
        "</div>";

    return (
      '<div class="card' +
      (picture ? " pictorial" : "") +
      (i < 18 ? " hang" : "") +
      '" data-kind="' +
      esc(a.kind) +
      '" data-id="' +
      esc(a.id) +
      '" ' +
      'tabindex="0" role="button"' +
      ' aria-label="' +
      esc(
        (a.title || "Untitled") +
          ", " +
          a.kind +
          ", " +
          bits.join(", ") +
          (unread ? ", not read yet" : "") +
          (a.pinned ? ", kept" : ""),
      ) +
      '"' +
      (i < 18 ? ' style="animation-delay:' + i * 22 + 'ms"' : "") +
      " onclick=\"openArtifact('" +
      a.id +
      "')\"" +
      " onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();openArtifact('" +
      a.id +
      "')}\">" +
      inside +
      "</div>"
    );
  }

  // Ingestion time by default. The promise is that things sit in the order you found
  // them, and sorting by last touched means fixing a typo silently moves a note to the
  // front of your own museum.
  const MONTHS = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December",
  ];

  // "Three weeks ago" is a thing people remember. A date is not. Grouping by how long
  // ago turns the wall into something you can navigate by memory, which is the only
  // index this product is willing to ask you to maintain.
  function bucket(iso) {
    const then = new Date(iso);
    if (isNaN(then)) return "Undated";
    const now = new Date();
    const midnight = (d) =>
      new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const days = Math.round((midnight(now) - midnight(then)) / 86400000);

    if (days <= 0) return "Today";
    if (days === 1) return "Yesterday";
    if (days < 7) return "Earlier this week";
    if (days < 14) return "Last week";
    if (
      then.getFullYear() === now.getFullYear() &&
      then.getMonth() === now.getMonth()
    )
      return "Earlier this month";
    if (days < 365) return MONTHS[then.getMonth()];
    return String(then.getFullYear());
  }

  // What the wall was showing last time it drew. Compared on focus so a refresh only
  // happens when something actually changed, rather than reflowing the grid and
  // throwing away your scroll position every time you tab back.
  let wallStamp = null;

  // A capture made in the overlay lands in a different window, and this one has no
  // way to hear about it. Without this the museum sits stale until you navigate, so
  // saving something correctly looked like saving nothing.
  async function refreshIfStale() {
    if (place !== "wall" || document.hidden || !view) return;
    const peek = await api("/artifacts?limit=1&order=ingested").catch(
      () => null,
    );
    if (!peek) return;
    const stamp = peek.total + ":" + ((peek.items[0] || {}).id || "");
    if (stamp !== wallStamp) home({ keepScroll: true });
  }

  window.addEventListener("focus", refreshIfStale);
  document.addEventListener("visibilitychange", refreshIfStale);

  // One order, always: what you touched last. The bar of alternatives was three
  // controls for a decision nobody makes twice, sitting above the thing they were
  // meant to help you read.
  const PAGE = 48;
  let wall = null;

  async function home(opts) {
    const wasReading = chat;
    const keepAt = opts && opts.keepScroll ? window.scrollY : null;
    teardown();
    scope = { kind: "everything", label: "everything" };
    view.removeAttribute("data-kind");
    restorePill("wall");
    view.innerHTML = '<div class="state">opening...</div>';

    const [kept, first, exs, chats] = await Promise.all([
      api("/artifacts?pinned=true&order=touched&limit=200"),
      api("/artifacts?pinned=false&order=touched&limit=" + PAGE),
      api("/exhibits"),
      api("/chats?limit=40"),
    ]);

    if (!kept.total && !first.total) {
      // No illustration and no button. The capture pill is already on screen and it
      // is the call to action; a second one here would be the same instruction twice.
      view.innerHTML =
        '<div class="empty"><div class="display">Nothing here yet</div>' +
        '<div class="state">Anything you drop on the pill below is kept exactly as it ' +
        "arrived and read on this machine, in the order you found it. No folder, no tag, " +
        "no reason required. Nothing here expires.</div></div>";
      return;
    }

    let html = "";
    if (exs.items.length) {
      html +=
        '<div class="shelf">Collections</div>' +
        exs.items
          .map(
            (e) =>
              '<div class="item" tabindex="0" role="button" onclick="showExhibit(\'' +
              e.id +
              "')\"" +
              " onkeydown=\"rowKey(event, () => showExhibit('" +
              e.id +
              "'))\">" +
              '<div class="item-body"><div class="title">' +
              esc(e.name) +
              '</div><div class="excerpt">' +
              esc(e.through_line || "") +
              "</div></div></div>",
          )
          .join("");
    }

    // Kept and fresh share the same grid so every card is the same size.
    if (kept.total) {
      html +=
        '<div class="shelf">saved</div>' +
        '<div class="wall" style="margin-bottom:var(--sp-5)">' +
        kept.items.map(card).join("") +
        "</div>";
    }

    // Chat cards use the same visual as artifact cards but open the chat view.
    const chatItems = (chats && chats.items) || [];
    const chatCard = (c) =>
      '<div class="card" tabindex="0" role="button" onclick="showChat(\'' +
      c.id +
      "')\">" +
      '<div class="item-body"><div class="title">' +
      esc(c.title) +
      '</div><div class="excerpt">conversation</div></div></div>';

    html +=
      '<div class="shelf">Everything else</div><div class="wall" id="wall">' +
      chatItems.map(chatCard).join("") +
      first.items.map(card).join("") +
      '</div><div id="wallEnd" class="aside"></div>';

    wall = { offset: first.items.length, more: first.more, loading: false };
    wallStamp = first.total + ":" + ((first.items[0] || {}).id || "");

    view.innerHTML = html;
    watchWallEnd();
    if (keepAt !== null) window.scrollTo(0, keepAt);
    else if (wasReading) window.scrollTo(0, 0);
  }

  // Loads the next page when the foot of the wall comes near, so the collection is
  // not silently truncated at whatever number the first request asked for.
  let wallWatch = null;

  function watchWallEnd() {
    if (wallWatch) wallWatch.disconnect();
    const foot = document.getElementById("wallEnd");
    if (!foot) return;

    wallWatch = new IntersectionObserver(
      (entries) => {
        if (entries.some((e) => e.isIntersecting)) loadMore();
      },
      { rootMargin: "600px 0px" },
    );
    wallWatch.observe(foot);
  }

  async function loadMore() {
    if (!wall || wall.loading || !wall.more) return;
    wall.loading = true;

    const foot = document.getElementById("wallEnd");
    if (foot) foot.textContent = "loading more...";

    const next = await api(
      "/artifacts?pinned=false&order=touched&limit=" +
        PAGE +
        "&offset=" +
        wall.offset,
    ).catch(() => null);

    if (!next) {
      wall.loading = false;
      if (foot) foot.textContent = "could not load more";
      return;
    }

    const grid = document.getElementById("wall");
    if (grid)
      grid.insertAdjacentHTML("beforeend", next.items.map(card).join(""));

    wall.offset += next.items.length;
    wall.more = next.more;
    wall.loading = false;
    if (foot) foot.textContent = wall.more ? "" : "";
    if (!wall.more && wallWatch) wallWatch.disconnect();
  }

  let ctx = null;
  // A pending re-look at a link's preview. Held at module scope so leaving the screen
  // can cancel it rather than hoping a stale guard happens to be false.
  let faceWatch = null;
  let faceTries = 0;
  const FACE_LIMIT = 8;

  async function showArtifact(id, focus) {
    const arriving = !ctx || ctx.id !== id;
    teardown();
    if (arriving) faceTries = 0;
    const d = await api("/artifacts/" + id);
    const a = d.artifact;
    scope = { kind: "artifact", id, label: "this artifact" };
    restorePill("inside");

    view.setAttribute("data-kind", a.kind);

    const bits = [since(a.updated_at)];
    if (a.local_only) bits.push("local only");
    if (d.file && d.file.bytes) bits.push(bytes(d.file.bytes));
    if (a.source_url) bits.push(host(a.source_url));

    // No primary action anywhere on this page. Nothing you can do to a thing you have
    // already kept is urgent, and a yellow pill here would say otherwise.
    let html =
      '<button class="btn ghost back" onclick="home()">' +
      svg("back") +
      "Everything</button>" +
      '<div class="kindrow"><span class="kindmark"></span>' +
      '<span class="kindword">' +
      esc(a.kind) +
      "</span></div>" +
      '<div class="titlerow"><div class="h1" style="view-transition-name:artifact-title">' +
      esc(a.title || "Untitled") +
      "</div></div>" +
      '<div class="meta">' +
      bits.filter(Boolean).map(esc).join('<span class="sep">&bull;</span>') +
      "</div>" +
      '<div class="actions">' +
      (a.source_url
        ? '<a class="btn secondary" href="' +
          esc(a.source_url) +
          '" target="_blank" rel="noopener">Open original</a>'
        : "") +
      (["pdf", "image", "file"].includes(a.kind)
        ? '<a class="btn tertiary" href="/artifacts/' +
          a.id +
          '/blob" download>Download a copy</a>'
        : "") +
      '<button class="btn tertiary pin' +
      (a.pinned ? " lit" : "") +
      '" aria-pressed="' +
      !!a.pinned +
      '" onclick="pinArtifact(\'' +
      a.id +
      "'," +
      !a.pinned +
      ')">' +
      svg("star") +
      (a.pinned ? "Kept" : "Keep at the front") +
      "</button>" +
      '<button class="btn ghost harm" onclick="binArtifact(\'' +
      a.id +
      "')\">Move to trash</button></div>";

    if (a.source_url)
      html +=
        '<a class="url" href="' +
        esc(a.source_url) +
        '" target="_blank" rel="noopener">' +
        esc(a.source_url) +
        "</a>";

    if (d.secrets.length)
      html +=
        '<div class="callout warn"><p>This holds what looks like a credential, so it ' +
        "stays out of every model call.</p><p>" +
        d.secrets.map((s) => esc(s.excerpt)).join("<br>") +
        "</p></div>";

    if (a.kind === "note") {
      // The body is yours. Edited in place, with every version kept.
      const n = d.versions.length;
      // Long-form sits on the warm reading white rather than the raised white, so a
      // whole page of it does not glare against the cream.
      html +=
        '<div class="docpane">' +
        '<div class="editor md" id="body" contenteditable="true" spellcheck="true" ' +
        'role="textbox" aria-multiline="true" aria-label="The note itself" ' +
        'data-placeholder="Start writing. Markdown shorthand becomes formatting as you type."></div>' +
        '<div class="bar"><span id="state" class="meta"></span>' +
        '<span class="meta" style="margin-left:auto" id="vers" data-n="' +
        n +
        '">' +
        (n > 1 ? n + " drafts kept" : "") +
        "</span></div></div>";
      ctx = {
        id,
        kind: "note",
        title: a.title,
        saved: a.body || "",
        html: md(a.body || ""),
      };
    } else {
      if (a.kind === "pdf") {
        html += reader(a, d.pages);
      } else if (a.kind === "file") {
        html +=
          fileFacts(d.file) + '<div class="md" id="plain">reading...</div>';
      } else if (a.kind === "image") {
        html +=
          '<div class="docpane"><img class="page" src="/artifacts/' +
          a.id +
          '/blob" alt="' +
          esc(a.title) +
          '"></div>';
      } else if (a.kind === "link") {
        html += linkFace(a, d.preview);
      }
      const current = d.annotations.filter((x) => x.current);
      const last = current.length ? current[current.length - 1] : null;
      html +=
        '<div class="shelf">Your note on this</div>' +
        '<div class="docpane">' +
        '<div class="editor md" id="body" contenteditable="true" spellcheck="true" ' +
        'role="textbox" aria-multiline="true" aria-label="Your note on this" ' +
        'style="min-height:150px" data-placeholder="What you thought."></div>' +
        '<div class="bar"><span id="state" class="meta"></span></div></div>';
      ctx = {
        id,
        kind: a.kind,
        entryId: last ? last.id : null,
        saved: last ? last.text : "",
        html: md(last ? last.text : ""),
      };
    }

    // How the app keeps its central promise visible: what the model made of this, and
    // the fact that it made it here. Never behind a disclosure.
    if (d.facet_skip_reason)
      html +=
        '<div class="callout note"><div class="shelf">Read locally</div>' +
        "<p>" +
        esc(whyNoFacets(d.facet_skip_reason)) +
        "</p></div>";
    else if (d.facets.length)
      html +=
        '<div class="callout note"><div class="shelf">Read locally</div>' +
        d.facets.map((f) => "<p>" + esc(f.statement) + "</p>").join("") +
        "</div>";

    view.innerHTML = html;
    mountEditor(focus);
    if (a.kind === "pdf") mountReader(a.id, d.pages);
    if (a.kind === "file") mountPlain(a.id);
    window.scrollTo(0, 0);
  }

  // The gate prints its own enum value otherwise: "No facets: too_short" tells the
  // reader nothing and names an internal state they have no way to know about. Facets
  // are the machine's index of what a thing could be an example of; not having them
  // costs you nothing except being pulled into a room you did not search for by name.
  const NO_FACETS = {
    too_short:
      "Too short for the curator to draw anything general out of. Still searchable.",
    text_only:
      "Held out of every model call, because it looks like it contains a credential. " +
      "Still searchable.",
    kind: "Nothing here for the curator to read yet. Still searchable.",
  };

  function whyNoFacets(reason) {
    return (
      NO_FACETS[reason] ||
      "The curator has not read this yet. Still searchable."
    );
  }

  // ---- a link's face -------------------------------------------------------
  // A saved link has nothing but its address until someone decides it is worth one
  // request. So the page shows what is actually known, and the button that would find
  // out more says what it costs, right where it is.
  function linkFace(a, p) {
    const host = (() => {
      try {
        return new URL(a.source_url).hostname.replace(/^www\./, "");
      } catch (e) {
        return "the publisher";
      }
    })();

    if (p && p.status === "ok") {
      const shot = p.image_hash
        ? '<img class="shot" style="view-transition-name:artifact-face" src="/artifacts/' +
          a.id +
          '/preview-image" alt="" ' +
          'onerror="this.remove()">'
        : "";
      return (
        shot +
        (p.description
          ? '<div class="lede">' + esc(p.description) + "</div>"
          : "")
      );
    }

    // No row yet means the queue has not reached it. Saving already asked for a
    // preview, so a button here would be a second way to start something that is
    // already happening. It says so, and looks again shortly.
    //
    // The wait has to be bounded and the timer has to be cancellable. Neither was true
    // before: the poll rescheduled itself off a `ctx` that nothing ever cleared, so a
    // link whose preview never arrives (auto-fetch off, or a publisher that never
    // answers) kept firing `showArtifact` forever, which yanked the reader back out of
    // whatever they had navigated to. Going Home did not stop it, because Home did not
    // clear `ctx`. Two bugs stacked into one: an unbounded loop, and a loop that
    // outlived its own screen.
    if (!p) {
      if (faceTries < FACE_LIMIT) {
        faceTries += 1;
        clearTimeout(faceWatch);
        faceWatch = setTimeout(() => {
          if (ctx && ctx.id === a.id) showArtifact(a.id);
        }, 1500);
        return (
          '<div class="aside thinking">asking ' +
          esc(host) +
          " what this is...</div>"
        );
      }
      // Past the limit, saying "asking" would be a lie: nothing is in flight. Offer
      // the one request that is left to decide on.
      return (
        '<div class="aside caution">Nothing has come back from ' +
        esc(host) +
        ". Automatic previews may be off in settings.</div>" +
        '<button class="btn tertiary" id="btnPreview" onclick="fetchPreview(\'' +
        a.id +
        "')\">Ask " +
        esc(host) +
        "</button>"
      );
    }

    // Only a refusal gets a button, because only a refusal is a decision left to
    // make: the publisher said no, and another request is either worth it or not.
    return (
      '<div class="aside caution">' +
      esc(p.error || "that did not resolve") +
      "</div>" +
      '<button class="btn tertiary" id="btnPreview" onclick="fetchPreview(\'' +
      a.id +
      "')\">Try again</button>" +
      '<div class="aside">one more request to ' +
      esc(host) +
      "</div>"
    );
  }

  // Deleting is reversible and says so, because the whole promise of the product is
  // that nothing is lost. The window is the person's own setting, so the confirmation
  // quotes it rather than a number this code invented.
  async function binArtifact(id) {
    let days = 30;
    try {
      days = (await api("/trash")).retention_days;
    } catch (err) {}
    try {
      await api("/artifacts/" + id, { method: "DELETE" });
    } catch (err) {
      return toast("Not deleted. " + String(err.message || err), true);
    }
    home();
    toast(
      "Moved to the trash. Recoverable for " +
        days +
        " day" +
        (days === 1 ? "" : "s") +
        ".",
    );
  }

  async function pinArtifact(id, pinned) {
    try {
      await api("/artifacts/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pinned }),
      });
    } catch (err) {
      return toast(String(err.message || err), true);
    }
    showArtifact(id);
  }

  async function fetchPreview(id) {
    const button = document.getElementById("btnPreview");
    if (button) {
      button.disabled = true;
      button.textContent = "asking " + "...";
    }
    try {
      await api("/artifacts/" + id + "/preview", { method: "POST" });
    } catch (err) {
      if (button) {
        button.disabled = false;
        button.textContent = "Try again";
      }
      return toast(String(err.message || err), true);
    }
    faceTries = 0;
    showArtifact(id);
  }

  // What is known about a file the reader may not be able to show. An upload that
  // renders as a featureless square is indistinguishable from one that never arrived,
  // which is exactly how a successful capture got reported as a failure.
  function fileFacts(file) {
    if (!file)
      return '<div class="aside caution">The stored copy is missing.</div>';
    return (
      '<div class="aside">' +
      esc(file.name) +
      " &middot; " +
      esc(file.mime) +
      " &middot; " +
      bytes(file.bytes) +
      "</div>"
    );
  }

  // A captured text file had its contents nowhere: not on screen, not in the index,
  // not answerable. It rendered as an empty glyph with a filename.
  async function mountPlain(id) {
    const box = document.getElementById("plain");
    if (!box) return;
    try {
      const d = await api("/artifacts/" + id + "/text");
      const text = (d.pages || [])
        .map((p) => p.text)
        .join("\n")
        .trim();
      box.textContent = text || "";
      if (!text) {
        box.className = "state";
        box.innerHTML =
          "saved exactly as it arrived. Nothing in it reads as text, so there is " +
          "nothing to show and nothing to search - it is here, and it is intact.";
      }
    } catch (err) {
      box.className = "aside caution";
      box.textContent = String(err.message || err);
    }
  }

  // ---- finding a phrase inside one thing -----------------------------------
  // Only intercepted for PDFs. Their pages are rendered as images, so the browser has
  // no text to search and its own find is genuinely useless. A note is real text in the
  // DOM, where Cmd+F already works better than anything reimplemented here would, so it
  // is left alone.
  let findState = null;

  async function openFind() {
    // Notes are real text in the DOM, so the browser could search them - except this
    // window has no Edit menu, and without one the webview never binds its own find.
    // So the same field serves both, and only the drawing differs.
    if (!ctx || !["pdf", "note", "file"].includes(ctx.kind)) return false;

    if (!findState || findState.id !== ctx.id) {
      const d = await api("/artifacts/" + ctx.id + "/text").catch(() => null);
      findState = { id: ctx.id, kind: ctx.kind, pages: (d && d.pages) || [] };
    }

    pill.classList.add("wide");
    pill.innerHTML =
      '<input id="findField" placeholder="find in this ' +
      (ctx.kind === "pdf" ? "document" : "note") +
      '" autocomplete="off">' +
      '<span class="scope" id="findCount"></span>' +
      '<button class="round" aria-label="Close" onclick="restorePill()">' +
      svg("close") +
      "</button>";

    const field = document.getElementById("findField");
    field.focus();
    field.oninput = () => runFind(field.value);
    field.onkeydown = (e) => {
      if (e.key === "Escape") {
        clearFind();
        return restorePill();
      }
      if (e.key === "Enter") {
        e.preventDefault();
        stepFind(e.shiftKey ? -1 : 1);
      }
    };
    return true;
  }

  async function runFind(term) {
    const count = document.getElementById("findCount");
    clearFind();
    term = term.trim();
    if (!term) {
      if (count) count.textContent = "";
      return;
    }

    if (findState.kind === "pdf") {
      // The engine knows where the words are; the browser is looking at a picture.
      // Counting matches in the extracted text here and drawing boxes from a separate
      // source would let the two disagree, so both come from the one call.
      const found = await api(
        "/artifacts/" + findState.id + "/find?q=" + encodeURIComponent(term),
      ).catch(() => ({ hits: [] }));
      findState.hits = found.hits || [];
      paintPdfHits();
    } else {
      findState.hits = markInNote(term);
    }

    findState.at = findState.hits.length ? 0 : -1;
    if (count)
      count.textContent = findState.hits.length
        ? "1 of " + findState.hits.length
        : "nothing";
    if (findState.hits.length) goToHit(0);
  }

  // Boxes over the rendered page, positioned as percentages of it, so they stay put
  // at any window width and any pixel density.
  function paintPdfHits() {
    for (const hit of findState.hits) {
      const leaf = document.querySelector(
        '.leaf[data-page="' + hit.page + '"]',
      );
      if (!leaf) continue;
      const mark = document.createElement("span");
      mark.className = "findbox";
      mark.style.left = hit.x * 100 + "%";
      mark.style.top = hit.y * 100 + "%";
      mark.style.width = hit.w * 100 + "%";
      mark.style.height = hit.h * 100 + "%";
      leaf.appendChild(mark);
      hit.node = mark;
    }
  }

  // A note is live text the person can edit, so the matches are wrapped in CSS
  // highlights rather than in elements. Inserting <mark> tags would change the DOM
  // the editor serialises back to markdown, and the next save would write them into
  // the note.
  function markInNote(term) {
    const root =
      document.getElementById("body") || document.getElementById("plain");
    if (!root || !window.CSS || !CSS.highlights) return [];

    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const ranges = [];
    const needle = term.toLowerCase();
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      const hay = node.nodeValue.toLowerCase();
      let at = hay.indexOf(needle);
      while (at !== -1) {
        const range = new Range();
        range.setStart(node, at);
        range.setEnd(node, at + needle.length);
        ranges.push({ range });
        at = hay.indexOf(needle, at + needle.length);
      }
    }

    CSS.highlights.set(
      "enqueue-find",
      new Highlight(...ranges.map((r) => r.range)),
    );
    return ranges;
  }

  function stepFind(by) {
    const hits = (findState && findState.hits) || [];
    if (!hits.length) return;
    findState.at = (findState.at + by + hits.length) % hits.length;
    document.getElementById("findCount").textContent =
      findState.at + 1 + " of " + hits.length;
    goToHit(findState.at);
  }

  function goToHit(index) {
    const hit = findState.hits[index];
    if (!hit) return;

    document
      .querySelectorAll(".findbox.on")
      .forEach((m) => m.classList.remove("on"));

    if (findState.kind === "pdf") {
      if (hit.node) hit.node.classList.add("on");
      const target =
        hit.node ||
        document.querySelector('.leaf[data-page="' + hit.page + '"]');
      if (target)
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    // A Range has no scrollIntoView of its own, so its rectangle is measured and the
    // window moved to it.
    const box = hit.range.getBoundingClientRect();
    window.scrollTo({
      top: window.scrollY + box.top - window.innerHeight / 2,
      behavior: "smooth",
    });
    CSS.highlights.set("enqueue-find-current", new Highlight(hit.range));
  }

  function clearFind() {
    document.querySelectorAll(".findbox").forEach((m) => m.remove());
    if (window.CSS && CSS.highlights) {
      CSS.highlights.delete("enqueue-find");
      CSS.highlights.delete("enqueue-find-current");
    }
  }

  document.addEventListener("keydown", (e) => {
    if (
      (e.metaKey || e.ctrlKey) &&
      e.key === "f" &&
      ctx &&
      ctx.kind === "pdf"
    ) {
      e.preventDefault();
      openFind();
    }
  });

  // ---- the reader ----------------------------------------------------------
  // A PDF is read here, not handed to whatever the operating system would open it
  // with. Pages are rasterised by the engine, so they render in a webview that has no
  // PDF plugin, and they load as they are reached rather than all at once.
  function reader(a, pages) {
    if (!pages)
      return (
        '<div class="state">This file will not open as a document. It is stored ' +
        'exactly as it arrived: <a class="url" href="/artifacts/' +
        a.id +
        '/blob" download>keep a copy</a>.</div>'
      );

    let html = '<div class="reader" id="reader">';
    for (let i = 0; i < pages; i++)
      html +=
        '<div class="leaf"' +
        (i === 0 ? ' style="view-transition-name:artifact-face"' : "") +
        ' data-page="' +
        i +
        '" role="img" aria-label="page ' +
        (i + 1) +
        " of " +
        pages +
        '"></div>';
    return (
      html + "</div>" + '<div class="folio" id="folio">1 / ' + pages + "</div>"
    );
  }

  let readerWatch = null;

  function mountReader(id, pages) {
    if (readerWatch) {
      readerWatch.disconnect();
      readerWatch = null;
    }
    const root = document.getElementById("reader");
    if (!root || !pages) return;

    // Rasterise at the density the screen actually has: a 900px render on a Retina
    // display is a soft page, and soft type is the one thing a reader cannot forgive.
    //
    // Measured at mount, the width is sometimes 0, because the pane has not laid out
    // yet and a zero-width request renders nothing. So it is measured at the moment a
    // page is actually reached, by which point layout has certainly happened.
    const width = () =>
      Math.min(
        2400,
        Math.max(
          700,
          Math.round(root.clientWidth * (window.devicePixelRatio || 1)),
        ),
      );

    const load = (leaf) => {
      if (leaf.dataset.loaded) return;
      leaf.dataset.loaded = "1";
      const img = new Image();
      img.alt = "";
      img.onload = () => {
        // Prepended, not replaced. Pages load lazily, so a find can paint highlight
        // boxes onto a page before its picture arrives; `replaceChildren` then wiped
        // them and the search silently lost a third of its results.
        leaf.prepend(img);
        leaf.classList.add("loaded");
      };
      // A page that will not render is still a page. Removing it would silently
      // renumber the document underneath the reader.
      img.onerror = () => {
        leaf.dataset.loaded = "";
        leaf.classList.add("blank");
        leaf.textContent =
          "page " + (Number(leaf.dataset.page) + 1) + " would not render";
      };
      img.src =
        "/artifacts/" + id + "/page/" + leaf.dataset.page + "?width=" + width();
    };

    // Two observers, because the two jobs want opposite settings. Loading wants to fire
    // early, a screen or two ahead. The page counter wants to fire late and exactly:
    // sharing one observer is what made it read "2 / 9" while page one filled the screen.
    const ahead = new IntersectionObserver(
      (entries) =>
        entries.filter((e) => e.isIntersecting).forEach((e) => load(e.target)),
      { rootMargin: "1200px 0px" },
    );

    const folio = document.getElementById("folio");
    const shown = new Map();
    const here = new IntersectionObserver(
      (entries) => {
        for (const entry of entries)
          shown.set(Number(entry.target.dataset.page), entry.intersectionRatio);
        if (!folio) return;
        // The page you are reading is the one filling most of the screen. Ties go to the
        // earlier page, because that is the one you are still finishing.
        let best = null;
        for (const [page, ratio] of [...shown].sort((a, b) => a[0] - b[0]))
          if (ratio > 0 && (best === null || ratio > shown.get(best) + 0.01))
            best = page;
        if (best !== null) folio.textContent = best + 1 + " / " + pages;
      },
      { threshold: [0, 0.1, 0.25, 0.5, 0.75, 1] },
    );

    root.querySelectorAll(".leaf").forEach((leaf) => {
      ahead.observe(leaf);
      here.observe(leaf);
    });
    readerWatch = {
      disconnect: () => {
        ahead.disconnect();
        here.disconnect();
      },
    };
  }

  function mountEditor(focus) {
    const ed = document.getElementById("body");
    if (!ed || !ctx) return;
    ed.innerHTML = ctx.html || "";

    const lead = ed.firstElementChild;
    if (
      lead &&
      lead.tagName === "H1" &&
      ctx.title &&
      lead.textContent.trim() === ctx.title.trim()
    )
      ed.classList.add("titled");

    ed.addEventListener("input", () => applyInputRules(ed));
    ed.addEventListener("blur", saveBody);
    ed.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && "bi".includes(e.key)) {
        e.preventDefault();
        document.execCommand(e.key === "b" ? "bold" : "italic");
      }
      if ((e.metaKey || e.ctrlKey) && e.key === "s") {
        e.preventDefault();
        saveBody();
      }
    });
    // Paste as plain text. Pasting styled HTML from a browser would smuggle in tags the
    // serialiser cannot represent, and they would be silently lost on the next save.
    ed.addEventListener("paste", (e) => {
      e.preventDefault();
      document.execCommand(
        "insertText",
        false,
        (e.clipboardData || window.clipboardData).getData("text"),
      );
    });

    if (focus) ed.focus();
  }

  async function saveBody() {
    if (!ctx) return;
    const ed = document.getElementById("body"),
      state = document.getElementById("state");
    if (!ed || !state) return;
    const text = htmlToMd(ed);
    if (text === ctx.saved) return;

    try {
      if (ctx.kind === "note") {
        await api("/artifacts/" + ctx.id + "/body", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body: text }),
        });
        const v = document.getElementById("vers");
        if (v) {
          const n = Number(v.dataset.n || 0) + 1;
          v.dataset.n = n;
          // "3 versions" is a row count. What it means is that nothing you wrote is gone.
          v.textContent = n > 1 ? n + " drafts kept" : "";
        }
      } else {
        if (!text.trim()) return;
        const r = await api("/artifacts/" + ctx.id + "/annotations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, supersedes_id: ctx.entryId }),
        });
        ctx.entryId = r.id;
      }
    } catch (err) {
      state.className = "meta";
      state.textContent = String(err);
      return;
    }

    ctx.saved = text;
    state.className = "saved";
    state.textContent = ctx.kind === "note" ? "kept" : "noted";

    // The rule under the editor fills once in the artifact's own colour. It reads as
    // the page acknowledging the words rather than a toast arriving from elsewhere.
    const bar = state.closest(".bar");
    if (bar) {
      bar.classList.remove("landed");
      void bar.offsetWidth;
      bar.classList.add("landed");
    }
    setTimeout(() => {
      if (state.textContent === "saved") state.textContent = "";
    }, 2200);
  }

  // ---- chats ---------------------------------------------------------------
  // Asking is a conversation, not a single shot. The concepts a conversation turns out
  // to circle are kept beside it, and each one can still hang a room, which is the
  // only reason to store them rather than to name a chat by its first line.

  let chat = null;
  let rail = null;

  function teardown() {
    if (readerWatch) {
      readerWatch.disconnect();
      readerWatch = null;
    }
    // Leaving a screen has to take that screen's pending work with it. `ctx` is what
    // every deferred callback tests itself against, so a `ctx` that outlives its view
    // is a licence for the old screen to redraw itself over the new one.
    clearTimeout(faceWatch);
    faceWatch = null;
    ctx = null;
    chat = null;
  }

  async function startChat(text) {
    const asked = { kind: scope.kind, id: scope.id };
    view.innerHTML =
      '<div class="state thinking">reading what you saved...</div>';
    let made;
    try {
      made = await api("/chats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          scope_kind:
            asked.kind === "artifact" || asked.kind === "exhibit"
              ? asked.kind
              : "everything",
          scope_id: asked.id || null,
          text,
        }),
      });
    } catch (err) {
      return chatFailed(err, text);
    }
    showChat(made.chat.id, made);
  }

  async function chatFailed(err, text) {
    const why = await api("/chats/ready").catch(() => ({
      ready: true,
      reason: null,
    }));
    view.innerHTML =
      '<div class="back" onclick="home()">&larr; everything</div>' +
      '<div class="state">' +
      (why.ready
        ? 'The curator could not answer.<br><br><span class="strongtext">' +
          esc(String(err)) +
          "</span><br><br>Nothing was lost. Your question was " +
          esc(text) +
          "."
        : "There is nothing to answer from yet: " + esc(why.reason) + ".") +
      "</div>";
  }

  async function showChat(id, preloaded) {
    if (readerWatch) {
      readerWatch.disconnect();
      readerWatch = null;
    }
    const d = preloaded || (await api("/chats/" + id));
    chat = d;
    scope = { kind: "chat", id, label: "this conversation" };
    showRail(id);
    renderChat(d);
    composer();
  }

  function renderChat(d, pending) {
    // The scope is a constraint, not a subtitle. Rendered as metadata it read like a
    // caption, and a chat silently locked to one empty link answered "nothing you have
    // saved" to a question the museum could answer instantly. Say what it can see, and
    // put the way out next to it.
    const scoped = d.chat.scope_kind !== "everything";
    // Side and corner shape carry the speaker, so there are no name labels under the
    // bubbles. A label on every turn is a thing to read that says nothing.
    const chip = (kind, id, label, handler) =>
      '<button class="src" data-kind="' +
      esc(kind || "") +
      '" onclick="' +
      handler +
      "('" +
      esc(id) +
      "')\">" +
      (kind ? '<span class="kindmark"></span>' : "") +
      esc(label) +
      "</button>";

    let html =
      '<div class="transcript">' +
      '<button class="btn ghost back" onclick="home()">' +
      svg("back") +
      "Everything</button>" +
      '<div class="titlerow"><div class="h2">' +
      esc(d.chat.title) +
      "</div>" +
      '<button class="btn ghost harm" onclick="dropChat(\'' +
      d.chat.id +
      "')\">Delete</button></div>" +
      (scoped
        ? '<div class="from scopebar">' +
          '<span class="meta">reading only</span>' +
          (d.chat.scope_kind === "artifact"
            ? chip("", d.chat.scope_id, d.chat.scope_label, "showArtifact")
            : chip("", d.chat.scope_id, d.chat.scope_label, "showExhibit")) +
          "</div>"
        : '<div class="meta">reading everything</div>');

    for (const m of d.messages) {
      html +=
        '<div class="turn ' +
        (m.role === "user" ? "you" : "curator") +
        '">' +
        '<div class="said md">' +
        (m.role === "user" ? esc(m.text) : md(m.text));
      const echoes =
        d.chat.scope_kind === "artifact" &&
        m.cited &&
        m.cited.length === 1 &&
        m.cited[0].artifact_id === d.chat.scope_id;

      // The evidence lives inside the bubble it supports. Outside it, it was a
      // footnote under the most important thing on the page.
      if (m.cited && m.cited.length && !echoes)
        html +=
          '<div class="from">' +
          m.cited
            .map((c) => chip(c.kind, c.artifact_id, c.title, "showArtifact"))
            .join("") +
          "</div>";
      else if (m.role === "assistant" && !m.grounded)
        html +=
          '<div class="unsourced">Nothing you have saved carried this.</div>';
      html += "</div></div>";
    }

    if (pending)
      html +=
        '<div class="turn you"><div class="said">' +
        esc(pending) +
        '</div></div><div class="turn curator">' +
        '<div class="said streaming">Reading what you saved...</div></div>';

    view.innerHTML = html + "</div>";
    window.scrollTo(0, document.body.scrollHeight);
  }

  // The rail is present on every surface, not only inside a conversation. A thread you
  // have to be already reading in order to find is a thread you will not go back to.
  // Rail removed — conversations are accessed via the pill's eye icon.
  async function showRail(_activeId) {}
  function toggleRail() {}

  // A conversation is scaffolding around the collection, not part of it, so this
  // removes it outright rather than sending it to the trash: there is no original to
  // recover, and the artifacts it cited are untouched either way.
  async function dropChat(id) {
    const row = document.querySelector('.thread[onclick*="' + id + '"]');
    const name = row ? row.textContent.trim() : "this conversation";
    const yes = await ask(
      "Delete this conversation?",
      name + " will be removed. The artifacts it cited stay where they are.",
      "Delete",
    );
    if (!yes) return;

    try {
      await api("/chats/" + id, { method: "DELETE" });
    } catch (err) {
      return toast("Not deleted. " + String(err.message || err), true);
    }
    if (chat && chat.chat.id === id) {
      chat = null;
      home();
    } else {
      home();
    }
    toast("Conversation deleted.");
  }

    restorePill("wall");

    let html = '<div class="shelf">Conversations</div>';

    try {
      await api("/chats/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pinned }),
      });

    }

  // The composer is drawn before the rail has finished loading, so the toggle looks the
  // rail up when it is pressed rather than closing over a variable that may still be null.
  function toggleRail() {
    const found = document.querySelector(".rail");
    if (found) found.classList.toggle("open");
  }

  function composer() {
    closeMenu();
    pill.classList.add("wide");
    pill.innerHTML =
      '<button id="btnRail" aria-label="Conversations" onclick="toggleRail()">' +
      svg("rail") +
      "</button>" +
      '<input id="field" placeholder="ask about ' +
      esc(chat.chat.scope_label) +
      '" autocomplete="off">' +
      '<button aria-label="Leave" onclick="home()">' +
      svg("close") +
      "</button>";

    const field = document.getElementById("field");
    field.focus();
    field.onkeydown = (e) => {
      if (e.key === "Escape") return home();
      if (e.key !== "Enter") return;
      const v = field.value.trim();
      if (!v) return;
      field.value = "";
      sendInChat(v);
    };

  async function sendInChat(text) {
    const id = chat.chat.id;
    renderChat(chat, text);
    let d;
    try {
      d = await api("/chats/" + id + "/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
    } catch (err) {
      chat = await api("/chats/" + id);
      renderChat(chat);
      const note = document.createElement("div");
      note.className = "callout warn";
      note.textContent = String(err);
      view.appendChild(note);
      return;
    }
    chat = d;
    renderChat(d);
    showRail(id);
    composer();
  }

  // ---- the trash -----------------------------------------------------------
  // Everything else here is kept on purpose. This is the one surface where something
  // leaves, so it says what is going, when, and how to stop it.
  async function showTrash() {
    teardown();
    restorePill("inside");
    showRail(null);
    view.innerHTML = '<div class="state">...</div>';
    const d = await api("/trash");

    let html =
      '<div class="h2">Trash</div>' +
      '<div class="aside">Deleted things wait ' +
      d.retention_days +
      " day" +
      (d.retention_days === 1 ? "" : "s") +
      ", then go for good. Nothing else here ever expires on its own.</div>";

    if (!d.items.length) {
      html += '<div class="state">Nothing in the trash.</div>';
      view.innerHTML = html;
      return;
    }

    html +=
      '<div class="callout warn">Emptying the trash deletes these files from this ' +
      "machine. It cannot be undone.</div>";

    // A list, not the wall grid. A wall implies keeping, and this page is about not
    // keeping. The full-pill radius on "Empty trash" is the one departure from the
    // 20px control radius in the app, and the shape is what flags it as terminal.
    html +=
      '<div class="trash">' +
      '<div class="trashbar"><span class="meta">' +
      d.items.length +
      " waiting</span>" +
      '<button class="btn danger terminal" onclick="emptyTrash(' +
      d.items.length +
      ')">Empty trash</button></div>';
    html += d.items
      .map(
        (a) =>
          '<div class="item" data-kind="' +
          esc(a.kind) +
          '"><div class="item-body">' +
          '<span class="kindrow"><span class="kindmark"></span>' +
          '<span class="kindword">' +
          esc(a.kind) +
          "</span></span>" +
          '<div class="title">' +
          esc(a.title || "Untitled") +
          "</div></div>" +
          '<span class="meta">' +
          (a.days_left > 0
            ? a.days_left + " day" + (a.days_left === 1 ? "" : "s") + " left"
            : "goes at the next launch") +
          "</span>" +
          '<div class="rowacts">' +
          '<button class="btn ghost" onclick="restoreArtifact(&#39;' +
          a.id +
          '&#39;)">Restore</button>' +
          '<button class="btn ghost harm" onclick="purgeArtifact(&#39;' +
          a.id +
          '&#39;)">Delete now</button></div></div>',
      )
      .join("");
    html += "</div>";

    view.innerHTML = html;
    window.scrollTo(0, 0);
  }

  // Skips the waiting period for everything at once, so the confirmation counts the
  // things rather than saying "are you sure".
  async function emptyTrash(count) {
    const yes = await ask(
      "Empty the trash?",
      "This destroys " +
        count +
        " thing" +
        (count === 1 ? "" : "s") +
        " for good. It cannot be undone.",
      // The verb, repeated. Never "OK", never "Yes".
      "Empty trash",
    );
    if (!yes) return;

    try {
      await api("/trash", { method: "DELETE" });
    } catch (err) {
      return toast(String(err.message || err), true);
    }
    showTrash();
    toast("Trash emptied.");
  }

  async function restoreArtifact(id) {
    try {
      await api("/artifacts/" + id + "/restore", { method: "POST" });
    } catch (err) {
      return toast("Not restored. " + String(err.message || err), true);
    }
    showTrash();
    toast("Put back.");
  }

  // The only irreversible action in the product, so it is the only one that asks.
  async function purgeArtifact(id) {
    // The title is read from the row rather than passed through the handler: a title
    // is model- or file-derived text, and threading it through an inline onclick
    // string is how that kind of text ends up being parsed as code.
    const row = document.querySelector('[onclick*="' + id + '"]');
    const title =
      row?.closest(".item")?.querySelector(".title")?.textContent || "this";

    const yes = await ask(
      "Delete for good?",
      title + " will be destroyed. This cannot be undone.",
      "Delete",
    );
    if (!yes) return;
    try {
      await api("/trash/" + id, { method: "DELETE" });
    } catch (err) {
      return toast(String(err.message || err), true);
    }
    showTrash();
    toast("Gone.");
  }

  // ---- settings ------------------------------------------------------------
  // Not a destination. This is where you go when something is wrong, so it says where
  // every value came from: a field you edit that is silently overridden by an
  // environment variable is worse than no field.
  const SETTING_LABELS = {
    llm_model: "Model",
    llm_url: "Endpoint",
    model_retries: "Retries after a failed answer",
    user_agent: "User agent for link previews",
    hotkey: "Capture hotkey",
    llm_headers: "Extra headers",
    auto_preview: "Resolve links when you save them",
    trash_days: "Days a deleted thing waits before it goes",
  };

  // Two spellings of the same binding, kept apart on purpose.
  //
  // `Alt` is what the shortcut plugin registers; `Option` is what is printed on the
  // key. Showing the accelerator to a Mac user asks them to find a key their keyboard
  // does not have. Store one, display the other.
  const KEY_NAMES = [
    ["CommandOrControl", "⌘"],
    ["Command", "⌘"],
    ["Cmd", "⌘"],
    ["Control", "⌃"],
    ["Ctrl", "⌃"],
    ["Alt", "⌥"],
    ["Option", "⌥"],
    ["Shift", "⇧"],
  ];

  function keyLabel(accelerator) {
    return String(accelerator || "")
      .split("+")
      .map((part) => {
        const hit = KEY_NAMES.find(
          ([name]) => name.toLowerCase() === part.trim().toLowerCase(),
        );
        return hit ? hit[1] : part.trim().toUpperCase();
      })
      .join("");
  }

  function toAccelerator(label) {
    // Accepts what the field shows back (glyphs) and what someone might type instead.
    const parts = [];
    let rest = String(label || "");
    for (const [name, glyph] of [
      ["Control", "⌃"],
      ["Alt", "⌥"],
      ["Shift", "⇧"],
      ["CommandOrControl", "⌘"],
    ]) {
      if (rest.includes(glyph)) {
        parts.push(name);
        rest = rest.split(glyph).join("");
      }
    }
    for (const spoken of [
      "Option",
      "Command",
      "Cmd",
      "Ctrl",
      "Control",
      "Alt",
      "Shift",
    ]) {
      const re = new RegExp("\\b" + spoken + "\\b\\s*\\+?\\s*", "i");
      if (re.test(rest)) {
        rest = rest.replace(re, "");
        const name = /option|alt/i.test(spoken)
          ? "Alt"
          : /cmd|command/i.test(spoken)
            ? "CommandOrControl"
            : /ctrl|control/i.test(spoken)
              ? "Control"
              : "Shift";
        if (!parts.includes(name)) parts.push(name);
      }
    }
    const key = rest.replace(/[+\s]/g, "").toUpperCase();
    return key ? [...parts, key].join("+") : parts.join("+");
  }

  // Recorded, not typed. Nobody knows the accelerator spelling of the key they want,
  // and everybody can press it.
  let recording = null;

  function recordHotkey(button) {
    if (recording) return;
    const label = document.getElementById("hotkeyLabel");
    const previous = label.textContent;
    button.classList.add("listening");
    label.textContent = "press a combination";

    const stop = () => {
      window.removeEventListener("keydown", onKey, true);
      button.classList.remove("listening");
      recording = null;
    };

    const onKey = (e) => {
      e.preventDefault();
      e.stopPropagation();

      if (e.key === "Escape") {
        label.textContent = previous;
        return stop();
      }

      // A bare letter is not a system-wide shortcut, it is the letter T. Wait until at
      // least one modifier is held before accepting anything.
      const held = [];
      if (e.ctrlKey) held.push("Control");
      if (e.altKey) held.push("Alt");
      if (e.shiftKey) held.push("Shift");
      if (e.metaKey) held.push("CommandOrControl");
      if (["Control", "Alt", "Shift", "Meta"].includes(e.key)) return;
      if (!held.length) {
        label.textContent = "hold a modifier too";
        return;
      }

      const key = e.code.startsWith("Key")
        ? e.code.slice(3)
        : e.code.startsWith("Digit")
          ? e.code.slice(5)
          : e.key.length === 1
            ? e.key.toUpperCase()
            : e.key;
      const accelerator = [...held, key].join("+");
      label.textContent = keyLabel(accelerator);
      stop();
      saveSetting("hotkey", accelerator);
    };

    recording = onKey;
    window.addEventListener("keydown", onKey, true);
  }

  function bytes(n) {
    if (!n) return "0 B";
    const units = ["B", "KB", "MB", "GB"];
    const i = Math.min(
      units.length - 1,
      Math.floor(Math.log(n) / Math.log(1024)),
    );
    return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + units[i];
  }

  async function showSettings() {
    teardown();
    restorePill("inside");
    view.innerHTML = '<div class="state">...</div>';

    let html =
      '<div class="h1">Settings</div>' +
      '<div class="settings-nav-wrap">' +
      // AI
      '<button class="settings-nav-row" onclick="showSettingsAI()">' +
      '<svg class="row-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
