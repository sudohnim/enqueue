<meta charset="utf-8">
<!-- Without this a phone lays the page out at 980px and scales it to fit: measured
     0.383x at 375px wide, which renders 14px body text at 5.4 device pixels and makes
     the max-width:900px rules unreachable on any actual phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enqueue</title>
<style>
:root {
  --base:#E5E8EB; --s1:#EFF2F3; --s2:#FAFBFC;
  --ink:#181E23; --subtext:#565C61; --muted:#61666A;
  --border:#D0D4D7; --border-strong:#B7BDC1;
  --mount:#1C1D1A; --gold:#C9A961; --vellum:#EDE9E0;
  /* Gold is a light on a dark object. On pale stone it is mustard at 1.83:1, and it
     was carrying every focus ring, every selected state, every link and the primary
     nav item. So text and state get their own darker gold in light mode; the leaf
     stays for fills, rules, and anything sitting on --mount. */
  --gold-ink:#7A5F1F;
  --shadow:0 6px 28px rgba(24,30,35,.14), 0 1px 3px rgba(24,30,35,.10);

  --sp-1:4px; --sp-2:8px; --sp-3:14px; --sp-4:20px; --sp-5:28px; --sp-6:40px;
  --sans:-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  --z-pill:40; --z-menu:50;
  --ease:cubic-bezier(0.25,1,0.5,1);
  --dur-fast:120ms; --dur:220ms; --dur-slow:420ms;
}
:root[data-theme="dark"] {
  --base:#0D1115; --s1:#171C1F; --s2:#23282C;
  --ink:#E4E8EB; --subtext:#A2A8AC; --muted:#949A9E;
  --border:#2D3136; --border-strong:#44494D;
  --shadow:0 6px 30px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4);
  /* On a dark ground the leaf already measures 8.42:1, so it is its own ink. */
  --gold-ink:#C9A961;
}
* { box-sizing:border-box; }
/* The sticky period heading is 45px tall and would otherwise cover the focus ring of
   anything reached by keyboard from below. */
html { scroll-padding-top:60px; }
body { margin:0; background:var(--base); color:var(--ink); font-family:var(--sans);
       font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }

/* No chrome. A persistent bar is a wall, and the walls are supposed to recede. */
main { max-width:820px; margin:0 auto; padding:var(--sp-6) var(--sp-4) 150px; }

.shelf { font-size:12px; font-weight:500; color:var(--muted); margin:var(--sp-6) 0 var(--sp-3); }
.shelf:first-child { margin-top:0; }

.item { display:flex; gap:var(--sp-3); padding:var(--sp-3) var(--sp-2);
        --focus-ring:0;
        margin:0 calc(-1 * var(--sp-2)); border-radius:8px; align-items:flex-start;
        transition:background var(--dur-fast) var(--ease); cursor:pointer; }
.item + .item { border-top:1px solid var(--border); }
.item:hover { background:var(--s2); }
.item:focus-visible { outline:2px solid var(--gold-ink); outline-offset:-2px; }
.item:hover .face { border-color:var(--gold-ink); }
.item-body { flex:1; min-width:0; }

.title { font-family:var(--serif); font-size:16px; line-height:1.35; }
.excerpt { font-family:var(--mono); font-size:11.5px; line-height:1.55; color:var(--muted);
           margin-top:var(--sp-1); display:-webkit-box; -webkit-line-clamp:3;
           -webkit-box-orient:vertical; overflow:hidden; }
.meta { font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:var(--sp-2); }

/* ---- the wall ----------------------------------------------------------
   Each artifact shows its own face at the same size, so the eye compares objects
   rather than reading a list. The faces are not one repeated template: a PDF shows
   its first page, an image shows itself, a note shows its own opening set as type,
   and a link shows its domain. What differs between kinds is the point. */
.wall { display:grid; grid-template-columns:repeat(auto-fill, minmax(196px, 1fr));
        gap:var(--sp-4) var(--sp-4); margin-top:var(--sp-3); }
.card { cursor:pointer; min-width:0; }
.frame { aspect-ratio:1; border:1px solid var(--border); border-radius:10px;
         overflow:hidden; background:var(--s2); position:relative;
         transition:border-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.card:hover .frame { border-color:var(--gold-ink); transform:translateY(-2px); }
.card:focus-visible { outline:none; }
.card:focus-visible .frame { outline:2px solid var(--gold-ink); outline-offset:2px; }
.frame img { width:100%; height:100%; object-fit:cover; object-position:top center;
             display:block; background:#fff; }
/* A note's face is the note. Set in the reading face, clipped where it runs out,
   so the wall is legible text rather than a grid of identical grey rectangles. */
/* Faded at the foot rather than guillotined mid-word: the text runs out of card, it
   does not stop having more to say. */
.frame .opening { font-family:var(--serif); font-size:12.5px; line-height:1.55;
                  color:var(--subtext); padding:var(--sp-3); height:100%;
                  overflow:hidden;
                  -webkit-mask-image:linear-gradient(180deg, #000 68%, transparent 98%);
                  mask-image:linear-gradient(180deg, #000 68%, transparent 98%); }
.frame .glyphface { height:100%; display:flex; flex-direction:column; gap:var(--sp-2);
                    align-items:center; justify-content:center; padding:var(--sp-3);
                    color:var(--gold-ink); font-size:22px; text-align:center; }
.frame .host { font-family:var(--mono); font-size:10.5px; color:var(--muted);
               word-break:break-all; }
.cap { margin-top:var(--sp-2); }
.cap .title { font-size:14px; overflow:hidden; display:-webkit-box;
              -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.cap .meta { margin-top:3px; }

/* Sticky, so you always know which stretch of time you are looking at once the wall
   is long enough to lose your place in. */
.when { position:sticky; top:0; z-index:1; font-family:var(--mono); font-size:11px;
        color:var(--muted); padding:var(--sp-4) 0 var(--sp-2);
        background:linear-gradient(var(--base) 68%, transparent); }
.when:first-of-type { padding-top:var(--sp-2); }

.sortbar { display:flex; gap:var(--sp-3); align-items:baseline; flex-wrap:wrap; }
.sort { background:transparent; border:0; padding:0; font-family:var(--mono);
        font-size:11px; color:var(--muted); cursor:pointer; }
.sort[aria-pressed="true"] { color:var(--gold-ink); }
.sort:hover { color:var(--ink); }

/* Only when there is something real to show. A note's excerpt is its face. */
.face { width:60px; height:76px; border-radius:3px; flex-shrink:0; overflow:hidden;
        background:var(--s2); border:1px solid var(--border);
        transition:border-color var(--dur) var(--ease); }
.face img { width:100%; height:100%; object-fit:cover; display:block; }
.face.glyph { display:flex; align-items:center; justify-content:center;
              font-size:20px; color:var(--gold-ink); }
/* Holds the column open without drawing anything in it, and without the 76px of
   height that would pad a short row out to the size of a page thumbnail. */
.face.gap { height:0; background:none; border-color:transparent; }
.item:hover .face.gap { border-color:transparent; }

/* ---- the pill ---------------------------------------------------------- */
.pill { position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
        display:flex; align-items:center; gap:var(--sp-1); z-index:var(--z-pill);
        background:var(--s2); border:1px solid var(--border); border-radius:9999px;
        box-shadow:var(--shadow); padding:var(--sp-1); }
.pill button { width:44px; height:44px; border:0; border-radius:9999px; background:transparent;
               color:var(--ink); cursor:pointer; display:grid; place-items:center;
               transition:background var(--dur-fast) var(--ease); }
.pill button:hover { background:var(--base); }
.pill button:focus-visible { outline:2px solid var(--gold-ink); outline-offset:-2px; }
.pill button[aria-expanded="true"] { background:var(--gold); color:var(--mount); }
.pill svg { width:19px; height:19px; fill:none; stroke:currentColor;
            stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

.pill.wide { border-radius:14px; padding:var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-3);
             width:min(560px, calc(100vw - 40px)); }
.pill input { flex:1; min-width:0; font:inherit; font-size:14px;
              background:transparent; border:0; color:var(--ink); padding:var(--sp-2) 0; }
.pill input:focus { outline:none; }
.pill input::placeholder { color:var(--muted); }
.scope { font-family:var(--mono); font-size:10.5px; color:var(--gold-ink); white-space:nowrap;
         padding-right:var(--sp-2); }

.menu { position:fixed; left:50%; bottom:88px; z-index:var(--z-menu);
        display:flex; flex-direction:column; gap:var(--sp-1);
        background:var(--s2); border:1px solid var(--border); border-radius:14px;
        box-shadow:var(--shadow); padding:var(--sp-2); min-width:212px; }
.menu button { display:flex; align-items:center; gap:var(--sp-3); width:100%;
               background:transparent; border:0; border-radius:10px; cursor:pointer;
               padding:var(--sp-2) var(--sp-3); font:inherit; color:var(--ink); text-align:left;
               transition:background var(--dur-fast) var(--ease); }
.menu button:hover, .menu button:focus-visible { background:var(--base); outline:none; }
.menu .ic { width:32px; height:32px; border-radius:9999px; background:var(--base);
            display:grid; place-items:center; flex-shrink:0; }
.menu svg { width:16px; height:16px; fill:none; stroke:currentColor;
            stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

@keyframes rise { from { opacity:0; transform:translate(-50%, 8px); }
                  to   { opacity:1; transform:translate(-50%, 0); } }
.menu { transform:translateX(-50%); animation:rise var(--dur) var(--ease) both; }
@keyframes hang { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.hang { animation:hang var(--dur-slow) var(--ease) both; }

/* `animation-iteration-count` has to be reset too, and leaving it out is worse than
   doing nothing at all. Measured: `breathe` kept `infinite` while its duration was
   crushed to 1ms, turning a slow pulse into roughly sixty opacity flashes a second
   for exactly the people who asked for less motion. Every loading state in the app
   uses that keyframe. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:1ms !important; animation-delay:0ms !important;
                           animation-iteration-count:1 !important;
                           transition-duration:1ms !important; }
  .thinking, .recorder.listening span { animation:none !important; opacity:1 !important; }
}

/* ---- detail ------------------------------------------------------------ */
.back { font-family:var(--mono); font-size:11px; color:var(--muted); cursor:pointer; }
.h1 { font-family:var(--serif); font-size:25px; line-height:1.2; margin-top:var(--sp-4); }
/* No back link above it, so it does not need to sit below one. */
.h1:first-child { margin-top:0; }
.titlerow { display:flex; align-items:flex-start; gap:var(--sp-3); }
.titlerow .h1 { flex:1; min-width:0; margin-top:0; }
.pin.big { opacity:1; padding:8px; margin-top:2px; }
.pin.big svg { width:17px; height:17px; }
.pin.big:not(.lit) { color:var(--border-strong); }
.pin.big:not(.lit):hover { color:var(--gold-ink); }
/* A pinned card is the only thing on the wall allowed to announce itself. */
.card .flag { position:absolute; top:8px; right:8px; color:var(--gold-ink);
              filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
.card .flag svg { width:14px; height:14px; display:block; fill:currentColor;
                  stroke:currentColor; stroke-width:1.4; stroke-linejoin:round; }
/* One pane. You type into the document itself, not into a source view beside it.
   Markdown remains the storage format; it is parsed on load and serialised on save. */
.editor { min-height:400px; max-width:70ch; margin-top:var(--sp-4); outline:none;
          caret-color:var(--gold-ink); }
.editor:empty::before { content:attr(data-placeholder); color:var(--muted); }
/* Invisible until clicked is not a state. The rule appears on hover to say the text
   is yours to change, and fills on focus so keyboard users can see where they are. */
.editor { border-left:2px solid transparent; padding-left:var(--sp-4);
          margin-left:calc(-1 * var(--sp-4) - 2px);
          transition:border-color var(--dur-fast) var(--ease); }
.editor:hover { border-left-color:var(--border); }
.editor:focus, .editor:focus-visible { outline:none; border-left-color:var(--gold-ink); }
.editor > *:first-child { margin-top:0; }
.editor.titled > h1:first-child { position:absolute; width:1px; height:1px;
                                  overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.bar { display:flex; gap:var(--sp-3); align-items:center; margin-top:var(--sp-5);
       padding-top:var(--sp-3); border-top:1px solid var(--border); max-width:70ch; }
.saved { color:var(--gold-ink); font-family:var(--mono); font-size:10.5px; }

.md, .editor { font-family:var(--serif); font-size:16px; line-height:1.75; }
.md h1,.md h2,.md h3,.editor h1,.editor h2,.editor h3 { font-weight:500; margin:var(--sp-4) 0 var(--sp-2); line-height:1.25; }
.md h1,.editor h1 { font-size:23px; } .md h2,.editor h2 { font-size:19px; } .md h3,.editor h3 { font-size:17px; }
.md p,.editor p { margin:var(--sp-2) 0; }
.md ul,.md ol,.editor ul,.editor ol { margin:var(--sp-2) 0; padding-left:var(--sp-4); }
.md li,.editor li { margin:3px 0; }
.md code,.editor code { font-family:var(--mono); font-size:0.86em; background:var(--s2);
           border:1px solid var(--border); border-radius:4px; padding:1px 5px; }
.md pre,.editor pre { background:var(--s2); border:1px solid var(--border); border-radius:8px;
          padding:var(--sp-3); overflow-x:auto; }
.md pre code { border:0; background:none; padding:0; }
.md blockquote,.editor blockquote { margin:var(--sp-2) 0; padding-left:var(--sp-3);
                 border-left:1px solid var(--gold-ink); color:var(--subtext); }
.md a,.editor a { color:var(--gold-ink); text-decoration:underline; text-underline-offset:2px; }
.md strong,.editor strong { font-weight:600; } .md em,.editor em { font-style:italic; }

.page { display:block; width:100%; border:1px solid var(--border); border-radius:6px;
        margin-top:var(--sp-3); background:#fff; }
.state { color:var(--muted); font-size:13px; padding:var(--sp-5) 0; max-width:58ch;
         line-height:1.75; }
.gold { color:var(--gold-ink); }
a { color:inherit; text-decoration:none; }

/* ---- a link, once it has said what it is ------------------------------- */
/* Block, and only as wide as its text: two of these stack instead of colliding, and
   the next element starts on its own line rather than beside a long address. */
.url { font-family:var(--mono); font-size:11.5px; color:var(--gold-ink); word-break:break-all;
       display:block; width:fit-content; max-width:100%; margin-top:var(--sp-2); }
.url:hover { text-decoration:underline; text-underline-offset:2px; }
.lede { font-family:var(--serif); font-size:16.5px; line-height:1.65; color:var(--subtext);
        max-width:64ch; margin-top:var(--sp-4); text-wrap:pretty; }

.act { display:inline-flex; align-items:center; gap:var(--sp-2); margin-top:var(--sp-4);
       font:inherit; font-size:13px; padding:var(--sp-2) var(--sp-4); cursor:pointer;
       background:var(--s2); color:var(--ink);
       border:1px solid var(--border-strong); border-radius:9999px;
       transition:border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
.act:hover { border-color:var(--gold-ink); background:var(--base); }
.act:focus-visible { outline:2px solid var(--gold-ink); outline-offset:2px; }
.act[disabled] { opacity:.55; cursor:default; border-color:var(--border); }
/* The cost of the button, stated where the button is, rather than as a standing
   paragraph about privacy that nobody reads twice. */
.aside { font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:var(--sp-2);
         max-width:52ch; line-height:1.6; }
/* Why it failed carries more than what it will cost, so it is not the same grey. */
.aside.why { color:var(--subtext); }

/* ---- the reader -------------------------------------------------------- */
.leaf { width:100%; aspect-ratio:1 / 1.414; background:var(--s2);
        border:1px solid var(--border); border-radius:6px; margin-top:var(--sp-3);
        overflow:hidden; }
.leaf.loaded { aspect-ratio:auto; background:#fff; }
.leaf img { width:100%; height:auto; display:block; }
.leaf.blank { aspect-ratio:auto; min-height:120px; display:grid; place-items:center;
              font-family:var(--mono); font-size:10.5px; color:var(--muted); }
/* The page a hit is on. The word cannot be highlighted, because the page is a picture
   of itself, so the page is marked instead and the reader does the last step. */
.leaf.hit { border-color:var(--gold-ink); box-shadow:0 0 0 2px var(--gold-ink); }
.folio { position:fixed; right:22px; bottom:32px; z-index:var(--z-pill);
         font-family:var(--mono); font-size:10.5px; color:var(--muted);
         background:var(--s2); border:1px solid var(--border); border-radius:9999px;
         padding:6px 12px; box-shadow:var(--shadow); pointer-events:none; }

/* ---- chats ------------------------------------------------------------- */
/* The one place with a persistent sidebar. Everywhere else the walls recede, but a
   conversation you cannot find again is a conversation you did not have. */
.rail { position:fixed; left:0; top:0; bottom:0; width:250px; z-index:var(--z-pill);
        background:var(--s1); border-right:1px solid var(--border); overflow-y:auto;
        padding:56px var(--sp-3) 132px;
        transition:transform var(--dur) var(--ease); }
.rail h2 { font-size:12px; font-weight:500; color:var(--muted);
           margin:0 0 var(--sp-3) var(--sp-2); }
/* The one place the eye should land first in the rail, so it is the only thing in
   here carrying the accent at full strength. */
.gohome { display:flex; align-items:center; gap:var(--sp-2); width:100%; text-align:left;
          background:transparent; border:0; border-radius:8px; cursor:pointer;
          padding:var(--sp-2) var(--sp-3); font:inherit; font-size:13px; font-weight:600;
          color:var(--gold-ink); margin-bottom:var(--sp-5);
          transition:background var(--dur-fast) var(--ease); }
.gohome:hover { background:var(--s2); }
.gohome:focus-visible { outline:2px solid var(--gold-ink); outline-offset:-2px; }
.gohome svg { width:15px; height:15px; flex-shrink:0; fill:none; stroke:currentColor;
              stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

.threadrow { display:flex; align-items:center; border-radius:8px;
             transition:background var(--dur-fast) var(--ease); }
.threadrow:hover, .threadrow.on { background:var(--s2); }
.thread { flex:1; min-width:0; text-align:left; background:transparent; border:0;
          padding:var(--sp-2) var(--sp-3); font:inherit; font-size:13px;
          line-height:1.4; color:var(--subtext); cursor:pointer; }
.threadrow:hover .thread, .threadrow.on .thread { color:var(--ink); }
.thread:focus-visible { outline:2px solid var(--gold-ink); outline-offset:-2px; border-radius:8px; }

/* Visible only on hover or when it is already doing something, so the rail stays a
   list of names rather than a list of controls. */
.pin { flex-shrink:0; background:transparent; border:0; cursor:pointer; padding:6px;
       margin-right:2px; color:var(--muted); opacity:0; border-radius:6px;
       transition:opacity var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.pin svg { width:13px; height:13px; display:block; fill:none; stroke:currentColor;
           stroke-width:1.6; stroke-linejoin:round; }
.threadrow:hover .pin, .pin:focus-visible { opacity:1; }
.pin:hover { color:var(--gold-ink); }
.pin.lit { opacity:1; color:var(--gold-ink); }
.pin.lit svg { fill:currentColor; }
.pin:focus-visible { outline:2px solid var(--gold-ink); outline-offset:-2px; }

/* Kept threads sit above the rest with a rule under them, so the break reads as an
   ordering and not as two unrelated lists. */
.kept { padding-bottom:var(--sp-3); margin-bottom:var(--sp-3);
        border-bottom:1px solid var(--border); }
.drawn { display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--sp-2);
         margin-top:var(--sp-4); max-width:70ch; }
.drawn .aside { margin:0; }
.drawn .topic { padding:3px 10px; border:1px solid var(--border); border-radius:9999px; }
.drawn .topic:hover { border-color:var(--gold-ink); text-decoration:none; }

.topics { padding:2px 0 var(--sp-3) var(--sp-3); }
.topic { display:block; background:transparent; border:0; padding:3px var(--sp-2);
         font-family:var(--mono); font-size:10.5px; line-height:1.6; color:var(--gold-ink);
         cursor:pointer; text-align:left; }
.topic:focus-visible { outline:2px solid var(--gold-ink); outline-offset:-2px; border-radius:4px; }
.topic:hover { text-decoration:underline; text-underline-offset:2px; }
body.railed { padding-left:250px; }
body.railed .pill { left:calc(50% + 125px); }

/* The gear sits at the foot of the rail, out of the way of the thing the rail is
   for. Configuration is not a destination; it is where you go when something is
   wrong, and it should look like it. */
.railfoot { position:absolute; left:0; right:0; bottom:0; padding:var(--sp-3);
            background:var(--s1); border-top:1px solid var(--border); }
.gear { display:flex; align-items:center; gap:var(--sp-2); width:100%;
        background:transparent; border:0; border-radius:8px; cursor:pointer;
        padding:var(--sp-2) var(--sp-3); font:inherit; font-size:12.5px;
        color:var(--muted); transition:background var(--dur-fast) var(--ease); }
.gear:hover { background:var(--s2); color:var(--ink); }
.gear:focus-visible { outline:2px solid var(--gold-ink); outline-offset:-2px; }
.gear svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7;
            stroke-linecap:round; stroke-linejoin:round; }
.newchat { display:flex; align-items:center; gap:var(--sp-2); width:100%;
           background:transparent; border:1px dashed var(--border-strong); border-radius:8px;
           cursor:pointer; padding:var(--sp-2) var(--sp-3); font:inherit; font-size:12.5px;
           color:var(--muted); margin-bottom:var(--sp-3); text-align:left;
           transition:border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.newchat:hover { border-color:var(--gold-ink); color:var(--ink); }
.newchat:focus-visible { outline:2px solid var(--gold-ink); outline-offset:-2px; }

                          stroke:currentColor; stroke-width:1.7;
                          stroke-linecap:round; stroke-linejoin:round; }

/* Sides carry the speaker, so the transcript is parseable before a word is read.
   Only your side is a bubble: a question is a short utterance and boxing it is

       border:1px solid var(--border); border-radius:9999px; padding:6px 12px; min-height:24px;

/* Above the pill, never over it, and it announces itself to a screen reader because a
   capture you cannot see confirmed is a capture you have to go and check. */
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:92px;
         z-index:var(--z-menu); max-width:min(560px, calc(100vw - 40px));
         background:var(--s2); color:var(--ink); border:1px solid var(--border-strong);

<main id="view"><div class="state">opening...</div></main>
<div class="pill" id="pill"></div>

<script>
const view = document.getElementById("view");
const pill = document.getElementById("pill");
const esc = s => (s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Follows the system, including when it changes under a window that is already open,
// which is the whole point of a machine that goes dark at sunset.
const darkness = matchMedia("(prefers-color-scheme: dark)");
const applyTheme = () =>
  document.documentElement.setAttribute("data-theme", darkness.matches ? "dark" : "light");
darkness.addEventListener("change", applyTheme);
applyTheme();

const api = async (p, o) => {
  const r = await fetch(p, o);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};

// Self-contained markdown. A CDN would make the museum reach the network to render
// something you wrote, which is the opposite of the promise. Escapes before parsing,
// so no input path can render raw HTML.
function md(src) {
  let t = esc(src);
  const held = [];
  t = t.replace(/```([\s\S]*?)```/g, (m, code) =>
    "␀" + (held.push("<pre><code>" + code.replace(/^\w*\n/, "") + "</code></pre>") - 1) + "␀");
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");

  const out = []; let list = null;
  const close = () => { if (list) { out.push("</" + list + ">"); list = null; } };
  for (const raw of t.split("\n")) {
    const line = raw.trimEnd();
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    const li = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    const bq = line.match(/^(?:&gt;|>)\s?(.*)$/);
    if (h) { close(); out.push("<h" + h[1].length + ">" + h[2] + "</h" + h[1].length + ">"); }
    else if (li) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + li[1] + "</li>"); }
    else if (ol) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + ol[1] + "</li>"); }
    else if (bq) { close(); out.push("<blockquote>" + bq[1] + "</blockquote>"); }
    else if (!line.trim()) close();
    else { close(); out.push("<p>" + line + "</p>"); }
  }
  close();
  return out.join("").replace(/␀(\d+)␀/g, (m, i) => held[+i]);
}

// Turn the edited document back into markdown. Only the tags md() can produce need
// handling, which is what keeps this tractable: the editor and the parser are two
// halves of one contract rather than a general HTML converter.
function htmlToMd(root) {
  const inline = node => {
    if (node.nodeType === 3) return node.nodeValue;
    if (node.nodeType !== 1) return "";
    const kids = [...node.childNodes].map(inline).join("");
    switch (node.tagName) {
      case "BR": return "\n";
      case "STRONG": case "B": return kids.trim() ? "**" + kids + "**" : "";
      case "EM": case "I": return kids.trim() ? "*" + kids + "*" : "";
      case "CODE": return "`" + kids + "`";
      case "A": return "[" + kids + "](" + (node.getAttribute("href") || "") + ")";
      default: return kids;
    }
  };

  const lines = [];
  for (const node of root.childNodes) {
    if (node.nodeType === 3) {
      const t = node.nodeValue.trim();
      if (t) lines.push(t, "");
      continue;
    }
    if (node.nodeType !== 1) continue;

    switch (node.tagName) {
      case "H1": lines.push("# " + inline(node).trim(), ""); break;
      case "H2": lines.push("## " + inline(node).trim(), ""); break;
      case "H3": lines.push("### " + inline(node).trim(), ""); break;
      case "UL":
        for (const li of node.children) lines.push("- " + inline(li).trim());
        lines.push("");
        break;
      case "OL": {
        let i = 1;
        for (const li of node.children) lines.push(i++ + ". " + inline(li).trim());
        lines.push("");
        break;
      }
      case "BLOCKQUOTE": lines.push("> " + inline(node).trim(), ""); break;
      case "PRE": lines.push("```", node.textContent.replace(/\n$/, ""), "```", ""); break;
      case "DIV": case "P": {
        const t = inline(node).replace(/\u00a0/g, " ").trimEnd();
        lines.push(t.trim() ? t : "", t.trim() ? "" : null);
        break;
      }
      default: {
        const t = inline(node).trim();
        if (t) lines.push(t, "");
      }
    }
  }
  return lines.filter(l => l !== null).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

// Structural markdown typed at the start of a line becomes the real thing, the way
// it does in any editor that renders as you write.
const RULES = [
  [/^(#{1,3})\s$/, m => "h" + m[1].length],
  [/^[-*+]\s$/, () => "ul"],
  [/^1\.\s$/, () => "ol"],
  [/^>\s$/, () => "blockquote"],
];

function applyInputRules(ed) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  let block = sel.anchorNode;
  while (block && block.parentNode !== ed) block = block.parentNode;
  if (!block || block.nodeType !== 1) return;
  if (["UL", "OL", "PRE", "BLOCKQUOTE"].includes(block.tagName)) return;

  const text = block.textContent;
  for (const [re, kind] of RULES) {
    const m = text.match(re);
    if (!m) continue;
    const tag = kind(m);
    document.execCommand(
      tag === "ul" ? "insertUnorderedList" : tag === "ol" ? "insertOrderedList" : "formatBlock",
      false,
      tag === "ul" || tag === "ol" ? null : tag,
    );
    // The marker characters were the instruction, not the content.
    const target = window.getSelection().anchorNode;
    const host = target && target.nodeType === 3 ? target : null;
    if (host) host.nodeValue = host.nodeValue.replace(re.source.replace(/[\^$]/g, "") === "" ? "" : /^(#{1,3}|[-*+]|1\.|>)\s/, "");
    return;
  }
}

// ---- the pill ------------------------------------------------------------
const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  find: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  // The eye, not a question mark. Asking here is not a support request; it is looking
  // at what you already own and seeing what is in it.
  ask:  '<path d="M2.2 12S5.8 5.6 12 5.6 21.8 12 21.8 12 18.2 18.4 12 18.4 2.2 12 2.2 12z"/><circle cx="12" cy="12" r="2.8"/>',
  back: '<path d="M14.5 6.5L9 12l5.5 5.5"/>',
  home: '<path d="M4 10.5L12 4l8 6.5"/><path d="M6 9.6V20h12V9.6"/>',
  star: '<path d="M12 4.2l2.3 4.9 5.2.7-3.8 3.7 1 5.3-4.7-2.6-4.7 2.6 1-5.3-3.8-3.7 5.2-.7z"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  note: '<path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/>',
  upload:'<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v3h16v-3"/>',
  link: '<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-7 7"/>',
  rail: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16"/>',
  gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7L5.6 5.6"/>',
};
const svg = k => '<svg viewBox="0 0 24 24">' + ICONS[k] + "</svg>";

let menu = null;
let scope = {kind: "everything", label: "everything"};

function closeMenu(restoreFocus) {
  if (menu) { menu.remove(); menu = null; }
  const b = document.getElementById("btnAdd");
  if (b) {
    b.setAttribute("aria-expanded", "false");
    // Focus goes back where it came from. Dropping it on BODY leaves a keyboard user
    // at the top of the document with no idea the menu ever opened.
    if (restoreFocus) b.focus();
  }
}

// The first slot changes with where you are. On the wall it captures, because that is
// the only thing you can do to a wall. Inside an object there is nowhere to put a new
// capture yet and the thing you actually want is out, so it becomes the way out.
// Search and ask never move: they mean the same thing on every surface.
let place = "wall";

function restorePill(where) {
  if (where) place = where;
  closeMenu();
  pill.classList.remove("wide");
  // Search leaves when you are inside something. Searching the whole collection from
  // inside one object is a different intention from the one you are holding there;
  // what you want is to find a phrase in front of you, and that is Cmd+F.
  const inside = place === "inside";

  // The rail toggle is emitted on every surface, not only inside a conversation.
  // Below 900px the rail is off-screen, and it holds the only route to Settings and
  // to every thread: drawing the opener in one place out of five left both stranded
  // on the wall, on an artifact, on search, and in Settings itself.
  pill.innerHTML =
    '<button id="btnRail" aria-label="Conversations and settings" onclick="toggleRail()">' +
    svg("rail") + "</button>" +
    (inside
      ? '<button aria-label="Back to everything" onclick="home()">' + svg("back") + "</button>"
      : '<button id="btnAdd" aria-label="Capture" aria-expanded="false" ' +
        'onclick="toggleMenu(event)">' + svg("plus") + "</button>") +
    (inside
      ? ""
      : '<button aria-label="Search" onclick="openField(\'search\')">' + svg("find") +
        "</button>") +
    '<button aria-label="Ask about this" onclick="openField(\'ask\')">' + svg("ask") + "</button>";
}

const MENU = [
  ["note", "Note", () => newNote()],
  ["upload", "Upload", () => pickFile("*/*")],
  ["link", "Link", () => openField("link")],
  ["image", "Image", () => pickFile("image/*")],
];

function toggleMenu(e) {
  if (e) e.stopPropagation();
  if (menu) return closeMenu();
  menu = document.createElement("div");
  menu.className = "menu";
  menu.setAttribute("role", "menu");
  menu.innerHTML = MENU.map(([k, label]) =>
    '<button role="menuitem"><span class="ic">' + svg(k) + "</span>" + label + "</button>").join("");
  document.body.appendChild(menu);
  menu.querySelectorAll("button").forEach((b, i) => {
    b.onclick = ev => { ev.stopPropagation(); closeMenu(); MENU[i][2](); };
  });
  document.getElementById("btnAdd").setAttribute("aria-expanded", "true");
  menu.querySelector("button").focus();

  // role="menu" promises arrow navigation. Without it the role is a lie to a screen
  // reader that has already announced a menu.
  menu.addEventListener("keydown", ev => {
    const items = [...menu.querySelectorAll("button")];
    const at = items.indexOf(document.activeElement);
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      const next = (at + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items[next].focus();
    }
    if (ev.key === "Home") { ev.preventDefault(); items[0].focus(); }
    if (ev.key === "End") { ev.preventDefault(); items[items.length - 1].focus(); }
  });
}

function openField(mode) {
  closeMenu();
  const hint = {search: "find something", ask: "ask about " + scope.label, link: "paste a url"}[mode];
  pill.classList.add("wide");
  pill.innerHTML =
    (mode === "ask" ? '<span class="scope">' + esc(scope.label) + "</span>" : "") +
    '<input id="field" placeholder="' + esc(hint) + '" autocomplete="off">' +
    '<button aria-label="Close" onclick="restorePill()">' + svg("close") + "</button>";

  const field = document.getElementById("field");
  field.focus();
  field.onkeydown = e => {
    if (e.key === "Escape") return restorePill();
    if (e.key !== "Enter") return;
    const v = field.value.trim();
    if (!v) return;
    restorePill();
    if (mode === "search") doSearch(v);
    else if (mode === "ask") startChat(v);
    else saveLink(v);
  };
}

// Capture is the one act the whole product rests on, and it used to fail in silence:
// a link that errored and an upload that 500ed both re-rendered the wall exactly like
// success. "Nothing is ever lost" cannot be true of a thing that can drop your capture
// without saying so, so both paths now report, and a failure keeps what you typed.
function toast(message, bad) {
  const old = document.getElementById("toast");
  if (old) old.remove();
  const node = document.createElement("div");
  node.id = "toast";
  node.className = "toast" + (bad ? " bad" : "");
  node.setAttribute("role", "status");
  node.textContent = message;
  document.body.appendChild(node);
  setTimeout(() => node.remove(), bad ? 8000 : 2600);
}

function pickFile(accept) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = accept; input.multiple = true;
  input.onchange = async () => {
    const failed = [];
    let saved = 0;
    for (const file of input.files) {
      const fd = new FormData();
      fd.append("file", file);
      try {
        const r = await fetch("/capture/upload", {method: "POST", body: fd});
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
        saved++;
      } catch (err) {
        failed.push(file.name + ": " + String(err.message || err));
      }
    }
    home();
    if (failed.length) toast("Not saved. " + failed.join("; "), true);
    else if (saved) toast(saved === 1 ? "Saved." : saved + " saved.");
  };
  input.click();
}

async function saveLink(url) {
  try {
    await api("/capture/link", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url})});
  } catch (err) {
    // The pill stays open with the address still in it: a failed capture must not
    // also cost you the thing you were capturing.
    openField("link");
    const field = document.getElementById("field");
    if (field) field.value = url;
    toast("Not saved. " + String(err.message || err), true);
    return;
  }
  home();
  toast("Saved.");
}

async function newNote() {
  const d = await api("/notes", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({body: ""})});
  showArtifact(d.artifact.id, true);
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    const wasOpen = !!menu;
    closeMenu(true);
    if (!wasOpen && pill.classList.contains("wide")) restorePill();
  }
});
document.addEventListener("click", e => {
  if (menu && !menu.contains(e.target) && !pill.contains(e.target)) closeMenu();
});

// ---- surfaces ------------------------------------------------------------
// Enter and Space activate a row, the way they would if it were a real button.
function rowKey(event, run) {
  if (event.key === "Enter" || event.key === " ") { event.preventDefault(); run(); }
}

function host(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url || ""; }
}

// The square. Each kind shows the truest thing it has, which is why this is a switch
// and not one template with a swapped icon.
function frame(a) {
  const drop = ' onerror="this.parentNode.innerHTML=\'&#9633;\'"';
  if (a.kind === "image")
    return '<img src="/artifacts/' + a.id + '/blob" alt="" loading="lazy"' + drop + ">";
  if (a.kind === "pdf")
    return '<img src="/artifacts/' + a.id + '/page/0?width=520" alt="" loading="lazy"' + drop + ">";
  if (a.kind === "link")
    return '<div class="glyphface">&#8599;<span class="host">' + esc(host(a.source_url)) +
      "</span></div>";
  if (a.kind === "file") return '<div class="glyphface">&#9633;</div>';
  return a.excerpt
    ? '<div class="opening">' + esc(a.excerpt) + "</div>"
    : '<div class="glyphface" style="font-size:13px;color:var(--muted)">empty</div>';
}

function card(a, i) {
  const bits = [];
  if (a.kind !== "note") bits.push(a.kind);
  bits.push((a.created_at || "").slice(0, 10));
  if (a.local_only) bits.push("local only");
  if (a.status === "text_only" && a.kind === "note") bits.push("holds a credential");

  return '<div class="card' + (i < 18 ? " hang" : "") + '" tabindex="0" role="button"' +
    ' aria-label="' + esc((a.title || "Untitled") + ", " + bits.join(", ")) + '"' +
    (i < 18 ? ' style="animation-delay:' + i * 22 + 'ms"' : "") +
    " onclick=\"showArtifact('" + a.id + "')\"" +
    " onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();showArtifact('" +
    a.id + "')}\">" +
    '<div class="frame" aria-hidden="true">' + frame(a) +
    (a.pinned ? '<span class="flag" aria-label="pinned">' + svg("star") + "</span>" : "") +
    "</div>" +
    '<div class="cap"><div class="title">' + esc(a.title || "Untitled") + "</div>" +
    '<div class="meta">' + bits.map(esc).join(" &middot; ") + "</div></div></div>";
}

// Ingestion time by default. The promise is that things sit in the order you found
// them, and sorting by last touched means fixing a typo silently moves a note to the
// front of your own museum.
const ORDERS = [["ingested", "when you saved it"], ["touched", "last touched"],
                ["title", "by name"]];
let order = "ingested";

function setOrder(next) { order = next; home(); }

const MONTHS = ["January", "February", "March", "April", "May", "June", "July",
                "August", "September", "October", "November", "December"];

// "Three weeks ago" is a thing people remember. A date is not. Grouping by how long
// ago turns the wall into something you can navigate by memory, which is the only
// index this product is willing to ask you to maintain.
function bucket(iso) {
  const then = new Date(iso);
  if (isNaN(then)) return "Undated";
  const now = new Date();
  const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((midnight(now) - midnight(then)) / 86400000);

  if (days <= 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return "Earlier this week";
  if (days < 14) return "Last week";
  if (then.getFullYear() === now.getFullYear() && then.getMonth() === now.getMonth())
    return "Earlier this month";
  if (days < 365) return MONTHS[then.getMonth()];
  return String(then.getFullYear());
}

async function home() {
  const wasReading = chat;
  teardown();
  scope = {kind: "everything", label: "everything"};
  restorePill("wall");
  showRail(null);
  view.innerHTML = '<div class="state">opening...</div>';

  const [arts, exs] = await Promise.all([
    api("/artifacts?limit=120&order=" + order), api("/exhibits"),
  ]);

  if (!arts.total) {
    view.innerHTML = '<div class="state">Nothing saved yet.<br><br>' +
      "Everything you save lands here, in the order you found it, with nothing asked of " +
      "you at the time. No folder, no tag, no reason required. The reason is what you " +
      "come back for later, when you name a theme and the room assembles itself.<br><br>" +
      'Nothing here expires. Start with <span class="gold">+</span>.</div>';
    return;
  }

  let html = "";
  if (exs.items.length) {
    html += '<div class="shelf">Exhibits</div>' + exs.items.map(e =>
      "<div class=\"item\" tabindex=\"0\" role=\"button\" onclick=\"showExhibit('" + e.id + "')\"" +
      " onkeydown=\"rowKey(event, () => showExhibit('" + e.id + "'))\">" +
      '<div class="item-body">' +
      '<div class="title">' + esc(e.name) + "</div>" +
      '<div class="excerpt">' + esc(e.through_line || "") + "</div></div></div>").join("");
  }

  html += '<div class="shelf sortbar"><span>' + arts.total + " artifact" +
    (arts.total === 1 ? "" : "s") + "</span>" +
    ORDERS.map(([key, label]) =>
      '<button class="sort" aria-pressed="' + (order === key) + '" onclick="setOrder(\'' +
      key + '\')">' + label + "</button>").join("") + "</div>";

  // Grouped by when, because that is how the thing is actually remembered. Sorting by
  // name has no when to group by, so it stays one wall.
  if (order === "title") {
    html += '<div class="wall">' + arts.items.map(card).join("") + "</div>";
  } else {
    const stamp = a => order === "touched" ? a.updated_at : a.created_at;
    let current = null, i = 0;
    for (const a of arts.items) {
      const label = bucket(stamp(a));
      if (label !== current) {
        if (current !== null) html += "</div>";
        html += '<div class="when">' + esc(label) + '</div><div class="wall">';
        current = label;
      }
      html += card(a, i++);
    }
    if (current !== null) html += "</div>";
  }

  view.innerHTML = html;
  if (wasReading) window.scrollTo(0, 0);
}

let ctx = null;

async function showArtifact(id, focus) {
  teardown();
  const d = await api("/artifacts/" + id);
  const a = d.artifact;
  scope = {kind: "artifact", id, label: "this artifact"};
  restorePill("inside");

  const bits = [a.kind, (a.updated_at || "").slice(0, 10)];
  if (a.local_only) bits.push("local only");

  let html = '<div class="titlerow"><div class="h1">' + esc(a.title || "Untitled") + "</div>" +
    '<button class="pin big' + (a.pinned ? " lit" : "") + '" aria-pressed="' + !!a.pinned +
    '" aria-label="' + (a.pinned ? "Unpin" : "Keep at the front") + '" title="' +
    (a.pinned ? "Unpin" : "Keep at the front") + '" onclick="pinArtifact(\'' + a.id + '\',' +
    !a.pinned + ')">' + svg("star") + "</button></div>" +
    '<div class="meta">' + bits.filter(Boolean).map(esc).join(" &middot; ") + "</div>";

  if (a.source_url)
    html += '<a class="url" href="' + esc(a.source_url) + '" target="_blank" rel="noopener">' +
      esc(a.source_url) + "</a>";
  // Not "open externally": the file is read here. This is only the way out, for the
  // day the museum is not where you want it.
  if (["pdf", "image", "file"].includes(a.kind))
    html += '<a class="url" href="/artifacts/' + a.id + '/blob" download>keep a copy</a>';

  if (d.secrets.length)
    html += '<div class="state gold">This holds what looks like a credential, so it stays out of ' +
      "every model call.<br>" + d.secrets.map(s => esc(s.excerpt)).join("<br>") + "</div>";

  if (a.kind === "note") {
    // The body is yours. Edited in place, with every version kept.
    const n = d.versions.length;
    html += '<div class="editor md" id="body" contenteditable="true" spellcheck="true" ' +
      'role="textbox" aria-multiline="true" aria-label="The note itself" ' +
      'data-placeholder="Start writing. Markdown shorthand becomes formatting as you type."></div>' +
      '<div class="bar"><span id="state" class="meta"></span>' +
      '<span class="meta" style="margin-left:auto" id="vers" data-n="' + n + '">' +
      (n ? n + " version" + (n === 1 ? "" : "s") : "") + "</span></div>";
    ctx = {id, kind: "note", title: a.title, saved: a.body || "", html: md(a.body || "")};
  } else {
    if (a.kind === "pdf") {
      html += reader(a, d.pages);
    } else if (a.kind === "image") {
      html += '<img class="page" src="/artifacts/' + a.id + '/blob" alt="' + esc(a.title) + '">';
    } else if (a.kind === "link") {
      html += linkFace(a, d.preview);
    }
    const current = d.annotations.filter(x => x.current);
    const last = current.length ? current[current.length - 1] : null;
    html += '<div class="shelf">Your note on this</div>' +
      '<div class="editor md" id="body" contenteditable="true" spellcheck="true" ' +
      'role="textbox" aria-multiline="true" aria-label="Your note on this" ' +
      'style="min-height:150px" data-placeholder="What you thought."></div>' +
      '<div class="bar"><span id="state" class="meta"></span></div>';
    ctx = {id, kind: a.kind, entryId: last ? last.id : null, saved: last ? last.text : "",
           html: md(last ? last.text : "")};
  }

  if (d.facet_skip_reason) html += '<div class="aside">' + esc(whyNoFacets(d.facet_skip_reason)) + "</div>";
  if (d.facets.length)
    html += '<div class="shelf">What the curator made of it</div>' + d.facets.map(f =>
      '<div class="md" style="font-size:13px;color:var(--subtext);padding:2px 0">' +
      '<span class="meta gold" style="margin-right:8px">L' + f.level + "</span>" +
      esc(f.statement) + "</div>").join("");

  view.innerHTML = html;
  mountEditor(focus);
  if (a.kind === "pdf") mountReader(a.id, d.pages);
  window.scrollTo(0, 0);
}

// The gate prints its own enum value otherwise: "No facets: too_short" tells the
// reader nothing and names an internal state they have no way to know about. Facets
// are the machine's index of what a thing could be an example of; not having them
// costs you nothing except being pulled into a room you did not search for by name.
const NO_FACETS = {
  too_short: "Too short for the curator to draw anything general out of. Still searchable.",
  text_only: "Held out of every model call, because it looks like it contains a credential. " +
             "Still searchable.",
  kind: "Nothing here for the curator to read yet. Still searchable.",
};

function whyNoFacets(reason) {
  return NO_FACETS[reason] || "The curator has not read this yet. Still searchable.";
}

// ---- a link's face -------------------------------------------------------
// A saved link has nothing but its address until someone decides it is worth one
// request. So the page shows what is actually known, and the button that would find
// out more says what it costs, right where it is.
function linkFace(a, p) {
  const host = (() => { try { return new URL(a.source_url).hostname.replace(/^www\./, ""); }
                        catch (e) { return "the publisher"; } })();

  if (p && p.status === "ok")
    return p.description ? '<div class="lede">' + esc(p.description) + "</div>" : "";

  const failed = p && p.status === "failed";
  return (failed ? '<div class="aside why">' + esc(p.error) + "</div>" : "") +
    '<button class="act" id="btnPreview" onclick="fetchPreview(\'' + a.id + '\')">' +
    (failed ? "Try again" : "Fetch a preview") + "</button>" +
    '<div class="aside">one request to ' + esc(host) +
    (failed ? "" : ". Saving a link makes none.") + "</div>";
}

async function pinArtifact(id, pinned) {
  await api("/artifacts/" + id, {method: "PATCH", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({pinned})}).catch(() => {});
  showArtifact(id);
}

async function fetchPreview(id) {
  const button = document.getElementById("btnPreview");
  if (button) { button.disabled = true; button.textContent = "asking " + "..."; }
  try {
    await api("/artifacts/" + id + "/preview", {method: "POST"});
  } catch (err) {
    if (button) { button.disabled = false; button.textContent = "Try again"; }
    return;
  }
  showArtifact(id);
}

// ---- finding a phrase inside one thing -----------------------------------
// Only intercepted for PDFs. Their pages are rendered as images, so the browser has
// no text to search and its own find is genuinely useless. A note is real text in the
// DOM, where Cmd+F already works better than anything reimplemented here would, so it
// is left alone.
let findState = null;

async function openFind() {
  if (!ctx || ctx.kind !== "pdf") return false;

  if (!findState) {
    const d = await api("/artifacts/" + ctx.id + "/text").catch(() => null);
    findState = {pages: (d && d.pages) || []};
  }
  if (!findState.pages.length) {
    const empty = document.getElementById("findState");
    if (empty) empty.textContent = "no text was extracted from this file";
  }

  pill.classList.add("wide");
  pill.innerHTML =
    '<input id="findField" placeholder="find in this document" autocomplete="off">' +
    '<span class="scope" id="findCount"></span>' +
    '<button aria-label="Close" onclick="restorePill()">' + svg("close") + "</button>";

  const field = document.getElementById("findField");
  field.focus();
  field.oninput = () => runFind(field.value);
  field.onkeydown = e => {
    if (e.key === "Escape") { clearFind(); return restorePill(); }
    if (e.key === "Enter") { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
  };
  return true;
}

function runFind(term) {
  const count = document.getElementById("findCount");
  clearFind();
  term = term.trim().toLowerCase();
  if (!term) { if (count) count.textContent = ""; return; }

  const hits = [];
  for (const p of findState.pages) {
    const haystack = p.text.toLowerCase();
    let at = haystack.indexOf(term);
    while (at !== -1) {
      hits.push({page: p.page, at});
      at = haystack.indexOf(term, at + term.length);
    }
  }
  findState.hits = hits;
  findState.at = hits.length ? 0 : -1;
  if (count) count.textContent = hits.length ? "1 of " + hits.length : "nothing";
  if (hits.length) goToHit(0);
}

function stepFind(by) {
  const hits = (findState && findState.hits) || [];
  if (!hits.length) return;
  findState.at = (findState.at + by + hits.length) % hits.length;
  document.getElementById("findCount").textContent =
    (findState.at + 1) + " of " + hits.length;
  goToHit(findState.at);
}

function goToHit(index) {
  const hit = findState.hits[index];
  const leaf = document.querySelector('.leaf[data-page="' + hit.page + '"]');
  if (!leaf) return;
  document.querySelectorAll(".leaf.hit").forEach(l => l.classList.remove("hit"));
  leaf.classList.add("hit");
  leaf.scrollIntoView({behavior: "smooth", block: "start"});
}

function clearFind() {
  document.querySelectorAll(".leaf.hit").forEach(l => l.classList.remove("hit"));
}

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "f" && ctx && ctx.kind === "pdf") {
    e.preventDefault();
    openFind();
  }
});

// ---- the reader ----------------------------------------------------------
// A PDF is read here, not handed to whatever the operating system would open it
// with. Pages are rasterised by the engine, so they render in a webview that has no
// PDF plugin, and they load as they are reached rather than all at once.
function reader(a, pages) {
  if (!pages)
    return '<div class="state">This file will not open as a document. It is stored ' +
      'exactly as it arrived: <a class="gold" href="/artifacts/' + a.id +
      '/blob" download>keep a copy</a>.</div>';

  let html = '<div class="reader" id="reader">';
  for (let i = 0; i < pages; i++)
    html += '<div class="leaf" data-page="' + i + '" role="img" aria-label="page ' +
      (i + 1) + ' of ' + pages + '"></div>';
  return html + "</div>" + '<div class="folio" id="folio">1 / ' + pages + "</div>";
}

let readerWatch = null;

function mountReader(id, pages) {
  if (readerWatch) { readerWatch.disconnect(); readerWatch = null; }
  const root = document.getElementById("reader");
  if (!root || !pages) return;

  // Rasterise at the density the screen actually has: a 900px render on a Retina
  // display is a soft page, and soft type is the one thing a reader cannot forgive.
  //
  // Measured at mount, the width is sometimes 0, because the pane has not laid out
  // yet and a zero-width request renders nothing. So it is measured at the moment a
  // page is actually reached, by which point layout has certainly happened.
  const width = () =>
    Math.min(2400, Math.max(700, Math.round(root.clientWidth * (window.devicePixelRatio || 1))));

  const load = leaf => {
    if (leaf.dataset.loaded) return;
    leaf.dataset.loaded = "1";
    const img = new Image();
    img.alt = "";
    img.onload = () => { leaf.replaceChildren(img); leaf.classList.add("loaded"); };
    // A page that will not render is still a page. Removing it would silently
    // renumber the document underneath the reader.
    img.onerror = () => {
      leaf.dataset.loaded = "";
      leaf.classList.add("blank");
      leaf.textContent = "page " + (Number(leaf.dataset.page) + 1) + " would not render";
    };
    img.src = "/artifacts/" + id + "/page/" + leaf.dataset.page + "?width=" + width();
  };

  // Two observers, because the two jobs want opposite settings. Loading wants to fire
  // early, a screen or two ahead. The page counter wants to fire late and exactly:
  // sharing one observer is what made it read "2 / 9" while page one filled the screen.
  const ahead = new IntersectionObserver(
    entries => entries.filter(e => e.isIntersecting).forEach(e => load(e.target)),
    {rootMargin: "1200px 0px"},
  );

  const folio = document.getElementById("folio");
  const shown = new Map();
  const here = new IntersectionObserver(entries => {
    for (const entry of entries) shown.set(Number(entry.target.dataset.page), entry.intersectionRatio);
    if (!folio) return;
    // The page you are reading is the one filling most of the screen. Ties go to the
    // earlier page, because that is the one you are still finishing.
    let best = null;
    for (const [page, ratio] of [...shown].sort((a, b) => a[0] - b[0]))
      if (ratio > 0 && (best === null || ratio > shown.get(best) + 0.01)) best = page;
    if (best !== null) folio.textContent = (best + 1) + " / " + pages;
  }, {threshold: [0, 0.1, 0.25, 0.5, 0.75, 1]});

  root.querySelectorAll(".leaf").forEach(leaf => { ahead.observe(leaf); here.observe(leaf); });
  readerWatch = {disconnect: () => { ahead.disconnect(); here.disconnect(); }};
}

function mountEditor(focus) {
  const ed = document.getElementById("body");
  if (!ed || !ctx) return;
  ed.innerHTML = ctx.html || "";

  const lead = ed.firstElementChild;
  if (lead && lead.tagName === "H1" && ctx.title &&
      lead.textContent.trim() === ctx.title.trim())
    ed.classList.add("titled");

  ed.addEventListener("input", () => applyInputRules(ed));
  ed.addEventListener("blur", saveBody);
  ed.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && "bi".includes(e.key)) {
      e.preventDefault();
      document.execCommand(e.key === "b" ? "bold" : "italic");
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); saveBody(); }
  });
  // Paste as plain text. Pasting styled HTML from a browser would smuggle in tags the
  // serialiser cannot represent, and they would be silently lost on the next save.
  ed.addEventListener("paste", e => {
    e.preventDefault();
    document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text"));
  });

  if (focus) ed.focus();
}

async function saveBody() {
  if (!ctx) return;
  const ed = document.getElementById("body"), state = document.getElementById("state");
  if (!ed || !state) return;
  const text = htmlToMd(ed);
  if (text === ctx.saved) return;

  try {
    if (ctx.kind === "note") {
      await api("/artifacts/" + ctx.id + "/body", {method: "PATCH",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify({body: text})});
      const v = document.getElementById("vers");
      if (v) {
        const n = Number(v.dataset.n || 0) + 1;
        v.dataset.n = n;
        v.textContent = n + " version" + (n === 1 ? "" : "s");
      }
    } else {
      if (!text.trim()) return;
      const r = await api("/artifacts/" + ctx.id + "/annotations", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text, supersedes_id: ctx.entryId})});
      ctx.entryId = r.id;
    }
  } catch (err) { state.className = "meta"; state.textContent = String(err); return; }

  ctx.saved = text;
  state.className = "saved";
  state.textContent = "saved";
  setTimeout(() => { if (state.textContent === "saved") state.textContent = ""; }, 2200);
}
