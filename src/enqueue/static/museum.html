        b.textContent = k || "Not determined";
        b.onclick = () => finish(k);
        list.appendChild(b);
      }
      if (!others.length) {
        const only = document.createElement("div");
        only.className = "aside";
        only.textContent = "There is no other group to move it to yet.";
        list.appendChild(only);
      }

      box.querySelector('[value="no"]').onclick = () => finish(null);
      box.addEventListener("cancel", (e) => {
        e.preventDefault();
        finish(null);
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          finish(null);
        }
      });

      document.body.appendChild(box);
      box.showModal();
      // Cancel takes focus first, so a stray Return never files a card at random.
      box.querySelector('[value="no"]').focus();
    });
  }

  // ---- chats ---------------------------------------------------------------
  // Asking is a conversation, not a single shot. The concepts a conversation turns out
  // to circle are kept beside it, and each one can still hang a room, which is the
  // only reason to store them rather than to name a chat by its first line.

  let chat = null;
  let rail = null;

  function teardown() {
    if (readerWatch) {
      readerWatch.disconnect();
      readerWatch = null;
    }
    // Leaving a screen has to take that screen's pending work with it. `ctx` is what
    // every deferred callback tests itself against, so a `ctx` that outlives its view
    // is a licence for the old screen to redraw itself over the new one.
    clearTimeout(faceWatch);
    faceWatch = null;
    // The drawer belongs to the artifact view; leaving the view takes it with it.
    const drawer = document.getElementById("drawer");
    if (drawer) drawer.classList.remove("open");
    // The greeting eye's timer and pointer listener live only while the home view
    // is up; leaving any surface clears them.
    tearDownEye();
    // A poller watching this chat's pending turns dies with the surface: a stale
    // timer must never re-render a view the person has left.
    stopPolling();
    ctx = null;
    chat = null;
    organizeTurns = {};
    // Unsaved settings edits are staging on a form, not a decision. Leaving the form
    // drops them, so stale values never follow the user between screens.
    pendingSettings = null;
  }

  async function startChat(text) {
    const asked = { kind: scope.kind, id: scope.id };
    view.innerHTML =
      '<div class="state thinking">reading what you saved...</div>';
    let made;
    try {
      made = await api("/chats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          scope_kind: asked.kind === "artifact" ? "artifact" : "everything",
          scope_id: asked.id || null,
          text,
        }),
      });
    } catch (err) {
      return chatFailed(err, text);
    }
    showChat(made.chat.id, made);
  }

  async function chatFailed(err, text) {
    const why = await api("/chats/ready").catch(() => ({
      ready: true,
      reason: null,
    }));
    view.innerHTML =
      '<div class="back" onclick="home()">&larr; everything</div>' +
      '<div class="state">' +
      (why.ready
        ? 'The curator could not answer.<br><br><span class="strongtext">' +
          esc(String(err)) +
          "</span><br><br>Nothing was lost. Your question was " +
          esc(text) +
          "."
        : "There is nothing to answer from yet: " + esc(why.reason) + ".") +
      "</div>";
  }

  async function showChat(id, preloaded) {
    if (readerWatch) {
      readerWatch.disconnect();
      readerWatch = null;
    }
    stopPolling();
    const d = preloaded || (await api("/chats/" + id));
    chat = d;
    scope = { kind: "chat", id, label: "this conversation" };
    showRail(id);
    setRoute("c/" + id);
    renderChat(d);
    composer();
    // A person who left during an answer and came back finds the turn still
    // pending; the poller finishes it without them doing anything (H4.3).
    if (hasPending(d)) startPolling(id);
  }

  function renderChat(d) {
    // The scope is a constraint, not a subtitle. Rendered as metadata it read like a
    // caption, and a chat silently locked to one empty link answered "nothing you have
    // saved" to a question the museum could answer instantly. Say what it can see, and
    // put the way out next to it.
    const scoped = d.chat.scope_kind !== "everything";
    // Side and corner shape carry the speaker, so there are no name labels under the
    // bubbles. A label on every turn is a thing to read that says nothing.
    const chip = (kind, id, label, handler) =>
      '<button class="src" data-kind="' +
      esc(kind || "") +
      '" onclick="' +
      handler +
      "('" +
      esc(id) +
      "')\">" +
      (kind ? '<span class="kindmark"></span>' : "") +
      esc(label) +
      "</button>";

    // The view rebuilds every render, so last screen's organize turns are gone.
    organizeTurns = {};

    let html =
      '<div class="transcript">' +
      '<button class="btn ghost back" onclick="home()">' +
      svg("back") +
      "Everything</button>" +
      '<div class="titlerow"><div class="h2">' +
      esc(d.chat.title) +
      "</div>" +
      '<button class="btn ghost harm" onclick="dropChat(\'' +
      d.chat.id +
      "')\">Delete</button></div>" +
      (scoped
        ? '<div class="from scopebar">' +
          '<span class="meta">reading only</span>' +
          chip("", d.chat.scope_id, d.chat.scope_label, "showArtifact") +
          "</div>"
        : '<div class="meta">reading everything</div>');

    for (const m of d.messages) {
      // A typed turn (S4): `answer` (and any unknown kind, defensively) renders
      // exactly as today; `organize` renders its label in the bubble and the
      // grouped view below it, hydrated from the stored spec.
      const organize = m.kind === "organize" && m.role === "assistant";
      // Phase H: the pending turn is a real stored message, not a fake drawn on
      // top. It renders as a thinking bubble the poller refreshes until the
      // worker fills it in; a failed turn shows its reason with a way to ask
      // again (H4.1).
      const pending = m.status === "pending" && m.role === "assistant";
      const failed = m.status === "failed" && m.role === "assistant";
      html +=
        '<div class="turn ' +
        (m.role === "user" ? "you" : "curator") +
        '">' +
        '<div class="said md">' +
        (m.role === "user"
          ? esc(m.text)
          : pending
            ? '<span class="streaming">Reading what you saved...</span>'
            : md(m.text));
      const echoes =
        d.chat.scope_kind === "artifact" &&
        m.cited &&
        m.cited.length === 1 &&
        m.cited[0].artifact_id === d.chat.scope_id;

      // The evidence lives inside the bubble it supports. Outside it, it was a
      // footnote under the most important thing on the page.
      if (m.cited && m.cited.length && !echoes)
        html +=
          '<div class="from">' +
          m.cited
            .map((c) => chip(c.kind, c.artifact_id, c.title, "showArtifact"))
            .join("") +
          "</div>";
      else if (
        !pending &&
        !failed &&
        m.role === "assistant" &&
        !m.grounded &&
        !organize
      )
        html +=
          '<div class="unsourced">Nothing you have saved carried this.</div>';

      // The failed turn is honest about why (Rule 2), and the way out is one
      // click: the cause with a path to the fix when the worker stored one
      // (CR.2), and ask the same question again as a fresh turn (H4.4).
      if (failed) {
        if (m.error)
          html +=
            '<div class="cause">' +
            esc(m.error) +
            ' <button class="btn ghost" onclick="showSettings()">Check Settings</button></div>';
        html +=
          '<button class="btn ghost" onclick="retryTurn(\'' +
          esc(m.id) +
          "')\">Try again</button>";
      }
      html += "</div>";

      // The grouped view is not stored in the turn's text: it re-runs the stored
      // spec (S4.2), so a reload shows the same groups without re-planning. The
      // slot starts as a placeholder and hydrates right after this render.
      if (organize)
        html +=
          '<div class="org" id="org-' +
          esc(m.id) +
          '"><div class="state thinking">grouping what you saved...</div></div>';
      html += "</div>";
    }

    view.innerHTML = html + "</div>";
    for (const m of d.messages)
      if (m.kind === "organize" && m.role === "assistant" && m.payload)
        hydrateOrganize(m, d);
    window.scrollTo(0, document.body.scrollHeight);
  }

  // ---- typed turns: the in-chat organize view -------------------------------
  // The organize turns currently on screen: message id -> {d (last run), spec,
  // userText}. They reuse the same run endpoint and the same group markup as the
  // standalone pivot; only the home differs. A correction re-runs the turn's own
  // spec, cheap because every derive call is cached.
  let organizeTurns = {};

  // Re-run a turn's stored spec and fill its slot. One run endpoint, no fork: the
  // same POST /pivot/run the standalone pivot used.
  function hydrateOrganize(m, d) {
    const slot = document.getElementById("org-" + m.id);
    if (!slot) return;
    const idx = d.messages.indexOf(m);
    const userText =
      idx > 0 && d.messages[idx - 1].role === "user"
        ? d.messages[idx - 1].text
        : m.text;

    api("/pivot/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ spec: m.payload }),
    })
      .then((result) => {
        organizeTurns[m.id] = { d: result, spec: m.payload, userText };
        slot.innerHTML = organizeSlotHtml(m.id);
        mountPivotGroups(m.payload);
      })
      .catch((err) => {
        slot.innerHTML =
          '<div class="state">That grouping could not be re-run: ' +
          esc(String((err && err.message) || err)) +
          ".</div>";
      });
  }

  // The turn's groups plus its controls (Rule 2: the routing is declared - the
  // label is in the bubble - and reversible - "Answer instead" is always here).
  function organizeSlotHtml(mid) {
    const st = organizeTurns[mid];
    if (!st) return "";
    // The actions sit at the top of the turn's result (K.8), above the first
    // group: they act on the whole grouping, and a person reads the actions
    // before the cards. The buttons stay ghost - they are reversible.
    return (
      '<div class="org-actions">' +
      '<button class="btn ghost" onclick="saveGrouping(\'' +
      mid +
      "')\">Save grouping</button>" +
      '<button class="btn ghost" onclick="answerInstead(\'' +
      mid +
      "')\">Answer instead</button>" +
      "</div>" +
      pivotGroupsHtml(
        st.d,
        (id) => "onclick=\"chatPivotMove('" + mid + "','" + esc(id) + "')\"",
        st.spec,
      )
    );
  }

  // Keep this arrangement: name the spec that produced the turn and store it, so
  // the grid button can re-open and re-run it live. The spec is the recipe, not a
  // snapshot - naming is the only text a person types; grouping never prompts.
  async function saveGrouping(mid) {
    const st = organizeTurns[mid];
    if (!st) return;
    const name = await askGroupName(
      "Name this grouping",
      "e.g. By author region",
      "Save",
    );
    if (!name) return;
    try {
      await api("/pivots", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, spec: st.spec }),
      });
    } catch (err) {
      return toast(String((err && err.message) || err), true);
    }
    toast('Saved as "' + name + '". Find it under the grid button.');
  }

  // Correct a misfiled card inside a chat organize turn: write a user override on
  // the grouping attribute for this one artifact, then re-run the turn's own spec
  // so the card lands where the person put it. The override always wins on read,
  // so the move survives every later re-run (S4.4).
  async function chatPivotMove(mid, id) {
    const st = organizeTurns[mid];
    if (!st) return;
    const d = st.d;

    let current = "";
    for (const g of d.groups) {
      if ((g.artifact_ids || []).includes(id)) {
        current = g.key;
        break;
      }
    }
    const keys = d.groups.map((g) => g.key);

    const target = await pickGroup(keys, current);
    if (target === null) return;

    try {
      await api("/derived/override", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          scope: "artifact",
          subject: id,
          attribute: d.group_by,
          value: target,
        }),
      });
    } catch (err) {
      return toast(String((err && err.message) || err), true);
    }

    const slot = document.getElementById("org-" + mid);
    if (!slot) return;
    slot.innerHTML = '<div class="state thinking">moving it...</div>';
    try {
      st.d = await api("/pivot/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ spec: st.spec }),
      });
    } catch (err) {
      slot.innerHTML =
        '<div class="state">That grouping could not be re-run: ' +
        esc(String((err && err.message) || err)) +
        ".</div>";
      return;
    }
    slot.innerHTML = organizeSlotHtml(mid);
    toast("Moved to " + (target || "Not determined") + ".");
  }

  // Rule 2's way back, in one click: re-send the same words forcing `answer`
  // (the dispatcher's force_skill), appending a fresh answer turn below.
  function answerInstead(mid) {
    const st = organizeTurns[mid];
    if (!st || !chat) return;
    sendInChat(st.userText, "answer");
  }

  // The rail is present on every surface, not only inside a conversation. A thread you
  // have to be already reading in order to find is a thread you will not go back to.
  // Rail removed — conversations are accessed via the pill's eye icon.
  async function showRail(_activeId) {}
  function toggleRail() {}

  // A conversation is scaffolding around the collection, not part of it, so this
  // removes it outright rather than sending it to the trash: there is no original to
  // recover, and the artifacts it cited are untouched either way.
  async function dropChat(id) {
    const row = document.querySelector('.thread[onclick*="' + id + '"]');
    const name = row ? row.textContent.trim() : "this conversation";
    const yes = await ask(
      "Delete this conversation?",
      name + " will be removed. The artifacts it cited stay where they are.",
      "Delete",
    );
    if (!yes) return;

    try {
      await api("/chats/" + id, { method: "DELETE" });
    } catch (err) {
      return toast("Not deleted. " + String(err.message || err), true);
    }
    if (chat && chat.chat.id === id) {
      chat = null;
      home();
    } else {
      home();
    }
    toast("Conversation deleted.");
  }

  // Show a list of all conversations — called from the pill's eye button.
  async function showChatList() {
    teardown();
    // A sub-view, not the wall: show the inside pill so Home is a way out. Without
    // it an empty list is a dead end with nothing to click back to.
    restorePill("inside");
    const list = await api("/chats?limit=100").catch(() => ({ items: [] }));
    let html = '<div class="shelf">Conversations</div>';
    if (!list.items.length) {
      html += '<div class="aside">No conversations yet.</div>';
    } else {
      html +=
        '<div class="wall">' +
        list.items
          .map(
            (c) =>
              '<div class="card" tabindex="0" role="button" onclick="showChat(\'' +
              c.id +
              "')\">" +
              '<div class="frame" style="padding:24px 16px">' +
              '<div class="title">' +
              esc(c.title) +
              '</div><div class="excerpt">' +
              (c.pinned ? "kept" : "") +
              "</div></div></div>",
          )
          .join("") +
        "</div>";
    }
    view.innerHTML = html;
  }

  // ---- saved groupings: the grid button's home -----------------------------
  // A saved grouping is an arrangement's recipe (the spec), not a frozen result.
  // Opening one re-runs it live, so a note captured since it was saved lands in
  // its group - the arrangement stays true as the library grows. The grid button
  // opens this list; a row runs its grouping; the small cross forgets it.
  async function showSavedGroupings() {
    teardown();
    // A sub-view, not the wall: show the inside pill so Home is a way out. This is
    // the bug fix - an empty saved-groupings list was a dead end with no way back.
    restorePill("inside");
    setRoute("g");
    const list = await api("/pivots").catch(() => ({ items: [] }));
    let html = '<div class="shelf">Saved groupings</div>';
    if (!list.items.length) {
      html +=
        '<div class="aside">Nothing saved yet. Ask the eye to organize your ' +
        "notes, then save the grouping you want to keep.</div>";
    } else {
      html +=
        '<div class="wall">' +
        list.items
          .map(
            (p) =>
              '<div class="card" data-pivot="' +
              p.id +
              '" tabindex="0" role="button" onclick="runSavedGrouping(\'' +
              p.id +
              "','" +
              esc(p.name).replace(/'/g, "\\'") +
              "')\">" +
              '<div class="frame" style="padding:24px 16px">' +
              '<div class="title">' +
              esc(p.name) +
              "</div>" +
              '<button class="title-action" aria-label="Rename ' +
              esc(p.name) +
              '" title="Rename this grouping" onclick="renameSavedGrouping(event,\'' +
              p.id +
              "')\">" +
              svg("pencil") +
              "</button>" +
              '<button class="movebtn" aria-label="Forget ' +
              esc(p.name) +
              '" onclick="forgetSavedGrouping(event,\'' +
              p.id +
              "')\">forget</button>" +
              "</div></div>",
          )
          .join("") +
        "</div>";
    }
    view.innerHTML = html;
  }

  // Run a saved grouping: fetch its spec, run it live, and render it in the same
  // standalone pivot view (renderPivot) the planner produced - so a move works
  // through the same path. The saved name stands in for the words that planned it.
  async function runSavedGrouping(id, name) {
    teardown();
    setRoute("g/" + id);
    view.innerHTML =
      '<div class="state thinking">grouping what you saved...</div>';
    let saved;
    try {
      saved = await api("/pivots/" + id);
    } catch (err) {
      return pivotFailed(err);
    }
    let d;
    try {
      d = await api("/pivot/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ spec: saved.spec }),
      });
    } catch (err) {
      return pivotFailed(err);
    }
    renderPivot(d, name || saved.name, saved.spec, saved.id);
  }

  async function forgetSavedGrouping(ev, id) {
    if (ev) ev.stopPropagation();
    try {
      await api("/pivots/" + id, { method: "DELETE" });
    } catch (err) {
      return toast(String((err && err.message) || err), true);
    }
    toast("Grouping forgotten.");
    // If the forget happened inside the saved-groupings modal (L.5), refresh its
    // list in place; otherwise re-render the saved-groupings sub-view.
    const picker = document.querySelector("dialog.ask #customPickerList");
    if (picker && picker.closest("dialog").open) {
      await refreshCustomPicker();
      return;
    }
    showSavedGroupings();
  }

  async function togglePin(id, pinned) {
    try {
      await api("/chats/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pinned }),
      });
    } catch (err) {
      return toast(String(err.message || err), true);
    }
    home();
  }

  // The composer is drawn before the rail has finished loading, so the toggle looks the
  // rail up when it is pressed rather than closing over a variable that may still be null.
  function toggleRail() {
    const found = document.querySelector(".rail");
    if (found) found.classList.toggle("open");
  }

  function composer() {
    closeMenu();
    pill.classList.add("wide");
    pill.innerHTML =
      '<button id="btnRail" aria-label="Conversations" onclick="toggleRail()">' +
      svg("rail") +
      "</button>" +
      '<input id="field" placeholder="ask about ' +
      esc(chat.chat.scope_label) +
      '" autocomplete="off">' +
      '<button aria-label="Leave" onclick="home()">' +
      svg("close") +
      "</button>";

    const field = document.getElementById("field");
    field.focus();
    field.onkeydown = (e) => {
      if (e.key === "Escape") return home();
      if (e.key !== "Enter") return;
      const v = field.value.trim();
      if (!v) return;
      field.value = "";
      sendInChat(v);
    };
  }

  async function sendInChat(text, skill) {
    const id = chat.chat.id;
    let d;
    try {
      // Submitting returns immediately with a pending turn; the worker computes
      // the answer off the request thread. Nothing here awaits the model (H4.2).
      d = await api("/chats/" + id + "/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // `skill` forces a route (Rule 2's "answer instead"). JSON.stringify
        // drops an undefined value, so a plain send carries no skill at all.
        body: JSON.stringify({ text, skill }),
      });
    } catch (err) {
      chat = await api("/chats/" + id);
      renderChat(chat);
      const note = document.createElement("div");
      note.className = "callout warn";
      note.textContent = String(err);
      view.appendChild(note);
      return;
    }
    chat = d;
    renderChat(d);
    showRail(id);
    composer();
    // The turn is pending; the poller watches it resolve and stops when done.
    startPolling(id);
  }

  // ---- pending turns: the poller that watches them resolve -----------------
  // A submitted answer is computed after the request has returned. While any turn
  // in the open chat is pending, one poller re-reads the transcript every couple
  // of seconds and re-renders on change; it stops when none are pending. Leaving
  // the surface cancels it (teardown), so a stale poller never redraws a screen
  // it no longer owns, and opening a different chat starts its own.
  let pollTimer = null;
  let pollChatId = null;

  function stopPolling() {
    clearTimeout(pollTimer);
    pollTimer = null;
    pollChatId = null;
  }

  function hasPending(d) {
    return (d.messages || []).some((m) => m.status === "pending");
  }

  function startPolling(id) {
    // One poller per chat: opening a different surface (or a different chat)
    // cancels the old one before the new one starts.
    if (pollChatId !== id) stopPolling();
    if (pollTimer) return;
    pollChatId = id;
    pollTimer = setTimeout(pollTick, 2000);
  }

  async function pollTick() {
    const id = pollChatId;
    if (!id) return;
    let d;
    try {
      d = await api("/chats/" + id);
    } catch (err) {
      // The chat is gone (deleted while we waited): stop, don't thrash.
      stopPolling();
      return;
    }
    if (pollChatId !== id) return; // canceled while the fetch was in flight
    const open = chat && chat.chat.id === id;
    if (open && transcriptChanged(chat, d)) {
      chat = d;
      renderChat(d);
    }
    if (hasPending(d)) pollTimer = setTimeout(pollTick, 2000);
    else stopPolling();
  }

  // Re-render only when the transcript actually moved: a poller that redraws the
  // whole view on an unchanged tick would yank a person who scrolled up to read
  // back to the bottom every two seconds.
  function transcriptChanged(a, b) {
    if (!a || !b) return true;
    if (a.chat.title !== b.chat.title) return true;
    if ((a.topics || []).length !== (b.topics || []).length) return true;
    if (a.messages.length !== b.messages.length) return true;
    return a.messages.some((m, i) => {
      const n = b.messages[i];
      return (
        m.id !== n.id ||
        m.status !== n.status ||
        m.text !== n.text ||
        m.kind !== n.kind ||
        m.grounded !== n.grounded
      );
    });
  }

  // A failed turn's way back: ask the same question again as a fresh turn. The
  // text is the user message that preceded the failed turn - the question it was
  // answering (H4.4).
  function retryTurn(mid) {
    if (!chat) return;
    const idx = chat.messages.findIndex((m) => m.id === mid);
    if (idx < 1) return;
    const prev = chat.messages[idx - 1];
    if (prev.role !== "user") return;
    sendInChat(prev.text);
  }

  // ---- the trash -----------------------------------------------------------
  // Everything else here is kept on purpose. This is the one surface where something
  // leaves, so it says what is going, when, and how to stop it.
  async function showTrash() {
    teardown();
    restorePill("inside");
    showRail(null);
    view.innerHTML = '<div class="state">...</div>';
    const d = await api("/trash");

    let html =
      '<div class="h2">Trash</div>' +
      '<div class="aside">Deleted things wait ' +
      d.retention_days +
      " day" +
      (d.retention_days === 1 ? "" : "s") +
      ", then go for good. Nothing else here ever expires on its own.</div>";

    if (!d.items.length) {
      html += '<div class="state">Nothing in the trash.</div>';
      view.innerHTML = html;
      return;
    }

    html +=
      '<div class="callout warn">Emptying the trash deletes these files from this ' +
      "machine. It cannot be undone.</div>";

    // A list, not the wall grid. A wall implies keeping, and this page is about not
    // keeping. The full-pill radius on "Empty trash" is the one departure from the
    // 20px control radius in the app, and the shape is what flags it as terminal.
    html +=
      '<div class="trash">' +
      '<div class="trashbar"><span class="meta">' +
      d.items.length +
      " waiting</span>" +
      '<button class="btn danger terminal" onclick="emptyTrash(' +
      d.items.length +
      ')">Empty trash</button></div>';
    html += d.items
      .map(
        (a) =>
          '<div class="item" data-kind="' +
          esc(a.kind) +
          '"><div class="item-body">' +
          '<span class="kindrow"><span class="kindmark"></span>' +
          '<span class="kindword">' +
          esc(a.kind) +
          "</span></span>" +
          '<div class="title">' +
          esc(a.title || "Untitled") +
          "</div></div>" +
          '<span class="meta">' +
          (a.days_left > 0
            ? a.days_left + " day" + (a.days_left === 1 ? "" : "s") + " left"
            : "goes at the next launch") +
          "</span>" +
          '<div class="rowacts">' +
          '<button class="btn ghost" onclick="restoreArtifact(&#39;' +
          a.id +
          '&#39;)">Restore</button>' +
          '<button class="btn ghost harm" onclick="purgeArtifact(&#39;' +
          a.id +
          '&#39;)">Delete now</button></div></div>',
      )
      .join("");
    html += "</div>";

    view.innerHTML = html;
    window.scrollTo(0, 0);
  }

  // Skips the waiting period for everything at once, so the confirmation counts the
  // things rather than saying "are you sure".
  // The trash actions land on whichever surface is showing them: the settings
  // trash tab re-renders in place, the standalone trash page redraws itself.
  function refreshTrashSurface() {
    if (document.getElementById("settingsTabPane")) renderSettingsTab("trash");
    else showTrash();
  }

  async function emptyTrash(count) {
    const yes = await ask(
      "Empty the trash?",
      "This destroys " +
        count +
        " thing" +
        (count === 1 ? "" : "s") +
        " for good. It cannot be undone.",
      // The verb, repeated. Never "OK", never "Yes".
      "Empty trash",
    );
    if (!yes) return;

    try {
      await api("/trash", { method: "DELETE" });
    } catch (err) {
      return toast(String(err.message || err), true);
    }
    refreshTrashSurface();
    toast("Trash emptied.");
  }

  async function restoreArtifact(id) {
    try {
      await api("/artifacts/" + id + "/restore", { method: "POST" });
    } catch (err) {
      return toast("Not restored. " + String(err.message || err), true);
    }
    refreshTrashSurface();
    toast("Put back.");
  }

  // The only irreversible action in the product, so it is the only one that asks.
  async function purgeArtifact(id) {
    // The title is read from the row rather than passed through the handler: a title
    // is model- or file-derived text, and threading it through an inline onclick
    // string is how that kind of text ends up being parsed as code.
    const row = document.querySelector('[onclick*="' + id + '"]');
    const title =
      row?.closest(".item")?.querySelector(".title")?.textContent || "this";

    const yes = await ask(
      "Delete for good?",
      title + " will be destroyed. This cannot be undone.",
      "Delete",
    );
    if (!yes) return;
    try {
      await api("/trash/" + id, { method: "DELETE" });
    } catch (err) {
      return toast(String(err.message || err), true);
    }
    refreshTrashSurface();
    toast("Gone.");
  }

  // ---- settings ------------------------------------------------------------
  // Not a destination. This is where you go when something is wrong, so it says where
  // every value came from: a field you edit that is silently overridden by an
  // environment variable is worse than no field.
  const SETTING_LABELS = {
    llm_model: "Model",
    llm_url: "Endpoint",
    vision_model: "Vision model (describes images)",
    model_retries: "Retries after a failed answer",
    user_agent: "User agent for link previews",
    hotkey: "Capture hotkey",
    llm_headers: "Extra headers",
    auto_preview: "Resolve links when you save them",
    trash_days: "Days a deleted thing waits before it goes",
  };

  // Two spellings of the same binding, kept apart on purpose.
  //
  // `Alt` is what the shortcut plugin registers; `Option` is what is printed on the
  // key. Showing the accelerator to a Mac user asks them to find a key their keyboard
  // does not have. Store one, display the other.
  const KEY_NAMES = [
    ["CommandOrControl", "⌘"],
    ["Command", "⌘"],
    ["Cmd", "⌘"],
    ["Control", "⌃"],
    ["Ctrl", "⌃"],
    ["Alt", "⌥"],
    ["Option", "⌥"],
    ["Shift", "⇧"],
  ];

  function keyLabel(accelerator) {
    return String(accelerator || "")
      .split("+")
      .map((part) => {
        const hit = KEY_NAMES.find(
          ([name]) => name.toLowerCase() === part.trim().toLowerCase(),
        );
        return hit ? hit[1] : part.trim().toUpperCase();
      })
      .join("");
  }

  function toAccelerator(label) {
    // Accepts what the field shows back (glyphs) and what someone might type instead.
    const parts = [];
    let rest = String(label || "");
    for (const [name, glyph] of [
      ["Control", "⌃"],
      ["Alt", "⌥"],
      ["Shift", "⇧"],
      ["CommandOrControl", "⌘"],
    ]) {
      if (rest.includes(glyph)) {
        parts.push(name);
        rest = rest.split(glyph).join("");
      }
    }
    for (const spoken of [
      "Option",
      "Command",
      "Cmd",
      "Ctrl",
      "Control",
      "Alt",
      "Shift",
    ]) {
      const re = new RegExp("\\b" + spoken + "\\b\\s*\\+?\\s*", "i");
      if (re.test(rest)) {
        rest = rest.replace(re, "");
        const name = /option|alt/i.test(spoken)
          ? "Alt"
          : /cmd|command/i.test(spoken)
            ? "CommandOrControl"
            : /ctrl|control/i.test(spoken)
              ? "Control"
              : "Shift";
        if (!parts.includes(name)) parts.push(name);
      }
    }
    const key = rest.replace(/[+\s]/g, "").toUpperCase();
    return key ? [...parts, key].join("+") : parts.join("+");
  }

  // Recorded, not typed. Nobody knows the accelerator spelling of the key they want,
  // and everybody can press it.
  let recording = null;

  function recordHotkey(button) {
    if (recording) return;
    const label = document.getElementById("hotkeyLabel");
    const previous = label.textContent;
    button.classList.add("listening");
    label.textContent = "press a combination";

    const stop = () => {
      window.removeEventListener("keydown", onKey, true);
      button.classList.remove("listening");
      recording = null;
    };

    const onKey = (e) => {
      e.preventDefault();
      e.stopPropagation();

      if (e.key === "Escape") {
        label.textContent = previous;
        return stop();
      }

      // A bare letter is not a system-wide shortcut, it is the letter T. Wait until at
      // least one modifier is held before accepting anything.
      const held = [];
      if (e.ctrlKey) held.push("Control");
      if (e.altKey) held.push("Alt");
      if (e.shiftKey) held.push("Shift");
      if (e.metaKey) held.push("CommandOrControl");
      if (["Control", "Alt", "Shift", "Meta"].includes(e.key)) return;
      if (!held.length) {
        label.textContent = "hold a modifier too";
        return;
      }

      const key = e.code.startsWith("Key")
        ? e.code.slice(3)
        : e.code.startsWith("Digit")
          ? e.code.slice(5)
          : e.key.length === 1
            ? e.key.toUpperCase()
            : e.key;
      const accelerator = [...held, key].join("+");
      label.textContent = keyLabel(accelerator);
      stop();
      stageSetting("hotkey", accelerator);
    };

    recording = onKey;
    window.addEventListener("keydown", onKey, true);
  }

  function bytes(n) {
    if (!n) return "0 B";
    const units = ["B", "KB", "MB", "GB"];
    const i = Math.min(
      units.length - 1,
      Math.floor(Math.log(n) / Math.log(1024)),
    );
    return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + units[i];
  }

  // DI.1: settings is one tabbed surface, not four stacked full pages. Each tab
  // renders only the form content below the shared tab bar, and switching tabs
  // swaps that one pane - no teardown, no back button, no loading flash.
  const SETTINGS_TABS = [
    { id: "ai", label: "AI", render: renderSettingsAI },
    { id: "features", label: "Features", render: renderSettingsFeatures },
    { id: "storage", label: "Storage", render: renderSettingsStorage },
    { id: "trash", label: "Trash", render: renderSettingsTrash },
  ];

  // The tab on screen, so Save, Discard, and the key actions can re-render it
  // against fresh config without leaving the tabbed surface.
  let currentSettingsTab = "ai";

  function settingsTabBar() {
    return (
      '<div class="settings-tabs" role="tablist" aria-label="Settings sections">' +
      SETTINGS_TABS.map(
        (t) =>
          '<button role="tab" id="tab-' +
          t.id +
          '" aria-selected="' +
          String(t.id === currentSettingsTab) +
          '" onclick="switchSettingsTab(&#39;' +
          t.id +
          '&#39;)">' +
          esc(t.label) +
          "</button>",
      ).join("") +
      "</div>"
    );
  }

  function markActiveSettingsTab() {
    for (const t of SETTINGS_TABS) {
      const b = document.getElementById("tab-" + t.id);
      if (!b) continue;
      b.classList.toggle("active", t.id === currentSettingsTab);
      b.setAttribute("aria-selected", String(t.id === currentSettingsTab));
    }
  }

  // Render one tab's form into the shared pane. The previous tab's content stays
  // on screen until the new one is ready, so a switch never flashes a loading
  // state (DI.1); the stale-render guard drops the result if the user clicked
  // away while the fetch was in flight.
  async function renderSettingsTab(name) {
    const spec = SETTINGS_TABS.find((t) => t.id === name);
    const pane = document.getElementById("settingsTabPane");
    if (!spec || !pane) return;
    currentSettingsTab = name;
    markActiveSettingsTab();
    const html = await spec.render();
    if (
      currentSettingsTab !== name ||
      !document.getElementById("settingsTabPane")
    )
      return;
    pane.innerHTML = html;
    refreshDirtyBar();
    window.scrollTo(0, 0);
  }

  // The tab bar's onclick target: swap only the pane below it.
  function switchSettingsTab(name) {
    renderSettingsTab(name);
  }

  async function showSettings() {
    teardown();
    restorePill("inside");
    view.innerHTML =
      '<div class="h1">Settings</div>' +
      settingsTabBar() +
      '<div id="settingsTabPane"></div>';
    window.scrollTo(0, 0);
    await renderSettingsTab(currentSettingsTab);
  }

  // Rebuild the whole concept layer with the current model (POST /facets redo).
  // The run is long - one model call per item - so the button does not block on
  // it: it fires, reports that it is running, and updates when the run reports
  // back. Leaving the page does not stop it; generate_all commits per item, so a
  // closed tab just leaves a resumable, half-rebuilt layer, never a corrupt one.
  async function rebuildFacets() {
    const yes = await ask(
      "Rebuild concepts?",
      "Every item is re-analyzed with the current model. This runs in the background and can take a while.",
      "Rebuild",
    );
    if (!yes) return;
    const el = document.getElementById("facetRebuildState");
    if (el) el.textContent = "Rebuilding in the background...";
    toast("Rebuilding concepts in the background.");
    api("/facets", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ redo: true }),
    })
      .then((r) => {
        if (el)
          el.textContent =
            "Done. " +
            (r.generated || 0) +
            " items re-analyzed, " +
            (r.facets || 0) +
            " concepts.";
      })
      .catch((err) => {
        if (el)
          el.textContent =
            "Rebuild failed: " + String((err && err.message) || err);
      });
  }

  // Settings changed in any settings form but not saved yet. One staging area for
  // the whole settings section, because Save commits the form in one PATCH. null
  // when nothing is pending. Cleared by Save or Discard, or by navigating away
  // from the form (deliberate: unsaved means unsaved).
  let pendingSettings = null;

  function isDirty() {
    return !!pendingSettings && Object.keys(pendingSettings).length > 0;
  }

  // Staging never re-renders the form: re-rendering would reset a text field and
  // lose the very edit that staged it. The control itself already shows the edit in
  // place; all that reacts here is the unsaved bar.
  function refreshDirtyBar() {
    const bar = document.getElementById("settingsActions");
    if (bar) bar.hidden = !isDirty();
  }

  function stageSetting(name, value) {
    if (!pendingSettings) pendingSettings = {};
    pendingSettings[name] = value;
    refreshDirtyBar();
  }

  // The preview toggle's look is driven by aria-checked, which a plain click does
  // not change, so the click flips it by hand and then stages like any other
  // control. The aside beneath it catches up on Save or Discard, when the form
  // re-renders against the config.
  function stagePreviewToggle(button) {
    const on = button.getAttribute("aria-checked") !== "true";
    button.setAttribute("aria-checked", String(on));
    stageSetting("auto_preview", on ? "on" : "off");
  }

  // Switching backend moves the endpoint with it, because leaving the old URL
  // behind would point a hosted model at localhost and fail in a way nobody could
  // read. The move is staged with the choice, committed by the same Save.
  async function stageBackend(name) {
    const list = (await api("/settings")).backends;
    const spec = list.find((b) => b.name === name);
    stageSetting("llm_backend", name);
    if (spec && spec.url) stageSetting("llm_url", spec.url);
    if (BACKEND_MODELS[name]) stageSetting("llm_model", BACKEND_MODELS[name]);
  }

  async function saveSettings() {
    if (!isDirty()) return;
    try {
      await api("/settings", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ changes: pendingSettings }),
      });
      pendingSettings = null;
      toast("Settings saved.");
      await renderSettingsTab(currentSettingsTab);
    } catch (err) {
      toast(String(err.message || err), true);
    }
  }

  function discardSettings() {
    pendingSettings = null;
    renderSettingsTab(currentSettingsTab);
  }

  // The one Save/Discard bar every editable settings form ends with. Hidden until

  function settingsActionsBar() {

      '<span class="aside dirty">unsaved</span>' +
      '<button class="btn primary" onclick="saveSettings()">Save</button>' +
      '<button class="btn ghost" onclick="discardSettings()">Discard</button>' +
      "</div>"
    );
  }

  // The value is sent once and never read back. What returns is whether a key now
  // exists and its last four characters, so the field can be cleared immediately.
  async function saveKey() {
    const field = document.getElementById("s_key");
    const state = document.getElementById("keyState");
    const key = field.value.trim();
    if (!key) return;

    try {
      await api("/settings/api-key", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key }),
      });
    } catch (err) {
      state.textContent = String(err.message || err);
      return;
    }
    field.value = "";
    renderSettingsTab(currentSettingsTab);
    toast("Key stored in the Keychain.");

  // A topic drawn out of a conversation is the same kind of thing a lens is, so it
  // hangs a room. The chat it came from stays in the rail, because the room is a move
  // inside the conversation rather than a departure from it.
  async function doCurate(lens) {
    const backTo = chat ? chat.chat.id : null;
    const stages = [
      "expanding the lens into the way documents actually talk",
      "searching the literal and conceptual layers",
      "reading each candidate and deciding whether it belongs",
      "looking for what they share, and where they disagree",
    ];
    let i = 0;
    view.innerHTML =
      '<div class="state thinking" id="stage">' + stages[0] + "</div>";
    const tick = setInterval(() => {
      i = Math.min(i + 1, stages.length - 1);
      const el = document.getElementById("stage");
      if (el) el.textContent = stages[i];
    }, 9000);

    let r;
    try {
      r = await api("/curate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lens, keep: 8, pool: 10 }),
      });
    } catch (err) {
      clearInterval(tick);
      view.innerHTML =
        back(backTo) +
        '<div class="state">The curator could not finish.<br><br><span class="strongtext">' +
        esc(String(err)) +
        "</span><br><br>Nothing was lost. The artifacts are untouched; only the " +
        "room failed to hang.</div>";
      return;
    }
    clearInterval(tick);

    const ex = r.room || {};

    let html =
      back(backTo) +
      '<div class="h1">' +
      esc(ex.suggested_name || lens) +
      "</div>" +
      '<div class="meta">' +
      r.kept.length +
      " kept &middot; " +
      (r.rejected_count ?? 0) +
      " rejected &middot; " +
      r.considered +
      " considered</div>";
    if (ex.through_line)
      html +=
        '<div class="md" style="margin:var(--sp-4) 0">' +
        esc(ex.through_line) +
        "</div>";
    if (ex.thin)
      html +=
        '<div class="callout warn">thin &middot; ' +
        esc(ex.thin_reason) +
        "</div>";

    // A room can come back short for two very different reasons: the collection did not
    // hold it, or the model could not do the job. Saying which is the difference between
    // a useful answer and a mystery.
    if (r.failed)
      html +=
        '<div class="aside caution">' +
        r.failed +
        " of " +
        r.considered +
        " judgments failed their checks; those artifacts were dropped without being judged.</div>";
    if (r.synthesis_error)
      html +=
        '<div class="aside caution">no through line: ' +
        esc(r.synthesis_error) +
        "</div>";

    r.kept.forEach((k, j) => {
      html +=
        '<div class="item hang" style="animation-delay:' +
        j * 70 +
        'ms" ' +
        'tabindex="0" role="button" onclick="showArtifact(\'' +
        k.artifact_id +
        "')\" " +
        "onkeydown=\"rowKey(event, () => showArtifact('" +
        k.artifact_id +
        "'))\">" +
        '<div class="item-body">' +
        '<div class="title">' +
        esc(k.title) +
        "</div>" +
        '<div class="md" style="font-size:14px">' +
        esc(k.placard) +
        "</div>" +
        '<div class="meta">match ' +
        k.strength +
        "</div></div></div>";
    });

    view.innerHTML = html;
    window.scrollTo(0, 0);
  }

  function back(chatId) {
    return chatId
      ? '<div class="back" onclick="showChat(\'' +
          chatId +
          "')\">&larr; the conversation</div>"
      : '<div class="back" onclick="home()">&larr; everything</div>';
  }

  // Boot restores whatever was open when the page was reclaimed (K.9): the hash
  // holds the route, so a hidden-and-restored museum lands back on the artifact
  // or grouping, not the wall. An empty hash is the wall.
  restoreRoute();
</script>
