        '<div class="tagbar"' +
        (wallGroup === "tags" ? "" : " hidden") +
        ">" +
        top
          .map(
            (t) =>
              '<button class="tagchip" data-tag="' +
              esc(t.name) +
              '" type="button">#' +
              esc(t.name) +
              "</button>",
          )
          .join("") +
        (rest.length
          ? '<button class="tagchip all" type="button" aria-expanded="false">all tags</button>' +
            rest
              .map(
                (t) =>
                  '<button class="tagchip more" data-tag="' +
                  esc(t.name) +
                  '" type="button" hidden>#' +
                  esc(t.name) +
                  "</button>",
              )
              .join("")
          : "") +
        "</div>";
    }
    html += "</div>";
    // M.1: the wall header goes straight from .homehead into the wall body.
    // The "Collections" shelf is gone; saved groupings own that concept.

    wall = { offset: first.items.length, more: first.more, loading: false };
    wallStamp = first.total + ":" + ((first.items[0] || {}).id || "");
    wallKept = kept.items;
    wallFirst = first.items;

    // The wall body renders in the chosen grouping mode (K.6). Custom fetches
    // /pivots after the shell is in place, so its slot starts empty.
    html += '<div class="wallbody" id="wallbody"></div>';

    view.innerHTML = html;
    mountEye();

    const bodySlot = view.querySelector(".wallbody");
    // Custom is never a boot or persistent mode (L.5): it opens a modal on
    // demand. The wall body always renders one of the client-side arrangements.
    bodySlot.innerHTML = wallBodyHtml();
    if (wallGroup === "type" || wallGroup === "tags")
      mountWallGroups(wallGroup);
    // The home search lives inside the greeting header and is re-created on every
    // home render, so its keys are bound here, not once at startup. Enter searches;
    // Escape clears so an emptied field is a way back to the wall.
    const hs = view.querySelector(".homehead input");
    if (hs) {
      hs.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          hs.value = "";
          hs.blur();
        } else if (e.key === "Enter") {
          const q = hs.value.trim();
          if (q) doSearch(q);
        }
      });
    }

    // `#name` query and the results come back filtered. The all-tags chip
    // reveals whatever the top eight did not cover.
    const tagbar = view.querySelector(".tagbar");
    if (tagbar) {
      tagbar.querySelectorAll(".tagchip[data-tag]").forEach((chip) => {
        chip.addEventListener("click", () => {
          const q = "#" + chip.dataset.tag;
          if (hs) hs.value = q;

            .querySelectorAll(".tagchip.more")
            .forEach((c) => (c.hidden = !show));

    // Switching re-renders the body in place; the header stays put.
    const gbar = view.querySelector(".groupbar");

      gbar.querySelectorAll("button").forEach((b) => {

  // The greeting eye is decoration for the greeting phrase: it carries no
  // interaction of its own and is hidden from the accessibility tree. The pupil
  // leans toward the cursor while the home view is up, and the eye blinks on a
  // timer that reschedules itself to a fresh random delay after every blink.
  // Both die with the view - teardown() clears the timer and the listeners - so
  // no other surface inherits a stray pointer handler.
  let eyeTimer = null;
  let eyeMove = null;
  let eyeLeave = null;
  let eyeSaccade = null;
  const motionOk = !matchMedia("(prefers-reduced-motion: reduce)").matches;

  function mountEye() {
    // L.7/M.4: the follow is functional, not decorative, so it runs even under
    // prefers-reduced-motion. Only the cosmetic saccade and blink chains are
    // gated on motionOk below.
    const el = document.getElementById("greetEye");
    if (!el) return;
    const iris = el.querySelector(".eye-iris");
    // AU.8: pointermove can fire dozens of times a second and every step reads
    // layout, so the work is throttled to one read per animation frame - and to
    // none at all once the eye has left the DOM, so a stray event can never make
    // the home view pay a getBoundingClientRect bill for a thing that is not there.
    let raf = 0;
    let lastMove = 0; // ms stamp of the last pointermove, for the saccade gate
    let rafQueued = 0; // when the current frame was queued, so a throttled frame can be reclaimed
    // The eye follows the cursor wherever it goes, with a dead zone at its own
    // center so it does not jitter when the cursor rests on it. Hovering the
    // emblem defers entirely to the CSS hover-wake, which centers the pupil and
    // blinks, so the two never fight over the pupil.
    const step = (e) => {
      if (!document.getElementById("greetEye")) return;
      if (el.matches(":hover")) {
        // Hand the pupil to the CSS hover-wake (DL.9): an inline transform
        // would outrank the :hover rule, so clear it while the cursor rests
        // on the emblem and let the stylesheet center the pupil.
        if (iris.style.transform) iris.style.transform = "";
        return;
      }
      lastMove = performance.now();
      if (raf) {
        // A frame is already queued; the newest event wins when it runs. If the
        // queued frame never fires (the window was hidden and rAF throttled), the
        // follow would wedge on this slot forever, so reclaim it after a beat and
        // re-queue rather than going silent.
        if (performance.now() - rafQueued > 500) {
          cancelAnimationFrame(raf);
          raf = 0;
        } else {
          return;
        }
      }
      rafQueued = performance.now();
      raf = requestAnimationFrame(() => {
        raf = 0;
        const r = el.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2);
        const dy = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy) || 1;
        // Dead-zone falloff: full reach past 90px, easing off inside it so a
        // cursor resting near the eye does not make the pupil tremble.
        const pull = Math.min(1, d / 90);
        // 3.6 viewBox units: the big eye (viewBox 0 0 24 24, iris r 4.6) needs a
        // travel that is a visible fraction of the sclera. The outline's nearest
        // boundary to the center is 8.33 units, so 3.6 + 4.6 = 8.2 keeps the iris
        // inside with a hair of margin - any bigger and it clips the upper curve.
        const reach = 3.6;
        if (pull === 0) {
          // Cursor dead center and not hovering: rest, and let the saccades
          // have the pupil back.
          iris.style.transform = "";
          return;
        }
        // DL.6: write the offset straight onto the iris group. CSS transforms
        // transition (the SVG transform attribute cannot be eased), and setting
        // the transform property directly - instead of routing it through a
        // custom property - keeps the follow working where var() inside
        // transform is unreliable on SVG elements. M.4: the translate() function
        // inside the transform property needs comma-separated lengths - a
        // unitless, space-separated value (translate(3.00 1.00)) is invalid CSS
        // and the browser silently drops it, which is why the pupil never moved.
        // The values are viewBox user units; 1px in SVG user space is 1 unit, so
        // reach stays 3.6 units.
        iris.style.transform =
          "translate(" +
          ((dx / d) * reach * pull).toFixed(2) +
          "px, " +
          ((dy / d) * reach * pull).toFixed(2) +
          "px)";
      });
    };
    const relax = () => {
      if (raf) {
        cancelAnimationFrame(raf);
        raf = 0;
      }
      // Clearing the inline transform hands the pupil back to the stylesheet,
      // which rests it at center (DL.9).
      iris.style.transform = "";
    };
    document.addEventListener("pointermove", step, { passive: true });
    document.addEventListener("mouseleave", relax);
    eyeMove = step;
    eyeLeave = relax;
    // Saccades: real eyes jump, they never glide. When the pointer is idle and
    // away, the pupil flicks to a random rest pose, holds it for a beat, then
    // returns - the difference between a painted eye and one that is thinking
    // about something else. Gated on pointer silence (600ms) and on the hover
    // state, so it only ever plays when nothing else is driving the pupil.
    let saccadeTimer = null;
    const saccade = () => {
      if (!document.getElementById("greetEye")) return;
      if (el.matches(":hover") || performance.now() - lastMove < 600) {
        saccadeTimer = setTimeout(saccade, 900); // try again once things settle
        return;
      }
      const ang = Math.random() * Math.PI * 2;
      // 0.35-0.95 of reach: the saccade stays inside the same 8.33-unit boundary
      // as the follow (3.6 * 0.95 + 4.6 = 8.02), so a flick can never clip the lid.
      const dist = 0.35 + Math.random() * 0.6;
      const reach = 3.6;
      iris.style.transform =
        "translate(" +
        (Math.cos(ang) * reach * dist).toFixed(2) +
        "px, " +
        (Math.sin(ang) * reach * dist).toFixed(2) +
        "px)";
      saccadeTimer = setTimeout(
        () => {
          if (!document.getElementById("greetEye")) return;
          // The dwell only clears the pose if the pointer is still idle - if the
          // cursor started moving, step() owns the pupil now and a stale clear
          // would yank it back to rest mid-follow.
          if (performance.now() - lastMove >= 600 && !el.matches(":hover"))
            iris.style.transform = "";
          saccadeTimer = setTimeout(saccade, 2400 + Math.random() * 4600);
        },
        140 + Math.random() * 240,
      ); // dwell on the new pose, then look away
    };
    // eyeSaccade is the cancel handle: tearDownEye calls it to kill whatever
    // is pending in the chain. The chain itself only ever reschedules through
    // saccadeTimer, so clearing it stops every leg of it.
    eyeSaccade = () => {
      if (saccadeTimer) {
        clearTimeout(saccadeTimer);
        saccadeTimer = null;
      }
    };
    if (motionOk)
      saccadeTimer = setTimeout(saccade, 1600 + Math.random() * 2200);
    const blink = () => {
      el.classList.add("blinking");
      setTimeout(() => el.classList.remove("blinking"), 320);
      // DL.7: one blink in five is a double - the second lid closes ~120ms after
      // the first, so the cadence never settles into a metronome.
      if (Math.random() < 0.15)
        setTimeout(() => {
          el.classList.add("blinking");
          setTimeout(() => el.classList.remove("blinking"), 320);
        }, 120);
      if (motionOk) eyeTimer = setTimeout(blink, 5000 + Math.random() * 15000);
    };
    if (motionOk) eyeTimer = setTimeout(blink, 5000 + Math.random() * 15000);
  }

  function tearDownEye() {
    if (eyeTimer) {
      clearTimeout(eyeTimer);
      eyeTimer = null;
    }
    if (eyeSaccade) {
      eyeSaccade(); // cancels the pending saccade chain
      eyeSaccade = null;
    }
    if (eyeMove) {
      document.removeEventListener("pointermove", eyeMove);
      eyeMove = null;
    }
    if (eyeLeave) {
      document.removeEventListener("mouseleave", eyeLeave);
      eyeLeave = null;
    }
  }

  // The greeting is generated by the engine's model on a four-hour bucket. The
  // time-based fallback is already on screen, so this is a quiet swap, never a
  // wait: the engine answers from cache without a model call, and a cold model is
  // retried a few times in the background before giving up until the next render.
  let greetTries = 0;
  async function refreshGreeting() {
    const el = document.querySelector(".homehead .greeting");
    if (!el) return;
    try {
      const r = await api("/greeting");
      if (!r || !r.text) return;
      if (r.generated) greetTries = 0;
      if (r.text !== el.textContent) {
        el.textContent = r.text;
        el.classList.remove("swap");
        void el.offsetWidth;
        el.classList.add("swap");
      }
      if (!r.generated && greetTries < 3) {
        greetTries += 1;
        setTimeout(refreshGreeting, 8000);
      }
    } catch (err) {
      // The wall keeps its fallback; a failed greeting is not worth an error state.
    }
  }

  // The phrase lives in four-hour buckets; when a bucket rolls over while the app
  // is open, the next check swaps in the new phrase. The check is a localhost GET
  // of a cached value, and it early-returns whenever the wall is not on screen.
  setInterval(refreshGreeting, 60000);

  /// Drag-and-drop ingestion.
  ///
  /// The whole window is a drop target, so there is no drop zone to find: when a
  /// file, image, or external text drag crosses into the window, the room dims and
  /// a card opens to receive (the acknowledgement in `#dropover`). Releasing routes
  /// through the same paths the pill uses - files and images to /capture/upload,
  /// text to /notes - so nothing about ingestion is new; only the gesture is.
  /// A drag that begins inside this document (moving a note's own text around) is
  /// left to the browser and never hijacked into a capture.
  const dropOver = document.getElementById("dropover");
  let dropDepth = 0; // balanced enter/leave count, survives child nodes
  let internalDrag = false; // true while a drag originates inside this document
  let dropBusy = false; // quiet while the accept beat plays out

  // Any drag that did not begin inside this document is a candidate: a file or
  // image from the Finder, or selected text from another app. WebKit does not
  // always surface the "Files" type on dragover the way Blink does, so eligibility
  // is decided by origin, not by what the engine happens to report in `types`.
  const externalDrag = (dt) => !internalDrag && !!dt;

  document.addEventListener("dragstart", () => {
    internalDrag = true;
  });
  document.addEventListener("dragend", () => {
    internalDrag = false;
    dropDepth = 0;
  });

  function showDrop() {
    if (dropBusy || !dropOver.hidden) return;
    dropOver.dataset.state = "ready";
    dropOver.hidden = false;
    requestAnimationFrame(() => dropOver.classList.add("on"));
  }
  function hideDrop() {
    if (dropOver.hidden) return;
    dropOver.classList.remove("on");
    setTimeout(() => {
      if (!dropOver.classList.contains("on")) dropOver.hidden = true;
    }, 320);
  }

  document.addEventListener("dragenter", (e) => {
    dropDepth++;
    if (externalDrag(e.dataTransfer)) {
      e.preventDefault();
      showDrop();
    }
  });
  document.addEventListener("dragover", (e) => {
    if (externalDrag(e.dataTransfer)) e.preventDefault();
  });
  document.addEventListener("dragleave", () => {
    if (--dropDepth <= 0) {
      dropDepth = 0;
      hideDrop();
    }
  });
  window.addEventListener("blur", () => {
    dropDepth = 0;
    hideDrop();
  });

  async function ingestDrop(files, text) {
    const failed = [];
    let kept = 0;
    for (const file of files) {
      const fd = new FormData();
      fd.append("file", file);
      try {
        const r = await fetch("/capture/upload", { method: "POST", body: fd });
        if (!r.ok)
          throw new Error(
            (await r.json().catch(() => ({}))).detail || r.statusText,
          );
        kept++;
      } catch (err) {
        failed.push(file.name + ": " + String(err.message || err));
      }
    }
    if (text) {
      try {
        const r = await fetch("/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body: text }),
        });
        if (!r.ok)
          throw new Error(
            (await r.json().catch(() => ({}))).detail || r.statusText,
          );
        kept++;
      } catch (err) {
        failed.push("text: " + String(err.message || err));
      }
    }
    home();
    if (failed.length) toast("Upload failed. " + failed.join("; "), true);
    else if (kept) toast(kept === 1 ? "Uploaded." : kept + " uploaded.");
  }

  document.addEventListener("drop", (e) => {
    if (dropBusy) return;
    const dt = e.dataTransfer;
    if (!externalDrag(dt)) return; // an internal move; let the browser do it
    // The DataTransfer is only valid inside this event, so the payload is read now.
    const files = Array.from(dt.files ? dt.files : []);
    const text = (dt.getData("text/plain") || "").trim();
    if (!files.length && !text) return;
    e.preventDefault();
    internalDrag = false;
    dropDepth = 0;
    dropBusy = true;
    dropOver.dataset.state = "accept";
    setTimeout(() => {
      dropOver.classList.remove("on");
      setTimeout(() => {
        dropOver.hidden = true;
        dropBusy = false;
      }, 320);
    }, 560);
    ingestDrop(files, text);
  });

  // Loads the next page when the foot of the wall comes near, so the collection is
  // not silently truncated at whatever number the first request asked for.
  let wallWatch = null;

  function watchWallEnd() {
    if (wallWatch) wallWatch.disconnect();
    const foot = document.getElementById("wallEnd");
    if (!foot) return;

    wallWatch = new IntersectionObserver(
      (entries) => {
        if (entries.some((e) => e.isIntersecting)) loadMore();
      },
      { rootMargin: "600px 0px" },
    );
    wallWatch.observe(foot);
  }

  async function loadMore() {
    if (!wall || wall.loading || !wall.more) return;
    wall.loading = true;

    const foot = document.getElementById("wallEnd");
    if (foot) foot.textContent = "loading more...";

    const next = await api(
      "/artifacts?pinned=false&order=touched&limit=" +
        PAGE +
        "&offset=" +
        wall.offset,
    ).catch(() => null);

    if (!next) {
      wall.loading = false;
      if (foot) foot.textContent = "could not load more";
      return;
    }

    const grid = document.getElementById("wall");
    if (grid) {
      grid.insertAdjacentHTML("beforeend", next.items.map(card).join(""));
    }

    wall.offset += next.items.length;
    wall.more = next.more;
    wall.loading = false;
    if (foot) foot.textContent = wall.more ? "" : "";
    if (!wall.more && wallWatch) wallWatch.disconnect();
  }

  let ctx = null;
  // A pending re-look at a link's preview. Held at module scope so leaving the screen
  // can cancel it rather than hoping a stale guard happens to be false.
  let faceWatch = null;
  let faceTries = 0;
  const FACE_LIMIT = 8;

  // ---- tags ---------------------------------------------------------------
  // A tag is an optional, later act on an artifact that already exists. It is
  // added here, on the artifact page, never at capture time and never required.
  // Each chip's remove is one small x - undoing a label is not a big decision.
  function tagRowHtml(tags) {
    return (
      '<div class="tagrow">' +
      (tags || [])
        .map(
          (t) =>
            '<span class="tagchip" data-tag="' +
            esc(t) +
            '"><span class="taglabel">' +
            esc(t) +
            "</span>" +
            '<button class="tagx" aria-label="Remove tag ' +
            esc(t) +
            '" title="Remove tag">' +
            svg("close") +
            "</button></span>",
        )
        .join("") +
      '<input class="tagadd" type="text" placeholder="add tag" autocomplete="off" ' +
      'aria-label="Add a tag" spellcheck="false" />' +
      "</div>"
    );
  }

  // The chip names and the input are bound here, not in inline onclick: a tag name
  // is user text, so it travels in a data attribute and is read at click time.
  function mountTagRow(id) {
    const row = view.querySelector(".tagrow");
    if (!row) return;
    row.querySelectorAll(".tagx").forEach((btn) => {
      btn.addEventListener("click", () => {
        removeTag(id, btn.closest(".tagchip").dataset.tag);
      });
    });
    const input = row.querySelector(".tagadd");
    if (input) {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTag(id, input.value);
        else if (e.key === "Escape") {
          input.value = "";
          input.blur();
        }
      });
    }
  }

  // ---- tags in the drawer --------------------------------------------------
  // The drawer holds the artifact's tags (editable chips) and the summary. The
  // "Add to grouping" row (K.5) was the redundant collections path; Phase M
  // removed it - saved groupings own membership now (M.2).

  async function addTag(id, raw) {
    const name = (raw || "").trim();
    if (!name) return;
    try {
      await api("/artifacts/" + id + "/tags", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const keep = drawerOpen();
      await showArtifact(id);
      if (keep) toggleDrawer(true);
    } catch (err) {
      toast(String((err && err.message) || err), true);
    }
  }

  async function removeTag(id, name) {
    try {
      await api("/artifacts/" + id + "/tags/" + encodeURIComponent(name), {
        method: "DELETE",
      });
      const keep = drawerOpen();
      await showArtifact(id);
      if (keep) toggleDrawer(true);
    } catch (err) {
      toast(String((err && err.message) || err), true);
    }
  }

  async function showArtifact(id, focus, scrollY) {
    const arriving = !ctx || ctx.id !== id;
    teardown();
    if (arriving) faceTries = 0;
    const d = await api("/artifacts/" + id);
    const a = d.artifact;
    scope = { kind: "artifact", id, label: "this artifact" };
    restorePill("inside");
    setRoute("a/" + id);

    view.setAttribute("data-kind", a.kind);

    const bits = [since(a.updated_at)];
    if (d.file && d.file.bytes) bits.push(bytes(d.file.bytes));
    if (a.source_url) bits.push(host(a.source_url));

    // No primary action anywhere on this page. Nothing you can do to a thing you have
    // already kept is urgent, and a yellow pill here would say otherwise.
    let html =
      '<div class="pagecol">' +
      '<button class="btn ghost back" onclick="home()">' +
      svg("back") +
      "Everything</button>" +
      '<div class="kindrow"><span class="kindmark"></span>' +
      '<span class="kindword">' +
      esc(a.kind) +
      "</span></div>" +
      '<div class="titlerow"><div class="h1" style="view-transition-name:artifact-title">' +
      esc(a.title || "Untitled") +
      "</div>" +
      (["pdf", "image", "file"].includes(a.kind)
        ? '<a class="title-action" href="/artifacts/' +
          a.id +
          '/blob" download aria-label="Download a copy" title="Download a copy">' +
          svg("down") +
          "</a>"
        : "") +
      // CR.3: pin and the drawer are both "work on this artifact", so they ride
      // together as one tight group; download (a copy) and trash (removal) stand
      // apart from that pair and from each other.
      '<span class="title-group">' +
      '<button class="title-action' +
      (a.pinned ? " lit" : "") +
      '" aria-label="' +
      (a.pinned ? "Kept" : "Keep") +
      '" title="' +
      (a.pinned ? "Kept" : "Keep at the front") +
      '" onclick="pinArtifact(\'' +
      a.id +
      "'," +
      !a.pinned +
      ')">' +
      svg("star") +
      "</button>" +
      '<button class="title-action" id="drawerToggle" aria-label="Tags and summary" aria-expanded="false" title="Tags and summary" onclick="toggleDrawer()">' +
      svg("panelin") +
      "</button></span>" +
      '<button class="title-action danger" aria-label="Move to trash" title="Move to trash" onclick="binArtifact(\'' +
      a.id +
      "')\">" +
      svg("trash") +
      "</button></div>" +
      '<div class="meta">' +
      bits.filter(Boolean).map(esc).join('<span class="sep">&bull;</span>') +
      (a.local_only
        ? '<span class="sep">&bull;</span><span class="badge neutral">local only</span>'
        : "") +
      "</div>" +
      '<div class="actions">' +
      (a.source_url
        ? '<a class="btn secondary" href="' +
          esc(a.source_url) +
          '" target="_blank" rel="noopener">Open original</a>'
        : "") +
      "</div>";

    if (a.source_url)
      html +=
        '<a class="url" href="' +
        esc(a.source_url) +
        '" target="_blank" rel="noopener">' +
        esc(a.source_url) +
        "</a>";

    if (d.secrets.length)
      html +=
        '<div class="callout warn"><p>This holds what looks like a credential, so it ' +
        "stays out of every model call.</p><p>" +
        d.secrets.map((s) => esc(s.excerpt)).join("<br>") +
        "</p></div>";

    // The body builds on its own so the tags and summary can leave the column
    // entirely: the reading pane is one centered column, and everything else on
    // this page lives in the drawer.
    let body = "";

    if (a.kind === "note") {
      // The body is yours. Edited in place, with every version kept.
      const n = d.versions.length;
      // Long-form sits on the warm reading white rather than the raised white, so a
      // whole page of it does not glare against the cream.
      body +=
        '<div class="docpane">' +
        '<div class="editor md" id="body" contenteditable="true" spellcheck="true" ' +
        'role="textbox" aria-multiline="true" aria-label="The note itself" ' +
        'data-placeholder="Start writing. Markdown shorthand becomes formatting as you type."></div>' +
        '<div class="bar"><span id="state" class="meta"></span>' +
        '<span class="meta" style="margin-left:auto" id="vers" data-n="' +
        n +
        '">' +
        (n > 1 ? n + " drafts kept" : "") +
        "</span></div></div>";
      ctx = {
        id,
        kind: "note",
        title: a.title,
        saved: a.body || "",
        html: md(a.body || ""),
      };
    } else {
      if (a.kind === "pdf") {
        body += reader(a, d.pages);
      } else if (a.kind === "file") {
        body +=
          fileFacts(d.file) + '<div class="md" id="plain">reading...</div>';
      } else if (a.kind === "image") {
        body +=
          '<div class="docpane"><img class="page" src="/artifacts/' +
          a.id +
          '/blob" alt="' +
          esc(a.title) +
          '"></div>';
      } else if (a.kind === "link") {
        body += linkFace(a, d.preview);
      }
      const current = d.annotations.filter((x) => x.current);
      const last = current.length ? current[current.length - 1] : null;
      body +=
        '<div class="shelf">Your note on this</div>' +
        '<div class="docpane">' +
        '<div class="editor md" id="body" contenteditable="true" spellcheck="true" ' +
        'role="textbox" aria-multiline="true" aria-label="Your note on this" ' +
        'style="min-height:150px" data-placeholder="What you thought."></div>' +
        '<div class="bar"><span id="state" class="meta"></span></div></div>';
      ctx = {
        id,
        kind: a.kind,
        entryId: last ? last.id : null,
        saved: last ? last.text : "",
        html: md(last ? last.text : ""),
      };
    }

    // How the app keeps its central promise visible: what the model made of this, and
    // the fact that it made it here. Never behind a disclosure. The panel is a summary:
    // facets are the model's compressed reading of the artifact, and it may be generated
    // remotely when the backend is remote, so the old privacy claim was also inaccurate.
    // It lives in the drawer, under the tags.
    let summaryHtml = "";
    if (d.facet_skip_reason)
      summaryHtml =
        '<div class="callout note"><div class="shelf">Summary</div>' +
        "<p>" +
        esc(whyNoFacets(d.facet_skip_reason)) +
        "</p></div>";
    else if (d.facets.length)
      summaryHtml =
        '<div class="callout note"><div class="shelf">Summary</div>' +
        d.facets.map((f) => "<p>" + esc(f.statement) + "</p>").join("") +
        "</div>";

    html +=
      '<div class="bodygrid"><div class="bodycol">' +
      body +
      "</div></div></div>" +
      '<aside class="drawer" id="drawer" aria-label="Tags and summary">' +
      '<div class="drawer-top"><span class="shelf">Tags</span>' +
      '<button class="drawer-close" aria-label="Close tags and summary" title="Close tags and summary" onclick="toggleDrawer(false)">' +
      svg("panelout") +
      "</button></div>" +
      tagRowHtml(d.tags) +
      summaryHtml +
      "</aside>";

    view.innerHTML = html;
    mountTagRow(id);
    mountEditor(focus);
    if (a.kind === "pdf") mountReader(a.id, d.pages);
    if (a.kind === "file") mountPlain(a.id);
    if (scrollY !== undefined) window.scrollTo(0, scrollY);
    else window.scrollTo(0, 0);
  }

  function drawerOpen() {
    const d = document.getElementById("drawer");
    return !!(d && d.classList.contains("open"));
  }

  // The tags-and-summary drawer. One button toggles it; the chevrons and the
  // aria state read differently open and closed, and Escape closes it from the
  // global handler. The drawer only ever covers the content, never pushes it.
  function toggleDrawer(force) {
    const drawer = document.getElementById("drawer");
    const toggle = document.getElementById("drawerToggle");
    if (!drawer) return;
    const open =
      force !== undefined ? !!force : !drawer.classList.contains("open");
    drawer.classList.toggle("open", open);
    if (toggle) {
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute(
        "aria-label",
        open ? "Close tags and summary" : "Tags and summary",
      );
      toggle.title = open
        ? "Close the tags and summary drawer"
        : "Tags and summary";
      toggle.innerHTML = svg(open ? "panelout" : "panelin");
    }
  }

  // The gate prints its own enum value otherwise: "No facets: too_short" tells the
  // reader nothing and names an internal state they have no way to know about. Facets
  // are the machine's index of what a thing could be an example of; not having them
  // costs you nothing except being pulled into a room you did not search for by name.
  const NO_FACETS = {
    too_short:
      "Too short for the curator to draw anything general out of. Still searchable.",
    text_only:
      "Held out of every model call, because it looks like it contains a credential. " +
      "Still searchable.",
    kind: "Nothing here for the curator to read yet. Still searchable.",
  };

  function whyNoFacets(reason) {
    return (
      NO_FACETS[reason] ||
      "The curator has not read this yet. Still searchable."
    );
  }

  // ---- a link's face -------------------------------------------------------
  // A saved link has nothing but its address until someone decides it is worth one
  // request. So the page shows what is actually known, and the button that would find
  // out more says what it costs, right where it is.
  function linkFace(a, p) {
    const host = (() => {
      try {
        return new URL(a.source_url).hostname.replace(/^www\./, "");
      } catch (e) {
        return "the publisher";
      }
    })();

    if (p && p.status === "ok") {
      const shot = p.image_hash
        ? '<img class="shot" style="view-transition-name:artifact-face" src="/artifacts/' +
          a.id +
          '/preview-image" alt="" ' +
          'onerror="this.remove()">'
        : "";
      return (
        shot +
        (p.description
          ? '<div class="lede">' + esc(p.description) + "</div>"
          : "")
      );
    }

    // No row yet means the queue has not reached it. Saving already asked for a
    // preview, so a button here would be a second way to start something that is
    // already happening. It says so, and looks again shortly.
    //
    // The wait has to be bounded and the timer has to be cancellable. Neither was true
    // before: the poll rescheduled itself off a `ctx` that nothing ever cleared, so a
    // link whose preview never arrives (auto-fetch off, or a publisher that never
    // answers) kept firing `showArtifact` forever, which yanked the reader back out of
    // whatever they had navigated to. Going Home did not stop it, because Home did not
    // clear `ctx`. Two bugs stacked into one: an unbounded loop, and a loop that
    // outlived its own screen.
    if (!p) {
      if (faceTries < FACE_LIMIT) {
        faceTries += 1;
        clearTimeout(faceWatch);
        faceWatch = setTimeout(() => {
          if (ctx && ctx.id === a.id) showArtifact(a.id);
        }, 1500);
        return (
          '<div class="aside thinking">asking ' +
          esc(host) +
          " what this is...</div>"
        );
      }
      // Past the limit, saying "asking" would be a lie: nothing is in flight. Offer
      // the one request that is left to decide on.
      return (
        '<div class="aside caution">Nothing has come back from ' +
        esc(host) +
        ". Automatic previews may be off in settings.</div>" +
        '<button class="btn tertiary" id="btnPreview" onclick="fetchPreview(\'' +
        a.id +
        "')\">Ask " +
        esc(host) +
        "</button>"
      );
    }

    // Only a refusal gets a button, because only a refusal is a decision left to
    // make: the publisher said no, and another request is either worth it or not.
    return (
      '<div class="aside caution">' +
      esc(p.error || "that did not resolve") +
      "</div>" +
      '<button class="btn tertiary" id="btnPreview" onclick="fetchPreview(\'' +
      a.id +
      "')\">Try again</button>" +
      '<div class="aside">one more request to ' +
      esc(host) +
      "</div>"
    );
  }

  // Deleting is reversible and says so, because the whole promise of the product is
  // that nothing is lost. The window is the person's own setting, so the confirmation
  // quotes it rather than a number this code invented.
  async function binArtifact(id) {
    let days = 30;
    try {
      days = (await api("/trash")).retention_days;
    } catch (err) {}
    try {
      await api("/artifacts/" + id, { method: "DELETE" });
    } catch (err) {
      return toast("Not deleted. " + String(err.message || err), true);
    }
    home();
    toast(
      "Moved to the trash. Recoverable for " +
        days +
        " day" +
        (days === 1 ? "" : "s") +
        ".",
    );
  }

  async function pinArtifact(id, pinned) {
    try {
      await api("/artifacts/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pinned }),
      });
    } catch (err) {
      return toast(String(err.message || err), true);
    }
    showArtifact(id, undefined, window.scrollY);
  }

  async function fetchPreview(id) {
    const button = document.getElementById("btnPreview");
    if (button) {
      button.disabled = true;
      button.textContent = "asking " + "...";
    }
    try {
      await api("/artifacts/" + id + "/preview", { method: "POST" });
    } catch (err) {
      if (button) {
        button.disabled = false;
        button.textContent = "Try again";
      }
      return toast(String(err.message || err), true);
    }
    faceTries = 0;
    showArtifact(id);
  }

  // What is known about a file the reader may not be able to show. An upload that
  // renders as a featureless square is indistinguishable from one that never arrived,
  // which is exactly how a successful capture got reported as a failure.
  function fileFacts(file) {
    if (!file)
      return '<div class="aside caution">The stored copy is missing.</div>';
    return (
      '<div class="aside">' +
      esc(file.name) +
      " &middot; " +
      esc(file.mime) +
      " &middot; " +
      bytes(file.bytes) +
      "</div>"
    );
  }

  // A captured text file had its contents nowhere: not on screen, not in the index,
  // not answerable. It rendered as an empty glyph with a filename.
  async function mountPlain(id) {
    const box = document.getElementById("plain");
    if (!box) return;
    try {
      const d = await api("/artifacts/" + id + "/text");
      const text = (d.pages || [])
        .map((p) => p.text)
        .join("\n")
        .trim();
      box.textContent = text || "";
      if (!text) {
        box.className = "state";
        box.innerHTML =
          "saved exactly as it arrived. Nothing in it reads as text, so there is " +
          "nothing to show and nothing to search - it is here, and it is intact.";
      }
    } catch (err) {
      box.className = "aside caution";
      box.textContent = String(err.message || err);
    }
  }

  // ---- finding a phrase inside one thing -----------------------------------
  // Only intercepted for PDFs. Their pages are rendered as images, so the browser has
  // no text to search and its own find is genuinely useless. A note is real text in the
  // DOM, where Cmd+F already works better than anything reimplemented here would, so it
  // is left alone.
  let findState = null;

  async function openFind() {
    // Notes are real text in the DOM, so the browser could search them - except this
    // window has no Edit menu, and without one the webview never binds its own find.
    // So the same field serves both, and only the drawing differs.
    if (!ctx || !["pdf", "note", "file"].includes(ctx.kind)) return false;

    if (!findState || findState.id !== ctx.id) {
      const d = await api("/artifacts/" + ctx.id + "/text").catch(() => null);
      findState = { id: ctx.id, kind: ctx.kind, pages: (d && d.pages) || [] };
    }

    pill.classList.add("wide");
    pill.innerHTML =
      '<input id="findField" placeholder="find in this ' +
      (ctx.kind === "pdf" ? "document" : "note") +
      '" autocomplete="off">' +
      '<span class="scope" id="findCount"></span>' +
      '<button class="round" aria-label="Close" onclick="restorePill()">' +
      svg("close") +
      "</button>";

    const field = document.getElementById("findField");
    field.focus();
    field.oninput = () => runFind(field.value);
    field.onkeydown = (e) => {
      if (e.key === "Escape") {
        clearFind();
        return restorePill();
      }
      if (e.key === "Enter") {
        e.preventDefault();
        stepFind(e.shiftKey ? -1 : 1);
      }
    };
    return true;
  }

  async function runFind(term) {
    const count = document.getElementById("findCount");
    clearFind();
    term = term.trim();
    if (!term) {
      if (count) count.textContent = "";
      return;
    }

    if (findState.kind === "pdf") {
      // The engine knows where the words are; the browser is looking at a picture.
      // Counting matches in the extracted text here and drawing boxes from a separate
      // source would let the two disagree, so both come from the one call.
      const found = await api(
        "/artifacts/" + findState.id + "/find?q=" + encodeURIComponent(term),
      ).catch(() => ({ hits: [] }));
      findState.hits = found.hits || [];
      paintPdfHits();
    } else {
      findState.hits = markInNote(term);
    }

    findState.at = findState.hits.length ? 0 : -1;
    if (count)
      count.textContent = findState.hits.length
        ? "1 of " + findState.hits.length
        : "nothing";
    if (findState.hits.length) goToHit(0);
  }

  // Boxes over the rendered page, positioned as percentages of it, so they stay put
  // at any window width and any pixel density.
  function paintPdfHits() {
    for (const hit of findState.hits) {
      const leaf = document.querySelector(
        '.leaf[data-page="' + hit.page + '"]',
      );
      if (!leaf) continue;
      const mark = document.createElement("span");
      mark.className = "findbox";
      mark.style.left = hit.x * 100 + "%";
      mark.style.top = hit.y * 100 + "%";
      mark.style.width = hit.w * 100 + "%";
      mark.style.height = hit.h * 100 + "%";
      leaf.appendChild(mark);
      hit.node = mark;
    }
  }

  // A note is live text the person can edit, so the matches are wrapped in CSS
  // highlights rather than in elements. Inserting <mark> tags would change the DOM
  // the editor serialises back to markdown, and the next save would write them into
  // the note.
  function markInNote(term) {
    const root =
      document.getElementById("body") || document.getElementById("plain");
    if (!root || !window.CSS || !CSS.highlights) return [];

    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const ranges = [];
    const needle = term.toLowerCase();
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      const hay = node.nodeValue.toLowerCase();
      let at = hay.indexOf(needle);
      while (at !== -1) {
        const range = new Range();
        range.setStart(node, at);
        range.setEnd(node, at + needle.length);
        ranges.push({ range });
        at = hay.indexOf(needle, at + needle.length);
      }
    }

    CSS.highlights.set(
      "enqueue-find",
      new Highlight(...ranges.map((r) => r.range)),
    );
    return ranges;
  }

  function stepFind(by) {
    const hits = (findState && findState.hits) || [];
    if (!hits.length) return;
    findState.at = (findState.at + by + hits.length) % hits.length;
    document.getElementById("findCount").textContent =
      findState.at + 1 + " of " + hits.length;
    goToHit(findState.at);
  }

  function goToHit(index) {
    const hit = findState.hits[index];
    if (!hit) return;

    document
      .querySelectorAll(".findbox.on")
      .forEach((m) => m.classList.remove("on"));

    if (findState.kind === "pdf") {
      if (hit.node) hit.node.classList.add("on");
      const target =
        hit.node ||
        document.querySelector('.leaf[data-page="' + hit.page + '"]');
      if (target)
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    // A Range has no scrollIntoView of its own, so its rectangle is measured and the
    // window moved to it.
    const box = hit.range.getBoundingClientRect();
    window.scrollTo({
      top: window.scrollY + box.top - window.innerHeight / 2,
      behavior: "smooth",
    });
    CSS.highlights.set("enqueue-find-current", new Highlight(hit.range));
  }

  function clearFind() {
    document.querySelectorAll(".findbox").forEach((m) => m.remove());
    if (window.CSS && CSS.highlights) {
      CSS.highlights.delete("enqueue-find");
      CSS.highlights.delete("enqueue-find-current");
    }
  }

  document.addEventListener("keydown", (e) => {
    if (
      (e.metaKey || e.ctrlKey) &&
      e.key === "f" &&
      ctx &&
      ctx.kind === "pdf"
    ) {
      e.preventDefault();
      openFind();
    }
  });

  // ---- the reader ----------------------------------------------------------
  // A PDF is read here, not handed to whatever the operating system would open it
  // with. Pages are rasterised by the engine, so they render in a webview that has no
  // PDF plugin, and they load as they are reached rather than all at once.
  function reader(a, pages) {
    if (!pages)
      return (
        '<div class="state">This file will not open as a document. It is stored ' +
        'exactly as it arrived: <a class="url" href="/artifacts/' +
        a.id +
        '/blob" download>keep a copy</a>.</div>'
      );

    let html = '<div class="reader" id="reader">';
    for (let i = 0; i < pages; i++)
      html +=
        '<div class="leaf"' +
        (i === 0 ? ' style="view-transition-name:artifact-face"' : "") +
        ' data-page="' +
        i +
        '" role="img" aria-label="page ' +
        (i + 1) +
        " of " +
        pages +
        '"></div>';
    return (
      html + "</div>" + '<div class="folio" id="folio">1 / ' + pages + "</div>"
    );
  }

  let readerWatch = null;

  function mountReader(id, pages) {
    if (readerWatch) {
      readerWatch.disconnect();
      readerWatch = null;
    }
    const root = document.getElementById("reader");
    if (!root || !pages) return;

    // Rasterise at the density the screen actually has: a 900px render on a Retina
    // display is a soft page, and soft type is the one thing a reader cannot forgive.
    //
    // Measured at mount, the width is sometimes 0, because the pane has not laid out
    // yet and a zero-width request renders nothing. So it is measured at the moment a
    // page is actually reached, by which point layout has certainly happened.
    const width = () =>
      Math.min(
        2400,
        Math.max(
          700,
          Math.round(root.clientWidth * (window.devicePixelRatio || 1)),
        ),
      );

    const load = (leaf) => {
      if (leaf.dataset.loaded) return;
      leaf.dataset.loaded = "1";
      const img = new Image();
      img.alt = "";
      img.onload = () => {
        // Prepended, not replaced. Pages load lazily, so a find can paint highlight
        // boxes onto a page before its picture arrives; `replaceChildren` then wiped
        // them and the search silently lost a third of its results.
        leaf.prepend(img);
        leaf.classList.add("loaded");
      };
      // A page that will not render is still a page. Removing it would silently
      // renumber the document underneath the reader.
      img.onerror = () => {
        leaf.dataset.loaded = "";
        leaf.classList.add("blank");
        leaf.textContent =
          "page " + (Number(leaf.dataset.page) + 1) + " would not render";
      };
      img.src =
        "/artifacts/" + id + "/page/" + leaf.dataset.page + "?width=" + width();
    };

    // Two observers, because the two jobs want opposite settings. Loading wants to fire
    // early, a screen or two ahead. The page counter wants to fire late and exactly:
    // sharing one observer is what made it read "2 / 9" while page one filled the screen.
    const ahead = new IntersectionObserver(
      (entries) =>
        entries.filter((e) => e.isIntersecting).forEach((e) => load(e.target)),
      { rootMargin: "1200px 0px" },
    );

    const folio = document.getElementById("folio");
    const shown = new Map();
    const here = new IntersectionObserver(
      (entries) => {
        for (const entry of entries)
          shown.set(Number(entry.target.dataset.page), entry.intersectionRatio);
        if (!folio) return;
        // The page you are reading is the one filling most of the screen. Ties go to the
        // earlier page, because that is the one you are still finishing.
        let best = null;
        for (const [page, ratio] of [...shown].sort((a, b) => a[0] - b[0]))
          if (ratio > 0 && (best === null || ratio > shown.get(best) + 0.01))
            best = page;
        if (best !== null) folio.textContent = best + 1 + " / " + pages;
      },
      { threshold: [0, 0.1, 0.25, 0.5, 0.75, 1] },
    );

    root.querySelectorAll(".leaf").forEach((leaf) => {
      ahead.observe(leaf);
      here.observe(leaf);
    });
    readerWatch = {
      disconnect: () => {
        ahead.disconnect();
        here.disconnect();
      },
    };
  }

  function mountEditor(focus) {
    const ed = document.getElementById("body");
    if (!ed || !ctx) return;
    ed.innerHTML = ctx.html || "";

    const lead = ed.firstElementChild;
    if (
      lead &&
      lead.tagName === "H1" &&
      ctx.title &&
      lead.textContent.trim() === ctx.title.trim()
    )
      ed.classList.add("titled");

    ed.addEventListener("input", () => applyInputRules(ed));
    ed.addEventListener("blur", saveBody);
    ed.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && "bi".includes(e.key)) {
        e.preventDefault();
        document.execCommand(e.key === "b" ? "bold" : "italic");
      }
      if ((e.metaKey || e.ctrlKey) && e.key === "s") {
        e.preventDefault();
        saveBody();
      }
      // Inside a code block, Enter is a code newline, not a new block: the break is
      // inserted as text (never a <br>, which the serializer's textContent read
      // would drop) so fences round-trip unchanged. Enter on the last empty line
      // leaves the block instead, back to prose, the way a markdown editor closes a
      // fence. Shift+Enter always stays inside.
      if (e.key === "Enter") {
        const node = window.getSelection().anchorNode;
        const el =
          node && node.nodeType === 1 ? node : node && node.parentElement;
        const pre = el && el.closest ? el.closest("pre") : null;
        if (pre) {
          e.preventDefault();
          const sel = window.getSelection();
          const range = sel.rangeCount && sel.getRangeAt(0);
          // The caret's absolute offset within the block text, whatever text nodes
          // the code is split across, decides whether the last line is empty.
          let abs = -1;
          if (range && range.collapsed) {
            const target = range.endContainer;
            const tOff = range.endOffset;
            let acc = 0;
            const walk = (n) => {
              if (abs >= 0) return;
              if (n.nodeType === 3) {
                if (n === target)
                  abs = acc + Math.min(tOff, n.nodeValue.length);
                acc += n.nodeValue.length;
              } else if (n.nodeType === 1) {
                for (const c of n.childNodes) walk(c);
              }
            };
            walk(pre);
          }
          const text = pre.textContent;
          // The line the caret ends on, ignoring the zero-width marker a fresh
          // Enter-made line carries (see below).
          const plain = text.replace(/\u200b/g, "");
          const lastLine = plain.slice(plain.lastIndexOf("\n") + 1);
          const exit =
            !e.shiftKey &&
            abs === text.length &&
            lastLine === "" &&
            text.endsWith("\u200b");
          if (exit) {
            // The exit paragraph gets a zero-width marker so the caret sits inside
            // a text node: an element-position caret would put the next keystroke
            // at the end of the pre above it.
            const p = document.createElement("p");
            p.appendChild(document.createTextNode("\u200b"));
            pre.after(p);
            const r = document.createRange();
            r.setStart(p.firstChild, 1);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r);
          } else {
            // The newline is written by rebuilding the code text. execCommand's
            // insertText would emit a <br> (invisible to textContent, lost on
            // save), and splicing a text node by hand parks the caret on the
            // element, where the next keystroke lands wrong. A rebuild keeps the
            // caret inside a text node at the exact offset.
            if (abs < 0) abs = text.length;
            const codeEl = pre.querySelector("code") || pre;
            // A newline at the very end gets a zero-width space after it: Chrome
            // reads a caret after a trailing newline as the end of the previous
            // line and would put the next keystroke on the line above. The marker
            // is invisible, stripped by the serializer, and marks the line as
            // Enter-made, which is what lets a second Enter leave the block.
            const nl = abs === text.length ? "\n\u200b" : "\n";
            codeEl.textContent = text.slice(0, abs) + nl + text.slice(abs);
            const r = document.createRange();
            r.setStart(codeEl.firstChild, abs + nl.length);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r);
          }
          return;
        }
      }
      // Tab indents: inside a list it nests the item one level deeper (Shift+Tab
      // un-nests it), everywhere else it inserts a tab at the caret. Either way the
      // key never jumps focus to the pill. Outside a list, Shift+Tab keeps the
      // browser default so keyboard users can still move focus backward.
      if (e.key === "Tab") {
        const node = window.getSelection().anchorNode;
        const el =
          node && node.nodeType === 1 ? node : node && node.parentElement;
        const li = el && el.closest ? el.closest("li") : null;
        if (li) {
          e.preventDefault();
          // Indenting the first item of a list has nothing to nest under (matching
          // Word/Notion); outdent at the top level is likewise a no-op. The moves
          // keep the caret's text node alive; Chrome still re-anchors the selection
          // on the list container, so put the caret back where it was afterwards.
          const sel = window.getSelection();
          const saved =
            sel.rangeCount && sel.getRangeAt(0)
              ? {
                  node: sel.getRangeAt(0).startContainer,
                  offset: sel.getRangeAt(0).startOffset,
                }
              : null;
          const moved = e.shiftKey
            ? outdentItem(li)
            : li.parentElement.firstElementChild !== li && indentItem(li);
          if (moved) {
            const restoreCaret = () => {
              if (!saved || !saved.node || !saved.node.parentNode) return;
              try {
                const range = document.createRange();
                range.setStart(
                  saved.node,
                  Math.min(saved.offset, saved.node.length || 0),
                );
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
              } catch {
                /* anchor node detached; nothing to restore */
              }
            };
            restoreCaret();
            setTimeout(restoreCaret, 0);
          }
        } else if (!e.shiftKey) {
          e.preventDefault();
          document.execCommand("insertText", false, "\t");
        }
      }
    });
    // Paste as plain text. Pasting styled HTML from a browser would smuggle in tags the
    // serialiser cannot represent, and they would be silently lost on the next save.
    ed.addEventListener("paste", (e) => {
      e.preventDefault();
      document.execCommand(
        "insertText",
        false,
        (e.clipboardData || window.clipboardData).getData("text"),
      );
    });

    if (focus) ed.focus();
  }

  async function saveBody() {
    if (!ctx) return;
    const ed = document.getElementById("body"),
      state = document.getElementById("state");
    if (!ed || !state) return;
    const text = htmlToMd(ed);
    if (text === ctx.saved) return;

    try {
      if (ctx.kind === "note") {
        await api("/artifacts/" + ctx.id + "/body", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body: text }),
        });
        const v = document.getElementById("vers");
        if (v) {
          const n = Number(v.dataset.n || 0) + 1;
          v.dataset.n = n;
          // "3 versions" is a row count. What it means is that nothing you wrote is gone.
          v.textContent = n > 1 ? n + " drafts kept" : "";
        }
      } else {
        if (!text.trim()) return;
        const r = await api("/artifacts/" + ctx.id + "/annotations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, supersedes_id: ctx.entryId }),
        });
        ctx.entryId = r.id;
      }
    } catch (err) {
      state.className = "meta";
      state.textContent = String(err);
      return;
    }

    ctx.saved = text;
    state.className = "saved";
    state.textContent = ctx.kind === "note" ? "kept" : "noted";

    // The rule under the editor fills once in the artifact's own colour. It reads as
    // the page acknowledging the words rather than a toast arriving from elsewhere.
    const bar = state.closest(".bar");
    if (bar) {
      bar.classList.remove("landed");
      void bar.offsetWidth;
      bar.classList.add("landed");
    }
    setTimeout(() => {
      if (state.textContent === "saved") state.textContent = "";
    }, 2200);
  }

  // The exhibit page (M.6): `showExhibit()` and its rename pencil were the
  // redundant collections path Phase M removes. Saved groupings own the
  // grouping concept now; an old #e/<id> bookmark falls back to the wall.

  // Rename a saved grouping (a pivot recipe) from the custom wall or the saved
  // groupings list (L.3b). Same styled modal family as the grouping pencils, but it posts
  // PATCH /pivots/<id> - the spec (the arrangement) is untouched, only the label
  // moves. Re-renders whichever surface shows the list: the open saved-groupings
  // modal (L.5), or the saved-groupings sub-view.
  async function renameSavedGrouping(ev, id) {
    if (ev) ev.stopPropagation();
    const card =
      view.querySelector('.card[data-pivot="' + id + '"]') ||
      document.querySelector('.customrow[data-pivot="' + id + '"]');
    const current = card
      ? (card.querySelector(".title") || card.querySelector(".rowname") || {})
          .textContent
      : "";
    const name = await askGroupName(
      "Rename this grouping",
      "Grouping name",
      "Save",
      current,
      "Saved groupings re-run live as your library grows; renaming changes only the label.",
    );
    if (!name || name === current) return;
    try {
      await api("/pivots/" + id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
    } catch (err) {
      return toast(String((err && err.message) || err), true);
    }
    toast('Renamed to "' + name + '".');
    // Re-render whichever surface shows the list: the open saved-groupings
    // modal (L.5), or the saved-groupings sub-view.
    const picker = document.querySelector("dialog.ask #customPickerList");
    if (picker && picker.closest("dialog").open) {
      await refreshCustomPicker();
      return;
    }
    showSavedGroupings();
  }

  // A pure `#tag` or `tag:name` query (the tag bar, or one typed by hand) gets
  // the Tagged header with a clear control; anything with free text keeps the
  // ordinary results header.
  function tagFilterName(q) {
    const tokens = q.trim().split(/\s+/).filter(Boolean);
    if (!tokens.length) return null;
    const names = [];
    for (const t of tokens) {
      const rest = t.startsWith("#")
        ? t.slice(1)
        : t.startsWith("tag:")
          ? t.slice(4)
          : null;
      if (rest && rest.trim()) names.push(rest.trim().toLowerCase());
      else return null;
    }
    return names.join(" ");
  }

  async function doSearch(q) {
    teardown();
    setRoute("s/" + encodeURIComponent(q));
    view.innerHTML = '<div class="state thinking">searching...</div>';
    let r;
    try {
      r = await api("/search?limit=20&q=" + encodeURIComponent(q));
    } catch (err) {
      const msg = String((err && err.message) || err);
      if (msg.includes("Updating your search index")) {
        // The index is being rebuilt (version mismatch or first run). Show the
        // required message, then poll /doctor and re-run the search when the
        // rebuild lands - the index is never queried in its stale state.
        view.innerHTML = '<div class="state thinking">' + esc(msg) + "</div>";
        const timer = setInterval(async () => {
          const d = await api("/doctor").catch(() => null);
          if (d && d.index_state === "ready") {
            clearInterval(timer);
            doSearch(q);
          }
        }, 1000);
        return;
      }
      view.innerHTML = '<div class="state">' + esc(msg) + "</div>";
      return;
    }
    const tagName = tagFilterName(q);
    view.innerHTML =
      '<div class="back" onclick="home()">&larr; everything</div>' +
      '<div class="shelf center">' +
      (tagName
        ? "Tagged #" +
          esc(tagName) +
          " &middot; " +
          r.hits.length +
          " result" +
          (r.hits.length === 1 ? "" : "s") +
          ' <button class="tagclear" type="button" onclick="home()">clear filter</button>'
        : r.hits.length +
          " result" +
          (r.hits.length === 1 ? "" : "s") +
          " for &ldquo;" +
          esc(q) +
          "&rdquo;") +
      "</div>" +
      (r.hits.length
        ? r.hits
            .map(
              (h) =>
                '<div class="item" tabindex="0" role="button"' +
                " onclick=\"showArtifact('" +
                h.artifact_id +
                "')\"" +
                " onkeydown=\"rowKey(event, () => showArtifact('" +
                h.artifact_id +
                "'))\">" +
                '<div class="item-body"><div class="title">' +
                esc(h.title) +
                "</div>" +
                '<div class="excerpt">' +
                esc(h.snippet) +
                "</div>" +
                '<div class="meta">' +
                h.score.toFixed(3) +
                "</div></div></div>",
            )
            .join("")
        : '<div class="state">Nothing matched those words.<br><br>Search finds things you can ' +
          "name. If you are chasing an idea rather than a phrase, ask instead and let the room " +
          "assemble itself.</div>");
  }

  // ---- pivot ---------------------------------------------------------------
  // Grouping is no longer its own pill door: the eye routes an "organize ..."
  // request through the assistant (a typed turn), and the grid button re-runs a
  // saved grouping. Both reuse renderPivot / pivotGroupsHtml below. pivotFailed
  // is shared by runSavedGrouping.
  function pivotFailed(err) {
    view.innerHTML =
      back() +
      '<div class="state">That could not be organized.<br><br><span class="strongtext">' +
      esc(String((err && err.message) || err)) +
      "</span><br><br>Nothing was lost; your library is untouched.</div>";
  }

  // The last pivot, kept so a correction can re-run the exact same spec (cheap,
  // because every derive call is cached) instead of re-planning from the words.
  let pivotState = null;

  // The group markup both surfaces share - the standalone pivot view and the
  // in-chat organize turn. One renderer, two homes: a second grouping renderer
  // would drift from the first the moment either changed. `makeMove` /
  // `makeRemove` build each card's per-card action onclick; the remove control
  // only renders when a callback is supplied (only the saved-grouping view has
  // a pivot to exclude from).
  function pivotGroupsHtml(d, makeMove, makeRemove, spec) {
    // The grouping is inferred when any step read a value from world knowledge
    // rather than the note itself; the run marks that per group (they share the
    // one value, since one enrich taints the whole run). That is a guess about the
    // person's things, not a fact read from them, so it is said once at the top and
    // never buried (rule 2).
    const inferred = d.groups.some((g) => g.grounded === false);

    let html = "";
    if (inferred) {
      html +=
        '<div class="groundnote" role="note">These groups come from the ' +
        "assistant's knowledge, not from text in your notes.</div>";
    }

    // Collapsed choices persist per recipe (K.10): the same spec re-run keeps
    // the groups the person folded away, and a different grouping starts open.
    const collapsed = collapsedSet(spec);

    for (const g of d.groups) {
      const items = g.items || [];
      const key = g.key || "Not determined";
      const isCollapsed = collapsed.has(key);
      html +=
        '<section class="pivotgroup' +
        (isCollapsed ? " collapsed" : "") +
        '" data-key="' +
        esc(key) +
        '">' +
        '<button class="h2 grouptoggle" type="button" aria-expanded="' +
        String(!isCollapsed) +
        '"><span>' +
        esc(key) +
        '</span><span class="gchev" aria-hidden="true">' +
        svg("chev") +
        "</span></button>" +
        '<div class="meta">' +
        items.length +
        " item" +
        (items.length === 1 ? "" : "s") +
        "</div>" +
        '<div class="wall">' +
        items
          .map(
            (a, i) =>
              '<div class="pivotcard">' +
              card(a, i) +
              '<button class="movebtn" aria-label="Move ' +
              esc(a.title || "Untitled") +
              ' to another group" ' +
              makeMove(a.id) +
              ">move</button>" +
              (makeRemove
                ? '<button class="removebtn" aria-label="Remove ' +
                  esc(a.title || "Untitled") +
                  ' from this grouping" ' +
                  makeRemove(a.id) +
                  ">remove</button>"
                : "") +
              "</div>",
          )
          .join("") +
        "</div>" +
        "</section>";
    }
    return html;
  }

  // ---- collapsible group headers (K.10) ----------------------------------
  // A stable hash of the spec names the sessionStorage key, so the same recipe
  // re-run preserves the folded groups while a different grouping starts open.
  function specHash(spec) {
    const s = JSON.stringify(spec || {});
    let h = 5381;
    for (let i = 0; i < s.length; i++) {
      h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    }
    return h.toString(36);
  }

  function collapsedSet(spec) {
    try {
      return new Set(
        JSON.parse(
          sessionStorage.getItem("enqueue.collapsedGroups." + specHash(spec)) ||
            "[]",
        ),
      );
    } catch (_) {
      return new Set();
    }
  }

  function saveCollapsed(spec, set) {
    try {
      sessionStorage.setItem(
        "enqueue.collapsedGroups." + specHash(spec),
        JSON.stringify([...set]),
      );
    } catch (_) {
      // Storage unavailable (private mode, quota): collapsing still works for
      // this render, it just does not survive a re-run.
    }
  }

  // Bind the collapsible group headers after the grouping renders. The groups
  // live under `view` in both the standalone pivot view and a chat turn slot.
  function mountPivotGroups(spec) {
    const collapsed = collapsedSet(spec);
    view.querySelectorAll(".pivotgroup .grouptoggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const section = btn.closest(".pivotgroup");
        const key = section.dataset.key;
        section.classList.toggle("collapsed");
        const nowCollapsed = section.classList.contains("collapsed");
        btn.setAttribute("aria-expanded", String(!nowCollapsed));
        if (nowCollapsed) collapsed.add(key);
        else collapsed.delete(key);
        saveCollapsed(spec, collapsed);
      });
    });
  }

  // The standalone pivot view: a saved grouping re-run (or a fresh run behind
  // the grid button) rendered under `view`. `pivot_id` is the saved grouping
  // backing this view when there is one - the remove/restore actions need it;
  // a live run without a saved grouping has no remove actions, just moves.
  function renderPivot(d, request, spec, pivot_id) {
    pivotState = { d, request, spec, pivot_id: pivot_id || null };

    let html =
      back() +
      '<div class="h1">' +
      esc(request) +
      "</div>" +
      '<div class="meta">' +
      d.groups.length +
      " group" +
      (d.groups.length === 1 ? "" : "s") +
      " &middot; grouped by " +
      esc(d.group_by) +
      (d.truncated ? " &middot; first 200 only" : "") +
      "</div>" +
      (pivot_id
        ? '<div class="pivotactions"><button class="btn ghost" onclick="addArtifactToGrouping()">Add artifact to this grouping</button></div>'
        : "");

    html += pivotGroupsHtml(
      d,
      (id) => "onclick=\"pivotMove('" + esc(id) + "')\"",
      pivot_id ? (id) => "onclick=\"pivotRemove('" + esc(id) + "')\"" : null,
      spec,
    );
    view.innerHTML = html;
    mountPivotGroups(spec);
    removedSection(spec, pivot_id);
    window.scrollTo(0, 0);
  }

  // The "Removed" shelf at the bottom of a saved grouping: the artifacts
  // excluded from this grouping (L.6b), hydrated into the same card shape the
  // groups use, each with a restore button that puts it back. The shelf only
  // renders when the grouping actually has exclusions.
  async function removedSection(spec, pivot_id) {
    if (!pivot_id) return;
    const ids = spec.excluded_ids || [];
    if (!ids.length) return;

    const items = [];
    for (const id of ids) {
      try {
        const d = await api("/artifacts/" + id);
        const a = Object.assign({}, d.artifact, {
          excerpt: d.artifact.body ? mdText(d.artifact.body).slice(0, 200) : "",
          has_preview_image:
            d.artifact.kind === "link" && d.preview && !!d.preview.image_url,
        });
        items.push(a);
      } catch (_) {
        // A deleted artifact just does not render a card in the shelf.
      }
    }
    if (!items.length) return;

    const box = document.createElement("section");
    box.className = "pivotgroup removedgroup";
    box.setAttribute("data-key", "Removed");
    box.innerHTML =
      '<button class="h2 grouptoggle" type="button" aria-expanded="true"><span>Removed</span><span class="gchev" aria-hidden="true">' +
      svg("chev") +
      "</span></button>" +
      '<div class="meta">' +
      items.length +
      " item" +
      (items.length === 1 ? "" : "s") +
      "</div>" +
      '<div class="wall">' +
      items
        .map(
          (a) =>
            '<div class="pivotcard">' +
            card(a, 0) +
            '<button class="restorebtn" aria-label="Restore ' +
            esc(a.title || "Untitled") +
            ' to this grouping" onclick="pivotRestore(\'' +
            esc(a.id) +
            "')\">restore</button>" +
            "</div>",
        )
        .join("") +
      "</div>";
    view.appendChild(box);
    box.querySelector(".grouptoggle").addEventListener("click", () => {
      box.classList.toggle("collapsed");
      box
        .querySelector(".grouptoggle")
        .setAttribute(
          "aria-expanded",
          String(!box.classList.contains("collapsed")),
        );
    });
  }

  // Remove a card from this saved grouping (L.6b): write the exclusion into the
  // stored spec, re-run, and re-render. The artifact itself is untouched - it
  // still lives on the wall - it just stops matching this grouping.
  async function pivotRemove(id) {
    if (!pivotState || !pivotState.pivot_id) return;
    let excluded;
    try {
      const resp = await api("/pivots/" + pivotState.pivot_id + "/exclude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ artifact_id: id }),
      });
      excluded = resp.excluded_ids;
    } catch (err) {
      return toast(String((err && err.message) || err), true);
    }
    // Keep the local spec in sync with what was just stored, so the re-run
    // below (and any later move) sees the exclusion.
    pivotState.spec = Object.assign({}, pivotState.spec, {
      excluded_ids: excluded,
    });

    view.innerHTML = '<div class="state thinking">removing it...</div>';
    let next;
    try {
      next = await api("/pivot/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ spec: pivotState.spec }),
      });
    } catch (err) {
      return pivotFailed(err);
    }
    renderPivot(next, pivotState.request, pivotState.spec, pivotState.pivot_id);
    toast("Removed from this grouping.");
  }

  // Put a removed card back: undo the exclusion and re-run, mirroring pivotRemove.
  async function pivotRestore(id) {
    if (!pivotState || !pivotState.pivot_id) return;
    let excluded;
    try {
      const resp = await api("/pivots/" + pivotState.pivot_id + "/exclude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ artifact_id: id, undo: true }),
      });
      excluded = resp.excluded_ids;
    } catch (err) {
      return toast(String((err && err.message) || err), true);
    }
    pivotState.spec = Object.assign({}, pivotState.spec, {
      excluded_ids: excluded,
    });

    view.innerHTML = '<div class="state thinking">restoring it...</div>';
    let next;
    try {
      next = await api("/pivot/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ spec: pivotState.spec }),
      });
    } catch (err) {
      return pivotFailed(err);
    }
    renderPivot(next, pivotState.request, pivotState.spec, pivotState.pivot_id);
    toast("Restored to this grouping.");
  }

  // Force an artifact into this saved grouping (L.6c): pick one from the
  // library, write the inclusion into the stored spec, re-run, and re-render.
  // The artifact joins whichever group its group_by attribute resolves to - it
  // is never copied or moved, it just appears in this arrangement too.
  async function addArtifactToGrouping() {
    if (!pivotState || !pivotState.pivot_id) return;
    const id = await pickArtifact();
    if (!id) return;
    let included;
    try {
      const resp = await api("/pivots/" + pivotState.pivot_id + "/include", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ artifact_id: id }),
      });
      included = resp.included_ids;
    } catch (err) {
      return toast(String((err && err.message) || err), true);
    }
    pivotState.spec = Object.assign({}, pivotState.spec, {
      included_ids: included,
    });

    view.innerHTML = '<div class="state thinking">adding it...</div>';
    let next;
    try {
      next = await api("/pivot/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ spec: pivotState.spec }),
      });
    } catch (err) {
      return pivotFailed(err);
    }
    renderPivot(next, pivotState.request, pivotState.spec, pivotState.pivot_id);
    toast("Added to this grouping.");
  }

  // A modal picker over the person's artifacts: a search box filters the list,
  // picking one resolves its id, cancel resolves null. Built like pickGroup
  // (WKWebView ships no window.prompt) - the choice is captured in a closure,
  // never round-tripped through an HTML attribute.
  function pickArtifact() {
    return new Promise((resolve) => {
      const box = document.createElement("dialog");
      box.className = "ask";
      box.setAttribute("aria-labelledby", "pickTitle");
      box.innerHTML =
        '<h2 id="pickTitle">Add an artifact to this grouping</h2>' +
        '<input class="picksearch" type="search" placeholder="Search your library..." autocomplete="off">' +
        '<div class="pickgroups"></div>' +
        '<div class="asked"><button class="btn secondary" value="no">Cancel</button></div>';

      let done = false;
      const finish = (answer) => {
        if (done) return;
        done = true;
        try {
          box.close();
        } catch (_) {
          // Already closed by the platform; the node still has to go.
        }
        box.remove();
        resolve(answer);
      };

      const list = box.querySelector(".pickgroups");
      const field = box.querySelector(".picksearch");
      let all = [];

      const render = (q) => {
        const ql = (q || "").trim().toLowerCase();
        const shown = ql
          ? all.filter((a) => (a.title || "").toLowerCase().includes(ql))
          : all;
        list.textContent = "";
        if (!shown.length) {
          const none = document.createElement("div");
          none.className = "aside";
          none.textContent = ql
            ? "No artifact matches that."
            : all.length
              ? "Nothing left to add."
              : "Loading your library...";
          list.appendChild(none);
          return;
        }
        for (const a of shown) {
          const b = document.createElement("button");
          b.className = "btn tertiary pickrow";
          b.textContent = a.title || "Untitled";
          b.onclick = () => finish(a.id);
          list.appendChild(b);
        }
      };

      field.addEventListener("input", () => render(field.value));
      api("/artifacts?limit=200&order=touched")
        .then((d) => {
          // A grouping groups artifacts; conversations are not artifacts, so the
          // picker never offers them (a chat has no group_by attribute to read).
          all = (d.items || []).filter((a) => a.id && a.kind !== "chat");
          render(field.value);
        })
        .catch(() => render(field.value));

      box.querySelector('[value="no"]').onclick = () => finish(null);
      box.addEventListener("cancel", (e) => {
        e.preventDefault();
        finish(null);
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          finish(null);
        }
      });

      document.body.appendChild(box);
      box.showModal();
      field.focus();
    });
  }

  // Correct a misfiled card: write a user override on the grouping attribute for
  // this one artifact, then re-run the same spec so the card lands where the
  // person put it. The override always wins over the model on read (rule 2: the
  // director beats the curator), so the move survives every later re-run. Every
  // field here comes from the run's own data - no attribute name is hardcoded.
  async function pivotMove(id) {
    if (!pivotState) return;
    const d = pivotState.d;

    let current = "";
    for (const g of d.groups) {
      if ((g.artifact_ids || []).includes(id)) {
        current = g.key;
        break;
      }
    }
    const keys = d.groups.map((g) => g.key);

    const target = await pickGroup(keys, current);
    if (target === null) return;

    try {
      await api("/derived/override", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          scope: "artifact",
          subject: id,
          attribute: d.group_by,
          value: target,
        }),
      });
    } catch (err) {
      return toast(String((err && err.message) || err), true);
    }

    view.innerHTML = '<div class="state thinking">moving it...</div>';
    let next;
    try {
      next = await api("/pivot/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ spec: pivotState.spec }),
      });
    } catch (err) {
      return pivotFailed(err);
    }
    renderPivot(next, pivotState.request, pivotState.spec, pivotState.pivot_id);
    toast("Moved to " + (target || "Not determined") + ".");
  }

  // A small modal picker: pick which existing group a card belongs in. Resolves the
  // chosen group key, or null on cancel. Built like `ask` (WKWebView ships no
  // window.prompt), with the keys captured in closures so no value is round-tripped
  // through an HTML attribute.
  function pickGroup(keys, currentKey) {
    return new Promise((resolve) => {
      const box = document.createElement("dialog");
      box.className = "ask";
      box.setAttribute("aria-labelledby", "pickTitle");
      box.innerHTML =
        '<h2 id="pickTitle">Move to which group?</h2>' +
        '<div class="pickgroups"></div>' +
        '<div class="asked"><button class="btn secondary" value="no">Cancel</button></div>';

      let done = false;
      const finish = (answer) => {
        if (done) return;
        done = true;
        try {
          box.close();
        } catch (_) {
          // Already closed by the platform; the node still has to go.
        }
        box.remove();
        resolve(answer);
      };

      const list = box.querySelector(".pickgroups");
      const others = keys.filter((k) => k !== currentKey);
      for (const k of others) {
        const b = document.createElement("button");
        b.className = "btn tertiary";
