// ---- chats ---------------------------------------------------------------
// Asking is a conversation, not a single shot. The concepts a conversation turns out
// to circle are kept beside it, and each one can still hang a room, which is the
// only reason to store them rather than to name a chat by its first line.

let chat = null;
let rail = null;

function teardown() {
  if (readerWatch) { readerWatch.disconnect(); readerWatch = null; }
  chat = null;
}

async function startChat(text) {
  const asked = {kind: scope.kind, id: scope.id};
  view.innerHTML = '<div class="state thinking">reading what you saved...</div>';
  let made;
  try {
    made = await api("/chats", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        scope_kind: asked.kind === "artifact" || asked.kind === "exhibit" ? asked.kind : "everything",
        scope_id: asked.id || null,
        text,
      })});
  } catch (err) { return chatFailed(err, text); }
  showChat(made.chat.id, made);
}

async function chatFailed(err, text) {
  const why = await api("/chats/ready").catch(() => ({ready: true, reason: null}));
  view.innerHTML = '<div class="back" onclick="home()">&larr; everything</div>' +
    '<div class="state">' + (why.ready
      ? "The curator could not answer.<br><br><span class=\"gold\">" + esc(String(err)) +
        "</span><br><br>Nothing was lost. Your question was " + esc(text) + "."
      : "There is nothing to answer from yet: " + esc(why.reason) + ".") + "</div>";
}

async function showChat(id, preloaded) {
  if (readerWatch) { readerWatch.disconnect(); readerWatch = null; }
  const d = preloaded || await api("/chats/" + id);
  chat = d;
  scope = {kind: "chat", id, label: "this conversation"};
  showRail(id);
  renderChat(d);
  composer();
}

function renderChat(d, pending) {
  // The scope is a constraint, not a subtitle. Rendered as metadata it read like a
  // caption, and a chat silently locked to one empty link answered "nothing you have
  // saved" to a question the museum could answer instantly. Say what it can see, and
  // put the way out next to it.
  const scoped = d.chat.scope_kind !== "everything";
  let html = '<div class="back" onclick="home()">&larr; everything</div>' +
    '<div class="h1">' + esc(d.chat.title) + "</div>" +
    (scoped
      ? '<div class="aside why">reading only <b>' + esc(d.chat.scope_label) + "</b> &middot; " +
        '<button class="topic" style="display:inline;padding:0" onclick="widenChat()">' +
        "ask everything instead</button></div>"
      : '<div class="meta">reading everything</div>');

  // Topics live here rather than in the rail. In the rail they read as a sub-tree of
  // the conversation, which is redundant with its own title and makes a list of names
  // into a list of names-plus-children. They are not navigation: each one is an
  // action that hangs a room, so they belong beside the thing they came out of.
  if (d.topics.length)
    html += '<div class="drawn"><span class="aside">Make a room from:</span>' +
      d.topics.map(t => '<button class="topic" onclick="doCurate(' +
        JSON.stringify(t.topic).replace(/"/g, "&quot;") + ')">' + esc(t.topic) +
        "</button>").join("") + "</div>";

  for (const m of d.messages) {
    html += '<div class="turn ' + (m.role === "user" ? "you" : "curator") + '">' +
      '<div class="who">' + (m.role === "user" ? "you" : "the curator") + "</div>" +
      '<div class="said md">' + (m.role === "user" ? esc(m.text) : md(m.text)) + "</div>";
    if (m.cited && m.cited.length)
      html += '<div class="from">' + m.cited.map(c =>
        '<button class="src" onclick="showArtifact(\'' + c.artifact_id + '\')">' +
        esc(c.title) + "</button>").join("") + "</div>";
    else if (m.role === "assistant" && !m.grounded)
      html += '<div class="unsourced">nothing you have saved carried this</div>';
    html += "</div>";
  }

  if (pending)
    html += '<div class="turn you"><div class="who">you</div><div class="said">' +
      esc(pending) + '</div></div><div class="turn curator">' +
      '<div class="who">the curator</div>' +
      '<div class="said thinking">reading what you saved...</div></div>';

  view.innerHTML = html;
  window.scrollTo(0, document.body.scrollHeight);
}

// The rail is present on every surface, not only inside a conversation. A thread you
// have to be already reading in order to find is a thread you will not go back to.
async function showRail(activeId) {
  document.body.classList.add("railed");
  if (!rail) {
    rail = document.createElement("nav");
    rail.className = "rail";
    rail.setAttribute("aria-label", "Conversations");
    document.body.appendChild(rail);
  }

  const list = await api("/chats?limit=40").catch(() => ({items: []}));

  const thread = c => {
    const on = c.id === activeId;
    return '<div class="threadrow' + (on ? " on" : "") + '">' +
      '<button class="thread" onclick="showChat(\'' + c.id + '\')">' +
      esc(c.title) + "</button>" +
      '<button class="pin' + (c.pinned ? " lit" : "") + '" title="' +
      (c.pinned ? "Unpin" : "Keep at the top") + '" aria-label="' +
      (c.pinned ? "Unpin" : "Keep at the top") + '" aria-pressed="' + !!c.pinned +
      '" onclick="event.stopPropagation();togglePin(\'' + c.id + '\',' + !c.pinned +
      ')">' + svg("star") + "</button></div>";
  };

  const kept = list.items.filter(c => c.pinned);
  const rest = list.items.filter(c => !c.pinned);

  rail.innerHTML =
    '<button class="gohome" onclick="home()">' + svg("home") + "Everything</button>" +
    "<h2>Conversations</h2>" +
    '<button class="newchat" onclick="openField(\'ask\')">' + svg("plus") + "Ask something</button>" +
    (kept.length ? '<div class="kept">' + kept.map(thread).join("") + "</div>" : "") +
    (rest.length ? rest.map(thread).join("")
                 : (kept.length ? ""
                    : '<div class="aside" style="padding:0 var(--sp-3)">Nothing asked yet.</div>')) +
    '<div class="railfoot"><button class="gear" onclick="showSettings()">' +
    svg("gear") + "Settings</button></div>";
}

async function togglePin(id, pinned) {
  await api("/chats/" + id, {method: "PATCH", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({pinned})}).catch(() => {});
  showRail(chat ? chat.chat.id : null);
}

// Re-asks the last question with nothing withheld. A scope you cannot leave without
// starting over is a trap, and starting over is exactly what the person would do.
async function widenChat() {
  const asked = [...chat.messages].reverse().find(m => m.role === "user");
  scope = {kind: "everything", label: "everything"};
  if (!asked) { chat = null; return openField("ask"); }
  startChat(asked.text);
}

// The composer is drawn before the rail has finished loading, so the toggle looks the
// rail up when it is pressed rather than closing over a variable that may still be null.
function toggleRail() {
  const found = document.querySelector(".rail");
  if (found) found.classList.toggle("open");
}

function composer() {
  closeMenu();
  pill.classList.add("wide");
  pill.innerHTML =
    '<button id="btnRail" aria-label="Conversations" onclick="toggleRail()">' +
    svg("rail") + "</button>" +
    '<input id="field" placeholder="ask about ' + esc(chat.chat.scope_label) + '" autocomplete="off">' +
    '<button aria-label="Leave" onclick="home()">' + svg("close") + "</button>";

  const field = document.getElementById("field");
  field.focus();
  field.onkeydown = e => {
    if (e.key === "Escape") return home();
    if (e.key !== "Enter") return;
    const v = field.value.trim();
    if (!v) return;
    field.value = "";
    sendInChat(v);
  };
}

async function sendInChat(text) {
  const id = chat.chat.id;
  renderChat(chat, text);
  let d;
  try {
    d = await api("/chats/" + id + "/messages", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
  } catch (err) {
    chat = await api("/chats/" + id);
    renderChat(chat);
    const note = document.createElement("div");
    note.className = "state gold";
    note.textContent = String(err);
    view.appendChild(note);
    return;
  }
  chat = d;
  renderChat(d);
  showRail(id);
  composer();
}

// ---- settings ------------------------------------------------------------
// Not a destination. This is where you go when something is wrong, so it says where
// every value came from: a field you edit that is silently overridden by an
// environment variable is worse than no field.
const SETTING_LABELS = {
  llm_model: "Model",
  llm_url: "Endpoint",
  model_retries: "Retries after a failed answer",
  user_agent: "User agent for link previews",
  hotkey: "Capture hotkey",
};

// Two spellings of the same binding, kept apart on purpose.
//
// `Alt` is what the shortcut plugin registers; `Option` is what is printed on the
// key. Showing the accelerator to a Mac user asks them to find a key their keyboard
// does not have. Store one, display the other.
const KEY_NAMES = [["CommandOrControl", "⌘"], ["Command", "⌘"], ["Cmd", "⌘"],
                   ["Control", "⌃"], ["Ctrl", "⌃"],
                   ["Alt", "⌥"], ["Option", "⌥"],
                   ["Shift", "⇧"]];

function keyLabel(accelerator) {
  return String(accelerator || "").split("+").map(part => {
    const hit = KEY_NAMES.find(([name]) => name.toLowerCase() === part.trim().toLowerCase());
    return hit ? hit[1] : part.trim().toUpperCase();
  }).join("");
}

function toAccelerator(label) {
  // Accepts what the field shows back (glyphs) and what someone might type instead.
  const parts = [];
  let rest = String(label || "");
  for (const [name, glyph] of [["Control", "⌃"], ["Alt", "⌥"], ["Shift", "⇧"],
                               ["CommandOrControl", "⌘"]]) {
    if (rest.includes(glyph)) { parts.push(name); rest = rest.split(glyph).join(""); }
  }
  for (const spoken of ["Option", "Command", "Cmd", "Ctrl", "Control", "Alt", "Shift"]) {
    const re = new RegExp("\\b" + spoken + "\\b\\s*\\+?\\s*", "i");
    if (re.test(rest)) {
      rest = rest.replace(re, "");
      const name = /option|alt/i.test(spoken) ? "Alt"
                 : /cmd|command/i.test(spoken) ? "CommandOrControl"
                 : /ctrl|control/i.test(spoken) ? "Control" : "Shift";
      if (!parts.includes(name)) parts.push(name);
    }
  }
  const key = rest.replace(/[+\s]/g, "").toUpperCase();
  return key ? [...parts, key].join("+") : parts.join("+");
}

// Recorded, not typed. Nobody knows the accelerator spelling of the key they want,
// and everybody can press it.
let recording = null;

function recordHotkey(button) {
  if (recording) return;
  const label = document.getElementById("hotkeyLabel");
  const previous = label.textContent;
  button.classList.add("listening");
  label.textContent = "press a combination";

  const stop = () => {
    window.removeEventListener("keydown", onKey, true);
    button.classList.remove("listening");
    recording = null;
  };

  const onKey = e => {
    e.preventDefault();
    e.stopPropagation();

    if (e.key === "Escape") { label.textContent = previous; return stop(); }

    // A bare letter is not a system-wide shortcut, it is the letter T. Wait until at
    // least one modifier is held before accepting anything.
    const held = [];
    if (e.ctrlKey) held.push("Control");
    if (e.altKey) held.push("Alt");
    if (e.shiftKey) held.push("Shift");
    if (e.metaKey) held.push("CommandOrControl");
    if (["Control", "Alt", "Shift", "Meta"].includes(e.key)) return;
    if (!held.length) {
      label.textContent = "hold a modifier too";
      return;
    }

    const key = e.code.startsWith("Key") ? e.code.slice(3)
              : e.code.startsWith("Digit") ? e.code.slice(5)
              : e.key.length === 1 ? e.key.toUpperCase() : e.key;
    const accelerator = [...held, key].join("+");
    label.textContent = keyLabel(accelerator);
    stop();
    saveSetting("hotkey", accelerator);
  };

  recording = onKey;
  window.addEventListener("keydown", onKey, true);
}

function bytes(n) {
  if (!n) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  const i = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
  return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + units[i];
}

async function showSettings() {
  teardown();
  restorePill("inside");
  showRail(null);
  view.innerHTML = '<div class="state">...</div>';
  const d = await api("/settings");

  let html = '<div class="h1">Settings</div>';

  html += '<div class="shelf">The model</div>';

  // Which backend answers is the one setting here that changes what the product is,
  // so it says so at the point of choosing rather than in a note somewhere else.
  const chosen = d.settings.llm_backend;
  html += '<div class="field"><label for="s_backend">Answers come from</label>' +
    '<select id="s_backend"' + (chosen.locked ? " disabled" : "") +
    ' onchange="chooseBackend(this.value)">' +
    d.backends.map(b => '<option value="' + esc(b.name) + '"' +
      (b.name === chosen.value ? " selected" : "") + ">" + esc(b.label) + "</option>").join("") +
    "</select>";

  const picked = d.backends.find(b => b.name === chosen.value);
  if (picked && !picked.local)
    html += '<div class="aside why">The text of whatever is retrieved gets sent to ' +
      esc(picked.label) + ". Artifacts marked local only never take this path." +
      (picked.needs_key && !picked.key_present
        ? " <b>No API key is set</b>, so calls will fail until ENQ_LLM_API_KEY is exported."
        : "") + "</div>";
  else if (picked)
    html += '<div class="aside">Nothing leaves this machine.</div>';
  html += "</div>";

  for (const name of ["llm_model", "llm_url", "model_retries"]) {
    const f = d.settings[name];
    html += '<div class="field"><label for="s_' + name + '">' + esc(SETTING_LABELS[name]) +
      "</label>" +
      '<input id="s_' + name + '" value="' + esc(String(f.value ?? "")) + '"' +
      (f.locked ? " disabled" : "") + ' onchange="saveSetting(\'' + name + '\', this.value)">' +
      (f.locked ? '<div class="pinned">pinned by ' + esc(f.env_var) + " in the environment</div>" : "") +
      "</div>";
  }

  // Said plainly rather than shown as an empty field. Writing a key into a plaintext
  // file on disk would contradict the reason this product exists.
  html += '<div class="aside" style="margin-top:var(--sp-4)">API key: ' +
    (d.storage.api_key_present ? "set" : "not set") +
    ". Keys are read from <b>ENQ_LLM_API_KEY</b> and never written to disk, so there " +
    "is no field for one here.</div>";

  html += '<div class="shelf">Capture</div>';
  const hk = d.settings.hotkey;
  html += '<div class="field"><label for="s_hotkey">' + esc(SETTING_LABELS.hotkey) + "</label>" +
    '<button class="recorder" id="s_hotkey"' + (hk.locked ? " disabled" : "") +
    ' onclick="recordHotkey(this)"><span id="hotkeyLabel">' + esc(keyLabel(hk.value)) +
    "</span></button>" +
    (hk.locked ? '<div class="pinned">pinned by ' + esc(hk.env_var) + "</div>"
               : '<div class="aside">Click, then press the combination you want. ' +
                 "Takes effect on the next launch.</div>") + "</div>";

  const ua = d.settings.user_agent;
  html += '<div class="field"><label for="s_ua">' + esc(SETTING_LABELS.user_agent) + "</label>" +
    '<input id="s_ua" placeholder="Enqueue/0.2 (+https://your-contact-url)" value="' +
    esc(String(ua.value ?? "")) + '"' + (ua.locked ? " disabled" : "") +
    ' onchange="saveSetting(\'user_agent\', this.value)">' +
    '<div class="aside">Some publishers refuse a client with no contact URL. Naming ' +
    "yourself is how you satisfy that; disguising the request is not.</div></div>";

  const s = d.storage;
  html += '<div class="shelf">Where everything lives</div><div class="facts">' +
    "<b>data</b> " + esc(s.data_dir) + "<br>" +
    "<b>database</b> " + bytes(s.database.bytes) + "<br>" +
    "<b>files</b> " + bytes(s.blobs.bytes) + "<br>" +
    "<b>index</b> " + bytes(s.index.bytes) + "<br>" +
    Object.entries(s.counts).map(([k, v]) => "<b>" + esc(k) + "</b> " + v).join("<br>") +
    "</div>" +
    '<button class="act" onclick="rebuildIndex(this)">Rebuild the index</button>' +
    '<div class="aside">Everything derived is thrown away and made again from what you ' +
    "wrote and what you saved. Nothing you authored is touched.</div>";

  html += '<div id="settingState" class="aside why"></div>';
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

// Switching backend moves the endpoint with it, because leaving the old URL behind
// would point a hosted model at localhost and fail in a way nobody could read.
const BACKEND_MODELS = {
  ollama: "llama3.1:8b",
  openrouter: "google/gemini-3-flash",
  openai: "gpt-5.6-luna",
};

async function chooseBackend(name) {
  const list = (await api("/settings")).backends;
  const spec = list.find(b => b.name === name);
  const changes = {llm_backend: name};
  if (spec && spec.url) changes.llm_url = spec.url;
  if (BACKEND_MODELS[name]) changes.llm_model = BACKEND_MODELS[name];

  try {
    await api("/settings", {method: "PATCH", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({changes})});
  } catch (err) {
    const state = document.getElementById("settingState");
    if (state) state.textContent = String(err);
    return;
  }
  showSettings();
}

async function saveSetting(name, value) {
  const state = document.getElementById("settingState");
  try {
    await api("/settings", {method: "PATCH", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({changes: {[name]: value}})});
    if (state) { state.textContent = "saved"; setTimeout(() => { state.textContent = ""; }, 2000); }
  } catch (err) {
    if (state) state.textContent = String(err);
  }
}

async function rebuildIndex(button) {
  button.disabled = true;
  button.textContent = "rebuilding...";
  try {
    const r = await api("/index", {method: "POST"});
    button.textContent = "Rebuilt " + r.chunks.indexed + " passages";
  } catch (err) {
    button.disabled = false;
    button.textContent = "Could not rebuild: " + String(err);
  }
}

// A topic drawn out of a conversation is the same kind of thing a lens is, so it
// hangs a room. The chat it came from stays in the rail, because the room is a move
// inside the conversation rather than a departure from it.
let room = null;

async function doCurate(lens) {
  const backTo = chat ? chat.chat.id : null;
  const stages = [
    "expanding the lens into the way documents actually talk",
    "searching the literal and conceptual layers",
    "reading each candidate and deciding whether it belongs",
    "looking for what they share, and where they disagree",
  ];
  let i = 0;
  view.innerHTML = '<div class="state thinking" id="stage">' + stages[0] + "</div>";
  const tick = setInterval(() => {
    i = Math.min(i + 1, stages.length - 1);
    const el = document.getElementById("stage");
    if (el) el.textContent = stages[i];
  }, 9000);

  let r;
  try {
    r = await api("/curate", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({lens, keep: 8, pool: 10})});
  } catch (err) {
    clearInterval(tick);
    view.innerHTML = back(backTo) +
      '<div class="state">The curator could not finish.<br><br><span class="gold">' +
      esc(String(err)) + "</span><br><br>Nothing was lost. The artifacts are untouched; only the " +
      "room failed to hang.</div>";
    return;
  }
  clearInterval(tick);

  const ex = r.exhibit || {};
  room = {lens, exhibit: ex, kept: r.kept};

  let html = back(backTo) +
    '<div class="h1">' + esc(ex.suggested_name || lens) + "</div>" +
    '<div class="meta">' + r.kept.length + " kept &middot; " + r.rejected +
    " rejected &middot; " + r.considered + " considered</div>";
  if (ex.through_line) html += '<div class="md" style="margin:var(--sp-4) 0">' + esc(ex.through_line) + "</div>";
  if (ex.thin) html += '<div class="state gold">thin &middot; ' + esc(ex.thin_reason) + "</div>";

  // A room can come back short for two very different reasons: the collection did not
  // hold it, or the model could not do the job. Saying which is the difference between
  // a useful answer and a mystery.
  if (r.failed)
    html += '<div class="aside why">' + r.failed + " of " + r.considered +
      " judgments failed their checks; those artifacts were dropped without being judged.</div>";
  if (r.synthesis_error)
    html += '<div class="aside why">no through line: ' + esc(r.synthesis_error) + "</div>";

  r.kept.forEach((k, j) => {
    html += '<div class="item hang" style="animation-delay:' + j * 70 + 'ms" ' +
      "tabindex=\"0\" role=\"button\" onclick=\"showArtifact('" + k.artifact_id + "')\" " +
      "onkeydown=\"rowKey(event, () => showArtifact('" + k.artifact_id + "'))\">" +
      "<div class=\"item-body\">" +
      '<div class="title">' + esc(k.title) + "</div>" +
      '<div class="md" style="font-size:14px">' + esc(k.placard) + "</div>" +
      '<div class="meta">match ' + k.strength + "</div></div></div>";
  });

  // A room costs three model passes to build. Keeping one is a decision, not a
  // default, but re-deriving it later would cost the same again, so the offer is here.
  if (r.kept.length)
    html += '<button class="act" id="btnKeep" onclick="keepRoom()">Keep this room</button>';

  view.innerHTML = html;
  window.scrollTo(0, 0);
}

function back(chatId) {
  return chatId
    ? '<div class="back" onclick="showChat(\'' + chatId + '\')">&larr; the conversation</div>'
    : '<div class="back" onclick="home()">&larr; everything</div>';
}

async function keepRoom() {
  const button = document.getElementById("btnKeep");
  if (!room || !button) return;
  button.disabled = true;
  try {
    await api("/exhibits", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(room)});
    button.textContent = "Kept";
  } catch (err) {
    button.disabled = false;
    button.textContent = "Could not keep it: " + String(err);
  }
}

home();
</script>
