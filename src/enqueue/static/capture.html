<!doctype html>
<meta charset="utf-8" />
<title>Enqueue capture</title>
<link
  rel="preload"
  href="fonts/IBM-Plex-Sans-400.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<style>
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src:
      url("fonts/IBM-Plex-Sans-400.woff2") format("woff2"),
      url("fonts/IBMPlexSans-Regular.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 500;
    font-style: normal;
    font-display: swap;
    src:
      url("fonts/IBM-Plex-Sans-500.woff2") format("woff2"),
      url("fonts/IBMPlexSans-Medium.ttf") format("truetype");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 600;
    font-style: normal;
    font-display: swap;
    src:
      url("fonts/IBM-Plex-Sans-600.woff2") format("woff2"),
      url("fonts/IBMPlexSans-SemiBold.ttf") format("truetype");
  }
  :root {
    /* The overlay is self-contained on purpose. It is served from the same engine as
       the home window but it is a different surface with a different lifetime, and having
       it depend on the home page's stylesheet would mean a layout change over there can
       silently break the thing you press when you are mid-sentence somewhere else.
       The tokens below are the small subset of home.html the overlay actually uses,
       copied rather than shared, at the same values as the home page's :root (Phase A). */
    --bg: #ffffff;
    --surface: #f6f7f9;
    /* The keycap's ground (C.3d): the home page's faint-cool reading tint, copied
       with the badge rule because the overlay is standalone on purpose. */
    --surface-doc: #fbfbfd;
    --line: #dedee5;
    --line-strong: #7f8296;
    --text: #101114;
    --text-mute: #686b82;
    --ink-faint: #6c6f84;
    --accent: #60079f;
    /* The drag-over boundary is the accent (now the eye's bold purple), matching
       tokens.css so bin/check-contrast's capture-parity pass stays green. */
    --accent-strong: #60079f;
    --lavender-subtle: rgba(96, 7, 159, 0.12);
    /* The capture overlay wears the eye's bold purple (#60079f) on its brand disc
       and focus edge, matching the app mark. These are capture-local extras (not in
       the shared token set), so they carry the eye's saturation without drifting
       the synced lavender tokens above. */
    --purple-bold: #60079f;
    --purple-bold-wash: rgba(96, 7, 159, 0.1);
    /* Errors. The same danger hue as the app; the pink is only the image-kind
       hue (C.3), never an error color. */
    --danger: #b4332b;
    --pink: #8f4273;

    /* Kind is a fact about a thing, never an action, so none of these is the
       accent. Same values as the home page's :root (C.3b); the overlay copies
       them because it is standalone on purpose. */
    --kind-note: #30804b;
    --kind-link: #376899;
    --kind-image: #8f4273;
    --kind-file: #755c12;

    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-full: 9999px;
    --shadow-lifted: 0 8px 28px rgba(16, 17, 20, 0.08);

    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur: 160ms;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
    /* The window is transparent so the card can carry its own edge and shadow.
       Anything painted on the body would show up as a rectangle around it. */
    background: transparent;
    overflow: hidden;
  }

  body {
    font-family: var(--sans);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    height: 100vh;
  }

  /* The transparent window IS the floating card - it fills the window, carries its
     own rounded edge and shadow, and floats on the desktop (the dequeue capture
     model, without dimming the whole screen). */
  #card {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lifted);
    padding: 14px;
    transition:
      border-color var(--dur) var(--ease),
      box-shadow var(--dur) var(--ease),
      opacity 160ms var(--ease),
      transform 160ms var(--ease);
  }
  /* On a successful keep the card leaves before the bird flies (K.5 reorder). */
  #card.kept {
    opacity: 0;
    transform: scale(0.98);
  }

  #card.hovering {
    border-color: var(--purple-bold);
  }

  /* The focus signal is the app's ring, carried by the card so the borderless
     field can stay borderless. Same lavender ring as every input in the app, sized
     for the card's 12px radius. */
  /* The focus ring lives on the input box (#fieldbox), not the card, so the two
     never double up; the card keeps its hairline. */

  /* ------------------------------------------------------------------ title bar */

  /* A slim grab handle at the top of the card - the whole strip drags the window,
     with the brand disc centred in it. Nothing in it may swallow a mousedown. */
  #bar {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 12px;
    flex: 0 0 12px;
    user-select: none;
    cursor: default;
  }

  #bar .disc {
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--purple-bold);
    opacity: 0.5;
  }

  /* The kind-hue dot (C.3b): a 6px chip in the kind's own color, sitting next
     to the label it describes. Hidden until the field has something to
     classify; transparent when shown without a hue. */
  #bar .kind-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  #bar .kind-wrap .dot {
    width: 6px;
    height: 6px;
    flex-shrink: 0;
    border-radius: 50%;
    background: transparent;
  }

  #bar .kind-wrap .dot[hidden] {
    display: none;
  }

  .label {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 0.4px;
    color: var(--text-mute);
    white-space: nowrap;
  }

  #kind {
    color: var(--text);
  }

  .label.problem {
    color: var(--danger);
  }

  /* --------------------------------------------------------------------- field */

  /* The prominent input box: a tinted, rounded well the person types into, with the
     purple focus ring on the box itself - the dequeue capture model. */
  #fieldbox {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 12px 14px;
    transition:
      border-color var(--dur) var(--ease),
      box-shadow var(--dur) var(--ease);
  }
  #fieldbox:focus-within {
    border-color: var(--purple-bold);
    box-shadow: 0 0 0 3px var(--purple-bold-wash);
  }

  #field {
    flex: 1 1 auto;
    min-height: 0;
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    outline: none;
    caret-color: var(--text);
    overflow-y: auto;
    word-wrap: break-word;
  }
  /* The placeholder is the standard contenteditable trick: show it while the
     field is :empty, and also over the seeded empty <p><br></p> the field mounts
     with (NOTE.1's shape) so it reads until the first real character. */
  #field:empty::before,
  #field:has(> p:only-child > br:only-child)::before {
    content: attr(data-placeholder);
    color: var(--ink-faint);
  }
  /* Rich blocks, minimal: a heading reads larger, a list shows its markers, a
     quote its bar. The capture box is the note editor's smaller cousin. */
  #field h1,
  #field h2,
  #field h3 {
    font-weight: 600;
    line-height: 1.3;
    margin: 0;
  }
  #field h1 {
    font-size: 1.3em;
  }
  #field h2 {
    font-size: 1.18em;
  }
  #field h3 {
    font-size: 1.08em;
  }
  #field p {
    margin: 0;
  }
  #field ul,
  #field ol {
    margin: 0;
    padding-left: 1.25em;
  }
  #field li {
    margin: 0;
  }
  #field blockquote {
    margin: 0;
    padding-left: 0.7em;
    border-left: 2px solid var(--line-strong);
    color: var(--text-mute);
  }

  #foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  /* The caption row under the box: the kind hue-dot plus its label, and errors. */
  .cap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    overflow: hidden;
  }
  .cap .dot {
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    border-radius: 50%;
    background: transparent;
  }
  .cap .dot[hidden] {
    display: none;
  }
  #status {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* The keep action: a filled bold-purple pill with white ink - the one instruction
     on the surface, the dequeue "Add task" model. */
  #keep {
    flex-shrink: 0;
    border: 0;
    border-radius: var(--r-full);
    background: var(--purple-bold);
    color: #fff;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0;
    padding: 8px 18px;
    cursor: pointer;
    transition:
      background 140ms var(--ease),
      transform 140ms var(--ease);
  }
  #keep:hover {
    background: #7a1fc0;
  }
  #keep:active {
    transform: scale(0.96);
  }

  .busy {
    opacity: 0.55;
  }

  /* The kept beat (K.5): one calm settle of the brand disc - a single pulse,
     then the window goes away. Reduced motion skips the animation entirely and
     keptBeat's guard dismisses at once. */
  #bar .brand .disc.settle {
    animation: disc-settle 260ms var(--ease);
  }

  @keyframes disc-settle {
    0% {
      transform: scale(1);
    }
    40% {
      transform: scale(1.28);
    }
    100% {
      transform: scale(1);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    #bar .brand .disc.settle {
      animation: none;
    }
  }

  /* CAP2.2 pivot: the capture-success raven flies INSIDE this overlay, then the
     overlay dismisses. The capture window is already transparent, always-on-top, and
     summoned over whatever app the person captured from, so the raven shows over that
     app with no separate always-on-top window and no macOS window-level hacks. The
     card is hidden for the flight so only the raven paints over the app. Inlined from
     the shared ANIM.4 keyframes; GPU transform/opacity only; reduced motion fades. */
  #card.flying {
    visibility: hidden;
  }
  .capture-flight {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 220px;
    height: auto;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    will-change: transform, opacity;
  }
  .capture-flight:not(.reduced) {
    animation: raven-flight 1.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .capture-flight.reduced {
    animation: raven-fade 1.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes raven-flight {
    0% {
      transform: translate(calc(-50% - 100vw), -50%);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    31.6% {
      transform: translate(-50%, -50%);
    }
    84.2% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }
  @keyframes raven-fade {
    0% {
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    84.2% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }
</style>

<div id="card">
  <div id="bar" aria-hidden="true">
    <span class="disc"></span>
  </div>
  <div id="fieldbox">
    <div
      id="field"
      contenteditable="true"
      data-placeholder="Toss it here - text, a link, or markdown."
      spellcheck="false"
    ></div>
  </div>
  <div id="foot">
    <span class="cap">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <span class="label" id="kind"></span>
      <span class="label problem" id="status"></span>
    </span>
    <button id="keep" type="button">Keep</button>
  </div>
</div>

<script src="/static/js/md.js"></script>
<script>
  const card = document.getElementById("card");
  const bar = document.getElementById("bar");
  const field = document.getElementById("field");
  const kindLabel = document.getElementById("kind");
  const dot = document.getElementById("dot");
  const statusLabel = document.getElementById("status");
  const disc = document.querySelector("#bar .disc");
  const keepBtn = document.getElementById("keep");

  const invoke = window.__TAURI__ ? window.__TAURI__.core.invoke : null;

  // A single token that is plausibly an address: an explicit scheme, a www., or a
  // bare host.tld with no whitespace anywhere. The engine fills in https:// for the
  // last two, so being permissive here costs nothing and saves the person from
  // having to type a scheme they never type anywhere else.
  const URLISH =
    /^(?:[a-z][a-z0-9+.-]*:\/\/\S+|www\.\S+|[\w-]+(?:\.[\w-]+)+(?:[/?#]\S*)?)$/i;

  function looksLikeLink(text) {
    const t = text.trim();
    return t.length > 0 && !/\s/.test(t) && URLISH.test(t);
  }

  // The most natural thing to type is the address and why you bothered. Treating that
  // as a note meant the link was never a link: no preview, no title, no picture, and
  // findable only by the words you happened to use rather than the ones on the page.
  //
  // So a URL anywhere in the text makes this a link, and everything else you typed
  // becomes the note on it. Both halves survive, in the places that can use them.
  function splitLink(text) {
    const words = text.trim().split(/\s+/);
    const at = words.findIndex((w) => URLISH.test(w));
    if (at === -1) return null;

    const url = words[at];
    // Stripped only when the address is at one end, which is how people actually
    // write it. Pulling it out of the middle of a sentence would leave "read later"
    // where "read example.com later" was, so there the whole line is kept as written.
    const inside = at !== 0 && at !== words.length - 1;
    const note = inside
      ? text.trim()
      : words
          .filter((_, i) => i !== at)
          .join(" ")
          .trim();

    return { url, note };
  }

  let pending = 0; // files waiting to be dropped, only meaningful while hovering
  let pendingAllImages = false;

  // The dot next to the kind label (C.3b) wears the kind's own hue: note
  // green, link blue, image pink, plain files the file ochre. Empty field
  // hides the dot entirely.
  const KIND_HUES = {
    note: "var(--kind-note)",
    link: "var(--kind-link)",
    image: "var(--kind-image)",
    file: "var(--kind-file)",
  };

  function setKind(text, hue) {
    kindLabel.textContent = text;
    const on = !!(text && hue);
    dot.hidden = !on;
    dot.style.background = on ? KIND_HUES[hue] : "";
  }

  // The markdown shorthands that convert as you type, mirroring the note editor's
  // RULES (artifact.js) minus the code fence, which the one-field capture box does
  // not need. The serializer (htmlToMd) is shared: it comes from md.js, loaded above,
  // never copied here.
  const CAPTURE_RULES = [
    [/^(#{1,3})\s$/, (m) => "h" + m[1].length],
    [/^[-*+]\s$/, () => "ul"],
    [/^1\.\s$/, () => "ol"],
    [/^>\s$/, () => "blockquote"],
  ];

  function applyFieldRules() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    let block = sel.anchorNode;
    while (block && block.parentNode !== field) block = block.parentNode;
    if (!block) return;
    // A bare text node (a browser that did not wrap the first line in a block) gets
    // a <p> so the rules have a real block to convert - the same fallback as the
    // note editor; the seed below means the caret is normally already in one.
    if (block.nodeType !== 1) {
      if (block.nodeType !== 3) return;
      const p = document.createElement("p");
      block.parentNode.insertBefore(p, block);
      p.appendChild(block);
      block = p;
    }
    if (["UL", "OL", "BLOCKQUOTE"].includes(block.tagName)) return;

    const text = block.textContent;
    for (const [re, kind] of CAPTURE_RULES) {
      const m = text.match(re);
      if (!m) continue;
      const tag = kind(m);
      document.execCommand(
        tag === "ul"
          ? "insertUnorderedList"
          : tag === "ol"
            ? "insertOrderedList"
            : "formatBlock",
        false,
        tag === "ul" || tag === "ol" ? null : tag,
      );
      // A list command nests the new list inside the paragraph it converted
      // (`<p><ul><li>...`), which htmlToMd reads as a paragraph and flattens to
      // plain text. Unwrap until the list is a direct child of the field.
      const isList = tag === "ul" || tag === "ol";
      let made = isList ? block.querySelector("ul, ol") : null;
      if (isList && !made) {
        const caret = window.getSelection().anchorNode;
        const el =
          caret && caret.nodeType === 1 ? caret : caret && caret.parentElement;
        made = el && el.closest ? el.closest("ul, ol") : null;
      }
      if (isList) {
        while (made && made.parentNode && made.parentNode !== field) {
          const wrap = made.parentNode;
          wrap.parentNode.insertBefore(made, wrap);
          wrap.remove();
        }
      } else {
        const caret = window.getSelection().anchorNode;
        const el =
          caret && caret.nodeType === 1 ? caret : caret && caret.parentElement;
        made = el && el.closest ? el.closest("h1, h2, h3, blockquote") : null;
      }
      // The marker characters were the instruction, not the content: strip them
      // from the converted block's first text node.
      const first =
        made && made.firstElementChild
          ? made.firstElementChild.firstChild
          : made
            ? made.firstChild
            : null;
      const host = first && first.nodeType === 3 ? first : null;
      if (host)
        host.nodeValue = host.nodeValue.replace(/^(#{1,3}|[-*+]|1\.|>)\s/, "");
      // The marker was the whole block, so a heading/quote is now empty. An empty
      // text node is an unreliable caret anchor in Chrome/WebKit (the next
      // keystroke lands before the block instead of inside it), so anchor the
      // caret on a <br>, exactly like the seeded empty paragraph.
      if (!isList && made) {
        made.textContent = "";
        made.appendChild(document.createElement("br"));
        const sel2 = window.getSelection();
        const r2 = document.createRange();
        r2.setStart(made.firstChild, 0);
        r2.collapse(true);
        sel2.removeAllRanges();
        sel2.addRange(r2);
      }
      return;
    }
  }

  // The field's text, as markdown. paint() and keep() both read this so what the
  // kind detector sees is exactly what a keep stores (md.js's htmlToMd).
  function fieldText() {
    return htmlToMd(field);
  }

  // An empty field is a single <p><br></p> so the caret is never in a bare text
  // node (NOTE.1's char-stacking fix, which the WebKit capture window actually
  // ships on). The placeholder rule above covers this shape.
  function seedField() {
    const p = document.createElement("p");
    p.appendChild(document.createElement("br"));
    field.replaceChildren(p);
    const r = document.createRange();
    r.setStart(p.firstChild || p, 0);
    r.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }

  function placeCaretEnd() {
    const r = document.createRange();
    r.selectNodeContents(field);
    r.collapse(false);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }

  function paint() {
    if (pending) {
      setKind(
        pending === 1 ? "1 file" : pending + " files",
        pendingAllImages ? "image" : "file",
      );
      return;
    }
    const text = fieldText();
    if (!text.trim()) {
      setKind("", null);
      return;
    }
    const split = splitLink(text);
    setKind(
      !split ? "Note" : split.note ? "Link + note" : "Link",
      split ? "link" : "note",
    );
  }

  function say(message, problem) {
    statusLabel.textContent = message || "";
    statusLabel.classList.toggle("problem", !!problem);
  }

  /// The "kept" beat (C.3c/K.5): a brief confirmation before the overlay goes
  /// away. The status reads "Kept.", the card border goes lavender, and the
  /// brand disc settles once - one calm pulse - for
  /// 260ms, then everything resets so the next summon starts clean. Reduced
  /// motion skips the flash and the pulse and dismisses at once.
  async function keptBeat() {
    say("Kept.");
    card.style.borderColor = "var(--purple-bold)";
    disc.classList.add("settle");
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      await new Promise((resolve) => setTimeout(resolve, 260));
    }
    disc.classList.remove("settle");
    say("");
    card.style.borderColor = "";
  }

  function busy(on) {
    card.classList.toggle("busy", on);
    field.contentEditable = on ? "false" : "true";
  }

  /// CAP2.2 pivot: fly the raven across the overlay once, over whatever app the person
  /// captured from, and resolve when it lands (or a safety timer fires). A fresh img is
  /// mounted each time so the CSS animation restarts; it is removed on end so nothing
  /// persists into the next summon. Reduced motion surfaces a fade instead of the fly.
  function overlayFlight() {
    return new Promise((resolve) => {
      const old = document.getElementById("flightBird");
      if (old) old.remove();
      const bird = document.createElement("img");
      bird.id = "flightBird";
      bird.className =
        "capture-flight" +
        (window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? " reduced"
          : "");
      bird.src = "/static/capture-bird.png";
      bird.alt = "";
      bird.setAttribute("aria-hidden", "true");
      document.body.appendChild(bird);
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        bird.remove();
        resolve();
      };
      bird.addEventListener("animationend", finish);
      // Safety: a hidden/paused tab never fires animationend, so never hang the dismiss.
      setTimeout(finish, 2100);
    });
  }

  /// Put the overlay away and hand focus back to wherever the person was. Rust owns
  /// this because hiding the window is not enough on macOS: showing it activated
  /// Enqueue at the process level, so the app has to be hidden too or the person
  /// lands in Enqueue instead of the editor they were typing in.
  function dismiss() {
    if (invoke) invoke("capture_dismiss").catch(() => {});
  }

  // Clicking anything else puts the overlay away, which for a window with no chrome
  // is the ordinary way out: there is nothing to click that means "cancel".
  //
  // The guard matters. The window emits a transient unfocused event while it is being
  // shown, so dismissing on the first one would close the overlay the instant the
  // hotkey opened it. Only a loss of focus *after* it has actually held focus counts.
  (function dismissOnFocusLoss() {
    const w = window.__TAURI__ && window.__TAURI__.window;
    if (!w || !w.getCurrentWindow) return;

    let hasHeldFocus = false;
    try {
      w.getCurrentWindow().onFocusChanged(({ payload: focused }) => {
        if (focused) {
          hasHeldFocus = true;
          card.classList.remove("kept");
          field.focus();
        } else if (hasHeldFocus) {
          hasHeldFocus = false;
          dismiss();
        }
      });
    } catch (_) {
      // No Tauri window API means this is being viewed in a plain browser, where
      // there is no overlay to dismiss.
    }
  })();

  async function send(path, init) {
    const response = await fetch(path, init);
    if (!response.ok) {
      let detail = response.status + "";
      try {
        detail = (await response.json()).detail || detail;
      } catch (_) {}
      throw new Error(detail);
    }
    return response.json();
  }

  async function keepFiles(files) {
    for (const file of files) {
      const form = new FormData();
      form.append("file", file, file.name);
      await send("/capture/upload", { method: "POST", body: form });
    }
  }

  /// One field, four outcomes, no question asked. Which one it is falls out of what
  /// is in the field rather than out of a control the person has to operate first.
  async function keep() {
    const text = fieldText().trim();
    if (!text) return;

    busy(true);
    say("Keeping");
    try {
      const split = splitLink(text);
      if (split) {
        const made = await send("/capture/link", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: split.url }),
        });
        // A note on a capture is an annotation, which is exactly what the box on the
        // artifact's own page writes. Same field, reached from somewhere else.
        if (split.note) {
          await send("/artifacts/" + made.id + "/annotations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: split.note }),
          });
        }
      } else {
        await send("/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ body: text }),
        });
      }
      seedField();
      paint();
      busy(false);
      // CAP2.2 pivot: a brief "kept" beat, then the raven flies INSIDE this overlay
      // (which already sits over the app the person captured from) before the overlay
      // dismisses. Reduced motion still fades. See the .capture-flight CSS above.
      card.classList.add("kept");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduced) {
        await new Promise((r) => setTimeout(r, 160));
      }
      card.classList.add("flying");
      await overlayFlight();
      if (invoke) invoke("capture_dismiss").catch(() => {});
      card.classList.remove("flying", "kept");
    } catch (err) {
      // The text stays. Losing what someone just typed because a background
      // process is down is the one failure this whole surface exists to avoid.
      say("Not kept: " + err.message, true);
    } finally {
      busy(false);
    }
  }

  field.addEventListener("input", () => {
    applyFieldRules();
    paint();
  });
  keepBtn.addEventListener("click", keep);

  field.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      event.preventDefault();
      // Escape is "not now", not "discard": whatever is half-typed is still there
      // the next time the overlay is summoned.
      dismiss();
      return;
    }
    // A plain Enter submits the capture, exactly as the Keep button does.
    // Shift+Enter (or Cmd/Ctrl+Enter) is a newline: markdown-as-you-type needs
    // multi-line input ("- a" Shift+Enter "- b" is a bullet list).
    if (
      event.key === "Enter" &&
      !event.shiftKey &&
      !event.ctrlKey &&
      !event.metaKey
    ) {
      event.preventDefault();
      keep();
    }
  });

  // An image on the clipboard is the case where asking "what kind is this?" would be
  // most obviously absurd, so it is captured on arrival rather than pasted as a
  // filename the person then has to explain.
  field.addEventListener("paste", async (event) => {
    const items = Array.from(
      event.clipboardData ? event.clipboardData.items : [],
    );
    const images = items
      .filter((item) => item.kind === "file" && item.type.startsWith("image/"))
      .map((item) => item.getAsFile())
      .filter(Boolean);
    if (!images.length) return;

    event.preventDefault();
    busy(true);
    say("Keeping");
    try {
      const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      await keepFiles(
        images.map((file, index) => {
          const suffix = (file.type.split("/")[1] || "png").replace(
            /[^a-z0-9]/gi,
            "",
          );
          const name =
            images.length > 1
              ? `pasted-${stamp}-${index + 1}`
              : `pasted-${stamp}`;
          return new File([file], `${name}.${suffix}`, { type: file.type });
        }),
      );
      busy(false);
      await keptBeat();
      // CAP2.2 pivot: fly the raven inside the overlay (over the app), then dismiss.
      card.classList.add("flying");
      await overlayFlight();
      if (invoke) invoke("capture_dismiss").catch(() => {});
      card.classList.remove("flying");
    } catch (err) {
      say("Not kept: " + err.message, true);
    } finally {
      busy(false);
    }
  });

  // Tauri's own drag-drop handler is switched off for this window (see main.rs), so
  // these are the real web events and the dropped items are real Files.
  let depth = 0; // dragenter/dragleave fire per child element, so they are counted

  window.addEventListener("dragover", (event) => {
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
  });

  window.addEventListener("dragenter", (event) => {
    depth += 1;
    const files = Array.from(event.dataTransfer.items || []).filter(
      (item) => item.kind === "file",
    );
    pending = files.length;
    pendingAllImages =
      files.length > 0 &&
      files.every((item) => (item.type || "").startsWith("image/"));
    card.classList.add("hovering");
    paint();
  });

  window.addEventListener("dragleave", () => {
    depth -= 1;
    if (depth > 0) return;
    depth = 0;
    pending = 0;
    card.classList.remove("hovering");
    paint();
  });

  window.addEventListener("drop", async (event) => {
    event.preventDefault();
    depth = 0;
    pending = 0;
    card.classList.remove("hovering");
    paint();

    const files = Array.from(event.dataTransfer.files || []);
    if (!files.length) return;

    busy(true);
    say("Keeping");
    try {
      await keepFiles(files);
      busy(false);
      await keptBeat();
      // CAP2.2 pivot: fly the raven inside the overlay (over the app), then dismiss.
      card.classList.add("flying");
      await overlayFlight();
      if (invoke) invoke("capture_dismiss").catch(() => {});
      card.classList.remove("flying");
    } catch (err) {
      say("Not kept: " + err.message, true);
    } finally {
      busy(false);
    }
  });

  // Dragging a transparent, undecorated window is more reliable started from Rust
  // than from the JS window API, which is why this is an invoke rather than a
  // data-tauri-drag-region attribute.
  bar.addEventListener("mousedown", (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    if (invoke) invoke("capture_drag").catch(() => {});
  });

  // The window is hidden rather than destroyed between summonings, so the caret has
  // to be put back by hand each time it returns.
  window.addEventListener("focus", () => {
    field.focus();
    // Put the caret at the end of whatever is already there (a dismissed-without-
    // keeping note keeps its text); a freshly seeded empty field already has its
    // caret inside the <p> from seedField().
    if (fieldText().trim()) placeCaretEnd();
  });

  seedField();
  field.focus();
  paint();
</script>
