  // Switching backend moves the endpoint with it, because leaving the old URL behind
  // would point a hosted model at localhost and fail in a way nobody could read.
  const BACKEND_MODELS = {
    ollama: "llama3.1:8b",
    openrouter: "google/gemini-3-flash",
    openai: "gpt-5.6-luna",
  };

  async function chooseBackend(name) {
    const list = (await api("/settings")).backends;
    const spec = list.find((b) => b.name === name);
    const changes = { llm_backend: name };
    if (spec && spec.url) changes.llm_url = spec.url;
    if (BACKEND_MODELS[name]) changes.llm_model = BACKEND_MODELS[name];

    try {
      await api("/settings", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ changes }),
      });
    } catch (err) {
      const state = document.getElementById("settingState");
      if (state) state.textContent = String(err);
      return;
    }
    showSettings();
  }

  // The value is sent once and never read back. What returns is whether a key now
  // exists and its last four characters, so the field can be cleared immediately.
  async function saveKey() {
    const field = document.getElementById("s_key");
    const state = document.getElementById("keyState");
    const key = field.value.trim();
    if (!key) return;

    try {
      await api("/settings/api-key", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key }),
      });
    } catch (err) {
      state.textContent = String(err.message || err);
      return;
    }
    field.value = "";
    showSettings();
    toast("Key stored in the Keychain.");
  }

  async function forgetKey() {
    if (!window.confirm("Forget the stored API key?")) return;
    try {
      await api("/settings/api-key", { method: "DELETE" });
    } catch (err) {
      return toast(String(err.message || err), true);
    }
    showSettings();
    toast("Key forgotten.");
  }

  async function saveSetting(name, value) {
    const state = document.getElementById("settingState");
    try {
      await api("/settings", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ changes: { [name]: value } }),
      });
      if (state) {
        state.textContent = "saved";
        setTimeout(() => {
          state.textContent = "";
        }, 2000);
      }
    } catch (err) {
      if (state) state.textContent = String(err);
    }
  }

  async function rebuildIndex(button) {
    button.disabled = true;
    button.textContent = "rebuilding...";
    try {
      const r = await api("/index", { method: "POST" });
      button.textContent = "Rebuilt " + r.chunks.indexed + " passages";
    } catch (err) {
      button.disabled = false;
      button.textContent = "Could not rebuild: " + String(err);
    }
  }

  // A topic drawn out of a conversation is the same kind of thing a lens is, so it
  // hangs a room. The chat it came from stays in the rail, because the room is a move
  // inside the conversation rather than a departure from it.
  let room = null;

  async function doCurate(lens) {
    const backTo = chat ? chat.chat.id : null;
    const stages = [
      "expanding the lens into the way documents actually talk",
      "searching the literal and conceptual layers",
      "reading each candidate and deciding whether it belongs",
      "looking for what they share, and where they disagree",
    ];
    let i = 0;
    view.innerHTML =
      '<div class="state thinking" id="stage">' + stages[0] + "</div>";
    const tick = setInterval(() => {
      i = Math.min(i + 1, stages.length - 1);
      const el = document.getElementById("stage");
      if (el) el.textContent = stages[i];
    }, 9000);

    let r;
    try {
      r = await api("/curate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lens, keep: 8, pool: 10 }),
      });
    } catch (err) {
      clearInterval(tick);
      view.innerHTML =
        back(backTo) +
        '<div class="state">The curator could not finish.<br><br><span class="gold">' +
        esc(String(err)) +
        "</span><br><br>Nothing was lost. The artifacts are untouched; only the " +
        "room failed to hang.</div>";
      return;
    }
    clearInterval(tick);

    const ex = r.exhibit || {};
    room = { lens, exhibit: ex, kept: r.kept };

    let html =
      back(backTo) +
      '<div class="h1">' +
      esc(ex.suggested_name || lens) +
      "</div>" +
      '<div class="meta">' +
      r.kept.length +
      " kept &middot; " +
      r.rejected +
      " rejected &middot; " +
      r.considered +
      " considered</div>";
    if (ex.through_line)
      html +=
        '<div class="md" style="margin:var(--sp-4) 0">' +
        esc(ex.through_line) +
        "</div>";
    if (ex.thin)
      html +=
        '<div class="state gold">thin &middot; ' +
        esc(ex.thin_reason) +
        "</div>";

    // A room can come back short for two very different reasons: the collection did not
    // hold it, or the model could not do the job. Saying which is the difference between
    // a useful answer and a mystery.
    if (r.failed)
      html +=
        '<div class="aside why">' +
        r.failed +
        " of " +
        r.considered +
        " judgments failed their checks; those artifacts were dropped without being judged.</div>";
    if (r.synthesis_error)
      html +=
        '<div class="aside why">no through line: ' +
        esc(r.synthesis_error) +
        "</div>";

    r.kept.forEach((k, j) => {
      html +=
        '<div class="item hang" style="animation-delay:' +
        j * 70 +
        'ms" ' +
        'tabindex="0" role="button" onclick="showArtifact(\'' +
        k.artifact_id +
        "')\" " +
        "onkeydown=\"rowKey(event, () => showArtifact('" +
        k.artifact_id +
        "'))\">" +
        '<div class="item-body">' +
        '<div class="title">' +
        esc(k.title) +
        "</div>" +
        '<div class="md" style="font-size:14px">' +
        esc(k.placard) +
        "</div>" +
        '<div class="meta">match ' +
        k.strength +
        "</div></div></div>";
    });

    // A room costs three model passes to build. Keeping one is a decision, not a
    // default, but re-deriving it later would cost the same again, so the offer is here.
    if (r.kept.length)
      html +=
        '<button class="act" id="btnKeep" onclick="keepRoom()">Keep this room</button>';

    view.innerHTML = html;
    window.scrollTo(0, 0);
  }

  function back(chatId) {
    return chatId
      ? '<div class="back" onclick="showChat(\'' +
          chatId +
          "')\">&larr; the conversation</div>"
      : '<div class="back" onclick="home()">&larr; everything</div>';
  }

  async function keepRoom() {
    const button = document.getElementById("btnKeep");
    if (!room || !button) return;
    button.disabled = true;
    try {
      await api("/exhibits", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(room),
      });
      button.textContent = "Kept";
    } catch (err) {
      button.disabled = false;
      button.textContent = "Could not keep it: " + String(err);
    }
  }

  home();
</script>
