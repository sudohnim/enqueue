<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Enqueue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      /* ---- capture-success flight (ANIM.4) ----------------------------------
     Inlined from css/base.css so the overlay is fully self-contained. The raven
     flies in from the left edge to screen centre, holds, then fades out.
     GPU transform/opacity only; pointer-events none so it never blocks a click;
     will-change while the bird lives. Reduced motion drops the fly and keeps a
     plain fade. The raven is removed when the run ends. */
      .capture-flight {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 220px;
        height: auto;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 100;
        opacity: 0;
        will-change: transform, opacity;
      }
      .capture-flight:not(.reduced) {
        animation: raven-flight 1.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .capture-flight.reduced {
        animation: raven-fade 1.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes raven-flight {
        0% {
          transform: translate(calc(-50% - 100vw), -50%);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        31.6% {
          transform: translate(-50%, -50%);
        }
        84.2% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes raven-fade {
        0% {
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        84.2% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- aria-hidden: the raven is pure decoration; the "you captured" moment is signalled
       over the native window, not in this overlay. -->
    <img
      id="bird"
      class="capture-flight"
      src="/static/capture-bird.png"
      alt=""
      aria-hidden="true"
    />
    <script>
      (function () {
        var bird = document.getElementById("bird");

        // Reduced motion surfaces a plain fade instead of the fly-across-screen.
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          bird.classList.add("reduced");
        }

        // A captured run can only end once. Guards against the animation event and the
        // safety timer both firing (they race, not both should retire the overlay).
        var done = false;
        var retired = false;

        function callDone() {
          var t = window.__TAURI__;
          if (t && t.core && typeof t.core.invoke === "function") {
            t.core.invoke("flight_done").catch(function () {
              /* gone, ignore */
            });
          } else if (t && typeof t.invoke === "function") {
            t.invoke("flight_done").catch(function () {
              /* gone, ignore */
            });
          } else if (window.parent && window.parent !== window) {
            try {
              window.parent.postMessage({ enqueue: "flight-done" }, "*");
            } catch (e) {
              /* ignored */
            }
          }
        }

        function retire() {
          if (retired) return;
          retired = true;
          callDone(); // ask the shell to close the overlay window
          if (bird && bird.parentNode) {
            bird.parentNode.removeChild(bird); // stop painting once the bird is gone
          }
        }

        // ANIM.4: the CSS animation ending is the natural end of the flight.
        bird.addEventListener("animationend", retire);

        // Safety: never leave the overlay stuck on screen if an event listener missed
        // the animation end (e.g. the tab lost focus).
        setTimeout(retire, 2500);
      })();
    </script>
  </body>
</html>
