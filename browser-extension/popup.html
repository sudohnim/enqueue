<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Enqueue</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header><img src="icons/raven-48.png" alt="" width="28" height="28" /><span>Enqueue</span></header>

    <form id="connect" hidden>
      <p>Connect this browser to Enqueue on this Mac.</p>
      <ol>
        <li>In Enqueue, open Settings, Capture.</li>
        <li>Under Browser extension, press Show a connect code.</li>
        <li>Paste the code here.</li>
      </ol>
      <input id="code" autocomplete="off" spellcheck="false" placeholder="enq-..." aria-label="Connect code" />
      <button type="submit">Connect</button>
    </form>

    <form id="save" hidden>
      <input id="title" aria-label="Title" />
      <div id="url" class="quiet"></div>
      <textarea id="note" rows="3" placeholder="Why keep it? (optional)" aria-label="Your note"></textarea>
      <button type="submit">Save</button>
      <button type="button" id="forget" class="linkish">Use another connect code</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <script src="enqueue.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
