[project]
name = "enqueue"
version = "0.1.0"
description = "A digital hoarder's dream. Capture anything, organise it later, by concept."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "instructor>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "openai>=2.48.0",
    "chonkie>=1.7.0",
    "fastembed>=0.8.0",
    "qdrant-client>=1.18.0",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "alembic>=1.13",
]

[project.optional-dependencies]
index = [
    "chonkie>=0.4",
    "fastembed>=0.4",
    "qdrant-client>=1.11",
]

[project.scripts]
enq = "enqueue.cli:app"

[dependency-groups]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "sqlite-vec>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enqueue"]
artifacts = [
    "src/enqueue/static/*",
    "src/enqueue/migrations/*",
    "src/enqueue/migrations/versions/*",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
