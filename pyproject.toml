[project]
name = "enqueue"
version = "0.3.0"
description = "A digital hoarder's dream. Capture anything, organise it later, by concept."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "instructor>=1.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx[http2]>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pyyaml>=6.0",
  "openai>=2.48.0",
  "fastembed>=0.8.0",
  "onnxruntime>=1.17.0,!=1.20.0,!=1.24.0,!=1.24.1",
  "pymupdf>=1.28.0",
  "python-multipart>=0.0.32",
  "alembic>=1.13",
  "trafilatura>=1.8",
  "sqlite-vec>=0.1.9",
  "pynacl>=1.6.2",
  "sqlcipher3-wheels>=0.5.7",
]

[project.optional-dependencies]
index = ["fastembed>=0.4"]
# The "Try harder on sites that block previews" fallback (preview._read_browser):
# headless Chromium through crawl4ai. Over half the size of the engine (two copies of
# Playwright's driver, litellm, scipy), so the Mac app ships without it and the setting
# is not offered there; a development checkout has it through the dev group.
browser = ["crawl4ai>=0.9.4"]
# The hosted relay's accounts (relay/accounts.py): verifying Google and Apple sign-in
# tokens, and Postgres. Only the relay's container installs it; the Mac app does not.
hosted = ["pyjwt[crypto]>=2.9", "psycopg[binary]>=3.2"]

[project.scripts]
enq = "enqueue.cli:app"

[dependency-groups]
dev = [
    "crawl4ai>=0.9.4",
    "pyjwt[crypto]>=2.9",
    "psycopg[binary]>=3.2",
    "black>=24.0",
    "hypothesis>=6.165.4",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enqueue"]
artifacts = [
  "src/enqueue/static/*",
  "src/enqueue/migrations/*",
  "src/enqueue/migrations/versions/*",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
