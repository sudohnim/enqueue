[project]
name = "enqueue"
version = "0.3.1"
description = "A digital hoarder's dream. Capture anything, organise it later, by concept."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "instructor>=1.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx[http2]>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pyyaml>=6.0",
  "openai>=2.48.0",
  "fastembed>=0.8.0",
  "onnxruntime>=1.17.0,!=1.20.0,!=1.24.0,!=1.24.1",
  "pymupdf>=1.28.0",
  "python-multipart>=0.0.32",
  "alembic>=1.13",
  "trafilatura>=1.8",
  "sqlite-vec>=0.1.9",
  "pynacl>=1.6.2",
  "sqlcipher3-wheels>=0.5.7",
  # The preview browser (webkit_page.py): the Mac's own WebKit, through its bindings.
  "pyobjc-framework-WebKit>=12; sys_platform == 'darwin'",
  "rapidfuzz>=3.14.6",
  "anthropic>=2.3.0",
]

[project.optional-dependencies]
# The hosted relay's accounts (relay/accounts.py): verifying Google and Apple sign-in
# tokens, and Postgres. Only the relay's container installs it; the Mac app does not.
# boto3: the object bytes in Cloudflare R2 (relay/blobs.py), on when R2_* is set.
hosted = ["pyjwt[crypto]>=2.9", "psycopg[binary]>=3.2", "boto3>=1.35"]

[project.scripts]
enq = "enqueue.cli:app"

[dependency-groups]
dev = [
    # bin/screenshots drives headless Chromium (bin/setup installs it).
    "playwright>=1.47",
    "pyjwt[crypto]>=2.9",
    "psycopg[binary]>=3.2",
    "black>=24.0",
    "hypothesis>=6.165.4",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15,<0.16",
    "boto3>=1.35",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enqueue"]
artifacts = [
  "src/enqueue/static/*",
  "src/enqueue/migrations/*",
  "src/enqueue/migrations/versions/*",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
