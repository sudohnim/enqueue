# Publish downloadable builds on a version tag, so people can install Enqueue
# without cloning the repo or setting up the Android/Rust toolchain.
#
# Two artifacts, two jobs:
#   - android-apk (ubuntu): the debug-signed Android .apk.
#   - desktop-dmg (macOS): a self-contained macOS .dmg. `bin/release desktop` vendors the
#     Python engine INSIDE Enqueue.app (Contents/Resources/engine), so it runs on a clean
#     Mac with no repo, no uv, no system Python.
#
# The .dmg is SIGNED + NOTARIZED only when the Apple secrets are set (see desktop-dmg);
# with none set it still builds and uploads, unsigned (users right-click -> Open).
#
# Trigger: on-demand only. Run it by hand from the Actions tab (Actions -> release ->
# Run workflow) and give it the version tag to publish under. It never runs on a push
# to main - only when you deliberately start it. The tag is created on the commit the
# run checks out if it does not already exist.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the APK under (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # needed to create/update the GitHub Release and upload assets

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Android build reads the frontend from src/enqueue/static (frontendDist),
      # so no Python or Node runtime is needed to compile the apk.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pin the NDK to the version the project builds with locally.
      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      # Debug apk: unsigned-for-a-store but installable on any device with "install
      # unknown apps" enabled, and it needs no signing secrets. To ship a signed
      # RELEASE apk instead, set the RELEASE_KEYSTORE (base64), RELEASE_STORE_PASSWORD,
      # RELEASE_KEY_PASSWORD, and RELEASE_KEY_ALIAS repo secrets and switch the build
      # line below to `cargo tauri android build --target aarch64` (release), decoding
      # the keystore to desktop/gen/android/release.keystore first - the gradle config
      # already reads those env vars.
      - name: Build APK
        working-directory: desktop
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          cargo tauri android build --debug --target aarch64

      - name: Name the artifact
        id: apk
        run: |
          SRC="desktop/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          TAG="${{ inputs.tag }}"
          OUT="enqueue-${TAG}-android.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          body: |
            Enqueue ${{ inputs.tag }}.

            - Android: the `.apk` (debug-signed; enable "install unknown apps", open it,
              then link to a running desktop by scanning the sync-panel QR).
            - macOS: the `.dmg` (self-contained - drag to Applications, open).

  desktop-dmg:
    runs-on: macos-14 # arm64, so the .dmg matches Apple-silicon Macs
    # Apple secrets are optional: with all of them set the .dmg is signed + notarized;
    # with none set it still builds and uploads, unsigned. Kept at job level so a step
    # `if` can read them via the env context (secrets are not usable directly in `if`).
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"

      # If APPLE_CERTIFICATE (base64 .p12) is set, import it into a temporary keychain so
      # bin/release can deep-sign the engine and Tauri can sign the app. Skipped (leaving
      # an unsigned build) when no cert is configured.
      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          KEYCHAIN=build.keychain
          PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          rm -f /tmp/cert.p12

      # bin/release reads APPLE_SIGNING_IDENTITY (sign) and APPLE_ID/APPLE_PASSWORD/
      # APPLE_TEAM_ID (Tauri notarizes) from the job env above.
      - name: Build the .dmg
        run: bin/release desktop

      - name: Name the artifact
        id: dmg
        run: |
          SRC=$(ls desktop/target/release/bundle/dmg/*.dmg | head -1)
          OUT="enqueue-${{ inputs.tag }}-macos-arm64.dmg"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ steps.dmg.outputs.path }}
          fail_on_unmatched_files: true
