[package]
name = "Enqueue"
version = "0.1.0"
edition = "2021"
description = "Enqueue"

# Tauri mobile builds the app as a shared library loaded by the Android/iOS
# wrapper, so the crate needs a lib target in addition to the desktop binary.
[lib]
name = "enqueue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# Only used to pick the hotkey out of GET /settings. Already in the tree via tauri.
serde_json = "1"

# The mobile sync client (MOB.3) reimplements the desktop's Phase SYNC in Rust: a
# local SQLite read copy, the relay pull, and the same crypto (PyNaCl SecretBox =
# XSalsa20-Poly1305, Argon2id MODERATE). Pure Rust, so they cross-compile for Android.
rusqlite = { version = "0.32", features = ["bundled"] }
xsalsa20poly1305 = "0.9"
argon2 = "0.5"
ureq = { version = "2", features = ["json"] }
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
regex = "1.10"
qrcode = { version = "0.14", features = ["svg"] }

# Mobile plugins for capture (MOB.7): dialog for photo picker, opener for URLs,
# clipboard-manager for share-sheet text.
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-opener = { version = "2", default-features = false }
tauri-plugin-clipboard-manager = { version = "2", default-features = false }
# QR.4a: native QR scanner via ML Kit (tauri-plugin-barcode-scanner)
tauri-plugin-barcode-scanner = { version = "2.4.5", default-features = false }

# JNI for foreground service (QR.5b) - mobile only
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
jni = { version = "0.21", default-features = false }
ndk-context = { version = "0.1", default-features = false }

# The global-shortcut plugin and the engine/AppKit machinery are desktop-only;
# none of it compiles or makes sense on Android/iOS (no local Python engine there).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
rqrr = "0.9"
image = "0.25"

[profile.release]
opt-level = "s"
lto = true
strip = true
