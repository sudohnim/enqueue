[package]
name = "Enqueue"
version = "0.3.1"
edition = "2021"
description = "Enqueue"

# Tauri mobile builds the app as a shared library loaded by the Android/iOS
# wrapper, so the crate needs a lib target in addition to the desktop binary.
[lib]
name = "enqueue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# Only used to pick the hotkey out of GET /settings. Already in the tree via tauri.
serde_json = "1"

# The mobile sync client (MOB.3) reimplements the desktop's Phase SYNC in Rust: a
# local SQLite read copy, the relay pull, and the same crypto (PyNaCl SecretBox =
# XSalsa20-Poly1305, Argon2id MODERATE). Pure Rust, so they cross-compile for Android.
xsalsa20poly1305 = "0.9"
argon2 = "0.5"
# libsodium's sealed box (X25519 + XSalsa20-Poly1305), for device approval: a phone asks
# to join with a public key, or seals the library key to one (sync.rs join_*).
crypto_box = { version = "0.9", features = ["seal"] }
ureq = { version = "2", features = ["json"] }
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
regex = "1.10"
qrcode = { version = "0.14", features = ["svg"] }

# Mobile plugins for capture (MOB.7): dialog for photo picker, opener for URLs,
# clipboard-manager for share-sheet text.
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-opener = { version = "2", default-features = false }
tauri-plugin-clipboard-manager = { version = "2", default-features = false }

# The phone's library copy is a SQLCipher database (its key from the Keystore-guarded
# store key, lib.rs `open_lib`); everywhere else SQLite as it ships. JNI for the
# foreground service, the Kotlin bridge and the store key (QR.5b) - Android only.
[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
jni = { version = "0.21", default-features = false }
ndk-context = { version = "0.1", default-features = false }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# QR.4a: native QR scanner via ML Kit (tauri-plugin-barcode-scanner) - mobile only
tauri-plugin-barcode-scanner = { version = "2.4.5", default-features = false }

# The global-shortcut plugin and the engine/AppKit machinery are desktop-only;
# none of it compiles or makes sense on Android/iOS (no local Python engine there).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
# A shipped Mac app updates itself from a signed feed (lib.rs watch_for_updates).
tauri-plugin-updater = "2"

# On Linux the dialog plugin needs a file-dialog backend, which its default features
# pick and the `default-features = false` above turns off; without it rfd refuses to
# build. Only CI's desktop tests build for Linux; macOS and Android are unaffected.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["gtk3"] }

[dev-dependencies]
rqrr = "0.9"
image = "0.25"

[profile.dev]
# Keep file:line in panics/backtraces but skip full DWARF: cuts target/ and the
# debug .so that ships in the Android apk by more than half.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = true
strip = true

# swift-rs builds Tauri's Swift layer for iOS. Vendored with one change (see
# "Enqueue patch" in vendor/swift-rs/src-rs/build.rs): under Xcode 27 the default
# Swift build engine hides the entry points the Rust side links against. Drop this
# once upstream swift-rs or Tauri handles it.
# The page draws under the status bar and the home indicator itself (viewport-fit=cover
# and env(safe-area-inset-*)), so the iOS scroll view must not inset it too.
[target.'cfg(target_os = "ios")'.dependencies]
# The same SQLCipher library copy as Android, and its store key in the Keychain
# (lib.rs `store_key`), kept on this device only.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
security-framework = "3"
objc2 = "0.6"

[patch.crates-io]
swift-rs = { path = "vendor/swift-rs" }
