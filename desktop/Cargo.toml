[package]
name = "enqueue-desktop"
version = "0.1.0"
edition = "2021"
description = "Enqueue"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
# Only used to pick the hotkey out of GET /settings. Already in the tree via tauri.
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
