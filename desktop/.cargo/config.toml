# Google Play refuses an app whose native libraries are not aligned to 16 KB pages
# (required for Android 15+ devices). The NDK links at 4 KB unless told otherwise.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
