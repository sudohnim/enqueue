# Alembic, for the `alembic` CLI only. The engine builds this config in code
# (see `enqueue.db._alembic_config`) so it never depends on the process's cwd.
#
# There is no sqlalchemy.url here on purpose: env.py reads the path from
# `enqueue.config`, so the CLI and the running engine can never disagree about
# which database they are migrating.

[alembic]
script_location = src/enqueue/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
